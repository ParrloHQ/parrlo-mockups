.translate-clear-tr{background:var(--deep);color:#fff}

const LANGS=['ru','es','en'];
let L=(new URLSearchParams(location.search).get('l')||'ru').toLowerCase(); if(!LANGS.includes(L))L='ru';
const UL={ru:'ru',es:'es',en:'en'};

function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function wave(n,live,seed,maxH){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const env=0.45+0.55*Math.sin(Math.PI*(i+1)/(live+1));const v=i<live?Math.max(6,Math.round((0.25+0.75*r())*maxH*env)):4;h+=`<i class="${i<live?'':P+'z'}" style="height:${v}px"></i>`;}return h;}
function mini(n,seed){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const v=Math.round(5+r()*19*Math.sin(Math.PI*(i+.5)/n)+3);h+=`<i style="height:${v}px"></i>`;}return h;}
function raw(s,live){let t=live?s.split('|')[0]:s.replace('|','');return t.replace(/\{([^}]*)\}/g,`<span class="${P}f">$1</span>`);}
function words(s){return s.split(' ').map(w=>`<span>${w}</span>`).join(' ');}

function screen(st,t){
 const sbar=`<div class="sbar"><b>9:41</b><span class="sig"><i class="wf"></i><i></i></span></div>`;
 const top=`<div class="${P}top"><span class="${P}cb" role="button" aria-label="${t.aBack}">${I.back}</span><span class="${P}pair"><span><i class="${P}dot"></i>${t.pair[0]}<i class="${P}swp">${I.swap}</i>${t.pair[1]}<i class="${P}dot ${P}p"></i></span></span><span class="${P}cb" role="button" aria-label="${t.aKbd}">${I.kbd}</span><span class="${P}cb" role="button" aria-label="${t.aMore}">${I.more}</span></div>`;
 const rec=st==='recording', cl=st==='clear', tr=st==='translated';
 const par=`<span class="${P}par">${I.spark}</span>`;
 /* A */
 const A=rec
  ? `<div class="${P}slot ${P}a ${P}on"><div class="${P}lbl"><i class="${P}dot"></i>${t.aRec}<span class="${P}sp"><i></i>0:05</span></div>
     <p class="${P}raw" lang="${UL[L]}">${raw(t.raw,true)}<i class="${P}car"></i></p>
     <div class="${P}wave" aria-hidden="true">${wave(51,40,7,40)}</div></div>`
  : `<div class="${P}slot ${P}a"><div class="${P}lbl"><i class="${P}dot"></i>${t.aDone}</div>
     <p class="${P}raw ${P}done" lang="${UL[L]}">${raw(t.raw,false)}</p>
     <div class="${P}clip"><span class="${P}play" role="button" aria-label="${t.aListen}">${I.play}</span><div class="${P}mw" aria-hidden="true">${mini(44,11)}</div><span class="${P}dur">0:06</span></div></div>`;
 /* B */
 const B=rec
  ? `<div class="${P}slot ${P}b ${P}quiet"><div class="${P}lbl ${P}hdr">${par}${t.bLbl}</div>
     <p class="${P}empty">${t.bWait}</p>
     <div class="${P}sk" aria-hidden="true"><i style="width:88%"></i><i style="width:56%"></i></div></div>`
  : `<div class="${P}slot ${P}b ${cl?P+'on':''}"><div class="${P}lbl ${P}hdr">${par}${t.bLbl}<span class="${P}edit" role="button">${I.pencil}${t.edit}</span></div>
     <p class="${P}ph" lang="${UL[L]}">${words(t.clear)}</p>
     <div class="${P}tip">${I.tap}${t.tip}</div></div>`;
 /* C */
 const C=tr
  ? `<div class="${P}slot ${P}c ${P}tr"><div class="${P}lbl"><i class="${P}dot ${P}p"></i>${t.cLbl}</div>
     <p class="${P}out" lang="${t.outLang}">${t.out}</p>
     <div class="${P}acts"><span class="${P}act" role="button">${I.spk}${t.play}</span><span class="${P}act ${P}ghost" role="button">${I.rot}${t.show}</span></div></div>`
  : `<div class="${P}slot ${P}c ${P}dash"><div class="${P}lbl"><i class="${P}dot ${P}p"></i>${t.cLbl}</div>
     <p class="${P}empty">${rec?t.cWait:t.cCheck}</p></div>`;
 /* низ */
 const mic=I.mic;
 const bot=rec
  ? `<div class="${P}hint">${I.info}${t.hRec}</div><div class="${P}btns"><span class="${P}sec" role="button">${t.cancel}</span><span class="${P}stop" role="button"><i></i>${t.stop}</span></div>`
  : cl
  ? `<div class="${P}hint">${I.ok}${t.hClear}</div><div class="${P}btns"><span class="${P}sec" role="button">${I.retry}${t.redo}</span><span class="${P}go" role="button">${I.tr}${t.go}</span></div>`
  : `<div class="${P}hint">${I.down}${t.hTr}</div><div class="${P}btns"><span class="${P}pb ${P}me" role="button">${mic}<span><b>${t.me[0]}</b><small>${t.me[1]}</small></span></span><span class="${P}pb ${P}pt ${P}next" role="button">${mic}<span><b>${t.pt[0]}</b><small>${t.pt[1]}</small></span></span></div>`;
 return `<div class="scr ${P}scr" data-state="${st}">${sbar}${top}<div class="${P}main">${A}${B}${C}</div><div class="${P}bot">${bot}</div><div class="homebar"><i></i></div></div>`;
}

/* контраст */
function Lu(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#C3CBD5','#1C2026',4.5],['#F2F5F7','#242B34',4.5],['#0E1116','#2BC48A',4.5],['#0E1116','#BFF2DC',4.5],['#2BC48A','#1E3734',4.5],['#FFFFFF','#00875C',3],['#FFFFFF','#00875C',4.5],['#FFFFFF','#005E40',4.5],['#0E1116','#FFFFFF',4.5],['#0E1116','#F2F5F7',4.5]];

const STATES=['recording','clear','translated'];
const ph=(id,s,html)=>`<div class="pf p67" id="${id}" style="--s:${s}"><div class="shell"></div><div class="glass">${html}</div></div>`;
const $=id=>document.getElementById(P+id);
function render(){
 const t=T[L],p=t.page;
 document.documentElement.lang=L; document.title=p.title;
 $('lsw').innerHTML=LANGS.map(l=>`<a href="?l=${l}" data-l="${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
 $('tag').textContent=p.tag; $('h1').textContent=p.h1; $('lead').textContent=p.lead;
 $('hero-ph').innerHTML=ph('translate-clear',.8,screen('translated',t))+`<div class="pcap"><span class="dot"></span><div><b>${p.cap[0]}</b><span>${p.cap[1]}</span></div></div>`;
 $('hero-t').innerHTML=`<h3>${p.heroH}</h3>`+p.heroP.map(x=>`<p>${x}</p>`).join('');
 $('h-states').textContent=p.hStates; $('states-lead').textContent=p.statesLead;
 $('grid').innerHTML=STATES.map((k,i)=>`<figure>${ph(P+'-'+k,.6,screen(k,t))}<figcaption><b>${i+1} · ${p.st[k][0]}</b><code>${k}</code> · ${p.st[k][1]}</figcaption></figure>`).join('');
 $('h-dec').textContent=p.hDec; $('dec').innerHTML=p.dec.map(x=>`<li>${x}</li>`).join('');
 $('h-tok').textContent=p.hTok; $('tok').innerHTML=p.tok.map(x=>`<li>${x}</li>`).join('');
 const fmt=v=>L==='en'?v.toFixed(2):v.toFixed(2).replace('.',',');
 $('ctr').innerHTML=`<tr>${p.ctrH.map(h=>`<th>${h}</th>`).join('')}</tr>`+PAIRS.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${p.ctr[i]}</td><td><b>${fmt(v)}:1</b></td><td>${v>=n?'≥ '+fmt(n).replace(/[.,]00$/,'').replace(/0$/,'')+' ✓':'✗'}</td></tr>`;}).join('');
 $('h-na').textContent=p.hNa; $('na').innerHTML=p.na.map(x=>`<li>${x}</li>`).join('');
 window.TC_CR=PAIRS.map(([a,b,n],i)=>[p.ctr[i],+cr(a,b).toFixed(2),n]);
 document.body.dataset.ready=L;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-l]');if(!a)return;e.preventDefault();L=a.dataset.l;history.replaceState(null,'','?l='+L);render();});
window.TC_STATES=STATES;
render();
})();
</script>
