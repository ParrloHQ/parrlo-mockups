 const home=`<div class="homebar"><i></i></div>`;
 const cb=(ic,l)=>`<span class="${P}cb" role="button" aria-label="${l}">${ic}</span>`;
 const pill=(sm)=>`<span class="${P}pair ${sm?P+'sm':''}"><span><i class="${P}dot"></i>${t.pair[0]}<i class="${P}swp">${sm?I.arr:I.swap}</i>${t.pair[1]}<i class="${P}dot ${P}p"></i></span></span>`;
 const top=`<div class="${P}top">${cb(I.back,t.aBack)}${pill()}${cb(I.more,t.aMore)}</div>`;
 const topT=(title,right)=>`<div class="${P}top">${cb(I.back,t.aBack)}<span class="${P}ttl">${title}</span>${right}</div>`;
 const wrap=(body,bot,noHome)=>`<div class="scr ${P}scr" data-state="${st}">${sbar}${body}${bot?`<div class="${P}bot">${bot}</div>`:''}${noHome?'':home}</div>`;
 const tile=k=>`<div class="${P}tile" role="button"><span class="${P}ico">${I[k]}</span><b>${t.sit[k][0]}</b><small>${t.sit[k][1]}</small><span class="${P}chev">${I.chev}</span></div>`;

 if(st==='list') return wrap(`${top}<div class="${P}main">
  <div class="${P}hd"><h3>${t.listH}</h3><p>${t.listP}</p></div>
  <div class="${P}srch" role="search">${I.search}${t.srch}</div>
  <div class="${P}sec">${t.secH}</div>
  <div class="${P}tiles">${tile('pharmacy')}${tile('doctor')}</div>
  ${note()}
  <div class="${P}sec">${t.secO}</div>
  <div class="${P}tiles">${['housing','bank','school','taxi'].map(tile).join('')}</div>
 </div>`,'');

 if(st==='situation') return wrap(`${topT(t.sit.pharmacy[0],pill(true))}<div class="${P}main">
  ${note()}
  <div class="${P}chips" role="tablist">${t.chips.map((c,i)=>`<span role="tab" aria-selected="${i===0}" class="${i===0?P+'on':''}">${c}</span>`).join('')}</div>
  <div class="${P}list">${t.ph.map(([m,p],i)=>`<div class="${P}ph " role="button"><div><b lang="${t.ml}">${slot(m)}</b><span class="${P}tr" lang="${t.pl}"><i></i><span>${slot(p)}</span></span></div><span class="${P}pl" role="button" aria-label="${t.aPlay}">${I.spk}</span></div>`).join('')}</div>
 </div>`,
 `<div class="${P}btns"><span class="${P}own" role="button">${I.mic}${t.own}</span></div>`);

 if(st==='phrase'){
  const [m,p]=t.ph[1];
  return wrap(`${topT(t.sit.pharmacy[0],pill(true))}<div class="${P}main">
  <div class="${P}pan">
   <div class="${P}lbl"><i class="${P}dot ${P}p"></i><span lang="${t.pl}">${t.panLbl}</span></div>
   <p class="${P}big" lang="${t.pl}">${p}</p>
   <div class="${P}mine"><div class="${P}lbl" style="color:#fff"><i class="${P}dot"></i>${t.mineLbl}</div><p lang="${t.ml}">${m}</p>
    <div class="${P}mini"><span role="button">${I.pen}${t.add}</span><span role="button">${I.star}${t.save}</span></div></div>
  </div>
  <div class="${P}ans"><div class="${P}lbl">${t.ansLbl}</div><div class="${P}row">${t.ans.map(([a,b])=>`<span role="button"><b lang="${t.pl}">${a}</b><small lang="${t.ml}">${b}</small></span>`).join('')}</div></div>
  ${note(P+'ph-note')}
 </div>`,
 `<div class="${P}btns"><span class="${P}pb ${P}a" role="button">${I.spk}${t.play}</span><span class="${P}pb ${P}b" role="button">${I.show}${t.show}</span></div>`);
 }

 if(st==='custom'){
  const [m,p]=t.ph[2];
  const fillM=m.replace(/\{\{[^}]*\}\}/,`<span class="${P}fill">${t.val}</span>`);
  const fillP=p.replace(/\{\{[^}]*\}\}/,`<u>${t.outVal}</u>`);
  const k=t.kb;
  const keys=s=>[...s].map(c=>`<span class="k">${c}</span>`).join('');
  const shift=`<span class="k f w"><svg viewBox="0 0 24 24" ${SW}><path d="M12 4.5L4.5 12H8.5v7h7v-7h4z"/></svg></span>`;
  const del=`<span class="k f w"><svg viewBox="0 0 24 24" ${SW}><path d="M8.5 5.5H20v13H8.5L3 12z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5"/></svg></span>`;
  const r2=k.r[1].length<10?`<span class="hp"></span>${keys(k.r[1])}<span class="hp"></span>`:keys(k.r[1]);
  const kbd=`<div class="kb" aria-hidden="true">
   <div class="${P}qt">${k.qt.map((q,i)=>`<span class="${i===0?P+'q1':''}">${q}</span>`).join('')}</div>
   <div class="rows"><div class="r">${keys(k.r[0])}</div><div class="r">${r2}</div><div class="r">${shift}${keys(k.r[2])}${del}</div>
   <div class="r"><span class="k f w" style="font-size:16px">123</span><span class="k f" style="flex:.9 1 0"><svg viewBox="0 0 24 24" ${SW}><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></svg></span><span class="k sp">${k.sp}</span><span class="k rt" style="font-size:16px">${k.ret}</span></div></div>
   <div class="sys"></div><div class="hm"></div></div>`;
  return wrap(`${topT(t.cTitle,`<span class="${P}done" role="button">${t.done}</span>`)}<div class="${P}main ${P}cust">
   <div class="${P}card"><div class="${P}lbl"><i class="${P}dot"></i>${t.mineLbl}</div><p lang="${t.ml}">${fillM}</p></div>
   <div class="${P}fld"><small>${t.fld}</small><div class="${P}inp"><span lang="${t.ml}">${t.val}<i class="${P}car"></i></span><span class="${P}clr" role="button" aria-label="${t.aClear}">${I.x}</span></div></div>
   <div class="${P}out"><div class="${P}lbl"><i class="${P}dot ${P}p"></i>${t.partner}<em>${I.ok}${t.upd}</em></div><p lang="${t.pl}">${fillP}</p></div>
   ${note()}
  </div>${kbd}`,'',true);
 }

 /* search */
 return wrap(`<div class="${P}stop"><div class="${P}srch" role="search">${I.search}<span>${t.q}</span><span class="${P}x" role="button" aria-label="${t.aClear}"><i>${I.xs}</i></span></div><span class="${P}cn" role="button">${t.cancel}</span></div>
  <div class="${P}main">
  ${t.res.map(([k,items])=>`<div class="${P}grp"><span class="${P}ico">${I[k]}</span>${t.sit[k][0]}</div><div class="${P}list">${items.map(([m,p])=>`<div class="${P}ph" role="button"><div><b lang="${t.ml}">${hl(m)}</b><span class="${P}tr" lang="${t.pl}"><i></i><span>${p}</span></span></div><span class="${P}pl">${I.chev}</span></div>`).join('')}</div>`).join('')}
  <div class="${P}miss"><img src="${MASC}think-dark.svg" alt=""><div><b>${t.missH}</b><small>${t.missP}</small></div></div>
 </div>`,
 `<div class="${P}btns"><span class="${P}own" role="button">${I.mic}${t.own}</span></div>`);
}

/* контраст */
function Lu(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#F2F5F7','#242B34',4.5],['#0E1116','#2BC48A',4.5],['#0E1116','#BFF2DC',4.5],['#BFF2DC','#1C2026',4.5],['#BFF2DC','#243A33',3],['#FFFFFF','#00875C',4.5],['#FFFFFF','#00875C',3],['#FFFFFF','#005E40',4.5],['#E8F7F0','#173A2E',4.5],['#2BC48A','#1C2026',4.5]];

const STATES=['list','situation','phrase','custom','search'];
const HERO='phrase';
const ph=(id,s,html)=>`<div class="pf p67" id="${id}" style="--s:${s}"><div class="shell"></div><div class="glass">${html}</div></div>`;
const $=id=>document.getElementById(P+id);
function render(){
 const t=T[L],p=t.page;
 document.documentElement.lang=L; document.title=p.title;
 $('lsw').innerHTML=LANGS.map(l=>`<a href="?l=${l}" data-l="${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
 $('tag').textContent=p.tag; $('h1').textContent=p.h1; $('lead').textContent=p.lead;
 $('hero-ph').innerHTML=ph('translate-phrasebook',.8,screen(HERO,t))+`<div class="pcap"><span class="dot"></span><div><b>${p.cap[0]}</b><span>${p.cap[1]}</span></div></div>`;
 $('hero-t').innerHTML=`<h3>${p.heroH}</h3>`+p.heroP.map(x=>`<p>${x}</p>`).join('');
 $('h-states').textContent=p.hStates; $('states-lead').textContent=p.statesLead;
 $('grid').innerHTML=STATES.map((k,i)=>`<figure>${ph(P+'-'+k,.6,screen(k,t))}<figcaption><b>${i+1} · ${p.st[k][0]}</b><code>${k}</code> · ${p.st[k][1]}</figcaption></figure>`).join('');
 $('h-dec').textContent=p.hDec; $('dec').innerHTML=p.dec.map(x=>`<li>${x}</li>`).join('');
 $('h-tok').textContent=p.hTok; $('tok').innerHTML=p.tok.map(x=>`<li>${x}</li>`).join('');
 const fmt=v=>L==='en'?v.toFixed(2):v.toFixed(2).replace('.',',');
 const fn=n=>L==='en'?String(n):String(n).replace('.',',');
 $('ctr').innerHTML=`<tr>${p.ctrH.map(h=>`<th>${h}</th>`).join('')}</tr>`+PAIRS.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${p.ctr[i]}</td><td><b>${fmt(v)}:1</b></td><td>${v>=n?'≥ '+fn(n)+' ✓':'✗'}</td></tr>`;}).join('');
 $('h-na').textContent=p.hNa; $('na').innerHTML=p.na.map(x=>`<li>${x}</li>`).join('');
 window.TP_CR=PAIRS.map(([a,b,n],i)=>[p.ctr[i],+cr(a,b).toFixed(2),n]);
 document.body.dataset.ready=L;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-l]');if(!a)return;e.preventDefault();L=a.dataset.l;history.replaceState(null,'','?l='+L);render();});
window.TP_STATES=STATES;
render();
})();
</script>
</body>
</html>
