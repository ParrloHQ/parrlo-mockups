<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Translate · App Clip и без рук</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0E12;color:#F2F5F7}
body{font:400 16px/1.5 Inter,system-ui,sans-serif;padding:32px 16px 80px}
.translate-clip-w{max-width:1200px;margin:0 auto}
.translate-clip-lsw{display:flex;gap:4px;justify-content:flex-end;margin-bottom:24px}
.translate-clip-lsw a{min-width:48px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;font:700 14px/1 Inter,sans-serif;color:#C3CBD5;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.translate-clip-lsw a[aria-current="true"]{background:#2BC48A;color:#0E1116;box-shadow:none}
.translate-clip-w h1{font:900 40px/1.1 Nunito,sans-serif;margin-bottom:12px}
.translate-clip-w h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.translate-clip-lead{color:#9AA4B2;max-width:820px}
.translate-clip-tag{display:inline-block;margin-bottom:12px;font:600 13px/1 Inter,sans-serif;color:#0E1116;background:#BFF2DC;border-radius:8px;padding:6px 10px}
.translate-clip-hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;margin-top:40px;padding:48px 40px;border-radius:32px;background:#12161C;box-shadow:inset 0 0 0 1px #2F3742}
.translate-clip-hero figure{margin:0}
.translate-clip-hero-t{flex:1 1 320px;max-width:520px}
.translate-clip-hero-t h3{font:900 24px/1.25 Nunito,sans-serif;margin-bottom:12px}
.translate-clip-hero-t p{color:#C3CBD5;margin-bottom:12px}
.translate-clip-w ul{padding-left:20px;color:#C3CBD5;font-size:15px;max-width:860px}
.translate-clip-w li{margin:8px 0}
.translate-clip-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7}
.translate-clip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:48px 24px;margin-top:32px}
.translate-clip-grid figure{margin:0;display:flex;flex-direction:column;align-items:center}
.translate-clip-grid figcaption{margin-top:16px;width:272px;font-size:14px;line-height:1.45;color:#9AA4B2}
.translate-clip-grid figcaption b{display:block;color:#F2F5F7;font:900 17px/1.3 Nunito,sans-serif;margin-bottom:4px}
.translate-clip-grid figcaption code{font-size:12px}
.translate-clip-st{display:inline-block;margin:0 0 8px;font:600 12px/1 Inter,sans-serif;border-radius:6px;padding:5px 8px;color:#0E1116;background:#BFF2DC}
.translate-clip-st.translate-clip-prop{background:#FFC247}
.translate-clip-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.translate-clip-tbl th,.translate-clip-tbl td{text-align:left;vertical-align:top;border-bottom:1px solid #2F3742;padding:10px 12px 10px 0}
.translate-clip-tbl th{color:#9AA4B2;font-weight:600}
.translate-clip-tw{overflow-x:auto}
.translate-clip-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px #3A414B}
@media (max-width:760px){.translate-clip-w h1{font-size:30px}.translate-clip-hero{padding:24px 12px;gap:24px;justify-content:center}.translate-clip-hero .pf{--s:.74!important}}
@media (max-width:420px){.translate-clip-hero .pf{--s:.7!important}}

/* ===== экран 430×932 — каркас translate-talk ===== */
.translate-clip-scr{--me:#2BC48A;--es:#BFF2DC;--err:#FF6B5E}
.translate-clip-top{flex:none;height:64px;display:flex;align-items:center;gap:8px;padding:0 16px}
.translate-clip-cb{width:48px;height:48px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.translate-clip-pair{flex:1;min-width:0;display:flex;justify-content:center}
.translate-clip-pair>span{height:48px;border-radius:24px;background:var(--sf2);display:inline-flex;align-items:center;gap:8px;padding:0 16px;font:900 19px/1 Nunito,sans-serif;letter-spacing:.02em}
.translate-clip-swp{color:var(--sec);display:flex}
.translate-clip-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--me)}
.translate-clip-dot.translate-clip-p{background:var(--es)}
.translate-clip-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px;position:relative}
.translate-clip-bot{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px 16px 4px}
.translate-clip-hint{height:20px;display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px Inter,sans-serif;color:var(--sec);text-align:center;white-space:nowrap}
.translate-clip-hint svg{width:16px;height:16px;flex:none}
.translate-clip-btns{display:flex;gap:12px}
.translate-clip-pb{flex:1;min-width:0;height:80px;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:10px;color:#0E1116}
.translate-clip-pb svg{flex:none;width:26px;height:26px}
.translate-clip-pb b{display:block;font:900 21px/24px Nunito,sans-serif;white-space:nowrap}
.translate-clip-pb small{display:block;font:600 13px/1.3 Inter,sans-serif;margin-top:2px}
.translate-clip-pb.translate-clip-me{background:var(--me)}
.translate-clip-pb.translate-clip-pt{background:var(--es)}
.translate-clip-lbl{flex:none;height:20px;display:flex;align-items:center;gap:8px;font:600 13px/16px Inter,sans-serif;color:var(--sec);letter-spacing:.02em;white-space:nowrap}

/* clip-card: нейтральная сцена + системный лист (обобщённо) */
.translate-clip-scene{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 18%,#3A414B 0,#242B34 45%,#14181D 100%)}
.translate-clip-desk{position:absolute;left:0;right:0;top:470px;bottom:0;background:linear-gradient(#1C2026,#0E1116)}
.translate-clip-sign{position:absolute;left:50%;top:92px;width:232px;margin-left:-116px;border-radius:24px;background:#F2F5F7;color:#0E1116;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.translate-clip-sign .translate-clip-brand{display:flex;align-items:center;gap:8px;font:900 18px/1 Nunito,sans-serif}
.translate-clip-sign .translate-clip-brand img{width:28px;height:28px;border-radius:7px}
.translate-clip-qr{width:196px;height:196px;padding:14px;position:relative}
.translate-clip-qr svg{width:168px;height:168px}
.translate-clip-vf{position:absolute;inset:0}
.translate-clip-vf i{position:absolute;width:30px;height:30px;border:4px solid #FFC247}
.translate-clip-vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
.translate-clip-vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
.translate-clip-vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
.translate-clip-vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.translate-clip-nfc{display:flex;align-items:center;gap:8px;font:600 13px/16px Inter,sans-serif;color:#3A414B;white-space:nowrap}
.translate-clip-nfc svg{width:20px;height:20px;flex:none}
.translate-clip-scrim{position:absolute;inset:0;background:rgba(5,7,10,.55)}
.translate-clip-sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:44px;background:#1C2026;overflow:hidden;box-shadow:0 -1px 0 #2F3742,0 -30px 60px rgba(0,0,0,.4)}
.translate-clip-art{height:200px;position:relative;background:linear-gradient(160deg,#00875C 0,#005E40 100%);overflow:hidden}
.translate-clip-art img{position:absolute;left:50%;top:56px;width:136px;height:136px;margin-left:-56px}
.translate-clip-art .translate-clip-bub{position:absolute;height:44px;border-radius:22px;padding:0 18px;display:flex;align-items:center;font:900 19px/1 Nunito,sans-serif;color:#0E1116;white-space:nowrap}
.translate-clip-art .translate-clip-b1{left:20px;top:22px;background:var(--me);border-bottom-left-radius:8px}
.translate-clip-art .translate-clip-b2{right:22px;top:104px;background:var(--es);border-bottom-right-radius:8px}
.translate-clip-x{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:rgba(14,17,22,.55);color:#F2F5F7;display:flex;align-items:center;justify-content:center}
.translate-clip-x svg{width:20px;height:20px}
.translate-clip-sb{padding:20px 20px 0}
.translate-clip-id{display:flex;align-items:center;gap:16px}
.translate-clip-id img{width:64px;height:64px;border-radius:15px;flex:none;box-shadow:0 0 0 1px #2F3742}
.translate-clip-id b{display:block;font:900 24px/30px Nunito,sans-serif}
.translate-clip-id span{display:block;font:400 16px/22px Inter,sans-serif;color:var(--sec);text-wrap:balance}
.translate-clip-open{margin-top:20px;height:60px;border-radius:30px;background:var(--me);color:#0E1116;display:flex;align-items:center;justify-content:center;font:900 22px/1 Nunito,sans-serif}
.translate-clip-fine{margin-top:12px;height:20px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px/16px Inter,sans-serif;color:var(--sec);white-space:nowrap}
.translate-clip-fine svg{width:14px;height:14px}
.translate-clip-sheet .homebar{height:30px;padding-bottom:6px}

/* clip-first */
.translate-clip-ban{flex:none;margin:0 16px;display:flex;align-items:center;gap:12px;padding:10px 8px 10px 12px;border-radius:24px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line)}
.translate-clip-ban img{width:44px;height:44px;border-radius:11px;flex:none}
.translate-clip-ban>div{flex:1;min-width:0}
.translate-clip-ban b{display:block;font:600 16px/21px Inter,sans-serif;white-space:nowrap}
.translate-clip-ban span{display:block;font:400 13px/18px Inter,sans-serif;color:var(--sec);white-space:nowrap}
.translate-clip-chv{flex:none;display:flex;color:var(--sec)}
.translate-clip-chv svg{width:20px;height:20px}
.translate-clip-ban .translate-clip-bx{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sec)}
.translate-clip-ban .translate-clip-bx svg{width:18px;height:18px}
.translate-clip-brandtop{flex:1;display:flex;align-items:center;gap:10px;font:900 20px/1 Nunito,sans-serif;min-width:0}
.translate-clip-brandtop .translate-clip-ccl{font:600 12px/1 Inter,sans-serif;color:#0E1116;background:var(--es);border-radius:6px;padding:5px 7px;letter-spacing:.02em;white-space:nowrap}
.translate-clip-idle{align-items:center;text-align:center;justify-content:center;padding-bottom:8px}
.translate-clip-idle img{width:112px;height:112px;margin-bottom:12px}
.translate-clip-idle h3{font:900 32px/38px Nunito,sans-serif;margin-bottom:8px}
.translate-clip-idle>p{font:400 17px/25px Inter,sans-serif;color:var(--sec);max-width:360px;margin-bottom:24px;text-wrap:balance}
.translate-clip-set{align-self:stretch;background:var(--sf);border-radius:24px;padding:4px 16px 4px 20px;text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.translate-clip-row{display:flex;align-items:center;gap:12px;min-height:72px}
.translate-clip-row>div{flex:1;min-width:0}
.translate-clip-row b{display:block;font:600 16px/22px Inter,sans-serif}
.translate-clip-row small{display:flex;align-items:center;gap:6px;font:400 14px/19px Inter,sans-serif;color:var(--sec)}
.translate-clip-row small svg{width:14px;height:14px;flex:none}
.translate-clip-val{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:6px;height:44px;min-width:44px;font:600 15px Inter,sans-serif;color:var(--tx);white-space:nowrap}
.translate-clip-val svg{width:18px;height:18px;color:var(--sec)}

/* лента (как в translate-talk) */
.translate-clip-feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 64px);mask-image:linear-gradient(transparent 0,#000 64px)}
.translate-clip-bb{flex:none;max-width:88%;border-radius:24px;padding:12px 18px 14px;position:relative}
.translate-clip-bb .translate-clip-o{display:block;font:400 14px/19px Inter,sans-serif;padding-bottom:8px;margin-bottom:8px}
.translate-clip-bb .translate-clip-t{display:block;font:600 18px/25px Inter,sans-serif}
.translate-clip-bb.translate-clip-l{align-self:flex-start;background:var(--es);color:#0E1116;border-bottom-left-radius:8px}
.translate-clip-bb.translate-clip-l .translate-clip-orig{display:flex;align-items:center;gap:6px;margin-top:8px;font:600 13px/16px Inter,sans-serif;color:#2E4A3F}
.translate-clip-bb.translate-clip-l .translate-clip-orig svg{width:14px;height:14px}
.translate-clip-bb.translate-clip-r{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:8px}
.translate-clip-bb.translate-clip-r .translate-clip-o{color:#FFFFFF;border-bottom:1px solid rgba(255,255,255,.24)}
.translate-clip-meta{flex:none;font:500 12px/16px Inter,sans-serif;color:var(--sec);margin:2px 8px 8px}
.translate-clip-meta.translate-clip-l{align-self:flex-start}
.translate-clip-meta.translate-clip-r{align-self:flex-end;display:flex;align-items:center;gap:6px}
.translate-clip-meta svg{width:14px;height:14px}

/* clip-done */
.translate-clip-dim{flex:none;height:168px;display:flex;flex-direction:column;opacity:.32;padding:0 16px}
.translate-clip-done{position:absolute;left:8px;right:8px;bottom:8px;border-radius:44px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line),0 -30px 60px rgba(0,0,0,.5);padding:28px 20px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.translate-clip-done img{width:104px;height:104px}
.translate-clip-done h3{font:900 30px/36px Nunito,sans-serif;margin-top:12px}
.translate-clip-done>p{font:400 17px/25px Inter,sans-serif;color:var(--sec);margin-top:8px;max-width:350px;text-wrap:balance}
.translate-clip-feat{align-self:stretch;margin-top:20px;display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:20px;padding:6px 16px;text-align:left}
.translate-clip-feat div{display:flex;align-items:center;gap:12px;min-height:48px;font:500 16px/21px Inter,sans-serif}
.translate-clip-feat div+div{border-top:1px solid var(--line)}
.translate-clip-feat i{flex:none;width:32px;height:32px;border-radius:10px;background:#243A33;color:var(--es);display:flex;align-items:center;justify-content:center}
.translate-clip-feat i svg{width:18px;height:18px}
.translate-clip-pri{align-self:stretch;margin-top:20px;height:64px;border-radius:32px;background:var(--me);color:#0E1116;display:flex;align-items:center;justify-content:center;gap:10px;font:900 21px/1 Nunito,sans-serif;white-space:nowrap}
.translate-clip-pri svg{width:22px;height:22px;flex:none}
.translate-clip-sec{align-self:stretch;margin-top:12px;height:56px;border-radius:28px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 Inter,sans-serif;white-space:nowrap}
.translate-clip-sec svg{width:20px;height:20px}
.translate-clip-done .homebar{height:30px;padding-bottom:6px;margin-top:4px}

/* без рук */
.translate-clip-hf{flex:none;height:48px;border-radius:24px;padding:0 14px 0 10px;display:flex;align-items:center;gap:8px;background:#243A33;color:var(--es);font:600 15px/1 Inter,sans-serif;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--me)}
.translate-clip-hf svg{width:20px;height:20px;flex:none}
.translate-clip-hf .translate-clip-tg{width:30px;height:18px;border-radius:9px;background:var(--me);position:relative;flex:none}
.translate-clip-hf .translate-clip-tg::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#0E1116}
.translate-clip-hfm{gap:12px}
.translate-clip-hfm .translate-clip-feed{flex:1}
.translate-clip-live{flex:none;position:relative;border-radius:28px;padding:20px 20px 0;height:280px;background:var(--sf);box-shadow:inset 0 0 0 2px var(--me);overflow:hidden}
.translate-clip-live.translate-clip-lp{box-shadow:inset 0 0 0 2px var(--es)}
.translate-clip-live .translate-clip-lbl{color:var(--tx)}
.translate-clip-live .translate-clip-lbl em{font-style:normal;color:var(--sec);font-weight:500}
.translate-clip-ring{width:10px;height:10px;border-radius:50%;background:var(--me);box-shadow:0 0 0 4px rgba(43,196,138,.25);flex:none}
.translate-clip-lp .translate-clip-ring{background:var(--es);box-shadow:0 0 0 4px rgba(191,242,220,.22)}
.translate-clip-ltx{margin-top:14px;font:500 26px/35px Inter,sans-serif}
.translate-clip-car{display:inline-block;width:2px;height:28px;background:var(--me);vertical-align:-5px;margin-left:3px;border-radius:1px}
.translate-clip-lp .translate-clip-car{background:var(--es)}
.translate-clip-wave{position:absolute;left:20px;right:20px;bottom:68px;height:84px;display:flex;align-items:center;gap:4px}
.translate-clip-wave i{width:4px;border-radius:2px;background:var(--me);flex:none}
.translate-clip-lp .translate-clip-wave i{background:var(--es)}
.translate-clip-wave i.translate-clip-z{background:#3A414B!important;height:4px!important}
.translate-clip-auto{position:absolute;left:0;right:0;bottom:0;height:52px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 20px;font:500 14px/18px Inter,sans-serif;color:var(--sec);white-space:nowrap}
.translate-clip-auto svg{width:16px;height:16px;flex:none}
.translate-clip-ask{flex:none;display:flex;gap:10px;align-items:flex-start;background:#243A33;color:var(--es);border-radius:20px;padding:14px 16px;font:600 17px/24px Inter,sans-serif}
.translate-clip-ask svg{width:22px;height:22px;flex:none;margin-top:1px}
.translate-clip-pb.translate-clip-on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.translate-clip-pb.translate-clip-me.translate-clip-on{color:#0E1116;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--me)}
.translate-clip-pb.translate-clip-pt.translate-clip-on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--es)}
</style>
</head>
<body>
<div class="translate-clip-w">
<nav class="translate-clip-lsw" id="translate-clip-lsw" aria-label="Language"></nav>
<span class="translate-clip-tag" id="translate-clip-tag"></span>
<h1 id="translate-clip-h1"></h1>
<p class="translate-clip-lead" id="translate-clip-lead"></p>

<section class="translate-clip-hero">
 <figure id="translate-clip-hero-ph"></figure>
 <div class="translate-clip-hero-t" id="translate-clip-hero-t"></div>
</section>

<h2 id="translate-clip-h-states"></h2>
<p class="translate-clip-lead" id="translate-clip-states-lead"></p>
<div class="translate-clip-grid" id="translate-clip-grid"></div>

<h2 id="translate-clip-h-dec"></h2>
<ul id="translate-clip-dec"></ul>

<h2 id="translate-clip-h-tok"></h2>
<div class="translate-clip-tw"><table class="translate-clip-tbl" id="translate-clip-ctr"></table></div>
<ul id="translate-clip-tok"></ul>

<h2 id="translate-clip-h-na"></h2>
<ul id="translate-clip-na"></ul>
</div>

<script src="../screens.js"></script>
<script>
(function(){
const P='translate-clip-';
const SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const S=window.SITE_ICONS;
const I={
 mic:S.mic.replace('class="ic"','class="ic" style="width:26px;height:26px"'),
 kbd:S.kbd, more:S.more,
 back:`<svg class="ic" viewBox="0 0 24 24" ${SW}><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>`,
 swap:`<svg viewBox="0 0 24 24" ${SW} style="width:20px;height:20px"><path d="M4 8h14M14.5 4.5L18 8l-3.5 3.5"/><path d="M20 16H6M9.5 12.5L6 16l3.5 3.5"/></svg>`,
 spk:`<svg viewBox="0 0 24 24" ${SW}><path d="M3.5 9.5v5h3.5l4.5 4V5.5L7 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8.2 8.2 0 0 1 0 11.4"/></svg>`,
 x:`<svg viewBox="0 0 24 24" ${SW}><path d="M6 6l12 12M18 6L6 18"/></svg>`,
 chev:`<svg viewBox="0 0 24 24" ${SW}><path d="M9.5 6l6 6-6 6"/></svg>`,
 chevd:`<svg viewBox="0 0 24 24" ${SW}><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>`,
 dl:`<svg viewBox="0 0 24 24" ${SW}><path d="M12 4v11M7 10.5l5 5 5-5"/><path d="M5 19.5h14"/></svg>`,

/* QR-плейсхолдер: 25×25 модулей, три «глаза», остальное — детерминированный шум (не кодирует ничего) */
function qr(){const n=25;let s=7,d='';const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
 const eye=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" rx="1.4" fill="none" stroke="#0E1116" stroke-width="1"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".6" fill="#0E1116"/>`;
 const inEye=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inEye(x,y))continue;if(r()>.52)d+=`M${x} ${y}h1v1h-1z`;}
 return `<svg viewBox="-1 -1 ${n+2} ${n+2}" aria-hidden="true"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><path d="${d}" fill="#0E1116"/>${eye(.5,.5)}${eye(n-7.5,.5)}${eye(.5,n-7.5)}</svg>`;}

const LANGS=['ru','es','en'];
let L=(new URLSearchParams(location.search).get('l')||'ru').toLowerCase(); if(!LANGS.includes(L))L='ru';

function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function wave(n,live,seed,maxH){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const env=0.4+0.6*Math.sin(Math.PI*(i+1)/(live+1));const v=i<live?Math.max(6,Math.round((0.25+0.75*r())*maxH*env)):4;h+=`<i class="${i<live?'':P+'z'}" style="height:${v}px"></i>`;}return h;}

function screen(st,t){
 const sbar=`<div class="sbar"><b>9:41</b><span class="sig"><i class="wf"></i><i></i></span></div>`;
 const home=`<div class="homebar"><i></i></div>`;
 const pill=`<span class="${P}pair"><span><i class="${P}dot"></i>${t.pair[0]}<i class="${P}swp">${I.swap}</i>${t.pair[1]}<i class="${P}dot ${P}p"></i></span></span>`;
 const top=(right,more=true)=>`<div class="${P}top"><span class="${P}cb" role="button" aria-label="${t.aBack}">${I.back}</span>${pill}${right}${more?`<span class="${P}cb" role="button" aria-label="${t.aMore}">${I.more}</span>`:''}</div>`;
 const kbd=`<span class="${P}cb" role="button" aria-label="${t.aKbd}">${I.kbd}</span>`;
 const hfChip=`<span class="${P}hf" role="switch" aria-checked="true">${I.hands}${t.hf}<i class="${P}tg"></i></span>`;
 const pbMe=(x='')=>`<span class="${P}pb ${P}me ${x}" role="button">${I.mic}<span><b>${t.me[0]}</b><small>${t.me[1]}</small></span></span>`;
 const pbPt=(x='')=>`<span class="${P}pb ${P}pt ${x}" role="button" lang="${t.pl}">${I.mic}<span><b>${t.pt[0]}</b><small>${t.pt[1]}</small></span></span>`;
 const wrap=(body,bot,extra='')=>`<div class="scr ${P}scr" data-state="${st}">${sbar}${body}${bot?`<div class="${P}bot">${bot}</div>`:''}${bot!==null?home:''}${extra}</div>`;
 const bubP=(o,tr,time)=>`<div class="${P}bb ${P}l" role="button" aria-label="${t.aOrig}"><span class="${P}t" lang="${t.ml}">${tr}</span><span class="${P}orig">${I.chevd}${t.orig} · ${t.pair[1]}</span></div><div class="${P}meta ${P}l">${t.who[0]} · ${time}</div>`;
 const bubM=(o,tr,time,spoke)=>`<div class="${P}bb ${P}r"><span class="${P}o" lang="${t.ml}">${o}</span><span class="${P}t" lang="${t.pl}">${tr}</span></div><div class="${P}meta ${P}r">${spoke?I.spk+t.spoke+' · ':''}${t.who[1]} · ${time}</div>`;
 const c=t.card;

 if(st==='clip-card') return `<div class="scr ${P}scr" data-state="${st}" style="position:relative">
  <div class="${P}scene" aria-hidden="true"><div class="${P}desk"></div>
   <div class="${P}sign"><span class="${P}brand"><img src="${ICON}" alt="">Parrlo Translate</span>
    <div class="${P}qr">${qr()}<span class="${P}vf"><i></i><i></i><i></i><i></i></span></div>
    <span class="${P}nfc">${I.nfc}${c.nfc}</span></div></div>
  <div class="${P}scrim"></div>
  <div style="position:relative">${sbar}</div>
  <div class="${P}sheet" role="dialog" aria-label="${c.name}">
   <div class="${P}art" aria-hidden="true"><span class="${P}bub ${P}b1">${c.hi}</span><span class="${P}bub ${P}b2" lang="${t.pl}">${c.hi2}</span><img src="${MASC}speak-dark.svg" alt=""></div>
   <span class="${P}x" role="button" aria-label="${t.aClose}">${I.x}</span>
   <div class="${P}sb">
    <div class="${P}id"><img src="${ICON}" alt=""><div><b>${c.name}</b><span>${c.sub}</span></div></div>
    <span class="${P}open" role="button">${c.open}</span>
    <div class="${P}fine">${I.ok}${c.fine}</div>
   </div>${home}
  </div></div>`;

 if(st==='clip-first') return wrap(`<div class="${P}top"><span class="${P}brandtop"><img src="${ICON}" alt="" style="width:40px;height:40px;border-radius:10px"><span class="${P}ccl">${t.clipTag}</span></span>${pill.replace(`class="${P}pair"`,`class="${P}pair" style="flex:none"`)}</div>
  <div class="${P}ban"><img src="${ICON}" alt=""><div role="button"><b>${t.ban[0]}</b><span>${t.ban[1]}</span></div><span class="${P}chv" aria-hidden="true">${I.chev}</span><span class="${P}bx" role="button" aria-label="${t.aHide}">${I.x}</span></div>
  <div class="${P}main ${P}idle">
   <img src="${MASC}listen-dark.svg" alt="">
   <h3>${t.idleH}</h3><p>${t.idleP}</p>
   <div class="${P}set"><div class="${P}row"><div><b>${t.rLang[1]}</b><small>${I.qr}${t.rFrom}</small></div><span class="${P}val" role="button" aria-label="${t.rLang[0]}">${I.chev}</span></div></div>
  </div>`,
  `<div class="${P}hint">${t.hIdle}</div><div class="${P}btns">${pbMe()}${pbPt()}</div>`);

 if(st==='clip-done'){
  const [a,b2,c3]=t.conv;
  const d=t.done;
  return `<div class="scr ${P}scr" data-state="${st}" style="position:relative">${sbar}
   <div aria-hidden="true" style="opacity:.32">${top(kbd)}</div>
   <div class="${P}dim" aria-hidden="true"><div class="${P}feed">${bubP(b2[1],b2[2],'9:42')}${bubM(c3[1],c3[2],'9:43',true)}</div></div>
   <div class="${P}done" role="dialog" aria-label="${d.h}">
    <img src="${MASC}happy-dark.svg" alt="">
    <h3>${d.h}</h3><p>${d.p}</p>
    <div class="${P}feat"><div><i>${I.txt}</i>${d.f[0]}</div><div><i>${I.star}</i>${d.f[1]}</div><div><i>${I.cam}</i>${d.f[2]}</div></div>
    <span class="${P}pri" role="button">${I.dl}${d.pri}</span>
    <span class="${P}sec" role="button">${I.plus}${d.sec}</span>
    ${home}
   </div></div>`;
 }

 const [a,b2,c3]=t.conv;
 if(st==='handsfree-listening'){const h=t.hfMe;
  return wrap(`${top(hfChip,false)}<div class="${P}main ${P}hfm">
   <div class="${P}feed">${bubM(a[1],a[2],'9:41',true)}${bubP(b2[1],b2[2],'9:42')}</div>
   <div class="${P}live" aria-live="polite"><div class="${P}lbl"><i class="${P}ring"></i>${h.lbl}<em>· ${h.lang}</em></div>
    <p class="${P}ltx" lang="${t.ml}">${h.live}<i class="${P}car"></i></p>
    <div class="${P}wave" aria-hidden="true">${wave(44,30,7,76)}</div>
    <div class="${P}auto">${I.auto}${h.auto}</div></div>
  </div>`,
  `<div class="${P}hint">${h.hint}</div><div class="${P}btns">${pbMe(P+'on')}${pbPt()}</div>`);}

 const h=t.hfPt;
 return wrap(`${top(hfChip,false)}<div class="${P}main ${P}hfm">
  <div class="${P}feed">${bubP(b2[1],b2[2],'9:42')}${bubM(c3[1],c3[2],'9:43',true)}</div>
  <div class="${P}ask" lang="${t.pl}">${I.ear}${h.ask}</div>
  <div class="${P}live ${P}lp" aria-live="polite" style="height:268px"><div class="${P}lbl"><i class="${P}ring"></i>${h.lbl}<em>· ${h.lang}</em></div>
   <p class="${P}ltx" lang="${t.pl}">${h.live}<i class="${P}car"></i></p>
   <div class="${P}wave" aria-hidden="true" style="height:64px;bottom:64px">${wave(44,34,23,58)}</div>
   <div class="${P}auto">${I.auto}${h.auto}</div></div>
 </div>`,
 `<div class="${P}hint">${h.hint}</div><div class="${P}btns">${pbMe()}${pbPt(P+'on')}</div>`);
}

/* контраст */
function Lu(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#F2F5F7','#242B34',4.5],['#0E1116','#2BC48A',4.5],['#0E1116','#BFF2DC',4.5],['#2E4A3F','#BFF2DC',4.5],['#BFF2DC','#243A33',4.5],['#FFFFFF','#00875C',4.5],['#2BC48A','#0E1116',4.5]];

const STATES=['clip-card','clip-first','clip-done','handsfree-listening','handsfree-other'];
const ph=(id,s,html)=>`<div class="pf p67" id="${id}" style="--s:${s}"><div class="shell"></div><div class="glass">${html}</div></div>`;
const $=id=>document.getElementById(P+id);
function render(){
 const t=T[L],p=t.page;
 document.documentElement.lang=L; document.title=p.title;
 $('lsw').innerHTML=LANGS.map(l=>`<a href="?l=${l}" data-l="${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
 $('tag').textContent=p.tag; $('h1').textContent=p.h1; $('lead').textContent=p.lead;
 $('hero-ph').innerHTML=ph('translate-clip',.8,screen('clip-card',t))+`<div class="pcap"><span class="dot"></span><div><b>${p.cap[0]}</b><span>${p.cap[1]}</span></div></div>`;
 $('hero-t').innerHTML=`<span class="${P}st">${p.mk}</span><h3>${p.heroH}</h3>`+p.heroP.map(x=>`<p>${x}</p>`).join('');
 $('h-states').textContent=p.hStates; $('states-lead').textContent=p.statesLead;
 $('grid').innerHTML=STATES.map((k,i)=>{const pr=k.startsWith('handsfree');return `<figure>${ph(P+'-'+k,.6,screen(k,t))}<figcaption><span class="${P}st ${pr?P+'prop':''}">${pr?p.prop:p.mk}</span><b>${i+1} · ${p.st[k][0]}</b><code>${k}</code> · ${p.st[k][1]}</figcaption></figure>`;}).join('');
 $('h-dec').textContent=p.hDec; $('dec').innerHTML=p.dec.map(x=>`<li>${x}</li>`).join('');
 $('h-tok').textContent=p.hTok; $('tok').innerHTML=p.tok.map(x=>`<li>${x}</li>`).join('');
 const fmt=v=>L==='en'?v.toFixed(2):v.toFixed(2).replace('.',',');
 const fn=n=>L==='en'?String(n):String(n).replace('.',',');
 $('ctr').innerHTML=`<tr>${p.ctrH.map(h=>`<th>${h}</th>`).join('')}</tr>`+PAIRS.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${p.ctr[i]}</td><td><b>${fmt(v)}:1</b></td><td>${v>=n?'≥ '+fn(n)+' ✓':'✗'}</td></tr>`;}).join('');
 $('h-na').textContent=p.hNa; $('na').innerHTML=p.na.map(x=>`<li>${x}</li>`).join('');
 window.TC_CR=PAIRS.map(([a,b,n],i)=>[p.ctr[i],+cr(a,b).toFixed(2),n]);
 document.body.dataset.ready=L;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-l]');if(!a)return;e.preventDefault();L=a.dataset.l;history.replaceState(null,'','?l='+L);render();});
window.TC_STATES=STATES;
render();
})();
