<!doctype html>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-thread-w{max-width:1200px;margin:0 auto}
.chat-thread-lng{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-thread-lng a{min-width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#C9D1DA;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.chat-thread-lng a.on{background:#2BC48A;color:#0E1116;box-shadow:none}
.chat-thread-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-thread-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-thread-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-thread-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-thread-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-thread-info ul,.chat-thread-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-thread-info li,.chat-thread-sec li{margin:6px 0}
.chat-thread-w b{color:#F2F5F7;font-weight:600}
.chat-thread-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-thread-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-thread-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-thread-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:40px 24px;justify-items:center}
.chat-thread-card{width:273px}
.chat-thread-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.chat-thread-card h3 code{font-size:12px;color:#9AA4B2}
.chat-thread-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-thread-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.chat-thread-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-thread-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-thread-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-thread-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-thread-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-thread-hero .pf{--s:.78!important}.chat-thread-info h1{font-size:30px}.chat-thread-hero{gap:24px}}

/* ======= экран 430×932 ======= */
.chat-thread-scr{overflow:hidden}
.chat-thread-scr svg{display:block}
.chat-thread-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-thread-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-thread-ib svg{width:24px;height:24px}
.chat-thread-ib.bk{color:var(--acc)}.chat-thread-ib.bk svg{width:28px;height:28px}
.chat-thread-av{position:relative;width:40px;height:40px;border-radius:50%;color:#0E1116;font:800 17px/40px Nunito,Inter;text-align:center;flex:none}
.chat-thread-av i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2.5px var(--bg)}
.chat-thread-nm{flex:1;min-width:0;padding-left:4px}
.chat-thread-nm b{display:block;font:600 17px/22px Inter}
.chat-thread-nm span{display:flex;align-items:center;gap:5px;overflow:hidden;font-size:13px;line-height:18px;color:var(--sec);white-space:nowrap}
.chat-thread-nm span i{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.chat-thread-nm span.ty{color:var(--acc);font-weight:500}
.chat-thread-lc{flex:none;height:44px;display:flex;align-items:center}
.chat-thread-lc span{height:32px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 13px/1 Inter;letter-spacing:.04em;color:var(--tx)}
.chat-thread-lc svg{width:14px;height:14px;color:var(--sec)}

.chat-thread-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.chat-thread-day{align-self:center;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px;margin-bottom:4px}
.chat-thread-m{position:relative;max-width:80%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-thread-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px;padding-bottom:0}
.chat-thread-m.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-thread-m.gap{margin-top:8px}
.chat-thread-m.wide{width:80%}
.chat-thread-tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px}
.chat-thread-tm svg{width:16px;height:16px}
/* исходящее: мой текст, под чертой — что читает собеседник */
.chat-thread-t{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.3);font-size:15px;line-height:20px;color:#fff}
.chat-thread-t svg{flex:none;width:16px;height:16px;margin-top:2px}
/* входящее: перевод — основной текст, подпись «Перевод с …» мятным, оригинал по касанию (как chat-original) */
.chat-thread-ft{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:0 -12px;padding:0 12px}
.chat-thread-tg{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--mint);white-space:nowrap}
.chat-thread-tg svg{width:16px;height:16px;flex:none}
.chat-thread-tg svg.cv{width:14px;height:14px;opacity:.9}
.chat-thread-ft .chat-thread-tm{margin:0;color:var(--sec);flex:none}
.chat-thread-og{margin:8px 0 0;border-radius:12px;background:var(--sf);border-left:3px solid var(--mint);padding:8px 12px 10px}
.chat-thread-og .k{display:block;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin-bottom:2px}
.chat-thread-og .v{display:block;font-size:16px;line-height:22px;color:var(--tx)}
.chat-thread-rd{align-self:flex-end;display:flex;align-items:center;gap:4px;font:500 12px/16px Inter;color:var(--sec);margin:-2px 4px 0 0}
.chat-thread-rd svg{width:16px;height:16px;color:var(--acc)}

/* печатает */
.chat-thread-ty{align-self:flex-start;display:flex;align-items:center;gap:8px;margin-top:8px}
.chat-thread-ty .b{height:40px;border-radius:20px;border-bottom-left-radius:6px;background:var(--sf2);display:flex;align-items:center;gap:5px;padding:0 16px}
.chat-thread-ty .b i{width:8px;height:8px;border-radius:50%;background:var(--sec)}
.chat-thread-ty .b i:nth-child(2){opacity:.7}.chat-thread-ty .b i:nth-child(3){opacity:.45}
.chat-thread-ty span.l{font-size:13px;line-height:18px;color:var(--sec)}

/* поле ввода и предпросмотр (как chat-original) */
.chat-thread-cmp{flex:none;border-top:1px solid var(--line);padding:8px 12px 0;background:var(--bg)}
.chat-thread-row{display:flex;align-items:flex-end;gap:8px}
.chat-thread-pls{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-thread-pls svg{width:26px;height:26px}
.chat-thread-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:17px;line-height:22px;color:var(--tx)}
.chat-thread-f .pl{color:var(--sec)}
.chat-thread-f .car{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-4px;margin-left:1px;border-radius:1px}
.chat-thread-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-thread-go svg{width:22px;height:22px}
.chat-thread-pv{margin:0 0 8px;border-radius:16px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:2px 6px 12px 12px}
.chat-thread-pv .h{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--sec)}
.chat-thread-pv .h>svg{width:16px;height:16px;color:var(--mint);flex:none}
.chat-thread-pv .h .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-thread-pv p{margin:0 6px 0 0;font-size:16px;line-height:22px;color:var(--tx)}
.chat-thread-pv .ed{display:flex;align-items:center;gap:6px;margin:8px 6px 0 0;font-size:13px;line-height:18px;color:var(--sec)}
.chat-thread-pv .ed svg{width:14px;height:14px;flex:none}
.chat-thread-chip{flex:none;min-height:44px;display:flex;align-items:center}
.chat-thread-chip span{height:32px;border-radius:16px;background:var(--sf2);box-shadow:inset 0 0 0 1px #3A414B;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;font:600 13px/1 Inter;color:var(--tx);white-space:nowrap}
.chat-thread-chip svg{width:14px;height:14px;color:var(--sec)}
.chat-thread-chip .sp{width:16px;height:16px;color:var(--mint)}

/* баннер сети, ошибка отправки */
.chat-thread-bn{flex:none;display:flex;align-items:center;gap:12px;margin:8px 16px 0;padding:10px 14px;border-radius:14px;background:#3C2A2E;font-size:14px;line-height:20px}
.chat-thread-bn svg{width:22px;height:22px;color:#FF6B5E;flex:none}
.chat-thread-bn b{display:block;font-weight:600}
.chat-thread-bn span{color:#E4C9CC}
.chat-thread-m.fl{background:#173A2E;box-shadow:inset 0 0 0 1.5px rgba(255,107,94,.6)}
.chat-thread-m.fl .chat-thread-t{color:#C9D1DA;border-top-color:rgba(255,255,255,.16)}
.chat-thread-m.fl .chat-thread-tm{color:#C9D1DA}
.chat-thread-er{align-self:flex-end;display:flex;align-items:center;gap:8px;margin-top:-2px}
.chat-thread-er .r{display:flex;align-items:center;gap:6px;font:500 13px/18px Inter;color:#FF6B5E}
.chat-thread-er .r svg{width:16px;height:16px}
.chat-thread-rt{height:44px;display:flex;align-items:center}
.chat-thread-rt span{height:32px;border-radius:16px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;gap:6px;padding:0 14px;font:800 14px/1 Nunito,Inter}
.chat-thread-rt svg{width:16px;height:16px}

/* меню по долгому нажатию */
.chat-thread-dim{position:absolute;inset:0;background:rgba(9,11,14,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.chat-thread-dim.s{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(9,11,14,.66)}
.chat-thread-pop{position:absolute;left:16px;right:16px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.chat-thread-pop .chat-thread-m{box-shadow:0 12px 32px rgba(0,0,0,.4)}
.chat-thread-rx{display:flex;align-items:center;gap:2px;padding:4px;border-radius:28px;background:var(--sf2);box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 0 0 1px var(--line)}
.chat-thread-rx span{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.chat-thread-rx span svg{width:26px;height:26px}
.chat-thread-rx span.more{color:var(--sec)}
.chat-thread-mn{width:272px;border-radius:16px;background:var(--sf2);box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);overflow:hidden}
.chat-thread-mn div{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;font-size:17px;line-height:22px;border-top:1px solid var(--line)}
.chat-thread-mn div:first-child{border-top:0}
.chat-thread-mn div.sep{border-top:6px solid #1A1F25}
.chat-thread-mn svg{width:22px;height:22px;color:var(--sec);flex:none}

/* лист «Перевод неточный?» */
.chat-thread-sh{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45),inset 0 1px 0 var(--line);padding:8px 20px 0}
.chat-thread-gr{width:40px;height:5px;border-radius:3px;background:#3A414B;margin:0 auto 12px}
.chat-thread-shh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.chat-thread-shh h4{margin:0;font:900 26px/32px Nunito,sans-serif}
.chat-thread-shh p{margin:4px 0 0;color:var(--sec);font-size:14px;line-height:20px}
.chat-thread-x{width:44px;height:44px;margin:-6px -10px 0 0;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-thread-x i{width:32px;height:32px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center}
.chat-thread-x svg{width:18px;height:18px}
.chat-thread-bx{margin-top:12px;border-radius:16px;background:var(--sf2);padding:10px 14px 12px}
.chat-thread-bx .k{display:flex;align-items:center;gap:6px;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.chat-thread-bx .k svg{width:14px;height:14px}
.chat-thread-bx .v{font-size:17px;line-height:24px;margin-top:2px}
.chat-thread-bx .v.x{color:#C9D1DA;text-decoration:line-through;text-decoration-color:rgba(255,107,94,.8);text-decoration-thickness:1.5px}
.chat-thread-bx.ok{background:#1E3734;box-shadow:inset 0 0 0 1.5px var(--acc)}
.chat-thread-bx.ok .k{color:var(--mint)}
.chat-thread-bx .why{margin-top:4px;font-size:13px;line-height:18px;color:#C9D1DA}
.chat-thread-cta{margin-top:16px;height:52px;border-radius:26px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font:900 18px/1 Nunito,sans-serif;text-align:center;padding:0 16px}
.chat-thread-al{display:flex;gap:12px;margin-top:8px}
.chat-thread-al span{flex:1;min-width:0;min-height:48px;border-radius:24px;background:var(--sf2);display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px/20px Inter;padding:0 12px;text-align:center}
.chat-thread-al svg{width:18px;height:18px;color:var(--mint);flex:none}
.chat-thread-nt{margin:12px 0 0;font-size:13px;line-height:18px;color:var(--sec);text-align:center}
</style>
</head>

 ask:ic('<path d="M4.5 18.5V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v6.5a3 3 0 0 1-3 3H8z"/><path d="M10 8.8a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4"/><circle cx="12" cy="14" r=".5" fill="currentColor"/>'),
 heart:ic('<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/>'),
 thumb:ic('<path d="M7.5 10.5v9h-3v-9z"/><path d="M7.5 10.5l3.6-6.3c1.6 0 2.4 1 2.1 2.6l-.6 3h5.2a2 2 0 0 1 2 2.4l-1.3 5.8a2 2 0 0 1-2 1.5H7.5"/>'),
 laugh:ic('<circle cx="12" cy="12" r="9"/><path d="M7.5 13.5h9a4.5 4.5 0 0 1-9 0z"/><path d="M8 9.5l1.6-1 1.4 1M13 9.5l1.4-1 1.6 1"/>'),
 wow:ic('<circle cx="12" cy="12" r="9"/><circle cx="9" cy="9.5" r=".7" fill="currentColor"/><circle cx="15" cy="9.5" r=".7" fill="currentColor"/><ellipse cx="12" cy="15" rx="2" ry="2.5"/>'),
 ok:ic('<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/>'),
 add:ic('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>')
};
var sbar='<div class="sbar"><b>9:41</b><span class="sig"><i class="wf"></i><i></i></span></div>';
var home='<div class="homebar"><i></i></div>';
function scr(inner,extra){return '<div class="scr chat-thread-scr">'+sbar+inner+home+(extra||'')+'</div>'}
function nav(mode){
 var sub=mode==='ty'?'<span class="ty">'+T.typing+'</span>':mode==='off'?'<span>'+T.seen+'</span>':'<span><i></i>'+T.online+'</span>';
 return '<div class="chat-thread-nav"><span class="chat-thread-ib bk" role="button" aria-label="'+T.aBack+'" data-tap>'+I.back+'</span><span class="chat-thread-av" style="background:'+T.col+'" aria-hidden="true">'+T.ini+(mode==='off'?'':'<i></i>')+'</span><div class="chat-thread-nm"><b>'+T.name+'</b>'+sub+'</div><span class="chat-thread-lc" role="button" aria-label="'+T.aPair+'" data-tap><span>'+T.pair[0]+I.arr+T.pair[1]+'</span></span><span class="chat-thread-ib" role="button" aria-label="'+T.aMore+'" data-tap>'+I.more+'</span></div>'}
/* входящее: перевод — основной текст, оригинал по касанию (разметка chat-original) */
function mi(m,cls){
 return '<div class="chat-thread-m in '+(cls||'')+'"><span lang="'+T.ul+'">'+m[2]+'</span>'+
  '<div class="chat-thread-ft"><span class="chat-thread-tg" role="button" aria-expanded="false" data-tap>'+I.tr+T.trFrom+I.cd+'</span><span class="chat-thread-tm">'+m[3]+'</span></div></div>'}
function mo(m,cls){return '<div class="chat-thread-m out '+(cls||'')+'"><span>'+m[1]+'</span><div class="chat-thread-t" lang="'+T.rl+'" aria-label="'+T.trA+'">'+I.tr+'<span>'+m[2]+'</span></div><span class="chat-thread-tm">'+m[3]+I.done+'</span></div>'}
/* gap — отступ при смене стороны */
function list(arr){var prev=null;return arr.map(function(m){var g=prev&&prev!==m[0]?'gap':'';prev=m[0];return m[0]==='in'?mi(m,g):mo(m,g)}).join('')}
var day='<div class="chat-thread-day">'+T.today+'</div>';
function rd(t){return '<div class="chat-thread-rd">'+I.done+T.read+' '+t+'</div>'}
function cmp(){return '<div class="chat-thread-cmp"><div class="chat-thread-row"><span class="chat-thread-pls" role="button" aria-label="'+T.aPlus+'" data-tap>'+I.plus+'</span><span class="chat-thread-f"><span class="pl">'+T.ph+'</span></span><span class="chat-thread-go" role="button" aria-label="'+T.aMic+'" data-tap>'+I.mic+'</span></div></div>'}
function cmpTyped(){return '<div class="chat-thread-cmp"><div class="chat-thread-pv"><div class="h">'+I.tr+'<span class="lb">'+T.pvL+'</span><span class="chat-thread-chip" role="button" aria-label="'+T.aChip+'" data-tap><span>'+I.voice+T.chip+I.chev+'</span></span></div><p lang="'+T.rl+'">'+T.pvT+'</p><div class="ed">'+I.pen+'<span>'+T.pvEd+'</span></div></div>'+
 '<div class="chat-thread-row"><span class="chat-thread-pls" role="button" aria-label="'+T.aPlus+'" data-tap>'+I.plus+'</span><span class="chat-thread-f"><span>'+T.typed+'<i class="car"></i></span></span><span class="chat-thread-go" role="button" aria-label="'+T.aSend+'" data-tap>'+I.send+'</span></div></div>'}
var th=T.th;
function idiom(){return nav()+'<div class="chat-thread-msgs">'+list(th.slice(4,7).concat(T.id))+rd(T.id[2][3])+'</div>'+cmp()}

var S={};
S.main=function(){return scr(nav()+'<div class="chat-thread-msgs">'+day+list(th.slice(0,5))+rd(th[4][3])+'</div>'+cmp())};
S.preview=function(){return scr(nav()+'<div class="chat-thread-msgs">'+list(th.slice(2))+rd(th[6][3])+'</div>'+cmpTyped())};
S.typing=function(){return scr(nav('ty')+'<div class="chat-thread-msgs">'+day+list(th.slice(0,5))+rd(th[4][3])+
 '<div class="chat-thread-ty"><span class="b" role="img" aria-label="'+T.tyL+'"><i></i><i></i><i></i></span><span class="l">'+T.tyL+'</span></div></div>'+cmp())};
S.menu=function(){return scr(idiom(),
 '<div class="chat-thread-dim"></div><div class="chat-thread-pop" style="top:300px">'+
 '<div class="chat-thread-rx" role="group" aria-label="'+T.aRx+'">'+[I.heart,I.thumb,I.laugh,I.wow,I.ok].map(function(s,i){return '<span role="button" aria-label="'+T.rxN[i]+'" data-tap>'+s+'</span>'}).join('')+'<span class="more" role="button" aria-label="'+T.aMoreRx+'" data-tap>'+I.add+'</span></div>'+
 mi(T.id[1])+
 '<div class="chat-thread-mn" role="menu"><div role="menuitem" data-tap><span>'+T.mn[0]+'</span>'+I.reply+'</div><div role="menuitem" data-tap><span>'+T.mn[1]+'</span>'+I.copy+'</div><div role="menuitem" data-tap><span>'+T.mn[2]+'</span>'+I.orig+'</div><div role="menuitem" class="sep" data-tap><span>'+T.mn[3]+'</span>'+I.flag+'</div></div></div>')};
S.inaccurate=function(){return scr(idiom(),
 '<div class="chat-thread-dim s"></div><div class="chat-thread-sh" role="dialog" aria-label="'+T.shT+'"><div class="chat-thread-gr"></div>'+
 '<div class="chat-thread-shh"><div><h4>'+T.shT+'</h4><p>'+T.shS+'</p></div><span class="chat-thread-x" role="button" aria-label="'+T.aClose+'" data-tap><i>'+I.x+'</i></span></div>'+
 '<div class="chat-thread-bx"><div class="k">'+T.ogK+'</div><div class="v" lang="'+T.rl+'">'+T.id[1][1]+'</div></div>'+
 '<div class="chat-thread-bx"><div class="k">'+T.now+'</div><div class="v x">'+T.id[1][2]+'</div></div>'+
 '<div class="chat-thread-bx ok"><div class="k">'+I.tr+T.alt+'</div><div class="v">'+T.altT+'</div><div class="why">'+T.why+'</div></div>'+
 '<div class="chat-thread-cta" role="button" data-tap>'+T.cta+'</div>'+
 '<div class="chat-thread-al"><span role="button" data-tap>'+I.ask+T.ask+'</span><span role="button" data-tap>'+I.flag+T.rep+'</span></div>'+
 '<p class="chat-thread-nt">'+T.askN+'</p><div style="height:42px"></div></div>')};
S.failed=function(){return scr(nav('off')+'<div class="chat-thread-bn" role="status">'+I.woff+'<div><b>'+T.bnB+'</b><span>'+T.bnS+'</span></div></div><div class="chat-thread-msgs">'+list(th.slice(3))+
 '<div class="chat-thread-m out fl"><span>'+T.fl+'</span><div class="chat-thread-t">'+I.clock+'<span>'+T.flT+'</span></div><span class="chat-thread-tm">10:05</span></div>'+
 '<div class="chat-thread-er"><span class="r">'+I.alert+T.flE+'</span><span class="chat-thread-rt" role="button" aria-label="'+T.aRetry+'" data-tap><span>'+I.retry+T.retry+'</span></span></div></div>'+cmp())};

/* ===== страница ===== */
document.documentElement.lang=T.htmlLang;document.title=T.docTitle;
function $(id){return document.getElementById('chat-thread-'+id)}
$('lng').innerHTML=['ru','es','en'].map(function(k){return '<a href="?l='+k+'" hreflang="'+k+'" class="'+(k===l?'on':'')+'"'+(k===l?' aria-current="true"':'')+'>'+k.toUpperCase()+'</a>'}).join('');
$('eb').textContent=T.eb;$('h1').textContent=T.h1;$('intro').textContent=T.intro;
$('capb').textContent=T.capB;$('caps').textContent=T.capS;
$('what').innerHTML=T.what.map(function(x){return '<li>'+x+'</li>'}).join('');
$('sth').textContent=T.stH;$('stl').innerHTML=T.stL;
var order=['main','preview','typing','menu','inaccurate','failed'];
$('grid').innerHTML=order.map(function(k){return '<div class="chat-thread-card"><div class="pf p67" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+T.st[k][0]+' <code>'+k+'</code></h3><p>'+T.st[k][1]+'</p></div>'}).join('');
document.querySelectorAll('.pf[data-state]').forEach(function(p){p.querySelector('.glass').innerHTML=S[p.dataset.state]()});
$('moreh').textContent=T.moreH;$('dech').textContent=T.decH;$('tokh').textContent=T.tokH;$('nah').textContent=T.naH;
$('dec').innerHTML=T.dec.map(function(x){return '<li>'+x+'</li>'}).join('');
$('tok').innerHTML=T.tok.map(function(x){return '<li>'+x+'</li>'}).join('');
$('na').innerHTML=T.na.map(function(x){return '<li>'+x+'</li>'}).join('');

function Lu(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#242B34'],['#BFF2DC','#242B34'],['#9AA4B2','#242B34'],['#F2F5F7','#1C2026'],['#9AA4B2','#1C2026'],['#FFFFFF','#00875C'],['#9AA4B2','#0E1116'],['#2BC48A','#0E1116'],['#0E1116','#2BC48A'],['#FF6B5E','#0E1116'],['#E4C9CC','#3C2A2E'],['#F2F5F7','#173A2E'],['#C9D1DA','#173A2E'],['#BFF2DC','#1E3734'],['#C9D1DA','#242B34']];
$('ct').innerHTML=pairs.map(function(r,i){return '<tr><td><span class="chat-thread-sw" style="background:'+r[0]+'"></span><span class="chat-thread-sw" style="background:'+r[1]+'"></span>'+T.ct[i]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_THREAD={lang:l,S:S,order:order,min:Math.min.apply(null,pairs.map(function(r){return cr(r[0],r[1])})),
 hero:function(k){var h=$('hero');h.dataset.state=k;h.querySelector('.glass').innerHTML=S[k]()}};
})();
</script>
