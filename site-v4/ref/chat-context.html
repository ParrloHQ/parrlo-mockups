<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-context-w{max-width:1200px;margin:0 auto}
.chat-context-lng{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-context-lng a{min-width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#C9D1DA;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.chat-context-lng a.on{background:#2BC48A;color:#0E1116;box-shadow:none}
.chat-context-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-context-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-context-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-context-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-context-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-context-info ul,.chat-context-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-context-info li,.chat-context-sec li{margin:6px 0}
.chat-context-w b{color:#F2F5F7;font-weight:600}
.chat-context-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-context-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-context-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-context-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:40px 24px;justify-items:center}
.chat-context-card{width:273px}
.chat-context-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.chat-context-card h3 code{font-size:12px;color:#9AA4B2}
.chat-context-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-context-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.chat-context-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-context-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-context-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-context-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-context-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-context-hero .pf{--s:.78!important}.chat-context-info h1{font-size:30px}.chat-context-hero{gap:24px}}

/* ======= экран 430×932 ======= */
.chat-context-scr{overflow:hidden}
.chat-context-scr svg{display:block}
.chat-context-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-context-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-context-ib svg{width:24px;height:24px}
.chat-context-ib.bk{color:var(--acc)}.chat-context-ib.bk svg{width:28px;height:28px}
.chat-context-av{width:40px;height:40px;border-radius:50%;background:#6AA6F5;color:#0E1116;font:800 17px/40px Nunito,Inter;text-align:center;flex:none}
.chat-context-av.o{background:#E8A0BF}
.chat-context-nm{flex:1;min-width:0;padding-left:4px}
.chat-context-nm b{display:block;font:600 17px/22px Inter}
.chat-context-nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:18px;color:var(--sec)}
.chat-context-lc{flex:none;height:44px;display:flex;align-items:center}
.chat-context-lc span{height:32px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 13px/1 Inter;letter-spacing:.04em;color:var(--tx)}
.chat-context-lc svg{width:14px;height:14px;color:var(--sec)}

.chat-context-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.chat-context-day{align-self:center;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px;margin-bottom:4px}
.chat-context-m{position:relative;max-width:80%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-context-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px;padding-bottom:0}
.chat-context-m.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-context-m.gap{margin-top:8px}
.chat-context-m.wide{width:80%}
.chat-context-tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px}
.chat-context-tm svg{width:16px;height:16px}
/* подпись «перевод» внутри входящего */
.chat-context-ft{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:0 -12px;padding:0 12px}
.chat-context-tg{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--mint);white-space:nowrap}
.chat-context-tg svg{width:16px;height:16px;flex:none}
.chat-context-tg svg.cv{width:14px;height:14px;opacity:.9}
.chat-context-ft .chat-context-tm{margin:0;color:var(--sec);flex:none}
/* раскрытый оригинал */
.chat-context-og{margin:8px 0 0;border-radius:12px;background:var(--sf);border-left:3px solid var(--mint);padding:8px 12px 10px}
.chat-context-og .k{display:block;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin-bottom:2px}
.chat-context-og .v{display:block;font-size:16px;line-height:22px;color:var(--tx)}
.chat-context-m.hl{box-shadow:0 0 0 2px var(--acc)}
.chat-context-rd{align-self:flex-end;display:flex;align-items:center;gap:4px;font:500 12px/16px Inter;color:var(--sec);margin:-2px 4px 0 0}
.chat-context-rd svg{width:16px;height:16px;color:var(--acc)}

/* поле ввода и предпросмотр */
.chat-context-cmp{flex:none;border-top:1px solid var(--line);padding:8px 12px 0;background:var(--bg)}
.chat-context-row{display:flex;align-items:flex-end;gap:8px}
.chat-context-pls{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-context-pls svg{width:26px;height:26px}
.chat-context-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:17px;line-height:22px;color:var(--tx)}
.chat-context-f .pl{color:var(--sec)}
.chat-context-f .car{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-4px;margin-left:1px;border-radius:1px}
.chat-context-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-context-go svg{width:22px;height:22px}
.chat-context-pv{margin:0 0 8px;border-radius:16px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:2px 6px 12px 12px}
.chat-context-pv .h{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--sec)}
.chat-context-pv .h>svg{width:16px;height:16px;color:var(--mint);flex:none}
.chat-context-pv .h .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-context-pv p{margin:0 6px 0 0;font-size:16px;line-height:22px;color:var(--tx)}
.chat-context-chip{flex:none;min-height:44px;display:flex;align-items:center}
.chat-context-chip span{height:32px;border-radius:16px;background:var(--sf2);box-shadow:inset 0 0 0 1px #3A414B;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;font:600 13px/1 Inter;color:var(--tx);white-space:nowrap}
.chat-context-chip svg{width:14px;height:14px;color:var(--sec)}
.chat-context-chip .sp{width:16px;height:16px;color:var(--mint)}

/* затемнение, меню */
.chat-context-dim{position:absolute;inset:0;background:rgba(9,11,14,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.chat-context-dim.s{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(9,11,14,.66)}
.chat-context-pop{position:absolute;left:16px;right:16px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.chat-context-pop .chat-context-m{box-shadow:0 12px 32px rgba(0,0,0,.4)}
.chat-context-mn{width:272px;border-radius:16px;background:var(--sf2);box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);overflow:hidden}
.chat-context-mn div{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;font-size:17px;line-height:22px;border-top:1px solid var(--line)}
.chat-context-mn div:first-child{border-top:0}
.chat-context-mn div.sep{border-top:6px solid #1A1F25}
.chat-context-mn svg{width:22px;height:22px;color:var(--sec);flex:none}
.chat-context-mn div.on svg{color:var(--mint)}

.chat-context-st{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;padding:6px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px #FFC247;color:#FFC247;font:600 13px/18px Inter}
.chat-context-st i{width:8px;height:8px;border-radius:50%;background:#FFC247;flex:none}
/* кнопка «Объясни контекст» под входящим */
.chat-context-ask{align-self:flex-start;min-height:44px;display:flex;align-items:center;margin:-6px 0 -6px 0}
.chat-context-ask span{height:34px;border-radius:17px;background:var(--sf);box-shadow:inset 0 0 0 1px #3A414B;display:flex;align-items:center;gap:8px;padding:0 14px 0 10px;font:600 14px/1 Inter;color:var(--tx);white-space:nowrap}
.chat-context-ask svg{width:18px;height:18px;color:var(--mint);flex:none}
.chat-context-pk{width:18px;height:18px;flex:none}
/* лист «Что это значит» */
.chat-context-sh{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45),inset 0 1px 0 var(--line);padding:8px 20px 0}
.chat-context-gr{width:40px;height:5px;border-radius:3px;background:#3A414B;margin:0 auto 12px}
.chat-context-shh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chat-context-shh .ttl{display:flex;align-items:center;gap:10px;min-width:0}
.chat-context-shh .ttl .pk{width:36px;height:36px;border-radius:50%;background:#1E3734;color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
.chat-context-shh .ttl .pk svg{width:20px;height:20px}
.chat-context-shh h4{margin:0;font:900 26px/32px Nunito,sans-serif}
.chat-context-x{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-context-x i{width:32px;height:32px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center}
.chat-context-x svg{width:18px;height:18px}
.chat-context-q{margin-top:12px;border-radius:16px;background:var(--bg);border-left:3px solid var(--mint);padding:10px 14px 12px}
.chat-context-q .k{display:block;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.chat-context-q .v{display:block;margin-top:2px;font:600 18px/24px Inter;color:var(--tx)}
.chat-context-q .t{display:block;margin-top:2px;font-size:14px;line-height:20px;color:var(--sec)}
.chat-context-k{display:flex;align-items:center;gap:6px;margin:16px 0 6px;font:600 13px/18px Inter;color:var(--sec)}
.chat-context-k svg{width:16px;height:16px;color:var(--mint);flex:none}
.chat-context-p{margin:0;font-size:16px;line-height:22px;color:var(--tx)}
.chat-context-tn{display:flex;gap:8px}
.chat-context-tn>span{flex:1;min-width:0;height:40px;border-radius:20px;background:var(--sf2);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;font:500 14px/1 Inter;color:var(--sec);white-space:nowrap}
.chat-context-tn>span.on{background:#1E3734;box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--mint);font-weight:700}
.chat-context-tn svg{width:16px;height:16px;flex:none}
.chat-context-tnn{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--sec)}
.chat-context-ad{display:flex;align-items:center;gap:12px}
.chat-context-ad .b{width:56px;height:56px;border-radius:16px;background:#1E3734;box-shadow:inset 0 0 0 1.5px var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.chat-context-ad .b b{font:900 20px/22px Nunito,sans-serif;color:var(--mint)}
.chat-context-ad .b span{font:500 12px/14px Inter;color:var(--mint)}
.chat-context-ad p{margin:0;font-size:15px;line-height:21px;color:var(--tx)}
.chat-context-rp{border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:12px 12px 12px}
.chat-context-rp .u{margin-left:auto;max-width:92%;width:fit-content;border-radius:18px;border-bottom-right-radius:6px;background:var(--deep);color:#fff;padding:9px 14px;font:500 16px/22px Inter}
.chat-context-rp .r{display:flex;align-items:center;gap:6px;margin:10px 2px 0;font:600 12px/16px Inter;color:var(--sec)}
.chat-context-rp .r svg{width:14px;height:14px;color:var(--mint);flex:none}
.chat-context-rp .rt{margin:2px 2px 0;font-size:15px;line-height:21px;color:var(--tx)}
.chat-context-cta{margin-top:12px;height:52px;border-radius:26px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;gap:8px;font:900 18px/1 Nunito,sans-serif}
.chat-context-cta svg{width:20px;height:20px}
.chat-context-dc{margin:10px 0 0;font-size:12px;line-height:16px;color:var(--sec);text-align:center}
</style>
</head>

 var tn=T.tones.map(function(t,i){var on=i===T.tOn;return '<span class="'+(on?'on':'')+'">'+(on?I.check:'')+t+'</span>'}).join('');
 return scr(nav()+'<div class="chat-context-msgs">'+msg(3)+msg(4)+msg(5,'gap')+ask()+'</div>'+cmp(),
 '<div class="chat-context-dim s"></div><div class="chat-context-sh" role="dialog" aria-label="'+T.shT+'"><div class="chat-context-gr"></div>'+
 '<div class="chat-context-shh"><div class="ttl"><span class="pk">'+pk()+'</span><h4>'+T.shT+'</h4></div><span class="chat-context-x" role="button" aria-label="'+T.aClose+'"><i>'+I.x+'</i></span></div>'+
 '<div class="chat-context-q"><span class="k">'+T.ogK+'</span><span class="v" lang="'+T.rl+'">'+T.th[5][1]+'</span><span class="t" lang="'+T.ul+'">'+T.th[5][2]+'</span></div>'+
 '<div class="chat-context-k">'+I.bulb+T.mK+'</div><p class="chat-context-p">'+T.mT+'</p>'+
 '<div class="chat-context-k">'+I.tone+T.tK+'</div><div class="chat-context-tn">'+tn+'</div><p class="chat-context-tnn">'+T.tN+'</p>'+
 '<div class="chat-context-k">'+I.who+T.aK+'</div><div class="chat-context-ad"><span class="b"><b>'+T.aB[0]+'</b><span>'+T.aB[1]+'</span></span><p>'+T.aT+'</p></div>'+
 '<div class="chat-context-k">'+I.rep+T.rK+'</div><div class="chat-context-rp"><div class="u">'+T.rU+'</div><div class="r">'+I.tr+T.rR+'</div><div class="rt" lang="'+T.rl+'">'+T.rRt+'</div></div>'+
 '<div class="chat-context-cta" role="button">'+I.ins+T.cta+'</div><p class="chat-context-dc">'+T.dc+'</p><div style="height:34px"></div></div>')};
S.reply=function(){return scr(nav()+'<div class="chat-context-msgs">'+msg(1)+msg(2,'gap')+msg(3)+msg(4)+msg(5,'gap')+ask()+'</div>'+cmpTyped())};
window.CHAT_CONTEXT_S=S;

document.documentElement.lang=T.htmlLang;document.title=T.docTitle;
function $(id){return document.getElementById('chat-context-'+id)}
$('lng').innerHTML=['ru','es','en'].map(function(k){return '<a href="?l='+k+'" hreflang="'+k+'" class="'+(k===l?'on':'')+'"'+(k===l?' aria-current="true"':'')+'>'+k.toUpperCase()+'</a>'}).join('');
$('eb').textContent=T.eb;$('stat').textContent=T.stat;$('h1').textContent=T.h1;$('intro').textContent=T.intro;
$('capb').textContent=T.capB;$('caps').textContent=T.capS;
$('what').innerHTML=T.what.map(function(x){return '<li>'+x+'</li>'}).join('');
$('sth').textContent=T.stH;$('stl').innerHTML=T.stL;
var order=['thread','menu','explain','reply'];window.CHAT_CONTEXT_ORDER=order;
$('grid').innerHTML=order.map(function(k){return '<div class="chat-context-card"><div class="pf p67" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+T.st[k][0]+' <code>'+k+'</code></h3><p>'+T.st[k][1]+'</p></div>'}).join('');

$('tok').innerHTML=T.tok.map(function(x){return '<li>'+x+'</li>'}).join('');
$('na').innerHTML=T.na.map(function(x){return '<li>'+x+'</li>'}).join('');

function Lu(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#242B34'],['#BFF2DC','#242B34'],['#9AA4B2','#242B34'],['#F2F5F7','#1C2026'],['#9AA4B2','#1C2026'],['#9AA4B2','#0E1116'],['#F2F5F7','#0E1116'],['#BFF2DC','#1E3734'],['#9AA4B2','#242B34'],['#FFFFFF','#00875C'],['#0E1116','#2BC48A']];
$('ct').innerHTML=pairs.map(function(r,i){return '<tr><td><span class="chat-context-sw" style="background:'+r[0]+'"></span><span class="chat-context-sw" style="background:'+r[1]+'"></span>'+T.ct[i]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_CONTEXT_MIN=Math.min.apply(null,pairs.map(function(r){return cr(r[0],r[1])}));
})();
