<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Chat · веб-версия</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-web-w{max-width:1200px;margin:0 auto}
.chat-web-lsw{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-web-lsw a{min-width:48px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#9AA4B2;text-decoration:none;padding:0 12px}
.chat-web-lsw a[aria-current="true"]{background:#1C2026;color:#F2F5F7;box-shadow:inset 0 0 0 1px #2F3742}
.chat-web-info{max-width:860px;margin:0 0 32px}
.chat-web-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-web-info h1{font:900 44px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-web-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-web-info ul,.chat-web-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-web-info ul{columns:2;column-gap:40px}
.chat-web-info li,.chat-web-sec li{margin:6px 0;break-inside:avoid}
.chat-web-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7}
.chat-web-cap{display:flex;gap:10px;align-items:flex-start;margin-top:20px;max-width:720px;font:400 15px/1.45 Inter,system-ui,sans-serif}
.chat-web-cap .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:#2BC48A}
.chat-web-cap b{display:block;font:800 17px/1.3 Nunito,Inter,sans-serif}
.chat-web-cap span{color:#9AA4B2}
.chat-web-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-web-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-web-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 24px;justify-items:center;align-items:start}
.chat-web-card{width:300px}
.chat-web-card.wide{grid-column:1/-1;width:100%}
.chat-web-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chat-web-card h3 code{font-size:12px;color:#9AA4B2}
.chat-web-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45;max-width:720px}
.chat-web-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px 40px}
.chat-web-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-web-sec b{color:#F2F5F7;font-weight:600}
.chat-web-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-web-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-web-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-web-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:640px){.chat-web-info h1{font-size:34px}.chat-web-info ul{columns:1}.chat-web-cols{grid-template-columns:1fr}}

/* ===== рамка окна браузера на компьютере: 1440×900 ===== */
.chat-web-fit{position:relative;width:100%}
.chat-web-fit>.chat-web-win{position:absolute;left:0;top:0;transform-origin:0 0}
.chat-web-win{width:1440px;height:900px;border-radius:14px;overflow:hidden;background:#14181D;box-shadow:inset 0 0 0 1px #3A414B;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif}
.chat-web-fit.sh>.chat-web-win{box-shadow:inset 0 0 0 1px #3A414B,0 40px 90px -30px rgba(0,0,0,.6)}
.chat-web-tabs{flex:none;height:44px;display:flex;align-items:flex-end;gap:8px;padding:0 12px 0 16px}
.chat-web-dots{display:flex;gap:8px;align-self:center;margin-right:12px}
.chat-web-dots i{width:12px;height:12px;border-radius:50%;background:#3A414B}
.chat-web-tab{width:240px;height:36px;border-radius:10px 10px 0 0;background:#0E1116;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;font:500 13px/1 Inter;color:#F2F5F7}
.chat-web-tab img{width:18px;height:18px}
.chat-web-tab span{flex:1}
.chat-web-tab svg,.chat-web-nt svg{width:14px;height:14px;color:#9AA4B2}
.chat-web-nt{height:36px;width:36px;display:flex;align-items:center;justify-content:center}
.chat-web-tool{flex:none;height:48px;display:flex;align-items:center;gap:4px;padding:0 12px;background:#0E1116;border-bottom:1px solid #2F3742}
.chat-web-tool .b{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#9AA4B2}
.chat-web-tool .b svg{width:18px;height:18px}
.chat-web-url{flex:1;height:34px;margin:0 8px;border-radius:17px;background:#1C2026;display:flex;align-items:center;padding:0 16px;font:400 14px/1 Inter;color:#C9D1DA}
.chat-web-url b{font-weight:500;color:#F2F5F7}
.chat-web-app{flex:1;min-height:0;display:flex;flex-direction:row}
.chat-web-app.scr{flex-direction:row}

/* ===== рамка телефона-браузера ===== */
.chat-web-ph{--s:1;--w:390px;--h:844px;position:relative;display:inline-block;flex:none;width:calc((var(--w) + 20px)*var(--s));height:calc((var(--h) + 20px)*var(--s));border-radius:calc(48px*var(--s));background:#14181D;box-shadow:inset 0 0 0 calc(1.5px*var(--s)) #3A414B,0 calc(40px*var(--s)) calc(90px*var(--s)) calc(-30px*var(--s)) rgba(0,0,0,.55)}
.chat-web-ph.n360{--w:360px;--h:780px}
.chat-web-pg{position:absolute;left:calc(10px*var(--s));top:calc(10px*var(--s));width:calc(var(--w)*var(--s));height:calc(var(--h)*var(--s));border-radius:calc(38px*var(--s));overflow:hidden;background:#0E1116}
.chat-web-pg>.scr{width:var(--w);height:var(--h);transform:scale(var(--s));transform-origin:0 0;overflow:hidden}
.chat-web-mbar{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 8px;border-bottom:1px solid var(--line);background:#14181D}
.chat-web-mbar .u{flex:1;height:40px;border-radius:20px;background:var(--sf);display:flex;align-items:center;justify-content:center;font:500 15px/1 Inter;color:#C9D1DA}
.chat-web-mbar .b{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sec)}
.chat-web-mbar .b svg{width:20px;height:20px}
.chat-web-ph .sbar{background:#14181D}

/* ===== общий экран ===== */
.chat-web-scr svg{display:block;flex:none}
.chat-web-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-web-ib svg{width:22px;height:22px}
.chat-web-ib.f{background:var(--sf2);color:var(--acc)}
.chat-web-ib.me{background:var(--sf2);color:var(--sec)}

/* боковая панель / список */
.chat-web-side{width:400px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.chat-web-lst{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.chat-web-hd{flex:none;height:64px;display:flex;align-items:center;gap:8px;padding:0 16px 0 20px}
.chat-web-hd h3{margin:0;flex:1;font:900 28px/1 Nunito,sans-serif}
.chat-web-lst.mob .chat-web-hd{height:60px}
.chat-web-lst.mob .chat-web-hd h3{font-size:34px}
.chat-web-sr{flex:none;margin:0 16px 4px;height:44px;border-radius:12px;background:var(--sf);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--sec);font-size:16px;white-space:nowrap;overflow:hidden}
.chat-web-sr svg{width:20px;height:20px}
.chat-web-sr kbd{margin-left:auto;font:600 12px/1 Inter;color:var(--sec);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.chat-web-fl{flex:none;display:flex;gap:8px;padding:4px 16px 8px;height:52px;align-items:center;overflow:hidden}
.chat-web-ch{flex:none;height:36px;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:6px;font:600 15px/1 Inter;color:var(--tx);background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chat-web-ch.on{background:var(--tx);color:var(--bg);box-shadow:none}
.chat-web-ch em{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:var(--onacc);font:700 12px/20px Inter;text-align:center;padding:0 6px}
.chat-web-ls{flex:1;min-height:0;overflow:hidden;padding:0 8px}
.chat-web-lst.mob .chat-web-ls{padding:0}
.chat-web-r{position:relative;height:76px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:14px}
.chat-web-lst.mob .chat-web-r{border-radius:0;padding:0 16px}
.chat-web-r.sel{background:var(--sf)}
.chat-web-r.sel::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:2px;background:var(--acc)}
.chat-web-av{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:900 21px Nunito,sans-serif;color:#0E1116;position:relative}
.chat-web-av.w{color:#fff}
.chat-web-av .g{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--sf2);box-shadow:0 0 0 3px var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center}
.chat-web-av .g svg{width:13px;height:13px}
.chat-web-av .o{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--bg)}
.chat-web-r.sel .chat-web-av .o,.chat-web-r.sel .chat-web-av .g{box-shadow:0 0 0 3px var(--sf)}
.chat-web-av.rq{background:#1E3734;color:var(--mint)}
.chat-web-av.rq svg{width:24px;height:24px}
.chat-web-bd{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:inset 0 -1px 0 var(--line)}
.chat-web-r.sel .chat-web-bd,.chat-web-r.nl .chat-web-bd{box-shadow:none}
.chat-web-l1,.chat-web-l2{display:flex;align-items:center;gap:6px;min-width:0}
.chat-web-nm{min-width:0;font:600 17px/1.25 Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-web-mu{width:16px;height:16px;color:var(--sec)}
.chat-web-tm{margin-left:auto;flex:none;font:400 14px/1 Inter;color:var(--sec);display:flex;align-items:center;gap:4px}
.chat-web-tm.u{color:var(--acc);font-weight:600}
.chat-web-tm svg{width:18px;height:18px;color:var(--acc)}
.chat-web-pv{flex:1;min-width:0;font-size:15px;line-height:1.3;color:var(--sec);display:flex;align-items:center;gap:6px}
.chat-web-pv.u{color:var(--tx)}
.chat-web-pv>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-web-pv>svg{width:16px;height:16px;color:var(--sec)}
.chat-web-pv .who{color:var(--tx);font-weight:500}
.chat-web-bg{flex:none;min-width:24px;height:24px;border-radius:12px;background:var(--acc);color:var(--onacc);font:700 13px/24px Inter;text-align:center;padding:0 7px}
.chat-web-bg.m{background:var(--sf2);color:var(--tx)}

/* переписка */
.chat-web-th{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.chat-web-nav{flex:none;display:flex;align-items:center;gap:8px;height:64px;padding:0 16px 0 24px;border-bottom:1px solid var(--line)}
.chat-web-th.mob .chat-web-nav{height:60px;padding:0 8px 0 4px}
.chat-web-ib.bk{color:var(--acc);width:44px}.chat-web-ib.bk svg{width:28px;height:28px}
.chat-web-pav{position:relative;width:40px;height:40px;border-radius:50%;color:#0E1116;font:800 17px/40px Nunito,Inter;text-align:center;flex:none}
.chat-web-pav i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2.5px var(--bg)}
.chat-web-pnm{flex:1;min-width:0;padding-left:4px}
.chat-web-pnm b{display:block;font:600 17px/22px Inter}
.chat-web-pnm span{display:block;font-size:13px;line-height:18px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-web-lc{flex:none;height:44px;display:flex;align-items:center}
.chat-web-lc span{height:32px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 13px/1 Inter;letter-spacing:.04em;color:var(--tx)}
.chat-web-lc svg{width:14px;height:14px;color:var(--sec)}
.chat-web-col{width:100%;max-width:760px;margin:0 auto}
.chat-web-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 24px}
.chat-web-th.mob .chat-web-msgs{padding:12px 16px}
.chat-web-day{align-self:center;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px;margin-bottom:4px}
.chat-web-m{position:relative;max-width:72%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-web-th.mob .chat-web-m{max-width:82%}
.chat-web-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px}
.chat-web-m.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-web-m.gap{margin-top:8px}
.chat-web-t{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(154,164,178,.28);font-size:15px;line-height:20px}
.chat-web-t svg{flex:none;width:16px;height:16px;margin-top:2px}
.chat-web-m.in .chat-web-t{color:var(--mint)}
.chat-web-m.out .chat-web-t{color:#fff;border-top-color:rgba(255,255,255,.3)}
.chat-web-mt{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px}
.chat-web-m.in .chat-web-mt{color:var(--sec)}
.chat-web-mt svg{width:16px;height:16px}
.chat-web-rd{align-self:flex-end;display:flex;align-items:center;gap:4px;font:500 12px/16px Inter;color:var(--sec);margin:-2px 4px 0 0}
.chat-web-rd svg{width:16px;height:16px;color:var(--acc)}
/* наведение на сообщение (компьютер) */
.chat-web-m.hv{background:#2A313B}
.chat-web-hb{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);display:flex;gap:2px;padding:2px;border-radius:24px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.4)}
.chat-web-hb span{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.chat-web-hb span svg{width:20px;height:20px}
.chat-web-hb span.on{background:var(--sf2)}
.chat-web-tip{position:absolute;left:calc(100% + 8px);top:calc(50% + 32px);font:500 12px/1 Inter;color:var(--tx);background:#3A414B;border-radius:8px;padding:6px 8px;white-space:nowrap}
/* поле ввода */
.chat-web-cmp{flex:none;border-top:1px solid var(--line);padding:12px 24px 8px;background:var(--bg)}
.chat-web-th.mob .chat-web-cmp{padding:8px 12px 12px}
.chat-web-row{display:flex;align-items:flex-end;gap:8px}
.chat-web-pls{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-web-pls svg{width:26px;height:26px}
.chat-web-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:17px;line-height:22px;color:var(--tx)}
.chat-web-f.fc{border-color:var(--acc)}
.chat-web-f .pl{color:var(--sec)}
.chat-web-f .car{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-4px;margin-left:1px;border-radius:1px}
.chat-web-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-web-go svg{width:22px;height:22px}
.chat-web-pvw{margin:0 0 8px 52px;border-radius:16px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:8px 12px 10px}
.chat-web-pvw .h{display:flex;align-items:center;gap:6px;font:600 12px/16px Inter;color:var(--sec)}
.chat-web-pvw .h svg{width:14px;height:14px;color:var(--mint)}
.chat-web-pvw .h .lv{margin-left:auto;display:flex;align-items:center;gap:4px;font-weight:500}
.chat-web-pvw .h .lv i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chat-web-pvw p{margin:4px 0 0;font-size:16px;line-height:22px;color:var(--tx)}
.chat-web-kh{margin:8px 0 0 52px;font:400 12px/16px Inter;color:var(--sec)}
.chat-web-kh kbd{font:600 11px/1 Inter;color:#C9D1DA;border:1px solid var(--line);border-radius:5px;padding:2px 5px;margin:0 1px}

/* вход */
.chat-web-si{flex:1;display:flex;min-width:0}
.chat-web-brand{width:640px;flex:none;position:relative;overflow:hidden;background:linear-gradient(160deg,#1E3734 0%,#141B1C 52%,#0E1116 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 72px}
.chat-web-brand .lg{display:flex;align-items:center;gap:10px;position:absolute;left:40px;top:32px;font:900 22px/1 Nunito,sans-serif}
.chat-web-brand .lg img{width:40px;height:40px}
.chat-web-brand h2{margin:0 0 12px;font:900 52px/1.08 Nunito,sans-serif;letter-spacing:-.005em}
.chat-web-brand p{margin:0 0 40px;font-size:18px;line-height:27px;color:#C9D1DA;max-width:440px}
.chat-web-demo{display:flex;flex-direction:column;gap:10px;max-width:440px}
.chat-web-demo .chat-web-m{max-width:86%}
.chat-web-brand .ms{position:absolute;right:-28px;bottom:-24px;width:220px;height:220px;opacity:.95}
.chat-web-form{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 48px}
.chat-web-fb{width:400px}
.chat-web-fb h3{margin:0 0 8px;font:900 34px/1.15 Nunito,sans-serif}
.chat-web-fb>p{margin:0 0 32px;font-size:16px;line-height:24px;color:var(--sec)}
.chat-web-btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:12px;font:600 17px/1 Inter;background:var(--sf2);color:var(--tx);box-shadow:inset 0 0 0 1px #3A414B;margin-bottom:12px}
.chat-web-btn .ph{width:28px;height:28px;border-radius:50%;background:#3A414B;color:#F2F5F7;font:700 14px/28px Inter;text-align:center}
.chat-web-lg{margin:20px 0 0;font-size:13px;line-height:19px;color:var(--sec);text-align:center}
.chat-web-lg u{color:#C9D1DA;text-underline-offset:2px}
.chat-web-fo{position:absolute;right:40px;bottom:28px;display:flex;gap:4px}
.chat-web-fo span{height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:22px;font:500 14px/1 Inter;color:var(--sec)}
.chat-web-fo svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="chat-web-w">
<nav class="chat-web-lsw" id="chat-web-lsw" aria-label="Language"></nav>

<section class="chat-web-info">
 <p class="chat-web-eb" id="chat-web-eb"></p>
 <h1 id="chat-web-h1"></h1>
 <p id="chat-web-p1"></p>
 <ul id="chat-web-ul"></ul>
</section>

<section>
 <div class="chat-web-fit sh" data-state="desktop" data-hero="1"></div>
 <div class="chat-web-cap"><span class="dot"></span><div><b id="chat-web-capb"></b><span id="chat-web-caps"></span></div></div>
</section>

<h2 class="chat-web-h2" id="chat-web-h2s"></h2>
<p class="chat-web-lead" id="chat-web-lead"></p>
<div class="chat-web-grid" id="chat-web-grid"></div>

<h2 class="chat-web-h2" id="chat-web-h2d"></h2>

function Lm(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lm(a),y=Lm(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#0E1116'],['#9AA4B2','#0E1116'],['#9AA4B2','#1C2026'],['#9AA4B2','#1C2026'],['#BFF2DC','#242B34'],['#FFFFFF','#00875C'],['#0E1116','#2BC48A'],['#2BC48A','#0E1116'],['#C9D1DA','#1C2026'],['#F2F5F7','#242B34'],['#C9D1DA','#0E1116']];
var rows=pairs.map(function(p,i){return [p[0],p[1],P.ct[i]]});
$('chat-web-ct').innerHTML=rows.map(function(r){return '<tr><td><span class="chat-web-sw" style="background:'+r[0]+'"></span><span class="chat-web-sw" style="background:'+r[1]+'"></span>'+r[2]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_WEB.min=Math.min.apply(null,rows.map(function(r){return cr(r[0],r[1])}));
document.body.dataset.ready='1';
})();
</script>
