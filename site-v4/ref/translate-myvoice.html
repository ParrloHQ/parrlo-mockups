function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function wave(n,live,seed,maxH){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const env=0.45+0.55*Math.sin(Math.PI*(i+1)/(live+1));const v=i<live?Math.max(6,Math.round((0.25+0.75*r())*maxH*env)):4;h+=`<i class="${i<live?'':P+'z'}" style="height:${v}px"></i>`;}return h;}
function mini(n,seed,on){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const v=Math.round(5+r()*21*Math.sin(Math.PI*(i+.5)/n)+3);h+=`<i class="${i<on?P+'on':''}" style="height:${v}px"></i>`;}return h;}
function read(s){const m=s.match(/^(.*?)\[(.*?)\](.*)$/);return `<span class="${P}done">${m[1]}</span><span class="${P}cur">${m[2]}</span>${m[3]}`;}

function screen(st,t){
 const sbar=`<div class="sbar"><b>9:41</b><span class="sig"><i class="wf"></i><i></i></span></div>`;
 const top=ttl=>`<div class="${P}top"><span class="${P}cb" role="button" aria-label="${t.back}">${I.back}</span><span class="${P}ttl">${ttl}</span><span class="${P}cb ${P}nil" aria-hidden="true"></span></div>`;
 const btn=(cls,ic,txt)=>`<span class="${cls}" role="button">${ic||''}${txt}</span>`;
 let main='',bot='',ovl='',ttl=t.name;
 if(st==='intro'){
  ttl='';
  main=`<div class="${P}art"><img src="${M}mascot-speak-dark.svg" alt=""></div>
   <div class="${P}h">${t.name}</div><p class="${P}para">${t.iP}</p>
   <div class="${P}steps">${[I.mic,I.spk,I.tgl].map((ic,i)=>`<div class="${P}step"><i>${ic}</i>${t.iSteps[i]}</div>`).join('')}</div>`;
  bot=`<div class="${P}age"><b>${t.age}</b><span>${t.ageSub}</span><div class="${P}btns">${btn(P+'sec','',t.ageNo)}${btn(P+'go',I.ok,t.ageYes)}</div></div>`;
 } else if(st==='consent'){
  ttl='';
  const sk=[92,100,84,96,70,0,100,88,94,62,0,96,80,90,100,74].map(w=>w?`<i style="width:${w}%"></i>`:`<i class="${P}gap" style="width:0;height:0"></i>`).join('');
  main=`<div class="${P}eb">${t.cEb}</div><div class="${P}h ${P}l">${t.cH}</div>
   <div class="${P}doc"><div class="${P}doch"><i>${I.doc}</i>${t.cPh}</div><div class="${P}sk" aria-hidden="true">${sk}</div><div class="${P}fade"></div></div>`;
  bot=`<div class="${P}btns">${btn(P+'sec','',t.cNo)}${btn(P+'go',I.ok,t.cYes)}</div>`;
 } else if(st==='reading'){
  ttl=t.rTtl;
  main=`<div class="${P}prog"><div class="${P}lbl"><span>${t.name}</span><b>${t.rStep}</b></div><div class="${P}seg"><i class="${P}full"></i><i><b style="width:46%"></b></i><i></i><i></i></div></div>
   <div class="${P}card"><div class="${P}lbl"><i class="${P}dot"></i>${t.rLbl}<span class="${P}rec"><i></i>${t.rRec} · 0:48</span></div>
    <p class="${P}read" lang="${L}">${read(t.read)}</p>
    <div class="${P}wave" aria-hidden="true">${wave(50,38,5,44)}</div></div>
   <div class="${P}hint ${P}tip">${I.info}${t.rTip}</div>`;
  bot=`<div class="${P}btns">${btn(P+'sec '+P+'sm',I.retry,t.redo)}${btn(P+'sec '+P+'sm',I.pause,t.pause)}${btn(P+'go',I.ok,t.fin)}</div>`;
 } else if(st==='ready'){
  ttl='';
  main=`<div class="${P}art ${P}ok"><img src="${M}mascot-speak-dark.svg" alt=""><span class="${P}badge">${I.chk}</span></div>
   <div class="${P}h ${P}sm">${t.okH}</div><p class="${P}para">${t.okP}</p>
   <div class="${P}smp"><div class="${P}lbl"><i class="${P}dot ${P}p"></i>${t.smpLbl}</div><p class="${P}out" lang="${t.smpLang}">${t.smp}</p>
    <div class="${P}pl"><span class="${P}pb" role="button" aria-label="${t.playA}">${I.play}</span><div class="${P}mw" aria-hidden="true">${mini(40,9,0)}</div><span class="${P}dur">0:03</span></div></div>
   <div class="${P}tg"><div class="${P}row"><span class="${P}rt">${t.tg}<small>${t.tgSub}</small></span><span class="${P}swi" role="switch" aria-checked="true" aria-label="${t.tg}"><b>${I.chk}</b></span></div></div>`;
  bot=`<div class="${P}btns">${btn(P+'sec','',t.again)}${btn(P+'go',I.ok,t.done)}</div>`;
 } else {
  main=`<div class="${P}st"><span class="${P}av">${I.wave}</span><div><b>${t.stH}</b><span>${t.stSub}</span></div></div>
   <div class="${P}sh">${t.grp}</div>
   <div class="${P}grp">
    <div class="${P}row ${P}tall"><span class="${P}rt">${t.tg}<small>${t.tgSub}</small></span><span class="${P}swi" role="switch" aria-checked="true"><b>${I.chk}</b></span></div>
    <div class="${P}row" role="button"><i>${I.play}</i><span class="${P}rt">${t.play}</span><span class="${P}chev">${I.chev}</span></div>
    <div class="${P}row" role="button"><i>${I.retry}</i><span class="${P}rt">${t.again}</span><span class="${P}chev">${I.chev}</span></div>
   </div>
   <div class="${P}grp"><div class="${P}row ${P}del" role="button"><i>${I.trash}</i><span class="${P}rt">${t.del}</span></div></div>`;
  ovl=`<div class="${P}ovl"><div class="${P}dim"></div><div class="${P}sheet" role="dialog" aria-label="${t.dH}"><span class="${P}grab"></span><span class="${P}ico">${I.trash}</span><b>${t.dH}</b><p>${t.dP}</p>
   <div class="${P}sbtn"><span class="${P}red" role="button">${I.trash}${t.dYes}</span><span class="${P}cn" role="button">${t.dNo}</span></div></div></div>`;
 }
 const hasBot=!!bot;
 return `<div class="scr ${P}scr" data-state="${st}">${sbar}${top(ttl)}<div class="${P}main">${main}</div>${hasBot?`<div class="${P}bot">${bot}</div>`:''}${ovl}<div class="homebar"><i></i></div></div>`;
}

/* контраст */
function Lu(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#2BC48A','#1C2026',4.5],['#F2F5F7','#242B34',4.5],['#0E1116','#2BC48A',4.5],['#FFFFFF','#00875C',3],['#FFFFFF','#00875C',4.5],['#C3CBD5','#0E1116',4.5],['#FF6B5E','#1C2026',4.5],['#0E1116','#FF6B5E',4.5]];

const STATES=['intro','consent','reading','ready','settings'];
const HERO='reading';
const ph=(id,s,html)=>`<div class="pf p67" id="${id}" style="--s:${s}"><div class="shell"></div><div class="glass">${html}</div></div>`;
const $=id=>document.getElementById(P+id);
function render(){
 const t=T[L],p=t.page;
 document.documentElement.lang=L; document.title=p.title;
 $('lsw').innerHTML=LANGS.map(l=>`<a href="?l=${l}" data-l="${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
 $('tag').textContent=p.tag; $('tag2').textContent=p.legal; $('h1').textContent=p.h1; $('lead').textContent=p.lead;
 $('hero-ph').innerHTML=ph('translate-myvoice',.8,screen(HERO,t))+`<div class="pcap"><span class="dot"></span><div><b>${p.cap[0]}</b><span>${p.cap[1]}</span></div></div>`;
 $('hero-t').innerHTML=`<h3>${p.heroH}</h3>`+p.heroP.map(x=>`<p>${x}</p>`).join('');
 $('h-states').textContent=p.hStates; $('states-lead').textContent=p.statesLead;
 $('grid').innerHTML=STATES.map((k,i)=>`<figure>${ph(P+'-'+k,.6,screen(k,t))}<figcaption><b>${i+1} · ${p.st[k][0]}</b><code>${k}</code> · ${p.st[k][1]}</figcaption></figure>`).join('');
 $('h-dec').textContent=p.hDec; $('dec').innerHTML=p.dec.map(x=>`<li>${x}</li>`).join('');
 $('h-tok').textContent=p.hTok; $('tok').innerHTML=p.tok.map(x=>`<li>${x}</li>`).join('');
 const fmt=v=>L==='en'?v.toFixed(2):v.toFixed(2).replace('.',',');
 $('ctr').innerHTML=`<tr>${p.ctrH.map(h=>`<th>${h}</th>`).join('')}</tr>`+PAIRS.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${p.ctr[i]}</td><td><b>${fmt(v)}:1</b></td><td>${v>=n?'≥ '+(n===3?'3':fmt(n).replace(/0$/,''))+' ✓':'✗'}</td></tr>`;}).join('');
 $('h-na').textContent=p.hNa; $('na').innerHTML=p.na.map(x=>`<li>${x}</li>`).join('');
 window.TM_CR=PAIRS.map(([a,b,n],i)=>[p.ctr[i],+cr(a,b).toFixed(2),n]);
 document.body.dataset.ready=L;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-l]');if(!a)return;e.preventDefault();L=a.dataset.l;history.replaceState(null,'','?l='+L);render();});
window.TM_STATES=STATES;
render();
})();
</script>
</body>
</html>
