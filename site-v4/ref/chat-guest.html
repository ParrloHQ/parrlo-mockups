<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Chat · гость по QR</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-guest-w{max-width:1200px;margin:0 auto}
.chat-guest-lsw{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-guest-lsw a{min-width:48px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#9AA4B2;text-decoration:none;padding:0 12px}
.chat-guest-lsw a[aria-current="true"]{background:#1C2026;color:#F2F5F7;box-shadow:inset 0 0 0 1px #2F3742}
.chat-guest-hero{display:flex;flex-direction:column;align-items:center;gap:40px}
.chat-guest-pairw{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:24px 28px}
.chat-guest-ph{display:flex;flex-direction:column;align-items:center}
.chat-guest-tag{margin-top:14px;display:flex;align-items:center;gap:8px;font:600 14px/20px Inter;color:#C9D1DA}
.chat-guest-tag i{width:8px;height:8px;border-radius:50%;background:#2BC48A}
.chat-guest-tag.g i{background:#BFF2DC}
.chat-guest-info{max-width:760px;width:100%}
.chat-guest-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-guest-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-guest-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-guest-info ul,.chat-guest-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-guest-info li,.chat-guest-sec li{margin:6px 0}
.chat-guest-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-guest-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-guest-lead{color:#9AA4B2;margin:0 0 32px;max-width:720px}
.chat-guest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 24px;justify-items:center;align-items:end}
.chat-guest-card{width:280px;display:flex;flex-direction:column;align-items:flex-start}
.chat-guest-card .pf{align-self:center}
.chat-guest-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chat-guest-card h3 code{font-size:12px;color:#9AA4B2}
.chat-guest-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45;min-height:61px}
.chat-guest-who{font:600 12px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:#9AA4B2;margin-top:12px;display:flex;align-items:center;gap:6px}
.chat-guest-who i{width:7px;height:7px;border-radius:50%;background:#2BC48A}.chat-guest-who.g i{background:#BFF2DC}
.chat-guest-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px 40px}
.chat-guest-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-guest-sec b{color:#F2F5F7;font-weight:600}
.chat-guest-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-guest-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-guest-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-guest-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.chat-guest-t05{margin-top:40px;border-radius:20px;background:#14181D;box-shadow:inset 0 0 0 1px #2F3742;padding:20px 24px;color:#C9D1DA;font-size:15px}
.chat-guest-t05 b{color:#F2F5F7}
.chat-guest-t05 .mk{display:inline-block;font:700 11px/18px Inter;letter-spacing:.06em;text-transform:uppercase;color:#0E1116;background:#BFF2DC;border-radius:6px;padding:0 6px;margin-right:8px;vertical-align:1px}
@media (max-width:900px){.chat-guest-hero .pf{--s:.62!important}}
@media (max-width:480px){.chat-guest-hero .pf{--s:.76!important}.chat-guest-info h1{font-size:32px}.chat-guest-cols{grid-template-columns:1fr}}
/* съёмка пары 860×932 */
.chat-guest-shot{width:860px;height:932px;display:flex;align-items:flex-end;justify-content:space-between}

/* ======= экраны ======= */
.chat-guest-scr{overflow:hidden;--err:#FF6B5E}
.chat-guest-scr svg{display:block}
.chat-guest-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-guest-ib svg{width:24px;height:24px}
.chat-guest-ib.bk{color:var(--acc)}.chat-guest-ib.bk svg{width:28px;height:28px}
/* верхняя строка экрана QR */
.chat-guest-top{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.chat-guest-top h4{margin:0;font:600 17px/22px Inter}
/* QR */
.chat-guest-qrw{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:12px 28px 0;text-align:center}
.chat-guest-qrc{width:300px;height:300px;border-radius:32px;background:#FFFFFF;padding:22px;box-shadow:0 0 0 8px rgba(43,196,138,.10),0 24px 60px -20px rgba(43,196,138,.35);flex:none}
.chat-guest-qrc svg{width:256px;height:256px}
.chat-guest-qrw h5{margin:28px 0 8px;font:900 28px/34px Nunito,sans-serif}
.chat-guest-qrw p{margin:0;font-size:16px;line-height:23px;color:var(--sec);max-width:350px}
.chat-guest-stt{margin-top:20px;height:36px;border-radius:18px;display:flex;align-items:center;gap:8px;padding:0 16px 0 14px;font:600 14px/1 Inter;background:var(--sf);color:var(--sec);box-shadow:inset 0 0 0 1px var(--line)}
.chat-guest-stt i{width:8px;height:8px;border-radius:50%;background:var(--sec);box-shadow:0 0 0 4px rgba(154,164,178,.16)}
.chat-guest-stt.on{color:var(--mint);background:rgba(191,242,220,.10);box-shadow:inset 0 0 0 1px rgba(191,242,220,.28)}
.chat-guest-stt.on i{background:var(--mint);box-shadow:0 0 0 4px rgba(191,242,220,.18)}
.chat-guest-stt svg{width:16px;height:16px}
.chat-guest-lnk{flex:none;margin:0 24px 16px;height:56px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px}
.chat-guest-lnk svg{width:20px;height:20px;color:var(--sec);flex:none}
.chat-guest-lnk span{flex:1;min-width:0;font:500 15px/20px Inter;color:#C9D1DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-guest-lnk b{height:44px;border-radius:14px;display:flex;align-items:center;padding:0 14px;font:600 15px/1 Inter;color:var(--acc);flex:none}
.chat-guest-act{flex:none;display:flex;flex-direction:column;gap:8px;padding:0 24px 8px}
.chat-guest-btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;font:900 19px/1 Nunito,sans-serif;padding:0 20px;text-align:center}
.chat-guest-btn svg{width:22px;height:22px;flex:none}
.chat-guest-btn.p{background:var(--acc);color:var(--onacc)}
.chat-guest-btn.s{background:var(--sf2);color:var(--tx)}
.chat-guest-btn.t{height:44px;font:600 16px/1 Inter;color:var(--sec)}

/* браузер гостя */
.chat-guest-url{flex:none;height:52px;display:flex;align-items:center;gap:4px;padding:0 6px 8px 16px;border-bottom:1px solid var(--line);background:#14181D}
.chat-guest-url>span:first-child{flex:1;height:40px;border-radius:12px;background:var(--sf);display:flex;align-items:center;justify-content:center;font:500 15px/1 Inter;color:var(--tx);letter-spacing:.005em}
.chat-guest-url>span:first-child em{font-style:normal;color:var(--sec)}
.chat-guest-url .chat-guest-ib{color:var(--sec)}
.chat-guest-url .chat-guest-ib svg{width:20px;height:20px}
.chat-guest-brand{display:flex;align-items:center;gap:8px;font:900 20px/1 Nunito,sans-serif;color:var(--tx)}
.chat-guest-brand svg{width:26px;height:26px;color:var(--acc)}
/* вход гостя */
.chat-guest-join{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 20px 0}
.chat-guest-hi{display:flex;align-items:center;gap:12px;margin:20px 0 0}
.chat-guest-hi .av{position:relative;width:52px;height:52px;border-radius:50%;color:#0E1116;font:900 22px/52px Nunito,Inter;text-align:center;flex:none}
.chat-guest-hi .av i{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--bg)}
.chat-guest-join h5{margin:0;font:900 26px/31px Nunito,sans-serif}
.chat-guest-join>p{margin:10px 0 0;font-size:16px;line-height:22px;color:var(--sec)}
.chat-guest-lb{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px;font:600 14px/18px Inter;color:var(--tx)}
.chat-guest-lb em{font-style:normal;font-weight:500;color:var(--sec)}
.chat-guest-lst{border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.chat-guest-opt{height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;border-top:1px solid var(--line);font-size:16px}
.chat-guest-opt:first-child{border-top:0}
.chat-guest-opt .nm{flex:1;min-width:0}
.chat-guest-opt .nm small{font-size:13px;color:var(--sec);margin-left:6px}
.chat-guest-opt .rd{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #3A414B;flex:none;display:flex;align-items:center;justify-content:center}
.chat-guest-opt.on{background:rgba(43,196,138,.10)}
.chat-guest-opt.on .rd{background:var(--acc);box-shadow:none;color:var(--onacc)}
.chat-guest-opt.on .rd svg{width:14px;height:14px}
.chat-guest-opt .chv{width:18px;height:18px;color:var(--sec)}
.chat-guest-fld{height:50px;border-radius:16px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;padding:0 16px;font-size:16px}
.chat-guest-fld .car{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-4px;margin-left:1px;border-radius:1px}
.chat-guest-join .chat-guest-btn{margin-top:auto}
.chat-guest-fine{margin:10px 8px 6px;text-align:center;font-size:12px;line-height:17px;color:var(--sec)}
.chat-guest-fine u{text-decoration:underline;text-underline-offset:2px;color:#C9D1DA}

/* переписка (общая для меня и гостя) */
.chat-guest-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-guest-nav.web{padding-left:16px}
.chat-guest-av{position:relative;width:40px;height:40px;border-radius:50%;color:#0E1116;font:800 17px/40px Nunito,Inter;text-align:center;flex:none}
.chat-guest-av i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2.5px var(--bg)}
.chat-guest-nm{flex:1;min-width:0;padding-left:4px}
.chat-guest-nm b{display:block;font:600 17px/22px Inter}
.chat-guest-nm span{display:flex;align-items:center;gap:4px;font-size:13px;line-height:18px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-guest-nm span svg{width:14px;height:14px;flex:none}
.chat-guest-lc{flex:none;height:44px;display:flex;align-items:center}
.chat-guest-lc span{height:32px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 13px/1 Inter;letter-spacing:.04em;color:var(--tx)}
.chat-guest-lc svg{width:14px;height:14px;color:var(--sec)}
.chat-guest-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.chat-guest-sys{align-self:center;display:flex;align-items:center;gap:6px;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:6px 12px;border-radius:14px;margin-bottom:4px;text-align:center}
.chat-guest-sys svg{width:14px;height:14px;flex:none;color:var(--mint)}
.chat-guest-m{position:relative;max-width:82%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-guest-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px}
.chat-guest-m.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-guest-m.gap{margin-top:4px}
.chat-guest-t{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(154,164,178,.28);font-size:15px;line-height:20px}
.chat-guest-t svg{flex:none;width:16px;height:16px;margin-top:2px}
.chat-guest-m.in .chat-guest-t{color:var(--mint)}
.chat-guest-m.out .chat-guest-t{color:#fff;border-top-color:rgba(255,255,255,.3)}
.chat-guest-tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px}
.chat-guest-m.in .chat-guest-tm{color:var(--sec)}
.chat-guest-tm svg{width:16px;height:16px}
.chat-guest-cmp{flex:none;border-top:1px solid var(--line);padding:8px 12px 0;background:var(--bg)}
.chat-guest-row{display:flex;align-items:flex-end;gap:8px}
.chat-guest-pls{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-guest-pls svg{width:26px;height:26px}
.chat-guest-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:17px;line-height:22px;color:var(--sec);white-space:nowrap;overflow:hidden}
.chat-guest-cmp.web .chat-guest-f{margin-left:4px}
.chat-guest-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-guest-go svg{width:22px;height:22px}
.chat-guest-cmp.web{padding-bottom:4px}
/* «остаться на связи» у гостя */
.chat-guest-stay{flex:none;display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:6px 6px 6px 14px;border-radius:16px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:19px;color:#C9D1DA}
.chat-guest-stay>svg{width:22px;height:22px;color:var(--acc);flex:none}
.chat-guest-stay span{flex:1;min-width:0}
.chat-guest-stay b{height:44px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;padding:0 12px;font:800 14px/1 Nunito,Inter;color:var(--tx);flex:none;white-space:nowrap}

/* ссылка недействительна */
.chat-guest-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;text-align:center}
.chat-guest-mid img{width:148px;height:148px}
.chat-guest-mid h5{margin:16px 0 8px;font:900 28px/34px Nunito,sans-serif}
.chat-guest-mid p{margin:0;color:var(--sec);font-size:16px;line-height:23px;max-width:330px}
.chat-guest-tip{margin-top:24px;width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;line-height:21px;color:#C9D1DA}
.chat-guest-tip svg{flex:none;width:22px;height:22px;color:var(--mint);margin-top:0}
.chat-guest-tip b{color:var(--tx);font-weight:600}
.chat-guest-code{margin-top:14px;font:500 13px/18px Inter;color:var(--sec)}
</style>
</head>
<body>
<div class="chat-guest-w">
<nav class="chat-guest-lsw" id="chat-guest-lsw" aria-label="Language"></nav>

<section class="chat-guest-hero">
 <div class="chat-guest-pairw">
  <div class="chat-guest-ph"><div class="pf p67" style="--s:.82" data-state="host"><div class="shell"></div><div class="glass"></div></div><div class="chat-guest-tag"><i></i><span id="chat-guest-tagm"></span></div></div>
  <div class="chat-guest-ph"><div class="pf" style="--s:.82" data-state="talk"><div class="shell"></div><div class="glass"></div></div><div class="chat-guest-tag g"><i></i><span id="chat-guest-tagg"></span></div></div>
 </div>
 <div class="chat-guest-info">
  <div class="pcap" style="max-width:none;margin:0 0 28px"><span class="dot"></span><div><b id="chat-guest-capb"></b><span id="chat-guest-caps"></span></div></div>
  <p class="chat-guest-eb" id="chat-guest-eb"></p>
  <h1 id="chat-guest-h1"></h1>
  <p id="chat-guest-p1"></p>
  <ul id="chat-guest-ul"></ul>
 </div>
</section>

<h2 class="chat-guest-h2" id="chat-guest-h2s"></h2>
<p class="chat-guest-lead" id="chat-guest-lead"></p>
<div class="chat-guest-grid" id="chat-guest-grid"></div>
<div class="chat-guest-t05" id="chat-guest-t05"></div>

<h2 class="chat-guest-h2" id="chat-guest-h2d"></h2>
<div class="chat-guest-cols">
 <div class="chat-guest-sec"><h2 id="chat-guest-hdec"></h2><ul id="chat-guest-dec"></ul></div>
 <div class="chat-guest-sec"><h2 id="chat-guest-htok"></h2>
  <table class="chat-guest-ct" id="chat-guest-ct"></table>
  <ul style="margin-top:12px" id="chat-guest-tok"></ul></div>
 <div class="chat-guest-sec"><h2 id="chat-guest-hna"></h2><ul id="chat-guest-na"></ul></div>
</div>
</div>

<script>
(function(){
var SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
function ic(p,extra){return '<svg viewBox="0 0 24 24" '+(extra||SW)+' aria-hidden="true">'+p+'</svg>'}
var I={
 back:ic('<path d="M15 5l-7 7 7 7"/>'),
 x:ic('<path d="M6 6l12 12M18 6L6 18"/>'),
 more:ic('<circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/>','fill="currentColor" aria-hidden="true"'),
 tr:ic('<path d="M3 5h9M7.5 3v2M5 5c.5 3 2.5 6 6 7.5M10 5c-.8 3.5-3 6.5-6.5 8"/><path d="M12.5 21l4-10 4 10M14 17.5h5"/>'),
 arr:ic('<path d="M5 12h14M14 7l5 5-5 5"/>'),
 done:ic('<path d="M2.5 12.5l4 4 8-9"/><path d="M11 15.5l1.5 1.5 9-10"/>'),
 chk:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>','fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'),
 mic:ic('<rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11.5a7 7 0 0 0 14 0"/><path d="M12 18.5v3"/>'),
 plus:ic('<path d="M12 5v14M5 12h14"/>'),
 link:ic('<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L11.8 5.8"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.4-1.4"/>'),
 share:ic('<path d="M12 15V3.5M7.5 8l4.5-4.5L16.5 8"/><path d="M8 11.5H6.5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H16"/>'),
 reload:ic('<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/>'),
