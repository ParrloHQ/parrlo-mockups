.kb-setup-trust{background:#171C23;border-radius:32px;padding:40px 32px}

.kb-setup-law{display:inline-block;font:600 12px/18px Inter,sans-serif;color:#0E1116;background:#FFC247;border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:1px}

.kb-setup-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-setup-notes h2{font-size:20px;margin:0 0 10px}

.kb-setup-notes li{margin:6px 0}

body.kb-setup-cap .kb-setup-grid{grid-template-columns:1fr}

 .kb-setup-copy{padding:0 8px}
 .kb-setup-copy h2{font-size:26px}
 .kb-setup-trust{padding:28px 20px}
 .kb-setup-trust h2{font-size:24px}
}

.kb-setup-steps .tx small{display:block;font-size:14px;line-height:20px;color:var(--sec);margin-top:4px}
.kb-setup-steps li.ok .tx small{color:var(--acc)}
.kb-setup-gk{display:inline-flex;vertical-align:-6px;width:30px;height:26px;border-radius:6px;background:var(--key);box-shadow:0 1px 0 rgba(0,0,0,.6);align-items:center;justify-content:center;margin:0 2px;color:var(--tx)}

.kb-setup-why{display:flex;align-items:center;gap:12px;height:52px;margin-top:12px;padding:0 12px 0 16px;border-radius:16px;font:600 16px Inter,sans-serif;color:var(--tx)}

.kb-setup-fill{flex:1}
.kb-setup-cta{flex:none;height:60px;border-radius:30px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;gap:10px;font:900 20px Nunito,sans-serif;margin:0 0 8px;box-shadow:0 0 32px rgba(43,196,138,.28)}

.kb-setup-sec2{flex:none;height:48px;display:flex;align-items:center;justify-content:center;font:600 16px Inter,sans-serif;color:var(--tx);margin-bottom:4px}

.kb-setup-row .tx{flex:1;min-width:0}

.kb-setup-ico{flex:none;width:36px;height:36px;border-radius:9px;background:linear-gradient(160deg,#067A52,#12A06C);color:#fff;display:flex;align-items:center;justify-content:center}

.kb-setup-tap{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--mint);display:flex;align-items:center;justify-content:center}
.kb-setup-tap i{width:14px;height:14px;border-radius:50%;background:var(--mint)}
.kb-setup-sw{flex:none;width:52px;height:32px;border-radius:16px;background:#4A525D;position:relative}
.kb-setup-sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#F2F5F7;box-shadow:0 1px 3px rgba(0,0,0,.4)}

.kb-setup-call p{margin:0}
.kb-setup-call p+p,.kb-setup-call ul+p{margin-top:10px}
.kb-setup-call ul{margin:10px 0 0;padding:0;list-style:none}
.kb-setup-call li{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.kb-setup-call li svg{flex:none;width:20px;height:20px;margin-top:2px}

.kb-setup-demo{border-radius:24px;background:var(--sf);padding:20px 16px 16px;margin:0 0 16px}

.kb-setup-keys{display:flex;gap:6px}
.kb-setup-key{flex:1 1 0;height:46px;border-radius:8px;background:var(--key2);box-shadow:0 1px 0 rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font:500 16px Inter,sans-serif;color:var(--tx)}

.kb-setup-key.sp{flex:4 1 0;background:var(--key);color:#C5CCD5;font-weight:400}

.kb-setup-done li{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-top:1px solid var(--line);font-size:17px}
.kb-setup-done li:first-child{border-top:0}
.kb-setup-done li svg{flex:none;width:24px;height:24px;color:var(--acc)}
.kb-setup-big{font:700 19px/26px Inter,sans-serif;color:var(--tx);text-align:center;margin:0 0 20px}

const qs=new URLSearchParams(location.search);

document.documentElement.lang=LG;document.title=P.title;
const gk=`<span class="kb-setup-gk" role="img" aria-label="🌐">${I.globe}</span>`;
const fill=s=>s.replace('{g}',gk);

const crumbs=last=>`<div class="kb-setup-crumbs">${[...C.set.crumbs,last].map((c,i,a)=>i===a.length-1?`<b>${c}</b>`:`<span>${c}</span>${I.crumb}`).join('')}</div>`;
const sw=on=>`<span class="kb-setup-sw${on?' on':''}" role="switch" aria-checked="${on}"><i></i></span>`;

const S={

<div class="kb-setup-body">

</div>`,

 <img class="kb-setup-masc" src="${MASC}mascot-speak-dark.svg" alt="">
 <h4 class="kb-setup-h">${C.done.h}</h4>
 <p class="kb-setup-big">${fill(C.done.sub)}</p>
 <div class="kb-setup-demo" aria-hidden="true">
  <div class="kb-setup-pop">${C.done.pop.map((n,i)=>i===2?`<div class="on">${n}${I.check}</div>`:`<div>${n}</div>`).join('')}</div>
  <div class="kb-setup-keys"><span class="kb-setup-key">123</span><span class="kb-setup-key gl">${I.globe}</span><span class="kb-setup-key sp">${C.done.space}</span><span class="kb-setup-key">${I.ret}</span></div>
 </div>
 <ul class="kb-setup-done">${C.done.list.map(t=>`<li>${I.checkC}<span>${t}</span></li>`).join('')}</ul>
 <div class="kb-setup-fill"></div>
 <div class="kb-setup-cta" role="button">${C.done.cta}</div>
 <div class="kb-setup-sec2" role="button">${C.done.sec}</div>
</div>`};
const screen=id=>`<div class="scr kb-setup-scr" lang="${LG}">${sbar}${S[id]()}${home}</div>`;
const ph=(id,sc)=>`<div class="pf p67" style="--s:${sc}"><div class="shell"></div><div class="glass">${screen(id)}</div></div>`;

/* ===== страница ===== */
const $=id=>document.getElementById(id);
$('kb-setup-t-draft').textContent=P.draft;$('kb-setup-t-soon').textContent=P.soon;$('kb-setup-t-scheme').textContent=P.scheme;
$('kb-setup-lang').innerHTML=['ru','es','en'].map(l=>`<a href="?l=${l}" hreflang="${l}"${l===LG?' aria-current="true"':''}>${l.toUpperCase()}</a>`).join('');
$('kb-setup-h1').textContent=P.h1;$('kb-setup-lead').textContent=P.lead;
$('kb-setup-h-st').textContent=P.hSt;$('kb-setup-p-st').textContent=P.pSt;
$('kb-setup-hero').innerHTML=
`<figure data-shot="kb-setup--dark--${LG}">${ph('app-guide',1)}<div class="pcap"><span class="dot"></span><div><b>${P.heroC}</b><span>${P.heroS}</span></div></div></figure>
<div class="kb-setup-copy"><p class="ey">${P.copyEy}</p><h2>${P.copyH}</h2><ol>${P.copyS.map(s=>`<li>${s}</li>`).join('')}</ol>
<div class="kb-setup-note">${I.info.replace('<svg','<svg width="22" height="22" style="flex:none;color:#BFF2DC;margin-top:1px"')}<span><b>${P.noteB}</b> ${P.noteT}</span></div>
<p class="src" style="margin-top:16px">${P.copySrc}</p></div>`;
$('kb-setup-grid').innerHTML=Object.keys(S).map(id=>{const [t,w,k]=P.st[id];return `<article class="kb-setup-st"><h3>${t}<code>${id}</code></h3><p>${w}</p>
<figure data-shot="kb-setup--${id}--dark--${LG}">${ph(id,.6)}<div class="pcap"><div><b>${P.cap[k]}</b></div></div></figure></article>`}).join('');
$('kb-setup-trust').innerHTML=`<p class="ey">${P.trEy}</p><h2>${P.trH}<span class="kb-setup-law">${P.law}</span></h2>
<ul class="kb-setup-tl">${P.tr.map(([b,t])=>`<li><b>${b}</b>${t}<span class="kb-setup-law">${P.law}</span></li>`).join('')}</ul>
<div class="foot"><a class="btn" href="#">${P.trBtn} →</a><span>${P.trNote}</span></div>`;
const li=a=>`<li><b>${a[0]}</b> ${a[1]}</li>`;
$('kb-setup-notes').innerHTML=`<div><h2>${P.hDec}</h2><ul>${P.dec.map(li).join('')}</ul></div>
<div><h2>${P.hTok}</h2><ul>${P.tok.map(a=>a[2]?`<li><b>${a[0]}</b> <span id="kb-setup-calc"></span></li>`:li(a)).join('')}</ul></div>
<div><h2>${P.hNo}</h2><ul>${P.no.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

/* контраст: по вычисленным цветам CSS */
function rgb(s){const m=s.match(/[\d.]+/g);return m?m.map(Number):[0,0,0,0];}
function lum([r,g,b]){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b);}
function bgOf(el){while(el){const c=rgb(getComputedStyle(el).backgroundColor);if(c.length<4||c[3]>0.5)return c;el=el.parentElement;}return [14,17,22];}
function blend(fg,bg,a){return fg.slice(0,3).map((v,i)=>v*a+bg[i]*(1-a));}
let minC=99,bad=[];
document.querySelectorAll('.scr *').forEach(el=>{if(![...el.childNodes].some(n=>n.nodeType===3&&n.data.trim()))return;
 const cs=getComputedStyle(el);let a=1,e=el;while(e&&!e.classList.contains('scr')){a*=+getComputedStyle(e).opacity;e=e.parentElement;}
 const c=rgb(cs.color);const bg=bgOf(el);const fg=blend(c,bg,(c[3]??1)*a);
 const L1=lum(fg),L2=lum(bg);const r=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);
 const big=parseFloat(cs.fontSize)>=24||(parseFloat(cs.fontSize)>=18.66&&+cs.fontWeight>=700);
 if(r<(big?3:4.5))bad.push(el.textContent.trim().slice(0,20)+' '+r.toFixed(2));minC=Math.min(minC,r);});
$('kb-setup-calc').textContent=(LG==='ru'?'минимум по тексту экрана ':LG==='es'?'mínimo en el texto de la pantalla ':'minimum across screen text ')+minC.toFixed(1).replace('.',LG==='en'?'.':',')+' : 1 — '+(bad.length?bad.join('; '):P.ok)+'.';
window.KB_SETUP_BAD=bad;window.KB_SETUP_MIN=minC;
document.body.dataset.ready='1';
})();
</script>
