<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Chat · фото</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-photo-w{max-width:1200px;margin:0 auto}
.chat-photo-lsw{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-photo-lsw a{min-width:48px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#9AA4B2;text-decoration:none;padding:0 12px}
.chat-photo-lsw a[aria-current="true"]{background:#1C2026;color:#F2F5F7;box-shadow:inset 0 0 0 1px #2F3742}
.chat-photo-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-photo-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-photo-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-photo-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-photo-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-photo-info ul,.chat-photo-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-photo-info li,.chat-photo-sec li{margin:6px 0}
.chat-photo-w b{color:#F2F5F7;font-weight:600}
.chat-photo-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-photo-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-photo-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 24px;justify-items:center}
.chat-photo-card{width:280px}
.chat-photo-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.chat-photo-card h3 code{font-size:12px;color:#9AA4B2}
.chat-photo-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-photo-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px 40px}
.chat-photo-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-photo-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-photo-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-photo-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-photo-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-photo-hero .pf{--s:.78!important}.chat-photo-info h1{font-size:32px}.chat-photo-cols{grid-template-columns:1fr}}

/* ======= экран 430×932 ======= */
.chat-photo-scr{overflow:hidden;--err:#FF6B5E}
.chat-photo-scr svg{display:block}
.chat-photo-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-photo-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-photo-ib svg{width:24px;height:24px}
.chat-photo-ib.bk{color:var(--acc)}.chat-photo-ib.bk svg{width:28px;height:28px}
.chat-photo-ib i{width:36px;height:36px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center}
.chat-photo-ib i svg{width:20px;height:20px}
.chat-photo-av{position:relative;width:40px;height:40px;border-radius:50%;color:#0E1116;font:800 17px/40px Nunito,Inter;text-align:center;flex:none}
.chat-photo-av i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2.5px var(--bg)}
.chat-photo-nm{flex:1;min-width:0;padding-left:4px}
.chat-photo-nm b{display:block;font:600 17px/22px Inter}
.chat-photo-nm span{display:flex;align-items:center;gap:5px;font-size:13px;line-height:18px;color:var(--sec);white-space:nowrap}
.chat-photo-nm span i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chat-photo-lc{flex:none;height:44px;display:flex;align-items:center}
.chat-photo-lc span{height:32px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 13px/1 Inter;letter-spacing:.04em;color:var(--tx)}
.chat-photo-lc svg{width:14px;height:14px;color:var(--sec)}

.chat-photo-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.chat-photo-day{align-self:center;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px;margin-bottom:4px}
.chat-photo-m{position:relative;max-width:80%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-photo-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px}
.chat-photo-m.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-photo-m.gap{margin-top:8px}
.chat-photo-t{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.3);font-size:15px;line-height:20px;color:#fff}
.chat-photo-t svg{flex:none;width:16px;height:16px;margin-top:2px}
.chat-photo-tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.chat-photo-m.in .chat-photo-tm{color:var(--sec)}
.chat-photo-tm svg{width:16px;height:16px}
.chat-photo-rd{align-self:flex-end;display:flex;align-items:center;gap:4px;font:500 12px/16px Inter;color:var(--sec);margin:-2px 4px 0 0}
.chat-photo-rd svg{width:16px;height:16px;color:var(--acc)}
/* «перевод с …» + раскрытый оригинал — как в chat-original */
.chat-photo-ft{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:0 -12px -6px;padding:0 12px}
.chat-photo-tg{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--mint);white-space:nowrap}
.chat-photo-tg svg{width:16px;height:16px;flex:none}
.chat-photo-tg svg.cv{width:14px;height:14px;opacity:.9}
.chat-photo-ft .chat-photo-tm{margin:0;flex:none}
.chat-photo-og{margin:8px 0 0;border-radius:12px;background:var(--sf);border-left:3px solid var(--mint);padding:8px 12px 10px}
.chat-photo-og .k{display:block;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin-bottom:2px}
.chat-photo-og .v{display:block;font-size:16px;line-height:22px;color:var(--tx)}

/* фото в пузыре */
.chat-photo-m.ph{padding:4px;max-width:none;width:300px}
.chat-photo-m.ph.in{width:284px}
.chat-photo-img{position:relative;display:block;border-radius:16px;overflow:hidden;background:#2F3742}
.chat-photo-img>svg{width:100%;height:100%}
.chat-photo-r43{aspect-ratio:4/3}.chat-photo-r34{aspect-ratio:3/4}.chat-photo-r11{aspect-ratio:1}
.chat-photo-alb{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.chat-photo-alb .chat-photo-img:first-child{border-radius:16px 6px 6px 16px}
.chat-photo-alb .chat-photo-img:last-child{border-radius:6px 16px 16px 6px}
.chat-photo-cap{padding:6px 10px 2px}
.chat-photo-m.in .chat-photo-cap{padding:8px 12px 6px}
.chat-photo-m.in .chat-photo-cap .chat-photo-ft{margin:0 -12px -6px}
.chat-photo-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.chat-photo-ov.lo{align-items:flex-end;padding-bottom:14px}
.chat-photo-ring{position:relative;width:56px;height:56px;border-radius:50%;background:rgba(14,17,22,.72);display:flex;align-items:center;justify-content:center;color:#F2F5F7}
.chat-photo-ring>svg{position:absolute;inset:4px;width:48px;height:48px}
.chat-photo-ring .x{width:20px;height:20px;position:relative}
.chat-photo-ok{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(14,17,22,.35)}
.chat-photo-ok svg{width:16px;height:16px}
.chat-photo-dimm{position:absolute;inset:0;background:rgba(14,17,22,.55)}
.chat-photo-al{position:relative;width:48px;height:48px;border-radius:50%;background:#3C2A2E;color:var(--err);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px rgba(255,107,94,.6)}
.chat-photo-al svg{width:24px;height:24px}
.chat-photo-wt{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.16);font-size:14px;line-height:20px;color:#C9D1DA}
.chat-photo-wt svg{flex:none;width:16px;height:16px;margin-top:2px}
.chat-photo-m.fl{background:#173A2E;box-shadow:inset 0 0 0 1px rgba(255,107,94,.55)}
.chat-photo-m.fl .chat-photo-tm{color:#C9D1DA}
/* статус отправки под пузырём */
.chat-photo-up{align-self:flex-end;display:flex;align-items:center;gap:8px;margin-top:-4px}
.chat-photo-up .s{display:flex;align-items:center;gap:6px;font:500 13px/18px Inter;color:var(--sec)}
.chat-photo-up .s svg{width:16px;height:16px}
.chat-photo-cn{height:44px;display:flex;align-items:center}
.chat-photo-cn span{height:32px;border-radius:16px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;gap:6px;padding:0 14px;font:600 14px/1 Inter}
.chat-photo-cn svg{width:16px;height:16px;color:var(--sec)}
/* карточка ошибки */
.chat-photo-ec{align-self:flex-end;width:332px;border-radius:18px;background:#2A2023;box-shadow:inset 0 0 0 1px rgba(255,107,94,.35);padding:12px 14px 14px;margin-top:-2px}
.chat-photo-ec .h{display:flex;align-items:center;gap:8px;font:600 16px/22px Inter;color:var(--tx)}
.chat-photo-ec .h svg{width:20px;height:20px;color:var(--err);flex:none}
.chat-photo-ec p{margin:4px 0 0 28px;font-size:14px;line-height:20px;color:#E4C9CC}
.chat-photo-ec .b{display:flex;gap:8px;margin-top:12px}
.chat-photo-ec .b span{flex:1;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 15px/1 Inter;padding:0 10px;white-space:nowrap}
.chat-photo-ec .b svg{width:18px;height:18px;flex:none}
.chat-photo-ec .b .p{background:var(--acc);color:var(--onacc);font:900 16px/1 Nunito,sans-serif;flex:1.5}
.chat-photo-ec .b .s{background:var(--sf2);color:var(--tx)}

/* поле ввода */
.chat-photo-cmp{flex:none;position:relative;border-top:1px solid var(--line);padding:8px 12px 0;background:var(--bg)}
.chat-photo-row{display:flex;align-items:flex-end;gap:8px}
.chat-photo-pls{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-photo-pls svg{width:26px;height:26px}
.chat-photo-pls.on{background:var(--sf2);color:var(--tx)}
.chat-photo-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:17px;line-height:22px;color:var(--sec)}
.chat-photo-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-photo-go svg{width:22px;height:22px}

/* лист выбора фото */
.chat-photo-dim{position:absolute;inset:0;background:rgba(9,11,14,.66);z-index:5}
.chat-photo-sh{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45),inset 0 1px 0 var(--line);padding:8px 0 0}
.chat-photo-gr{width:40px;height:5px;border-radius:3px;background:#3A414B;margin:0 auto 6px}
.chat-photo-pkh{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;height:56px}
.chat-photo-pkh .t{flex:1;min-width:0;text-align:center}
.chat-photo-pkh .t b{display:block;font:900 20px/26px Nunito,sans-serif}
.chat-photo-pkh .t span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-photo-nx{height:44px;display:flex;align-items:center;flex:none}
.chat-photo-nx span{height:36px;border-radius:18px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;font:900 16px/1 Nunito,sans-serif}
.chat-photo-nx b{min-width:22px;height:22px;border-radius:11px;background:var(--onacc);color:var(--acc);font:800 13px/22px Inter;text-align:center;padding:0 6px}
.chat-photo-tabs{display:flex;gap:8px;padding:4px 16px 12px}
.chat-photo-tabs span{height:36px;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:6px;font:600 14px/1 Inter;background:var(--sf2);color:var(--tx)}
.chat-photo-tabs span.on{background:var(--tx);color:var(--bg)}
.chat-photo-tabs svg{width:16px;height:16px}
.chat-photo-pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.chat-photo-tl{position:relative;aspect-ratio:1;overflow:hidden;background:#2F3742}
.chat-photo-tl>svg{width:100%;height:100%}
.chat-photo-tl .ck{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:rgba(14,17,22,.35);display:flex;align-items:center;justify-content:center;font:800 15px/1 Inter;color:var(--onacc)}
.chat-photo-tl.sel .ck{background:var(--acc);border-color:#fff}
.chat-photo-tl.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px var(--acc)}
.chat-photo-tl.cam{background:var(--sf2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tx);font:600 14px/1 Inter}
.chat-photo-tl.cam svg{width:32px;height:32px}
.chat-photo-pnt{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;font-size:13px;line-height:18px;color:var(--sec)}
.chat-photo-pnt svg{width:16px;height:16px;color:var(--mint)}

/* предпросмотр перед отправкой */
.chat-photo-pvt{flex:none;display:flex;align-items:center;gap:8px;height:56px;padding:0 8px}
.chat-photo-pvt .nm{flex:1;min-width:0;text-align:center}
.chat-photo-pvt .nm b{display:block;font:600 17px/22px Inter}
.chat-photo-pvt .nm span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-photo-big{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px}
.chat-photo-big .chat-photo-img{height:100%;max-width:100%;border-radius:20px}
.chat-photo-thb{flex:none;display:flex;gap:8px;justify-content:center;padding:12px 16px}
.chat-photo-thb span{position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--sf2);flex:none}
.chat-photo-thb span>svg{width:100%;height:100%}
.chat-photo-thb span.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.chat-photo-thb span.add{display:flex;align-items:center;justify-content:center;color:var(--tx);box-shadow:inset 0 0 0 1px var(--line);background:var(--sf)}
.chat-photo-thb span.add svg{width:24px;height:24px}
.chat-photo-cc{flex:none;margin:0 12px;border-radius:20px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:4px 6px 6px 16px}
.chat-photo-cc .in{display:flex;align-items:flex-end;gap:8px}
.chat-photo-cc .tx{flex:1;min-width:0;padding:10px 0 8px;font-size:17px;line-height:24px;color:var(--tx)}
.chat-photo-cc .car{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-4px;margin-left:1px;border-radius:1px}
.chat-photo-snd{position:relative;width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:2px}
.chat-photo-snd svg{width:22px;height:22px}
.chat-photo-snd b{position:absolute;right:-4px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--tx);color:var(--bg);font:800 12px/22px Inter;text-align:center;padding:0 6px;box-shadow:0 0 0 2px var(--sf)}
.chat-photo-cc .trb{margin:2px 10px 6px 0;padding-top:10px;border-top:1px solid var(--line)}
.chat-photo-lb{display:flex;align-items:center;gap:6px;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mint)}
.chat-photo-lb svg{width:14px;height:14px}
.chat-photo-cc .trb p{margin:4px 0 0;font-size:16px;line-height:22px;color:var(--mint)}
.chat-photo-nt{flex:none;margin:8px 16px 0;text-align:center;font-size:13px;line-height:18px;color:var(--sec)}

/* просмотр */
.chat-photo-vw{background:#0A0C10}
.chat-photo-vt{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px}
.chat-photo-vt .nm{flex:1;min-width:0;text-align:center}
.chat-photo-vt .nm b{display:block;font:600 17px/22px Inter}
.chat-photo-vt .nm span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-photo-vp{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.chat-photo-vp .chat-photo-img{border-radius:0;width:430px}
.chat-photo-hint{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--sec)}
.chat-photo-hint svg{width:16px;height:16px}
.chat-photo-vc{flex:none;margin:0 12px;border-radius:20px;background:var(--sf);padding:12px 16px 4px}
.chat-photo-vc .tr{margin-top:4px;font-size:17px;line-height:24px;color:var(--tx)}
.chat-photo-vc .chat-photo-og{margin-top:10px;background:var(--sf2)}
.chat-photo-vc .chat-photo-ft{margin:2px -16px 0;padding:0 16px}
.chat-photo-va{flex:none;display:flex;justify-content:space-around;padding:8px 8px 0}
.chat-photo-va span{width:120px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 13px/16px Inter;color:var(--tx);text-align:center}
.chat-photo-va span svg{width:24px;height:24px}
</style>
</head>
<body>
<div class="chat-photo-w">
<nav class="chat-photo-lsw" id="chat-photo-lsw" aria-label="Language"></nav>

<section class="chat-photo-hero">
 <div><div class="pf p67" style="--s:1" data-state="thread" data-hero="1"><div class="shell"></div><div class="glass"></div></div>
 <div class="pcap"><span class="dot"></span><div><b id="chat-photo-capb"></b><span id="chat-photo-caps"></span></div></div></div>
 <div class="chat-photo-info">
  <p class="chat-photo-eb" id="chat-photo-eb"></p>
  <h1 id="chat-photo-h1"></h1>
  <p id="chat-photo-p1"></p>
  <ul id="chat-photo-ul"></ul>
 </div>
</section>

<h2 class="chat-photo-h2" id="chat-photo-h2s"></h2>
<p class="chat-photo-lead" id="chat-photo-lead"></p>
<div class="chat-photo-grid" id="chat-photo-grid"></div>

<h2 class="chat-photo-h2" id="chat-photo-h2d"></h2>
<div class="chat-photo-cols">
 <div class="chat-photo-sec"><h2 id="chat-photo-hdec"></h2><ul id="chat-photo-dec"></ul></div>
 <div class="chat-photo-sec"><h2 id="chat-photo-htok"></h2>
  <table class="chat-photo-ct" id="chat-photo-ct"></table>
  <ul style="margin-top:12px" id="chat-photo-tok"></ul></div>
 <div class="chat-photo-sec"><h2 id="chat-photo-hna"></h2><ul id="chat-photo-na"></ul></div>
</div>
</div>

<script>
(function(){
var SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
function ic(p,extra,cls){return '<svg viewBox="0 0 24 24" '+(extra||SW)+(cls?' class="'+cls+'"':'')+' aria-hidden="true">'+p+'</svg>'}
var I={

 phOut(album('<span class="chat-photo-ok" role="img" aria-label="'+A.done+'">'+I.check+'</span>','<span class="chat-photo-dimm"></span><span class="chat-photo-ov">'+ring(.62)+'</span>'),trLine(D.mOut.r),I.clock,'gap')+
 '<div class="chat-photo-up"><span class="s" role="status">'+I.upl+D.sending+'</span><span class="chat-photo-cn" role="button" data-tap><span>'+I.x+D.cancel+'</span></span></div>'+
 '</div>'+cmp())};
S.failed=function(){var e=D.err,m=D.f3;
 return scr(nav()+'<div class="chat-photo-msgs">'+txtOut(D.f1)+txtIn(D.f2)+
 '<div class="chat-photo-m out ph fl gap" style="width:248px" role="group" aria-label="'+A.fail+'">'+ph(meter(),'chat-photo-r43','<span class="chat-photo-dimm"></span><span class="chat-photo-ov lo"><span class="chat-photo-al" role="img" aria-label="'+A.fail+'">'+I.excl+'</span></span>')+
 '<div class="chat-photo-cap"><span lang="'+D.me+'">'+m.t+'</span><div class="chat-photo-wt">'+I.clock+'<span>'+D.later+'</span></div><div class="chat-photo-tm">'+m.tm+'</div></div></div>'+
 '<div class="chat-photo-ec" role="alert"><div class="h">'+I.alert+e.h+'</div><p>'+e.p+'</p><div class="b"><span class="p" role="button" data-tap>'+I.img+e.pick+'</span><span class="s" role="button" data-tap>'+I.trash+e.del+'</span></div></div>'+
 '</div>'+cmp())};
S.viewer=function(){var m=D.mIn,v=D.vw;
 return scr('<div class="chat-photo-vt"><span class="chat-photo-ib" role="button" aria-label="'+A.close+'" data-tap><i>'+I.x+'</i></span><div class="nm"><b>'+D.name+'</b><span>'+v.when+'</span></div><span class="chat-photo-ib" role="button" aria-label="'+A.more+'" data-tap><i>'+I.more+'</i></span></div>'+
 '<div class="chat-photo-vp">'+ph(valve(),'chat-photo-r43')+'<span class="chat-photo-hint">'+I.swipe+v.hint+'</span></div>'+
 '<div class="chat-photo-vc"><div class="tr" lang="'+D.me+'">'+m.r+'</div>'+ogb(m.o)+ftg(1)+'</div>'+
 '<div class="chat-photo-va"><span role="button" data-tap>'+I.save+v.save+'</span><span role="button" data-tap>'+I.share+v.share+'</span><span role="button" data-tap>'+I.flag+v.report+'</span></div>','','chat-photo-vw')};

var order=['picker','preview','uploading','thread','failed','viewer'];
var P=D.P;
document.documentElement.lang=D.lang;document.title=P.title;
function $(id){return document.getElementById(id)}
$('chat-photo-lsw').innerHTML=['ru','es','en'].map(function(k){return '<a href="?l='+k+'" lang="'+k+'"'+(k===LG?' aria-current="true"':'')+'>'+k.toUpperCase()+'</a>'}).join('');
$('chat-photo-eb').innerHTML=P.eb;$('chat-photo-h1').innerHTML=nb(P.h1);$('chat-photo-p1').innerHTML=nb(P.p1);
$('chat-photo-ul').innerHTML=P.ul.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');
$('chat-photo-capb').innerHTML=P.capb;$('chat-photo-caps').innerHTML=nb(P.caps);
$('chat-photo-h2s').innerHTML=P.h2s;$('chat-photo-lead').innerHTML=P.lead;$('chat-photo-h2d').innerHTML=P.h2d;
$('chat-photo-hdec').innerHTML=P.hdec;$('chat-photo-htok').innerHTML=P.htok;$('chat-photo-hna').innerHTML=P.hna;
$('chat-photo-dec').innerHTML=P.dec.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');
$('chat-photo-tok').innerHTML=P.tok.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');
$('chat-photo-na').innerHTML=P.na.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');
$('chat-photo-grid').innerHTML=order.map(function(k){return '<div class="chat-photo-card"><div class="pf p67" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+P.st[k][0]+' <code>'+k+'</code></h3><p>'+nb(P.st[k][1])+'</p></div>'}).join('');
document.querySelectorAll('.pf[data-state]').forEach(function(p){p.querySelector('.glass').innerHTML=nb(S[p.dataset.state]())});
window.CHAT_PHOTO={S:S,order:order,lang:LG,nb:nb};

function Lm(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lm(a),y=Lm(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#242B34'],['#BFF2DC','#242B34'],['#9AA4B2','#242B34'],['#FFFFFF','#00875C'],['#0E1116','#2BC48A'],['#E4C9CC','#2A2023'],['#F2F5F7','#2A2023'],['#9AA4B2','#0A0C10']];
var rows=pairs.map(function(p,i){return [p[0],p[1],P.ct[i]]});
$('chat-photo-ct').innerHTML=rows.map(function(r){return '<tr><td><span class="chat-photo-sw" style="background:'+r[0]+'"></span><span class="chat-photo-sw" style="background:'+r[1]+'"></span>'+r[2]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_PHOTO.min=Math.min.apply(null,rows.map(function(r){return cr(r[0],r[1])}));
})();
</script>
