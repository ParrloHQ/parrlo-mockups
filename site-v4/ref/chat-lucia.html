<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-lucia-w{max-width:1200px;margin:0 auto}
.chat-lucia-lng{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-lucia-lng a{min-width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#C9D1DA;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.chat-lucia-lng a.on{background:#2BC48A;color:#0E1116;box-shadow:none}
.chat-lucia-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-lucia-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-lucia-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-lucia-tag{display:inline-block;margin:0 0 12px;font:700 13px/1.3 Inter;color:#0E1116;background:#BFF2DC;border-radius:8px;padding:6px 10px}
.chat-lucia-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-lucia-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-lucia-info ul,.chat-lucia-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-lucia-info li,.chat-lucia-sec li{margin:6px 0}
.chat-lucia-w b{color:#F2F5F7;font-weight:600}
.chat-lucia-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-lucia-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-lucia-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-lucia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:40px 24px;justify-items:center}
.chat-lucia-card{width:273px}
.chat-lucia-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}

.chat-lucia-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-lucia-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-lucia-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-lucia-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-lucia-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-lucia-hero .pf{--s:.78!important}.chat-lucia-info h1{font-size:30px}.chat-lucia-hero{gap:24px}}

/* ======= экран 430×932 ======= */

.chat-lucia-scr svg{display:block}
.chat-lucia-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-lucia-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-lucia-ib svg{width:24px;height:24px}
.chat-lucia-ib.bk{color:var(--acc)}.chat-lucia-ib.bk svg{width:28px;height:28px}

.chat-lucia-end{flex:none;height:44px;display:flex;align-items:center}
.chat-lucia-end span{height:34px;border-radius:17px;background:var(--sf2);display:flex;align-items:center;padding:0 14px;font:600 14px/1 Inter;color:var(--tx)}

/* аватар-инициалы и плашка «ИИ» */
.chat-lucia-av{display:block;position:relative;width:40px;height:40px;border-radius:50%;background:#F4B183;color:#0E1116;font:900 18px/40px Nunito,Inter;text-align:center;flex:none}
.chat-lucia-av.p{background:#9CC9F5}
.chat-lucia-av.v{background:#F4B183}
.chat-lucia-av.l{background:#9CC9F5}
.chat-lucia-av .chat-lucia-ai{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%)}
.chat-lucia-av.big{width:56px;height:56px;font-size:24px;line-height:56px}
.chat-lucia-av.xl{width:104px;height:104px;font-size:46px;line-height:104px}

.chat-lucia-ai{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;background:#2F3742;color:#F2F5F7;font:700 11px/1 Inter;letter-spacing:.04em;white-space:nowrap;box-shadow:0 0 0 2px var(--bg)}
.chat-lucia-nm .chat-lucia-ai,.chat-lucia-pc .n .chat-lucia-ai,.chat-lucia-in h4 .chat-lucia-ai{box-shadow:none}
.chat-lucia-av .chat-lucia-ai{height:16px;padding:0 5px;font-size:10px;border-radius:5px}

/* лента */
.chat-lucia-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.chat-lucia-sc{align-self:stretch;display:flex;gap:12px;align-items:flex-start;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;margin-bottom:auto}

.chat-lucia-sc span.d{display:block;font-size:14px;line-height:20px;color:var(--sec);margin-top:2px}
.chat-lucia-m{position:relative;max-width:82%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-lucia-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px;padding-bottom:0}
.chat-lucia-m.wide{width:82%}

.chat-lucia-gap{margin-top:8px}
.chat-lucia-t{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.3);font-size:15px;line-height:20px}

.chat-lucia-tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px}
.chat-lucia-tm svg{width:16px;height:16px}
.chat-lucia-ft{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:0 -12px;padding:0 12px}
.chat-lucia-tg{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--mint);white-space:nowrap}
.chat-lucia-tg svg{width:16px;height:16px;flex:none}
.chat-lucia-tg svg.cv{width:14px;height:14px}
.chat-lucia-ft .chat-lucia-tm{margin:0;flex:none;color:var(--sec)}
.chat-lucia-og{margin:8px 0 0;border-radius:12px;background:var(--sf);border-left:3px solid var(--mint);padding:8px 12px 10px}
.chat-lucia-og .k{display:block;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin-bottom:2px}
.chat-lucia-og .v{display:block;font-size:17px;line-height:24px;color:var(--tx);font-weight:500}
.chat-lucia-ty{align-self:flex-start;display:flex;align-items:center;gap:8px}
.chat-lucia-ty .b{height:36px;border-radius:18px;border-bottom-left-radius:6px;background:var(--sf2);display:flex;align-items:center;gap:4px;padding:0 14px}
.chat-lucia-ty .b i{width:7px;height:7px;border-radius:50%;background:var(--sec)}
.chat-lucia-ty .b i:nth-child(2){opacity:.7}.chat-lucia-ty .b i:nth-child(3){opacity:.45}
.chat-lucia-ty span.l{font-size:13px;line-height:18px;color:var(--sec)}

/* подсказка «Как сказать проще» */

.chat-lucia-hc .h{display:flex;align-items:center;gap:8px;min-height:44px}
.chat-lucia-hc .h svg.b{width:20px;height:20px;color:var(--mint);flex:none}
.chat-lucia-hc .h b{flex:1;font:700 15px/20px Inter;color:var(--mint)}
.chat-lucia-hc .h .chat-lucia-ib{color:var(--sec)}
.chat-lucia-hc .h .chat-lucia-ib svg{width:20px;height:20px}
.chat-lucia-hc .body{padding-right:10px}
.chat-lucia-hc .es{font:600 20px/27px Inter;color:var(--tx)}
.chat-lucia-hc .tr{font-size:15px;line-height:21px;color:var(--sec);margin-top:2px}
.chat-lucia-hc .why{font-size:14px;line-height:20px;color:var(--sec);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.chat-lucia-hc .acts{display:flex;gap:8px;margin-top:12px}
.chat-lucia-pri{height:52px;border-radius:26px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;gap:8px;font:900 18px/1 Nunito,sans-serif;white-space:nowrap}
.chat-lucia-pri svg{width:20px;height:20px}
.chat-lucia-hc .chat-lucia-pri{flex:1.5;height:44px;font-size:16px;min-width:0}
.chat-lucia-sec2{height:52px;border-radius:26px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 Inter;white-space:nowrap}
.chat-lucia-sec2 svg{width:20px;height:20px;color:var(--sec)}
.chat-lucia-hc .chat-lucia-sec2{flex:1;height:44px;font-size:15px;min-width:0}
.chat-lucia-hl{align-self:flex-end;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:rgba(191,242,220,.12);color:var(--mint);font:600 13px/1 Inter;margin-top:-2px}
.chat-lucia-hl svg{width:16px;height:16px}

/* поле ввода */
.chat-lucia-cmp{flex:none;border-top:1px solid var(--line);padding:8px 12px 0;background:var(--bg)}
.chat-lucia-row{display:flex;align-items:flex-end;gap:8px}
.chat-lucia-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:16px;line-height:22px;color:var(--sec);white-space:nowrap;overflow:hidden}
.chat-lucia-f span{overflow:hidden;text-overflow:ellipsis}
.chat-lucia-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-lucia-go svg{width:22px;height:22px}
.chat-lucia-hb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mint);flex:none;background:var(--sf2)}
.chat-lucia-hb svg{width:22px;height:22px}

/* выбор собеседника */
.chat-lucia-pk{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 16px 12px}
.chat-lucia-pk h4{margin:0;font:900 34px/40px Nunito,sans-serif}
.chat-lucia-pk .lead{margin:4px 0 0;color:var(--sec);font-size:16px;line-height:22px}
.chat-lucia-lb{font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin:24px 0 10px}
.chat-lucia-pcs{display:flex;gap:12px}
.chat-lucia-pc{position:relative;flex:1;min-width:0;border-radius:20px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:16px 14px 14px}
.chat-lucia-pc.on{box-shadow:inset 0 0 0 2px var(--acc)}
.chat-lucia-pc .ck{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center}
.chat-lucia-pc .ck svg{width:15px;height:15px}
.chat-lucia-pc .n{display:flex;align-items:center;gap:6px;margin-top:16px;font:700 17px/22px Inter}
.chat-lucia-pc .r{display:block;font:600 13px/18px Inter;color:var(--mint);margin-top:2px}
.chat-lucia-pc p{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--sec)}
.chat-lucia-sits{display:flex;flex-direction:column;gap:8px}
.chat-lucia-si{min-height:64px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px}
.chat-lucia-si.on{box-shadow:inset 0 0 0 2px var(--acc)}
.chat-lucia-si .i{width:40px;height:40px;border-radius:50%;background:var(--sf2);color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
.chat-lucia-si .i svg{width:22px;height:22px}
.chat-lucia-si .t{flex:1;min-width:0}
.chat-lucia-si .t b{display:block;font:600 16px/22px Inter}
.chat-lucia-si .t span{display:block;font-size:14px;line-height:19px;color:var(--sec)}
.chat-lucia-si>svg{flex:none;width:20px;height:20px;color:var(--sec)}
.chat-lucia-si.on>svg{color:var(--acc)}
.chat-lucia-nt{display:flex;gap:8px;margin:auto 0 12px;padding-top:16px;font-size:13px;line-height:18px;color:var(--sec)}
.chat-lucia-nt svg{flex:none;width:16px;height:16px;margin-top:1px}

/* первая встреча */
.chat-lucia-in{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:28px 20px 12px;text-align:center}
.chat-lucia-in h4{margin:24px 0 4px;font:900 30px/36px Nunito,sans-serif;display:flex;align-items:center;gap:8px}
.chat-lucia-in h4 .chat-lucia-ai{height:24px;padding:0 8px;font-size:13px;border-radius:8px}
.chat-lucia-in .lead{margin:0;color:var(--sec);font-size:16px;line-height:22px;max-width:360px}
.chat-lucia-hon{align-self:stretch;display:flex;gap:12px;text-align:left;margin-top:24px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--mint);padding:14px 16px}
.chat-lucia-hon svg{flex:none;width:22px;height:22px;color:var(--mint);margin-top:1px}
.chat-lucia-hon b{display:block;font:700 16px/22px Inter}
.chat-lucia-hon span{display:block;font-size:14px;line-height:20px;color:var(--sec);margin-top:2px}
.chat-lucia-how{align-self:stretch;display:flex;flex-direction:column;gap:14px;text-align:left;margin-top:20px;padding:0 4px}
.chat-lucia-how div{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:21px}
.chat-lucia-how .i{width:36px;height:36px;border-radius:50%;background:var(--sf2);color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
.chat-lucia-how .i svg{width:18px;height:18px}
.chat-lucia-how span{padding-top:7px}
.chat-lucia-bt{align-self:stretch;margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* итог */
.chat-lucia-sum{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 16px 12px}
.chat-lucia-sum .top{display:flex;align-items:center;gap:14px}
.chat-lucia-sum .top .c{width:48px;height:48px;border-radius:50%;background:rgba(43,196,138,.16);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-lucia-sum .top .c svg{width:26px;height:26px}
.chat-lucia-sum .top .k{display:block;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.chat-lucia-sum .top b{display:block;font:900 26px/32px Nunito,sans-serif}
.chat-lucia-sum .lead{margin:12px 0 0;color:var(--sec);font-size:15px;line-height:21px}
.chat-lucia-ph{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.chat-lucia-pr{display:flex;align-items:center;gap:12px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:12px 8px 12px 16px}
.chat-lucia-pr .n{width:28px;height:28px;border-radius:50%;background:var(--sf2);color:var(--tx);font:800 14px/28px Nunito,Inter;text-align:center;flex:none;align-self:flex-start;margin-top:2px}
.chat-lucia-pr .t{flex:1;min-width:0}
.chat-lucia-pr .es{display:block;font:600 18px/25px Inter;color:var(--tx)}
.chat-lucia-pr .tr{display:block;font-size:14px;line-height:20px;color:var(--mint);margin-top:2px}
.chat-lucia-pr .ib{width:44px;height:44px;border-radius:50%;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;flex:none}
.chat-lucia-pr .ib svg{width:20px;height:20px}
.chat-lucia-sum .chat-lucia-bt{margin-top:auto}
.chat-lucia-by{display:flex;flex-direction:column;margin-top:20px}
.chat-lucia-sum .lead{margin-top:20px}
</style>
</head>
