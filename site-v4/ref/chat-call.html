<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Chat · звонок</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-call-w{max-width:1200px;margin:0 auto}
.chat-call-lsw{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-call-lsw a{min-width:48px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#9AA4B2;text-decoration:none;padding:0 12px}
.chat-call-lsw a[aria-current="true"]{background:#1C2026;color:#F2F5F7;box-shadow:inset 0 0 0 1px #2F3742}
.chat-call-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-call-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-call-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-call-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-call-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-call-info ul,.chat-call-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-call-info li,.chat-call-sec li{margin:6px 0}
.chat-call-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7}
.chat-call-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-call-lead{color:#9AA4B2;margin:0 0 32px;max-width:720px}
.chat-call-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 24px;justify-items:center}
.chat-call-card{width:280px}
.chat-call-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chat-call-card h3 code{font-size:12px;color:#9AA4B2}
.chat-call-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-call-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px 40px}
.chat-call-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-call-sec b{color:#F2F5F7;font-weight:600}
.chat-call-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-call-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-call-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-call-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-call-hero .pf{--s:.78!important}.chat-call-info h1{font-size:32px}.chat-call-cols{grid-template-columns:1fr}}

/* ======= экран 430×932 ======= */
.chat-call-scr{overflow:hidden;--me:#2BC48A;--th:#BFF2DC;--err:#FF6B5E;--yel:#FFC247}
.chat-call-scr svg{display:block}
.chat-call-top{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 8px}
.chat-call-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-call-ib svg{width:28px;height:28px}
.chat-call-tm{font:600 16px/20px Inter;font-variant-numeric:tabular-nums;color:var(--sec);display:flex;align-items:center;gap:6px}
.chat-call-tm i{width:8px;height:8px;border-radius:50%;background:var(--me)}
.chat-call-lc{flex:none;height:44px;display:flex;align-items:center}
.chat-call-lc span{height:32px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 13px/1 Inter;letter-spacing:.04em;color:var(--tx)}
.chat-call-lc svg{width:14px;height:14px;color:var(--sec)}

/* собеседник */
.chat-call-who{flex:none;display:flex;flex-direction:column;align-items:center;padding:4px 20px 16px}
.chat-call-av{position:relative;width:96px;height:96px;border-radius:50%;color:#0E1116;font:900 40px/96px Nunito,Inter;text-align:center;flex:none}
.chat-call-av.sp{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--th),0 0 0 16px rgba(191,242,220,.10)}
.chat-call-av.ring1{box-shadow:0 0 0 14px rgba(191,242,220,.09),0 0 0 32px rgba(191,242,220,.05),0 0 0 52px rgba(191,242,220,.025)}
.chat-call-av.dim{box-shadow:inset 0 0 0 48px rgba(14,17,22,.45);color:#3A414B}
.chat-call-av .bd{position:absolute;right:-4px;bottom:-4px;width:36px;height:36px;border-radius:50%;background:var(--err);color:#0E1116;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--bg)}
.chat-call-av .bd svg{width:22px;height:22px}
.chat-call-nm{margin:12px 0 0;font:900 28px/34px Nunito,sans-serif;text-align:center}
.chat-call-ind{margin-top:8px;height:32px;border-radius:16px;display:flex;align-items:center;gap:8px;padding:0 14px 0 12px;font:600 14px/1 Inter;background:var(--sf)}
.chat-call-ind.th{color:var(--th)}.chat-call-ind.me{color:var(--me)}
.chat-call-ind.mut{color:var(--sec)}
.chat-call-ind .wv{display:flex;align-items:center;gap:2px;height:16px}
.chat-call-ind .wv b{width:3px;border-radius:2px;background:currentColor}
.chat-call-ind svg{width:16px;height:16px}
.chat-call-st{margin-top:6px;font-size:16px;line-height:22px;color:var(--sec);text-align:center}

/* субтитры */
.chat-call-feed{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:8px 20px 16px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 56px);mask-image:linear-gradient(to bottom,transparent 0,#000 56px)}
.chat-call-ln{position:relative;padding:10px 14px 10px 18px;border-radius:18px}
.chat-call-ln::before{content:"";position:absolute;left:4px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--th)}
.chat-call-ln.me::before{background:var(--me)}
.chat-call-ln .who{display:flex;align-items:center;gap:6px;font:600 13px/18px Inter;color:var(--th);margin-bottom:2px}
.chat-call-ln.me .who{color:var(--me)}
.chat-call-ln .who .lv{margin-left:auto;display:flex;align-items:center;gap:5px;font-weight:500;color:var(--sec)}
.chat-call-ln .who .lv i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chat-call-ln .tx{font-size:17px;line-height:24px;color:#C9D1DA}
.chat-call-ln .og{display:flex;align-items:baseline;gap:6px;margin-top:4px;font-size:13px;line-height:18px;color:var(--sec);min-width:0}
.chat-call-ln .og .k{flex:none;font:700 11px/16px Inter;letter-spacing:.06em;color:var(--sec);border-radius:5px;padding:0 5px;box-shadow:inset 0 0 0 1px #3A414B}
.chat-call-ln .og .v{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* живая строка: перевод крупно, исходник сворачивается под ним */
.chat-call-ln.live{background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px 14px 20px}
.chat-call-ln.live::before{left:6px;top:16px;bottom:16px}
.chat-call-ln.live .tx{font-size:23px;line-height:31px;font-weight:500;color:var(--tx);letter-spacing:-.005em}
.chat-call-ln.live .tx em{font-style:normal;color:var(--sec)}
.chat-call-ln.live .tx .dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.chat-call-ln.live .tx .dots i{width:6px;height:6px;border-radius:50%;background:var(--sec)}
.chat-call-ln.live .tx .dots i:nth-child(2){opacity:.7}.chat-call-ln.live .tx .dots i:nth-child(3){opacity:.45}
.chat-call-ln.live .og{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:15px;line-height:21px}
.chat-call-ln.live .og .v{white-space:normal;max-height:42px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 55%,rgba(0,0,0,.35));mask-image:linear-gradient(to bottom,#000 55%,rgba(0,0,0,.35))}
.chat-call-ln.live .og svg{flex:none;width:16px;height:16px;align-self:center;color:var(--sec)}
/* я говорю: мой текст крупно, ниже — что прочитает собеседник */
.chat-call-ln.live.me .og{color:#C9D1DA}

/* подсказка и баннер */
.chat-call-hint{margin:0 4px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;line-height:22px;color:#C9D1DA}
.chat-call-hint svg{flex:none;width:22px;height:22px;color:var(--th);margin-top:1px}
.chat-call-sk{display:flex;flex-direction:column;gap:10px;padding:4px 4px 0}
.chat-call-sk i{display:block;height:12px;border-radius:6px;background:#1A1F25}
.chat-call-bn{flex:none;display:flex;align-items:center;gap:12px;margin:0 20px 4px;padding:12px 14px;border-radius:16px;background:var(--sf2);font-size:14px;line-height:20px}
.chat-call-bn svg{flex:none;width:22px;height:22px;color:var(--yel)}
.chat-call-bn b{display:block;font-weight:600;font-size:15px}
.chat-call-bn span{color:#C9D1DA}

/* управление */
.chat-call-ctl{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 16px 12px}
.chat-call-c{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.chat-call-c .b{width:68px;height:68px;border-radius:50%;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center}
.chat-call-c .b svg{width:28px;height:28px}
.chat-call-c.on .b{background:#F2F5F7;color:#0E1116}
.chat-call-c.end .b{background:var(--err);color:#0E1116}
.chat-call-c .l{font:500 13px/16px Inter;color:var(--sec);text-align:center;white-space:nowrap}
.chat-call-c.on .l{color:var(--tx)}

/* итоговые экраны: не удалось, завершён */
.chat-call-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center}
.chat-call-mid h4{margin:20px 0 8px;font:900 30px/36px Nunito,sans-serif}
.chat-call-mid p{margin:0;color:var(--sec);font-size:16px;line-height:23px;max-width:340px}
.chat-call-mid .meta{display:flex;align-items:center;gap:8px;justify-content:center;font-size:16px;line-height:22px;color:var(--sec)}
.chat-call-mid .meta svg{width:18px;height:18px}
.chat-call-rt{margin:28px 0 0;width:100%;border-radius:20px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.chat-call-rt .q{font:600 16px/22px Inter;color:var(--tx);margin:0 0 12px}
.chat-call-rt .r{display:flex;gap:10px}
.chat-call-rt .r span{flex:1;min-height:48px;border-radius:24px;background:var(--sf2);display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px/20px Inter;padding:0 12px;color:var(--tx)}
.chat-call-rt .r svg{width:20px;height:20px;color:var(--sec);flex:none}
.chat-call-act{flex:none;display:flex;flex-direction:column;gap:12px;padding:0 24px 8px}
.chat-call-btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;font:900 19px/1 Nunito,sans-serif;padding:0 20px}
.chat-call-btn svg{width:22px;height:22px;flex:none}
.chat-call-btn.p{background:var(--acc);color:var(--onacc)}
.chat-call-btn.s{background:var(--sf2);color:var(--tx)}
.chat-call-btn.s svg{color:var(--mint)}
.chat-call-btn.t{height:44px;font:600 16px/1 Inter;color:var(--sec)}
.chat-call-nt{margin:-4px 0 0;font-size:13px;line-height:18px;color:var(--sec);text-align:center}
</style>
</head>

 <div class="chat-call-sec"><h2 id="chat-call-hna"></h2><ul id="chat-call-na"></ul></div>
</div>
</div>

$('chat-call-tok').innerHTML=P.tok.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');
$('chat-call-na').innerHTML=P.na.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');
$('chat-call-grid').innerHTML=order.map(function(k){return '<div class="chat-call-card"><div class="pf p67" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+P.st[k][0]+' <code>'+k+'</code></h3><p>'+nb(P.st[k][1])+'</p></div>'}).join('');
document.querySelectorAll('.pf[data-state]').forEach(function(p){p.querySelector('.glass').innerHTML=nb(S[p.dataset.state]())});
window.CHAT_CALL={S:S,order:order,lang:LG};

function Lm(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lm(a),y=Lm(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#1C2026'],['#BFF2DC','#0E1116'],['#2BC48A','#0E1116'],['#C9D1DA','#0E1116'],['#9AA4B2','#0E1116'],['#9AA4B2','#1C2026'],['#9AA4B2','#0E1116'],['#0E1116','#FF6B5E'],['#C9D1DA','#242B34'],['#0E1116','#2BC48A']];
var rows=pairs.map(function(p,i){return [p[0],p[1],P.ct[i]]});
$('chat-call-ct').innerHTML=rows.map(function(r){return '<tr><td><span class="chat-call-sw" style="background:'+r[0]+'"></span><span class="chat-call-sw" style="background:'+r[1]+'"></span>'+r[2]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_CALL.min=Math.min.apply(null,rows.map(function(r){return cr(r[0],r[1])}));
})();
</script>
