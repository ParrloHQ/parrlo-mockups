<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo · клавиатура, перевод входящего</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.kb-incoming-w{max-width:1200px;margin:0 auto}
.kb-incoming-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.kb-incoming-tags{display:flex;gap:8px;flex-wrap:wrap}
.kb-incoming-tag{display:inline-block;font:600 13px/20px Inter,sans-serif;color:#0E1116;background:#FFC247;border-radius:8px;padding:2px 10px}
.kb-incoming-tag.m{background:#2F3742;color:#F2F5F7}
.kb-incoming-lng{display:flex;gap:4px;background:#171C23;border-radius:14px;padding:4px}
.kb-incoming-lng a{min-width:56px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 15px Inter,sans-serif;color:#C5CCD5;text-decoration:none}
.kb-incoming-lng a[aria-current="true"]{background:#2BC48A;color:#0E1116}
.kb-incoming-w h1{font:900 36px/1.15 Nunito,sans-serif;margin:0 0 8px}
.kb-incoming-w h2{font:900 24px/1.2 Nunito,sans-serif;margin:0 0 8px}
.kb-incoming-lead{color:#9AA4B2;max-width:760px;margin:0 0 32px}
.kb-incoming-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;padding:48px 24px 40px;border-radius:32px;background:#171C23}
.kb-incoming-hero figure,.kb-incoming-st figure{margin:0}
.kb-incoming-sec{margin-top:64px}
.kb-incoming-sec>p{color:#9AA4B2;margin:0 0 24px;max-width:760px}
.kb-incoming-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(600px,1fr));gap:24px}
.kb-incoming-st{background:#171C23;border-radius:24px;padding:24px}
.kb-incoming-st h3{font:900 20px/1.25 Nunito,sans-serif;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kb-incoming-st h3 code{font:500 13px ui-monospace,Menlo,monospace;color:#9AA4B2;background:#0E1116;border-radius:6px;padding:1px 6px}
.kb-incoming-st>p{margin:0 0 20px;color:#9AA4B2;font-size:15px}
.kb-incoming-pair{display:flex;gap:20px;justify-content:center}
.kb-incoming-pair .pcap{margin-top:10px;font-size:13px}
.kb-incoming-pair .pcap b{font-size:14px}
.kb-incoming-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-incoming-notes h2{font-size:20px;margin:0 0 10px}
.kb-incoming-notes ul{margin:0;padding-left:20px;color:#9AA4B2}
.kb-incoming-notes li{margin:6px 0}
.kb-incoming-notes b{color:#F2F5F7;font-weight:600}
.kb-incoming-st .pf{--s:.6!important}
@media (max-width:660px){
 .kb-incoming-grid{grid-template-columns:1fr}
 .kb-incoming-st{padding:16px}
 .kb-incoming-pair{gap:12px}
 .kb-incoming-st .pf{--s:.345!important}
 .kb-incoming-hero{padding:24px 8px;gap:24px}
 .kb-incoming-hero .pf{--s:.76!important}
 .kb-incoming-w h1{font-size:28px}
}

/* ===== экран 430×932: нейтральный мессенджер + клавиатура Parrlo ===== */
.scr.light{--kb-bg:#D3D7DC;--kb-key:#FFFFFF;--kb-key2:#ABB2BB;--kb-tx:#0E1116;--kb-sec:#5B6472;--kb-sh:0 1px 0 rgba(0,0,0,.3);--kb-acc:#00875C;--kb-onacc:#FFFFFF;--kb-line:#D5DBE1}
.scr:not(.light){--kb-bg:#1B1F25;--kb-key:#3A414B;--kb-key2:#2A3038;--kb-tx:#F2F5F7;--kb-sec:#C5CCD5;--kb-sh:0 1px 0 rgba(0,0,0,.6);--kb-acc:#2BC48A;--kb-onacc:#0E1116;--kb-line:#4A525D}
.kb-incoming-scr .nav{padding:6px 16px 10px}
.kb-incoming-scr .nav .av{color:#0E1116}
.kb-incoming-scr .msgs{padding:12px 16px}
.kb-incoming-scr .m{max-width:78%}
.kb-incoming-scr .m .tm{opacity:1;color:var(--sec)}
.kb-incoming-scr .m.out .tm{color:inherit;opacity:.85}
.kb-incoming-scr.light .m.out .tm{color:#3E5A4D;opacity:1}
.kb-incoming-scr .inp{padding:8px 12px 10px;align-items:flex-end}
.kb-incoming-scr .inp .f{color:var(--tx);flex:1;min-width:0;padding:8px 14px;line-height:24px;font-size:17px;border-radius:20px;min-height:42px}
.kb-incoming-scr .inp .f .pl{color:var(--sec)}
.kb-incoming-scr .inp .sd{flex:none;width:38px;height:38px;margin-bottom:2px}
.kb-incoming-scr .inp .sd.off{background:var(--sf2);color:var(--sec)}
.kb-incoming-car{display:inline-block;width:2px;height:22px;background:var(--acc);vertical-align:-5px;margin-left:1px}
.kb-incoming-kb{flex:none;background:var(--kb-bg);padding:0 3px;color:var(--kb-tx)}
/* полоса над панелью — 60 pt, как в kb-incoming */
.kb-incoming-strip{position:relative;margin:8px 5px 0;height:60px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);padding:0 4px 0 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:19px;overflow:hidden}
.kb-incoming-strip>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-incoming-strip .tx{flex:1;min-width:0}
.kb-incoming-strip .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-incoming-strip .tx span{display:block;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-incoming-pill{flex:none;height:44px;display:flex;align-items:center;padding:0 4px}
.kb-incoming-pill span{height:32px;border-radius:16px;background:var(--kb-key2);display:flex;align-items:center;gap:5px;padding:0 8px 0 12px;font:700 13px Inter,sans-serif;letter-spacing:.02em}
.kb-incoming-pill svg{width:16px;height:16px}
/* подсказки слов при наборе */
.kb-incoming-strip.sg{padding:0 4px;gap:0}
.kb-incoming-sg{flex:1 1 0;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;font:500 16px Inter,sans-serif;border-radius:10px;white-space:nowrap}
.kb-incoming-sg.on{background:var(--kb-bg)}
.kb-incoming-sgd{flex:none;width:1px;height:28px;background:var(--kb-line)}
/* черновик готов: два действия */
.kb-incoming-strip.go{padding:0 8px;gap:8px}
.kb-incoming-a{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font:700 15px Inter,sans-serif;white-space:nowrap}
.kb-incoming-a svg{flex:none;width:22px;height:22px}
.kb-incoming-a .pm{width:21px;height:21px}
.kb-incoming-a.p{flex:1 1 auto;min-width:0;background:var(--kb-acc);color:var(--kb-onacc)}
.kb-incoming-a.s{flex:none;background:var(--kb-key2);color:var(--kb-tx)}
.kb-incoming-a.p small{font:700 12px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor}
.scr:not(.light) .kb-incoming-pop{background:#4A525D}
/* панель иконок */
.kb-incoming-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:4px}
.kb-incoming-ib{width:64px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-incoming-ib svg{width:26px;height:26px}
.kb-incoming-ib .pm{width:25px;height:25px}
/* клавиши */
.kb-incoming-rows{position:relative;display:flex;flex-direction:column;gap:11px;padding-top:6px}
.kb-incoming-r{display:flex;gap:5px}
.kb-incoming-k{position:relative;flex:1 1 0;min-width:0;height:45px;border-radius:8px;background:var(--kb-key);box-shadow:var(--kb-sh);color:var(--kb-tx);display:flex;align-items:center;justify-content:center;font:400 24px/1 Inter,sans-serif}
.kb-incoming-k.f{background:var(--kb-key2)}
.kb-incoming-k.f svg{width:23px;height:23px}
.kb-incoming-k.w{flex:1.38 1 0}
.kb-incoming-g{flex:.18 1 0}
.kb-incoming-hp{flex:.5 1 0}
.kb-incoming-k.n{flex:1.25 1 0;font-size:17px;font-weight:500}
.kb-incoming-k.p{flex:.85 1 0}
.kb-incoming-k.sp{flex:4.4 1 0;font-size:16px;gap:10px}
.kb-incoming-k.sp i{font-style:normal;color:var(--kb-sec);font-size:18px}
.kb-incoming-k.rt{flex:1.55 1 0;background:var(--kb-acc);color:var(--kb-onacc);box-shadow:none}
.kb-incoming-k.rt svg{width:25px;height:25px}
/* нажатая клавиша: увеличенная буква над ней */
.kb-incoming-k.pr{background:transparent;box-shadow:none;color:transparent}
.kb-incoming-pop{position:absolute;left:-7px;right:-7px;bottom:0;height:108px;border-radius:12px 12px 9px 9px;background:var(--kb-key);box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);color:var(--kb-tx);display:flex;justify-content:center;padding-top:10px;font:400 36px/1 Inter,sans-serif;z-index:2;clip-path:polygon(0 0,100% 0,100% 52%,calc(100% - 7px) 60%,calc(100% - 7px) 100%,7px 100%,7px 60%,0 52%)}
.kb-incoming-home{height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.kb-incoming-home i{width:140px;height:5px;border-radius:3px;background:var(--kb-tx)}
/* ===== добавлено для kb-incoming: состояния полосы ===== */
.scr.light{--kb-err:#C42B1F;--kb-rec:#C42B1F;--kb-track:#E3E7EB}
.scr:not(.light){--kb-err:#FF8A80;--kb-rec:#FF6B5E;--kb-track:#4A525D}
.kb-incoming-strip>svg.ok{color:var(--kb-acc)}
.kb-incoming-strip>svg.er{color:var(--kb-err)}
.kb-incoming-strip>svg.nt{color:var(--kb-tx)}
.kb-incoming-strip.st{padding-right:8px}
.kb-incoming-strip.pg{padding-bottom:8px}
.kb-incoming-strip.pg .tx{padding-left:4px}
.kb-incoming-a.s .un{width:20px;height:20px}
.kb-incoming-a.q{flex:none;background:transparent;color:var(--kb-tx);padding:0 12px}
.kb-incoming-a.p.n{flex:none}
.kb-incoming-a.p.n svg{width:20px;height:20px}
.kb-incoming-prog{position:absolute;left:12px;right:12px;bottom:6px;height:3px;border-radius:2px;background:var(--kb-track);overflow:hidden}
.kb-incoming-prog i{position:absolute;top:0;bottom:0;left:22%;width:38%;border-radius:2px;background:var(--kb-acc);animation:kb-incoming-run 1.4s ease-in-out infinite}
@keyframes kb-incoming-run{0%{left:22%}45%{left:100%}45.01%{left:-40%}100%{left:22%}}
/* иконка панели: активна / занята / недоступна */
.kb-incoming-ib.on{background:var(--kb-acc);color:var(--kb-onacc)}
.kb-incoming-ib.off{opacity:.36}
.kb-incoming-spin{animation:kb-incoming-rot 1s linear infinite;transform-origin:12px 12px}
@keyframes kb-incoming-rot{to{transform:rotate(360deg)}}
/* диктовка: полоса «Идёт запись» */
.kb-incoming-strip.rec{padding:0 8px 0 4px;gap:8px}
.kb-incoming-rx{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-incoming-rx span{width:34px;height:34px;border-radius:50%;background:var(--kb-key2);display:flex;align-items:center;justify-content:center}
.kb-incoming-rx svg{width:18px;height:18px}
.kb-incoming-rdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--kb-rec)}
.kb-incoming-rl{flex:none;font:600 15px/20px Inter,sans-serif;white-space:nowrap}
.kb-incoming-rt{flex:none;font:500 15px/20px Inter,sans-serif;color:var(--kb-sec);font-variant-numeric:tabular-nums}
.kb-incoming-wv{flex:1;min-width:0;height:30px;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.kb-incoming-wv i{flex:none;width:3px;border-radius:2px;background:var(--kb-acc)}
/* диктовка: чип «Вставить» вместо панели иконок */
.kb-incoming-insr{height:48px;display:flex;align-items:center;padding:0 5px;margin-top:4px}
.kb-incoming-ins{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;font:400 14px/18px Inter,sans-serif;color:var(--kb-tx)}
.kb-incoming-ins>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-incoming-ins .t{flex:1;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.kb-incoming-ins .t b{font-weight:700}
.kb-incoming-ins small{flex:none;font:700 12px/18px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor;color:var(--kb-sec)}
@media (prefers-reduced-motion:reduce){.kb-incoming-spin,.kb-incoming-prog i{animation:none}}
/* ===== добавлено для kb-incoming ===== */
.scr.light{--kb-sel:#C2E6D6;--kb-selh:#00875C;--kb-mk:#C8EBDB}
.scr:not(.light){--kb-sel:#265C50;--kb-selh:#2BC48A;--kb-mk:#24604A}
/* пересланное сообщение и выделение текста в нём */
.kb-incoming-fw{display:flex;align-items:center;gap:4px;font:500 13px/18px Inter,sans-serif;color:var(--sec);margin-bottom:10px}
.kb-incoming-fw svg{width:15px;height:15px;flex:none}
.kb-incoming-hl{background:var(--kb-sel);border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 0}
.kb-incoming-h{display:inline-block;position:relative;width:2px;height:22px;vertical-align:-5px;background:var(--kb-selh);margin:0 1px 0 -1px}
.kb-incoming-h.e{margin:0 -1px 0 1px}
.kb-incoming-h::after{content:'';position:absolute;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--kb-selh)}
.kb-incoming-h.s::after{top:-9px}
.kb-incoming-h.e::after{bottom:-9px}
.kb-incoming-scr .m .kb-incoming-hl~.tm{margin-top:10px}
/* голосовое в переписке */
.kb-incoming-scr .m.kb-incoming-vb{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;width:262px}
.kb-incoming-vb .pl{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FFFFFF;color:#00875C}
.scr.light .kb-incoming-vb .pl{background:#00875C;color:#FFFFFF}
.kb-incoming-vb .pl svg{width:18px;height:18px}
.kb-incoming-vb .w{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:28px;overflow:hidden}
.kb-incoming-vb .w i{flex:none;width:3px;border-radius:2px;background:currentColor;opacity:.85}
.kb-incoming-vb .r{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.kb-incoming-vb .d{font:600 14px/18px Inter,sans-serif;font-variant-numeric:tabular-nums}
.kb-incoming-vb .tm{margin-top:0}
/* полоса «Скопирован текст» */
.kb-incoming-strip.st .kb-incoming-a.p.n{padding:0 14px}
.kb-incoming-a.p small{color:inherit}
/* карточка на месте полосы и панели: 112 + 8 = 120, раскладка не двигается */
.kb-incoming-card{margin:8px 5px 0;height:112px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);padding:0 6px 4px 14px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.kb-incoming-ch{flex:none;height:48px;display:flex;align-items:center;gap:8px}
.kb-incoming-ch>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-incoming-ch .lb{flex:1;min-width:0;font:600 14px/19px Inter,sans-serif;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-incoming-ch .kb-incoming-a.q{padding:0 12px}
.kb-incoming-ch .kb-incoming-a svg{width:20px;height:20px}
.kb-incoming-cb{flex:none;padding-right:10px;font:500 16px/22px Inter,sans-serif;color:var(--kb-tx);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:44px}
.kb-incoming-cb .k{color:var(--kb-sec);font-weight:600}
.kb-incoming-mk{color:inherit;background:var(--kb-mk);border-radius:5px;padding:0 3px;font-weight:700;white-space:nowrap;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ===== экран Parrlo Translate (только тёмный): голосовое на языке собеседника ===== */
.kb-incoming-tv{--me:#2BC48A;--es:#BFF2DC}
.kb-incoming-ttop{flex:none;height:64px;display:flex;align-items:center;gap:8px;padding:0 16px}
.kb-incoming-tb{flex:none;width:48px;height:48px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.kb-incoming-tb svg{width:24px;height:24px}
.kb-incoming-tt{flex:1;min-width:0;text-align:center;font:900 20px/24px Nunito,sans-serif}
.kb-incoming-tsp{flex:none;width:48px}
.kb-incoming-tm{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 16px 8px}
.kb-incoming-vc{background:var(--deep);color:#FFFFFF;border-radius:28px 28px 8px 28px;padding:20px 20px 20px}
.kb-incoming-vl{display:flex;align-items:center;gap:8px;font:600 13px/16px Inter,sans-serif;letter-spacing:.02em;margin-bottom:14px}
.kb-incoming-vl svg{width:18px;height:18px;flex:none}
.kb-incoming-vo{display:block;font:400 15px/21px Inter,sans-serif;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.28)}
.kb-incoming-vo small{display:block;font:600 12px/16px Inter,sans-serif;letter-spacing:.03em;margin-bottom:4px}
.kb-incoming-vt{display:block;font:900 26px/32px Nunito,sans-serif}
.kb-incoming-vp{display:flex;align-items:center;gap:12px;margin-top:20px;height:36px}
.kb-incoming-vp .w{flex:1;min-width:0;display:flex;align-items:center;gap:3px;height:36px;overflow:hidden}
.kb-incoming-vp .w i{flex:none;width:3px;border-radius:2px;background:#FFFFFF}
.kb-incoming-vp .d{flex:none;font:600 15px/20px Inter,sans-serif;font-variant-numeric:tabular-nums}
.kb-incoming-vr{display:flex;align-items:center;gap:12px;min-height:72px;background:var(--sf);border-radius:24px;padding:4px 8px 4px 20px;box-shadow:inset 0 0 0 1px var(--line)}
.kb-incoming-vr>div{flex:1;min-width:0}
.kb-incoming-vr b{display:block;font:600 16px/22px Inter,sans-serif}
.kb-incoming-vr small{display:block;font:400 14px/19px Inter,sans-serif;color:var(--sec)}
.kb-incoming-val{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px 0 12px;font:600 15px Inter,sans-serif;color:var(--tx)}
.kb-incoming-val svg{width:18px;height:18px;color:var(--sec)}
.kb-incoming-tbot{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px 16px 4px}
.kb-incoming-hint{height:20px;display:flex;align-items:center;justify-content:center;font:500 14px/20px Inter,sans-serif;color:var(--sec);white-space:nowrap}
.kb-incoming-btns{display:flex;gap:12px}
.kb-incoming-pb{flex:1 1 0;min-width:0;height:80px;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:10px;font:900 21px/24px Nunito,sans-serif;white-space:nowrap}
.kb-incoming-pb svg{flex:none;width:24px;height:24px}
.kb-incoming-pb.s{background:var(--sf2);color:var(--tx)}
.kb-incoming-pb.p{background:var(--me);color:#0E1116}
.kb-incoming-ch .ok{flex:none;display:flex;color:var(--kb-acc)}
.kb-incoming-ch .ok svg{width:22px;height:22px}
.kb-incoming-ch .lb.t{color:var(--kb-tx)}
</style>
</head>
<body>
<div class="kb-incoming-w">
<div class="kb-incoming-top"><div class="kb-incoming-tags"><span class="kb-incoming-tag" id="kb-incoming-t-draft"></span><span class="kb-incoming-tag m" id="kb-incoming-t-mock"></span></div>
<nav class="kb-incoming-lng" id="kb-incoming-lng" aria-label="Language"></nav></div>
<h1 id="kb-incoming-h1"></h1>
<p class="kb-incoming-lead" id="kb-incoming-lead"></p>
<div class="kb-incoming-hero" id="kb-incoming-hero"></div>
<section class="kb-incoming-sec">
<h2 id="kb-incoming-h-st"></h2>
<p id="kb-incoming-p-st"></p>

  '<b>El teclado solo ve lo que copias.</b> No puede leer la conversación ni lo que seleccionas en otra app, y no finge que puede. El camino es honesto: seleccionar → «Copiar» → «Traducir» en la franja. El portapapeles se lee solo al tocar ese botón.',

  '<b>Tarjeta en lugar de la franja y el panel, 112 + 8 pt.</b> Dos líneas necesitan sitio: la tarjeta ocupa la franja y la fila de iconos, y el teclado y el campo no se mueven. El panel vuelve con «Ocultar» o con cualquier tecla.',
  '<b>Números y fechas resaltados</b> con fondo y negrita, no solo con color: conviene revisarlos con tus propios ojos (copy‑ru §7).',
  '<b>«Responder»</b> cierra la tarjeta y pone el cursor en el campo: escribes en español y «Traducir» lo pasa al ruso.',
  '<b>«Quiere decir», en la misma tarjeta</b>: la traducción inversa de lo que hay en el campo, con la fecha resaltada. Continúa el estado «Traducido» de kb-translate: en vez de «Antes: …», «Quiere decir: …», y «Deshacer» en el mismo sitio.',
  '<b>La nota de voz, en Parrlo Translate</b>, como en la versión actual: «Nota de voz» abre la pantalla de voz. Color = lado: la tarjeta es tuya, verde oscuro como tus frases en translate-talk; arriba tu texto y debajo, en grande, el mismo en ruso.',
  '<b>Voz estándar de Parrlo, a elegir entre «Femenina» y «Masculina»</b>: no es «Mi voz» y no se adivina el género.',
  '<b>Se envía con «Compartir»</b>: llega al chat como un audio normal; la otra persona no necesita instalar nada.',
  '<b>Mensaje reenviado.</b> El texto del §7 de copy‑ru es un aviso de la comunidad; lo reenvía la casera para que la conversación sea la misma que en kb-before.'],

  'El encargo pide «Quiere decir» antes de insertar la traducción. Aquí, como en copy‑ru §8 y en kb-translate, la traducción ya está en el campo y «Quiere decir» se ve antes de enviar. Una vista previa antes de insertar sería otro comportamiento de «Traducir».',

  '<b>The keyboard only sees what you copy.</b> It can’t read the conversation or a selection in another app, and doesn’t pretend to. The path is honest: select → Copy → Translate in the strip. The clipboard is read only on that tap.',
  '<b>The field is left alone.</b> An incoming translation is for reading; it isn’t inserted into the field. Any draft stays where it was.',
  '<b>A card in place of the strip and toolbar, 112 + 8 pt.</b> Two lines need room: the card takes the strip and the icon row, while the layout and field stay put. Hide or any keystroke brings the toolbar back.',
  '<b>Numbers and dates are highlighted</b> with a tint and bold, not colour alone: they’re worth checking with your own eyes (copy‑ru §7).',
  '<b>Reply</b> closes the card and puts the cursor in the field: you write in English and Translate turns it into Spanish.',
  '<b>Meaning lives in the same card</b>: a back-translation of what’s in the field, date highlighted. It extends kb-translate’s Translated state: “Meaning: …” replaces “Before: …”, with Undo in the same place.',

 voice:c=>({tv:1}),
 shared:c=>({msgs:[c.base[1],c.base[2],['out','','10:03','voice']],field:`<span class="pl">${c.ph}</span>`,car:'pre',up:1,send:0,
  strip:`<div class="kb-incoming-strip">${I.tr}<span class="tx"><b>${c.hintB}</b><span>${c.hintS}</span></span><span class="kb-incoming-pill" role="button" aria-label="${c.pairA}"><span>${c.pair}${I.chev}</span></span></div>`})
};
const ORDER=['select','incoming','check','voice','shared'];
const HERO='incoming';

/* экран Parrlo Translate: голосовое на языке собеседника */
function tscreen(c){
 return `<div class="scr kb-incoming-tv" lang="${c.html}">
<div class="sbar"><span>9:41</span><span class="sig"><i class="wf"></i><i></i></span></div>
<div class="kb-incoming-ttop"><span class="kb-incoming-tb" role="button" aria-label="${c.vBack}">${I.backT}</span><span class="kb-incoming-tt">${c.vTitle}</span><span class="kb-incoming-tsp"></span></div>
<div class="kb-incoming-tm">
 <div class="kb-incoming-vc"><div class="kb-incoming-vl">${I.voice}${c.vLabel}</div>
  <span class="kb-incoming-vo"><small>${c.vYou}</small>${c.vSrc}</span>
  <span class="kb-incoming-vt" lang="${c.them}">${c.vOut}</span>
  <div class="kb-incoming-vp" aria-hidden="true"><span class="w">${VW.map(h=>`<i style="height:${h}px"></i>`).join('')}</span><span class="d">${c.vDur}</span></div></div>
 <div class="kb-incoming-vr"><div><b>${c.vVoice}</b><small>${c.vVoiceS}</small></div><span class="kb-incoming-val" role="button" aria-label="${c.vValA}">${c.vVal}${I.chevD}</span></div>
</div>
<div class="kb-incoming-tbot"><div class="kb-incoming-hint">${c.vHint}</div>
 <div class="kb-incoming-btns"><span class="kb-incoming-pb s" role="button">${I.play}${c.listen}</span><span class="kb-incoming-pb p" role="button">${I.share}${c.share}</span></div></div>
<div class="homebar"><i></i></div></div>`;}

function screen(id,light,c){
 const s=S[id](c);
 if(s.tv)return tscreen(c);
 const f=s.car==='pre'?car+s.field:s.field+car;
 const bar=s.card?'':`<div class="kb-incoming-bar">${BAR.map(([n,ic])=>`<span class="kb-incoming-ib" role="button" aria-label="${c[n]}">${ic()}</span>`).join('')}</div>`;
 return `<div class="scr kb-incoming-scr ${light?'light':''}" lang="${c.html}">
<div class="sbar"><span>9:41</span><span class="sig"><i class="wf"></i><i></i></span></div>
<div class="nav"><span class="bk">${I.back}</span><span class="av">${c.av}</span><span class="nm"><b>${c.who}</b><span>${c.online}</span></span></div>
<div class="msgs"><div class="day">${c.today}</div>${s.msgs.map(m=>msg(m,c)).join('')}</div>
<div class="inp"><span class="f"><span${s.flang?` lang="${s.flang}"`:''}>${f}</span></span><span class="sd${s.send?'':' off'}">${I.send}</span></div>
<div class="kb-incoming-kb">
${s.card||s.strip}
${bar}
<div class="kb-incoming-rows">${keys(c,s.up)}</div>
<div class="kb-incoming-home"><i></i></div></div></div>`;}
const ph=(id,l,sc,c)=>`<div class="pf p67 ${l?'light':''}" style="--s:${sc}"><div class="shell"></div><div class="glass">${screen(id,l,c)}</div></div>`;

function render(L){
 const c=D[L];
 document.documentElement.lang=c.html;document.title=c.title;
 const $=id=>document.getElementById(id);
 $('kb-incoming-lng').innerHTML=['ru','es','en'].map(x=>`<a href="?l=${x}" data-l="${x}" aria-current="${x===L}" lang="${x}">${x.toUpperCase()}</a>`).join('');
 $('kb-incoming-t-draft').textContent=c.t_draft;$('kb-incoming-t-mock').textContent=c.t_mock;
 $('kb-incoming-h1').textContent=c.h1;$('kb-incoming-lead').textContent=c.lead;
 $('kb-incoming-h-st').textContent=c.hSt;$('kb-incoming-p-st').textContent=c.pSt;
 $('kb-incoming-hero').innerHTML=
 `<figure data-shot="kb-incoming--light--${L}">${ph(HERO,1,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capL[0]}</b><span>${c.capL[1]}</span></div></div></figure>
<figure data-shot="kb-incoming--dark--${L}">${ph(HERO,0,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capD[0]}</b><span>${c.capD[1]}</span></div></div></figure>`;
 $('kb-incoming-grid').innerHTML=ORDER.map(id=>
 `<article class="kb-incoming-st"><h3>${c.st[id][0]}<code>${id}</code></h3><p>${c.st[id][1]}</p>`+(S[id](c).tv?
 `<div class="kb-incoming-pair"><figure data-shot="kb-incoming--${id}--dark--${L}">${ph(id,0,.6,c)}<div class="pcap"><div><b>${c.tvOnly}</b></div></div></figure></div></article>`:
 `<div class="kb-incoming-pair">
<figure data-shot="kb-incoming--${id}--light--${L}">${ph(id,1,.6,c)}<div class="pcap"><div><b>${c.light}</b></div></div></figure>
<figure data-shot="kb-incoming--${id}--dark--${L}">${ph(id,0,.6,c)}<div class="pcap"><div><b>${c.dark}</b></div></div></figure></div></article>`)).join('');
 const cs=t=>PAIRS[t].map(([k,a,b])=>`${PL[L][k]} ${fmt(cr(a,b),L)}`).join('; ');
 const tok=TOK[L].map(x=>x.replace('CONTRAST_L',cs('L')).replace('CONTRAST_D',cs('D')).replace('CONTRAST_V',cs('V')));
 $('kb-incoming-notes').innerHTML=`<div><h2>${c.hDec}</h2><ul>${c.dec.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hTok}</h2><ul>${tok.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hNo}</h2><ul>${c.no.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 document.body.dataset.lang=L;
}
let L0=new URLSearchParams(location.search).get('l');if(!D[L0])L0='ru';
render(L0);
document.getElementById('kb-incoming-lng').addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(!a)return;e.preventDefault();const l=a.dataset.l;try{history.replaceState(null,'','?l='+l)}catch(_){}render(l);});
window.KB_INCOMING_RENDER=render;
document.body.dataset.ready='1';
</script>
</body>
</html>
