/* подпись внизу входящего */

/* исходящее: подпись «через WhatsApp» и что ушло */

.chat-whatsapp-chip svg{width:16px;height:16px}

.chat-whatsapp-pb svg{width:20px;height:20px;color:var(--mint);flex:none}

.chat-whatsapp-rdy .h{display:flex;align-items:center;gap:8px;min-height:40px;font:600 13px/18px Inter;color:var(--sec)}
.chat-whatsapp-rdy .h svg{width:16px;height:16px;color:var(--mint);flex:none}

function chatIcon(){var n='chat-whatsapp-ic'+(icN++);return '<svg viewBox="0 0 1024 1024" aria-label="Parrlo"><defs><linearGradient id="'+n+'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2F36"/><stop offset="1" stop-color="#1C2026"/></linearGradient><clipPath id="'+n+'c"><rect width="1024" height="1024" rx="228"/></clipPath></defs><g clip-path="url(#'+n+'c)"><rect width="1024" height="1024" fill="url(#'+n+'b)"/><g transform="translate(-10 -40)"><g fill="#fff"><path d="M345 800 L 235 925 L 420 895 Z" stroke="#fff" stroke-width="70" stroke-linejoin="round"/><circle cx="500" cy="640" r="245"/><circle cx="560" cy="395" r="235"/></g><ellipse cx="430" cy="690" rx="165" ry="115" transform="rotate(-28 430 690)" fill="#C9EFDD"/><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z" fill="#FFC247"/><circle cx="612" cy="372" r="44" fill="#0E1116"/><circle cx="627" cy="357" r="14" fill="#fff"/></g><circle cx="662" cy="880" r="34" fill="#fff"/><circle cx="750" cy="880" r="34" fill="#fff"/><circle cx="838" cy="880" r="34" fill="#FFC247"/></g></svg>'}
var MASC='../../brandbook/assets/mascot/mascot-';
var sbar='<div class="sbar"><b>9:41</b><span class="sig"><i class="wf"></i><i></i></span></div>';
var home='<div class="homebar"><i></i></div>';
function scr(inner,extra){return '<div class="scr chat-whatsapp-scr">'+sbar+inner+home+(extra||'')+'</div>'}
function nav(){return '<div class="chat-whatsapp-nav"><span class="chat-whatsapp-ib bk" role="button" aria-label="'+T.aBack+'">'+I.back+'</span><span class="chat-whatsapp-av '+T.ava+'" aria-hidden="true">'+T.ini+'</span><div class="chat-whatsapp-nm"><b>'+T.name+'</b><span>'+I.out+T.sub+'</span></div><span class="chat-whatsapp-ib inf" role="button" aria-label="'+T.aInfo+'">'+I.info+'</span><span class="chat-whatsapp-ib" role="button" aria-label="'+T.aMore+'">'+I.more+'</span></div>'}
var sys='<div class="chat-whatsapp-sys">'+I.info+'<span>'+T.sys+'</span></div>';
/* входящее (вставлено из WhatsApp): перевод — основной текст, оригинал по касанию */
function mi(m,open,cls){
 var og=open?'<div class="chat-whatsapp-og" lang="'+T.rl+'"><span class="k">'+T.ogK+'</span><span class="v">'+m[1]+'</span></div>':'';
 return '<div class="chat-whatsapp-m in '+(open?'wide ':'')+(cls||'')+'"><div class="chat-whatsapp-src">'+I.paste+T.src+'</div><span lang="'+T.ul+'">'+m[2]+'</span>'+og+
  '<div class="chat-whatsapp-ft"><span class="chat-whatsapp-tg" role="button" aria-expanded="'+(open?'true':'false')+'">'+I.tr+(open?T.hide+I.cu:T.trFrom+I.cd)+'</span><span class="chat-whatsapp-tm">'+m[3]+'</span></div></div>'}
/* исходящее: копия того, что ушло через WhatsApp */
function mo(m,open,cls){
 var s=open?'<div class="chat-whatsapp-sent" lang="'+T.rl+'"><span class="k">'+I.tr+T.wentK+'</span><span class="v">'+m[2]+'</span></div>':'';
 return '<div class="chat-whatsapp-m out '+(open?'wide ':'')+(cls||'')+'"><span>'+m[1]+'</span>'+s+'<div class="chat-whatsapp-of"><span class="via">'+I.out+(open?T.viaFull:T.via)+'</span><span class="dt">· '+m[3]+'</span></div></div>'}
function msg(i,open,cls){var m=T.th[i];return m[0]==='in'?mi(m,open,cls):mo(m,open,cls)}
function cmpEmpty(paste){return '<div class="chat-whatsapp-cmp">'+(paste?'<div class="chat-whatsapp-paste"><span class="chat-whatsapp-pb" role="button" aria-label="'+T.aPaste+'">'+I.paste+T.paste+'</span></div>':'')+'<div class="chat-whatsapp-row"><span class="chat-whatsapp-pls" role="button" aria-label="'+T.aPlus+'">'+I.plus+'</span><span class="chat-whatsapp-f"><span class="pl">'+T.ph+'</span></span><span class="chat-whatsapp-go" role="button" aria-label="'+T.aMic+'">'+I.mic+'</span></div></div>'}
function cmpTyped(){var m=T.th[3];return '<div class="chat-whatsapp-cmp"><div class="chat-whatsapp-pv"><div class="h">'+I.tr+'<span class="lb">'+T.pvL+'</span><span class="chat-whatsapp-chip" role="button" aria-label="'+T.aInfo+'"><span>'+I.out+T.via+I.chev+'</span></span></div><p lang="'+T.rl+'">'+m[2]+'</p></div>'+
 '<div class="chat-whatsapp-row"><span class="chat-whatsapp-pls" role="button" aria-label="'+T.aPlus+'">'+I.plus+'</span><span class="chat-whatsapp-f"><span>'+m[1]+'<i class="car"></i></span></span><span class="chat-whatsapp-go" role="button" aria-label="'+T.aSend+'">'+I.send+'</span></div></div>'}
function toast(t){return '<div class="chat-whatsapp-toast" role="status"><i>'+I.check+'</i>'+t+'</div>'}

var S={};
S.compose=function(){return scr(nav()+'<div class="chat-whatsapp-msgs">'+sys+msg(0)+msg(1)+msg(2,0,'gap')+'</div>'+cmpTyped())};
S['send-via']=function(){var m=T.th[3];
 return scr(nav()+'<div class="chat-whatsapp-msgs" style="padding-bottom:508px">'+sys+msg(0)+msg(1)+'</div>'+cmpEmpty(),
 '<div class="chat-whatsapp-dim"></div>'+
 '<div class="chat-whatsapp-rdy" style="bottom:386px"><div class="h">'+I.tr+'<span>'+T.rdyL+' · '+T.pvL+'</span></div><p lang="'+T.rl+'">'+m[2]+'</p><p class="o">'+T.rdyO2+'</p><div class="chat-whatsapp-btn pr" role="button">'+I.out+T.btn+'</div></div>'+
 '<div class="chat-whatsapp-ss" role="dialog"><i class="chat-whatsapp-grab"></i>'+
 '<div class="chat-whatsapp-ssh">'+chatIcon()+'<div><b lang="'+T.rl+'">'+m[2]+'</b><span>'+T.ssS+'</span></div><span class="chat-whatsapp-x" role="button" aria-label="'+T.aClose+'">'+I.x+'</span></div>'+
 '<div class="chat-whatsapp-apps"><span class="chat-whatsapp-app on" role="button"><i></i><b>WhatsApp</b><u class="chat-whatsapp-tap"></u></span><span class="chat-whatsapp-app"><i></i><em></em></span><span class="chat-whatsapp-app"><i></i><em></em></span><span class="chat-whatsapp-app"><i></i><em></em></span><span class="chat-whatsapp-app"><i></i><em></em></span></div>'+
 '<div class="chat-whatsapp-grp"><div class="chat-whatsapp-gr">'+T.ssActs[0]+I.copy+'</div><div class="chat-whatsapp-gr">'+T.ssActs[1]+I.save+'</div></div>'+home+'</div>')};
S['copy-kept']=function(){return scr(nav()+'<div class="chat-whatsapp-msgs">'+msg(0)+msg(1)+msg(2,0,'gap')+msg(3,1,'gap hl')+'</div>'+cmpEmpty(1),toast(T.toastKept))};
S['reply-paste']=function(){return scr(nav()+'<div class="chat-whatsapp-msgs">'+msg(1)+msg(2,0,'gap')+msg(3,0,'gap')+msg(4,1,'gap hl')+'</div>'+cmpEmpty(),toast(T.toastPaste))};
S.how=function(){
 var st=T.steps.map(function(s,i){return '<div class="chat-whatsapp-st"><span class="n">'+[I.pen,I.out,I.paste][i]+'</span><div><p class="num">'+(i+1)+'</p><b>'+s[0]+'</b><span>'+s[1]+'</span></div></div>'}).join('');
 return scr(nav()+'<div class="chat-whatsapp-msgs">'+msg(1)+msg(2,0,'gap')+msg(3,0,'gap')+'</div>'+cmpEmpty(),
 '<div class="chat-whatsapp-dim"></div><div class="chat-whatsapp-sh" role="dialog" aria-label="'+T.shT+'"><div class="chat-whatsapp-grab" style="margin:0 auto 12px"></div>'+
 '<div class="chat-whatsapp-shh"><img src="'+MASC+'think-dark.svg" alt=""><div><h4>'+T.shT+'</h4><p>'+T.shS+'</p></div><span class="chat-whatsapp-shx" role="button" aria-label="'+T.aClose+'"><i>'+I.x+'</i></span></div>'+
 '<div class="chat-whatsapp-steps">'+st+'</div>'+
 '<div class="chat-whatsapp-cta" role="button">'+T.done+'</div><div class="chat-whatsapp-alt" role="button">'+I.user+T.alt+'</div><div style="height:38px"></div></div>')};
window.CHAT_WHATSAPP_S=S;

/* ===== страница ===== */
document.documentElement.lang=T.htmlLang;document.title=T.docTitle;
function $(id){return document.getElementById('chat-whatsapp-'+id)}
$('lng').innerHTML=['ru','es','en'].map(function(k){return '<a href="?l='+k+'" hreflang="'+k+'" class="'+(k===l?'on':'')+'"'+(k===l?' aria-current="true"':'')+'>'+k.toUpperCase()+'</a>'}).join('');
$('eb').textContent=T.eb;$('h1').textContent=T.h1;$('intro').textContent=T.intro;
$('capb').textContent=T.capB;$('caps').textContent=T.capS;
$('what').innerHTML=T.what.map(function(x){return '<li>'+x+'</li>'}).join('');
$('sth').textContent=T.stH;$('stl').innerHTML=T.stL;
var order=['compose','send-via','copy-kept','reply-paste','how'];window.CHAT_WHATSAPP_ORDER=order;
$('grid').innerHTML=order.map(function(k){return '<div class="chat-whatsapp-card"><div class="pf p67" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+T.st[k][0]+' <code>'+k+'</code></h3><p>'+T.st[k][1]+'</p></div>'}).join('');
document.querySelectorAll('.pf[data-state]').forEach(function(p){p.querySelector('.glass').innerHTML=S[p.dataset.state]()});
$('moreh').textContent=T.moreH;$('dech').textContent=T.decH;$('tokh').textContent=T.tokH;$('nah').textContent=T.naH;
$('dec').innerHTML=T.dec.map(function(x){return '<li>'+x+'</li>'}).join('');
$('tok').innerHTML=T.tok.map(function(x){return '<li>'+x+'</li>'}).join('');
$('na').innerHTML=T.na.map(function(x){return '<li>'+x+'</li>'}).join('');

function Lu(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#242B34'],['#BFF2DC','#242B34'],['#BFF2DC','#1E3734'],['#9AA4B2','#242B34'],['#FFFFFF','#00875C'],['#FFFFFF','#006E4B'],['#9AA4B2','#0E1116'],['#9AA4B2','#1C2026'],['#0E1116','#2BC48A']];
$('ct').innerHTML=pairs.map(function(r,i){return '<tr><td><span class="chat-whatsapp-sw" style="background:'+r[0]+'"></span><span class="chat-whatsapp-sw" style="background:'+r[1]+'"></span>'+T.ct[i]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_WHATSAPP_MIN=Math.min.apply(null,pairs.map(function(r){return cr(r[0],r[1])}));
})();
