<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Translate · разговор</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0E12;color:#F2F5F7}
body{font:400 16px/1.5 Inter,system-ui,sans-serif;padding:32px 16px 80px}
.translate-talk-w{max-width:1200px;margin:0 auto}
.translate-talk-lsw{display:flex;gap:4px;justify-content:flex-end;margin-bottom:24px}
.translate-talk-lsw a{min-width:48px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;font:700 14px/1 Inter,sans-serif;color:#C3CBD5;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.translate-talk-lsw a[aria-current="true"]{background:#2BC48A;color:#0E1116;box-shadow:none}
.translate-talk-w h1{font:900 40px/1.1 Nunito,sans-serif;margin-bottom:12px}
.translate-talk-w h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.translate-talk-lead{color:#9AA4B2;max-width:820px}
.translate-talk-tag{display:inline-block;margin-bottom:12px;font:600 13px/1 Inter,sans-serif;color:#0E1116;background:#BFF2DC;border-radius:8px;padding:6px 10px}
.translate-talk-hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;margin-top:40px;padding:48px 40px;border-radius:32px;background:#12161C;box-shadow:inset 0 0 0 1px #2F3742}
.translate-talk-hero figure{margin:0}
.translate-talk-hero-t{flex:1 1 320px;max-width:520px}
.translate-talk-hero-t h3{font:900 24px/1.25 Nunito,sans-serif;margin-bottom:12px}
.translate-talk-hero-t p{color:#C3CBD5;margin-bottom:12px}
.translate-talk-w ul{padding-left:20px;color:#C3CBD5;font-size:15px;max-width:860px}
.translate-talk-w li{margin:8px 0}
.translate-talk-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7}
.translate-talk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:48px 24px;margin-top:32px}
.translate-talk-grid figure{margin:0;display:flex;flex-direction:column;align-items:center}
.translate-talk-grid figcaption{margin-top:16px;width:272px;font-size:14px;line-height:1.45;color:#9AA4B2}
.translate-talk-grid figcaption b{display:block;color:#F2F5F7;font:900 17px/1.3 Nunito,sans-serif;margin-bottom:4px}
.translate-talk-grid figcaption code{font-size:12px}
.translate-talk-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.translate-talk-tbl th,.translate-talk-tbl td{text-align:left;vertical-align:top;border-bottom:1px solid #2F3742;padding:10px 12px 10px 0}
.translate-talk-tbl th{color:#9AA4B2;font-weight:600}
.translate-talk-tw{overflow-x:auto}
.translate-talk-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px #3A414B}
@media (max-width:760px){.translate-talk-w h1{font-size:30px}.translate-talk-hero{padding:24px 12px;gap:24px;justify-content:center}.translate-talk-hero .pf{--s:.74!important}}
@media (max-width:420px){.translate-talk-hero .pf{--s:.7!important}}

/* ===== экран 430×932 — каркас как у translate-clear / translate-word ===== */
.translate-talk-scr{--me:#2BC48A;--es:#BFF2DC;--err:#FF6B5E}
.translate-talk-top{flex:none;height:64px;display:flex;align-items:center;gap:8px;padding:0 16px}
.translate-talk-cb{width:48px;height:48px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.translate-talk-pair{flex:1;min-width:0;display:flex;justify-content:center}
.translate-talk-pair>span{height:48px;border-radius:24px;background:var(--sf2);display:inline-flex;align-items:center;gap:8px;padding:0 16px;font:900 19px/1 Nunito,sans-serif;letter-spacing:.02em}
.translate-talk-swp{color:var(--sec);display:flex}
.translate-talk-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--me)}
.translate-talk-dot.translate-talk-p{background:var(--es)}
.translate-talk-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px;position:relative}
.translate-talk-bot{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px 16px 4px}
.translate-talk-hint{height:20px;display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px Inter,sans-serif;color:var(--sec);text-align:center;white-space:nowrap}
.translate-talk-hint svg{width:16px;height:16px;flex:none}
.translate-talk-btns{display:flex;gap:12px}
.translate-talk-pb{flex:1;min-width:0;height:80px;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:10px;color:#0E1116}
.translate-talk-pb svg{flex:none;width:26px;height:26px}
.translate-talk-pb b{display:block;font:900 21px/24px Nunito,sans-serif;white-space:nowrap}
.translate-talk-pb small{display:block;font:600 13px/1.3 Inter,sans-serif;margin-top:2px}
.translate-talk-pb.translate-talk-me{background:var(--me)}
.translate-talk-pb.translate-talk-pt{background:var(--es)}
.translate-talk-pb.translate-talk-next{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--es),0 0 36px rgba(191,242,220,.28)}
.translate-talk-sec{flex:none;width:136px;height:80px;border-radius:40px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px Inter,sans-serif}
.translate-talk-sec svg{width:20px;height:20px;flex:none}
.translate-talk-stop{flex:1;min-width:0;height:80px;border-radius:40px;background:#F2F5F7;color:#0E1116;display:flex;align-items:center;justify-content:center;gap:12px;font:900 24px Nunito,sans-serif;white-space:nowrap}
.translate-talk-stop i{width:20px;height:20px;border-radius:5px;background:#E0483B;flex:none}
.translate-talk-lbl{flex:none;height:20px;display:flex;align-items:center;gap:8px;font:600 13px/16px Inter,sans-serif;color:var(--sec);letter-spacing:.02em;white-space:nowrap}
.translate-talk-lbl .translate-talk-sp{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--tx);font:600 15px/20px Inter,sans-serif;font-variant-numeric:tabular-nums}
.translate-talk-lbl .translate-talk-sp i{width:10px;height:10px;border-radius:50%;background:var(--err);box-shadow:0 0 0 4px rgba(255,107,94,.22)}

/* idle — T‑01 */
.translate-talk-idle{align-items:center;text-align:center;justify-content:center;padding-bottom:8px}
.translate-talk-idle img{width:120px;height:120px;margin-bottom:12px}
.translate-talk-idle h3{font:900 32px/38px Nunito,sans-serif;margin-bottom:8px}
.translate-talk-idle>p{font:400 17px/25px Inter,sans-serif;color:var(--sec);max-width:360px;margin-bottom:28px}
.translate-talk-set{align-self:stretch;background:var(--sf);border-radius:24px;padding:4px 16px 4px 20px;text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.translate-talk-row{display:flex;align-items:center;gap:12px;min-height:72px}
.translate-talk-row+.translate-talk-row{border-top:1px solid var(--line)}
.translate-talk-row>div{flex:1;min-width:0}
.translate-talk-row b{display:block;font:600 16px/22px Inter,sans-serif}
.translate-talk-row small{display:block;text-wrap:balance;font:400 14px/19px Inter,sans-serif;color:var(--sec)}
.translate-talk-row .translate-talk-val{flex:none;display:flex;align-items:center;gap:6px;height:44px;font:600 15px Inter,sans-serif;color:var(--tx)}
.translate-talk-row .translate-talk-val svg{width:18px;height:18px;color:var(--sec)}
.translate-talk-seg{flex:none;display:flex;background:var(--bg);border-radius:24px;padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
.translate-talk-seg span{min-width:56px;height:44px;border-radius:22px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 15px Inter,sans-serif;color:var(--sec)}
.translate-talk-seg span.translate-talk-sel{background:var(--es);color:#0E1116}
.translate-talk-seg span svg{width:16px;height:16px}

/* запись: блоки как в translate-clear */
.translate-talk-rec{gap:12px}
.translate-talk-slot{position:relative;border-radius:28px;padding:20px 20px 0;display:flex;flex-direction:column;overflow:hidden}
.translate-talk-a{flex:1;min-height:0;background:var(--sf);box-shadow:inset 0 0 0 2px var(--me)}
.translate-talk-a.translate-talk-ap{box-shadow:inset 0 0 0 2px var(--es)}
.translate-talk-c{flex:none;height:176px;background:transparent;border:1.5px dashed #3A414B;padding:20px 24px 0}
.translate-talk-ask{flex:none;display:flex;gap:10px;align-items:flex-start;background:#243A33;color:var(--es);border-radius:20px;padding:14px 16px;font:600 17px/24px Inter,sans-serif}
.translate-talk-ask svg{width:22px;height:22px;flex:none;margin-top:1px}
.translate-talk-live{margin-top:16px;font:500 26px/35px Inter,sans-serif;color:var(--tx)}
.translate-talk-car{display:inline-block;width:2px;height:28px;background:var(--me);vertical-align:-5px;margin-left:3px;border-radius:1px}
.translate-talk-ap .translate-talk-car{background:var(--es)}
.translate-talk-wave{position:absolute;left:20px;right:20px;bottom:24px;height:120px;display:flex;align-items:center;gap:4px}
.translate-talk-wave i{width:4px;border-radius:2px;background:var(--me);flex:none}
.translate-talk-ap .translate-talk-wave i{background:var(--es)}
.translate-talk-wave i.translate-talk-z{background:#3A414B!important;height:4px!important}
.translate-talk-empty{margin-top:12px;font:400 17px/25px Inter,sans-serif;color:var(--sec);max-width:340px}
.translate-talk-sk{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.translate-talk-sk i{display:block;height:16px;border-radius:8px;background:#1C2026}

/* разговор — T‑03 */
.translate-talk-conv{padding:0}
.translate-talk-gchip{flex:none;align-self:center;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 6px;border-radius:22px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);font:600 14px/18px Inter,sans-serif;white-space:nowrap;margin-bottom:4px}
.translate-talk-gchip .translate-talk-av{width:32px;height:32px;border-radius:50%;background:var(--es);color:#0E1116;display:flex;align-items:center;justify-content:center}
.translate-talk-gchip .translate-talk-av svg{width:18px;height:18px}
.translate-talk-gchip span{color:var(--sec);font-weight:500}
.translate-talk-gchip>svg{width:16px;height:16px;color:var(--sec)}
.translate-talk-feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:0 16px 4px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 56px);mask-image:linear-gradient(transparent 0,#000 56px)}
.translate-talk-bb{flex:none;max-width:88%;border-radius:24px;padding:12px 18px 14px;position:relative}
.translate-talk-bb .translate-talk-o{display:block;font:400 14px/19px Inter,sans-serif;padding-bottom:8px;margin-bottom:8px}
.translate-talk-bb .translate-talk-t{display:block;font:600 18px/25px Inter,sans-serif}
.translate-talk-bb.translate-talk-l{align-self:flex-start;background:var(--es);color:#0E1116;border-bottom-left-radius:8px}
.translate-talk-bb.translate-talk-l .translate-talk-orig{display:flex;align-items:center;gap:6px;margin-top:8px;font:600 13px/16px Inter,sans-serif;color:#2E4A3F}
.translate-talk-bb.translate-talk-l .translate-talk-orig svg{width:14px;height:14px}
.translate-talk-bb.translate-talk-r{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:8px}
.translate-talk-bb.translate-talk-r .translate-talk-o{color:#FFFFFF;border-bottom:1px solid rgba(255,255,255,.24)}
.translate-talk-bb.translate-talk-big{max-width:100%;padding-right:72px}
.translate-talk-bb.translate-talk-big .translate-talk-t{font:900 25px/31px Nunito,sans-serif}
.translate-talk-bb .translate-talk-spk{position:absolute;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:#005E40;display:flex;align-items:center;justify-content:center;color:#fff}
.translate-talk-bb .translate-talk-spk svg{width:22px;height:22px}
.translate-talk-g{text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:5px}
.translate-talk-l .translate-talk-g{text-decoration-color:rgba(14,17,22,.6)}
.translate-talk-r .translate-talk-g{text-decoration-color:rgba(255,255,255,.8)}
.translate-talk-meta{flex:none;font:500 12px/16px Inter,sans-serif;color:var(--sec);margin:2px 8px 8px}
.translate-talk-meta.translate-talk-l{align-self:flex-start}
.translate-talk-meta.translate-talk-r{align-self:flex-end}
/* реплика не переведена: оригинал остаётся, вместо перевода — бейдж ошибки и «Повторить» */
.translate-talk-bb.translate-talk-fail{max-width:100%}
.translate-talk-fail .translate-talk-o{font:400 18px/25px Inter,sans-serif}
.translate-talk-fl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.translate-talk-fl .translate-talk-erb{margin-top:0}
.translate-talk-flt{font:600 15px/20px Inter,sans-serif;color:#fff}
.translate-talk-rt{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:24px;background:#005E40;color:#fff;font:600 16px Inter,sans-serif}
.translate-talk-rt svg{width:20px;height:20px}

/* лицом к лицу */
.translate-talk-fc{padding:4px 12px 0}
.translate-talk-pan{flex:1;min-height:0;background:var(--deep);border-radius:32px;transform:rotate(180deg);display:flex;flex-direction:column;padding:24px;color:#fff}
.translate-talk-pan .translate-talk-lbl{color:#FFFFFF}
.translate-talk-pan p{font:900 38px/46px Nunito,sans-serif;margin-top:16px}
.translate-talk-pan .translate-talk-acts{margin-top:auto;display:flex;gap:12px}
.translate-talk-act{flex:1;min-width:0;height:64px;border-radius:32px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font:600 17px Inter,sans-serif;background:#FFFFFF;color:#0E1116;white-space:nowrap}
.translate-talk-act svg{width:22px;height:22px;flex:none}
.translate-talk-act.translate-talk-pm{background:var(--es);font:900 20px Nunito,sans-serif}
.translate-talk-mid{flex:none;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px Inter,sans-serif;color:var(--sec);white-space:nowrap}
.translate-talk-mid svg{width:18px;height:18px}
.translate-talk-mine{flex:none;padding:0 4px 4px;display:flex;flex-direction:column;gap:16px}
.translate-talk-mine p{font:400 19px/26px Inter,sans-serif;margin-top:6px}
.translate-talk-mine .translate-talk-btns>span{height:64px;border-radius:32px}
.translate-talk-mine .translate-talk-sec{flex:1;width:auto}

/* ошибка */
.translate-talk-er{align-items:center;text-align:center;justify-content:center}
.translate-talk-er img{width:112px;height:112px}
.translate-talk-erb{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:16px;background:#3C2A2E;color:#FF8A7F;font:600 14px Inter,sans-serif;margin-top:8px}
.translate-talk-erb svg{width:16px;height:16px}
.translate-talk-er h3{font:900 30px/36px Nunito,sans-serif;margin-top:16px}
.translate-talk-er>p{font:400 17px/25px Inter,sans-serif;color:var(--sec);margin-top:8px;max-width:340px}
.translate-talk-clip{align-self:stretch;margin-top:28px;background:var(--sf);border-radius:24px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.translate-talk-play{flex:none;width:48px;height:48px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.translate-talk-play svg{width:20px;height:20px}
.translate-talk-cw{flex:1;min-width:0}
.translate-talk-cw b{display:block;font:600 15px/20px Inter,sans-serif}
.translate-talk-mw{display:flex;align-items:center;gap:3px;height:28px;margin-top:4px;overflow:hidden}
.translate-talk-mw i{width:3px;border-radius:2px;background:#5B6472;flex:none}
.translate-talk-dur{font:600 14px Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--sec)}
.translate-talk-v{flex-direction:column}
.translate-talk-pri{height:64px;border-radius:32px;background:var(--me);color:#0E1116;display:flex;align-items:center;justify-content:center;gap:10px;font:900 21px Nunito,sans-serif}
.translate-talk-pri svg{width:22px;height:22px}
.translate-talk-v .translate-talk-sec{width:auto;height:56px;border-radius:28px}
</style>
</head>
<body>
<div class="translate-talk-w">
<nav class="translate-talk-lsw" id="translate-talk-lsw" aria-label="Language"></nav>
<span class="translate-talk-tag" id="translate-talk-tag"></span>
<h1 id="translate-talk-h1"></h1>
<p class="translate-talk-lead" id="translate-talk-lead"></p>

<section class="translate-talk-hero">
 <figure id="translate-talk-hero-ph"></figure>
 <div class="translate-talk-hero-t" id="translate-talk-hero-t"></div>
</section>

<h2 id="translate-talk-h-states"></h2>
<p class="translate-talk-lead" id="translate-talk-states-lead"></p>
<div class="translate-talk-grid" id="translate-talk-grid"></div>

<h2 id="translate-talk-h-dec"></h2>
<ul id="translate-talk-dec"></ul>

<h2 id="translate-talk-h-tok"></h2>
<div class="translate-talk-tw"><table class="translate-talk-tbl" id="translate-talk-ctr"></table></div>
<ul id="translate-talk-tok"></ul>

<h2 id="translate-talk-h-na"></h2>
<ul id="translate-talk-na"></ul>
</div>

<script src="../screens.js"></script>
<script>
(function(){
const P='translate-talk-';
const SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const S=window.SITE_ICONS;
const I={
 mic:S.mic.replace('class="ic"','class="ic" style="width:26px;height:26px"'),
 kbd:S.kbd, more:S.more,
 back:`<svg class="ic" viewBox="0 0 24 24" ${SW}><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>`,
 swap:`<svg viewBox="0 0 24 24" ${SW} style="width:20px;height:20px"><path d="M4 8h14M14.5 4.5L18 8l-3.5 3.5"/><path d="M20 16H6M9.5 12.5L6 16l3.5 3.5"/></svg>`,
 spk:`<svg viewBox="0 0 24 24" ${SW}><path d="M3.5 9.5v5h3.5l4.5 4V5.5L7 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8.2 8.2 0 0 1 0 11.4"/></svg>`,
 rot:`<svg viewBox="0 0 24 24" ${SW}><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M10.5 6h3"/><path d="M3 10.5a8 8 0 0 0 1.7 6.3M2.6 14.6l2 2.4 2.6-1.6"/></svg>`,
 play:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>`,
 retry:`<svg viewBox="0 0 24 24" ${SW}><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>`,
 down:`<svg viewBox="0 0 24 24" ${SW}><path d="M12 5v13M6.5 13L12 18.5 17.5 13"/></svg>`,
 info:`<svg viewBox="0 0 24 24" ${SW}><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5M12 7.8h.01"/></svg>`,

 ok:`<svg viewBox="0 0 24 24" ${SW}><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
 person:`<svg viewBox="0 0 24 24" ${SW}><circle cx="12" cy="8" r="3.8"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>`,
 ear:`<svg viewBox="0 0 24 24" ${SW}><path d="M6.5 9a5.5 5.5 0 0 1 11 0c0 3-2.5 3.8-3 6.3-.4 2-1.6 3.7-3.7 3.7A3 3 0 0 1 8 16.5"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.2-1 1.6-1.4 2.5"/></svg>`,
 wifioff:`<svg viewBox="0 0 24 24" ${SW}><path d="M2.5 9a14 14 0 0 1 5-2.9M11 5.6A14 14 0 0 1 21.5 9"/><path d="M5.5 12.5a9.5 9.5 0 0 1 4-2.2M14.5 10.6a9.5 9.5 0 0 1 4 1.9"/><path d="M8.8 15.8a5 5 0 0 1 6.4 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>`,
};
const MASC='../../brandbook/assets/mascot/mascot-';

/* ===== словарь: экран + страница =====
   conv: [сторона, оригинал, перевод]; {…} — слово, где Parrlo поставил род собеседника.
   Демо‑реплика 1 — фраза «горячая вода» с сайта (copy-ru/translate.md, сайт site-c3). */
const T={
ru:{

 page:{title:'Parrlo Translate · разговор',tag:'Эталон · пачка 2 · черновик текста',h1:'Translate · разговор лицом к лицу',
  lead:'T‑01 и T‑03 карты сайта. Один телефон на двоих: ты говоришь по‑русски, собеседник — по‑испански. Главный экран с двумя кнопками, запись с каждой стороны, лента разговора с правильным родом, режим «лицом к лицу» и ошибка с действием. Каркас — как у T‑02 и T‑10: та же шапка, блоки и нижняя панель. Только тёмная тема, интерфейс на «ты». Экран 430×932 pt, PNG @3× — 1290×2796.',
  heroH:'Главный кадр · разговор с администратором дома',
  heroP:['Пять реплик по очереди. Твои — тёмно‑зелёные: сверху твоя фраза, снизу перевод для собеседника. Ответы собеседника — мятные: сверху перевод для тебя, оригинал по касанию. Последний перевод крупнее и с кнопкой «Озвучить».','Правильный род: собеседник — женщина, и Parrlo это помнит. Слова, где род взят из этого знания, подчёркнуты пунктиром: «позвонила», «сама открою», «segura» — в исходной фразе рода не было. Чип над лентой говорит словами, что род учтён, и позволяет его поменять.'],
  cap:['Translate · разговор','Только тёмная тема. Тексты — черновик.'],
  hStates:'Состояния',statesLead:'Порядок — как в живом разговоре. Масштаб 0,6.',
  st:{idle:['Главный экран','T‑01. Открыли Translate: спокойный экран, пара языков и род собеседника. Пользователь нажимает «Я говорю» или передаёт слово собеседнику.'],
      listening:['Говоришь ты','Нажали «Я говорю». Живой текст и волна в зелёной рамке, ниже — место для перевода. «Стоп» — перевести, «Отменить» — сбросить.'],
      'listening-other':['Говорит собеседник','Нажали «Yo hablo». Рамка и волна мятные; подсказка — на языке собеседника, «Стоп» подписан на обоих языках.'],
      conversation:['Разговор','T‑03. Реплики по очереди, род собеседника учтён. Следующая кнопка — с кольцом, очередь названа словами.'],
      'turn-error':['Реплика не переведена','Связь пропала на одной реплике. Фраза остаётся в ленте, вместо перевода — бейдж и «Повторить»; разговор не прерывается. Сервер недоступен — бейдж «Сервер недоступен».'],

      error:['Нет сети','Связь пропала после записи. Запись можно прослушать; «Повторить» отправит её на перевод ещё раз.']},
  hDec:'Решения',
  dec:['<b>Один каркас с T‑02 и T‑10.</b> Шапка 64 pt (назад · пара языков · текст · ещё), нижняя панель с подсказкой и кнопками 80 pt, блоки со скруглением 28. Блоки записи — те же, что в «до / после»: активный с рамкой, место перевода — пунктиром.',
   '<b>Кнопки «Я говорю» / «Yo hablo»</b> — по текстам сайта. Кнопка собеседника подписана на его языке: телефон передают через стол.',
   '<b>Цвет = сторона.</b> Ты — #2BC48A (кнопка, рамка и волна записи, точка в пилюле), собеседник — #BFF2DC. Твои реплики — Deep Green, его — мятные. Очередь — ещё и словами («Теперь очередь собеседника») и кольцом вокруг кнопки.',
   '<b>Правильный род виден.</b> Род собеседника задаётся на главном экране («Он / Она») и висит чипом над лентой. Слова, где род поставлен по этому знанию, подчёркнуты пунктиром. Род пользователя не используется нигде: в интерфейсе — «Твоя фраза», «Ты».',
   '<b>Входящий пузырь — как в сборке:</b> сверху перевод, оригинал по касанию (строка «Оригинал» внизу пузыря).',
   '<b>Подсказка для собеседника — на его языке.</b> В записи собеседника над живым текстом плашка «Te escucho…», а «Стоп» подписан на двух языках.',
   '<b>Лицом к лицу.</b> Верхняя половина повёрнута на 180°: перевод крупно (Nunito 38), «Escuchar» и своя кнопка «Yo hablo». Внизу — твоя фраза и «Я говорю».',
   '<b>Ошибка не теряет запись.</b> Запись можно прослушать, «Повторить» — главное действие, «Записать заново» — запасное.'],
  hTok:'Токены и контраст',
  tok:['Фон <code>#0E1116</code>, поверхности <code>#1C2026</code> / <code>#242B34</code>, линии <code>#2F3742</code>, текст <code>#F2F5F7</code> / <code>#9AA4B2</code> — тёмная тема v2.3.',
   'Ты: <code>#2BC48A</code>. Собеседник: <code>#BFF2DC</code>, плашка его подсказки <code>#243A33</code>. Твои реплики — <code>#00875C</code>, кнопка «Озвучить» в пузыре <code>#005E40</code>. Ошибка: <code>#FF8A7F</code> на <code>#3C2A2E</code>.',
   'Nunito 900 — заголовки, кнопки, крупный перевод (25 pt в ленте, 38 pt лицом к лицу); Inter 400/500/600 — интерфейс. Сетка 4 pt, поля 16, блоки 20–24. Зоны нажатия ≥ 44 pt.'],
  ctrH:['Пара (текст / фон)','Где','Контраст','Норма'],
  hNa:'Не утверждено',
  na:['Все тексты — черновик, включая испанский и английский варианты интерфейса и демо‑разговор (реплика 1 — фраза «горячая вода» с сайта, остальные дописаны).','В карте сайта (T‑01) кнопки названы «Я» и «Собеседник»; в текстах сайта — «Я говорю» / «Yo hablo». На макете — по текстам сайта, как в T‑02 и T‑10.','Пунктир под словами с учётом рода и чип «Собеседник: она» — предложение; в сборке род задаётся переключателем, без пометок в ленте.','Плашка подсказки на языке собеседника, двуязычный «Стоп», режим лицом к лицу кнопкой «Показать» и прослушивание записи при ошибке — сверх текущей сборки.','Цвета <code>#005E40</code>, <code>#243A33</code>, <code>#2E4A3F</code>, <code>#FF8A7F</code>, <code>#E0483B</code> — производные, в токенах v2.3 их нет.'],
  ctr:['основной текст','подписи, подсказки на фоне','подписи в блоках и чипе','кнопки «Отменить», «Обычный вид», пилюля','«Я говорю», «Повторить»','«Yo hablo», пузырь собеседника','строка «Оригинал» в пузыре собеседника','подсказка собеседнику','твоя реплика и перевод в пузыре','крупный перевод (Nunito)','кнопка «Озвучить» в пузыре','«Escuchar» лицом к лицу','кнопка «Стоп»','бейдж ошибки']}

 page:{title:'Parrlo Translate · conversación',tag:'Referencia · lote 2 · textos en borrador',h1:'Translate · conversación cara a cara',
  lead:'T‑01 y T‑03 del mapa del sitio. Un móvil para dos: tú hablas en español y la otra persona, en ruso. Pantalla principal con dos botones, grabación de cada lado, conversación con el género correcto, modo cara a cara y error con acción. Misma estructura que T‑02 y T‑10: cabecera, bloques y panel inferior. Solo tema oscuro, interfaz de «tú». Pantalla de 430×932 pt, PNG @3×: 1290×2796.',
  heroH:'Fotograma principal · hablando con la administradora',
  heroP:['Cinco frases por turnos. Las tuyas, en verde oscuro: arriba lo que dijiste y abajo la traducción. Las de la otra persona, en menta: arriba la traducción para ti y el original al tocar. La última traducción, más grande y con «Escuchar».','Género correcto: la otra persona es mujer y Parrlo lo recuerda. Las palabras que concuerdan gracias a eso llevan subrayado punteado («la administradora», «misma»): en ruso «администратор» no marca el género. El chip sobre la conversación lo dice con palabras y permite cambiarlo.'],

      'turn-error':['Frase sin traducir','Se cortó la red en una frase. La frase sigue en la conversación; en lugar de la traducción, una etiqueta y «Reintentar». La conversación sigue. Si falla el servidor: «Servidor no disponible».'],
      face:['Cara a cara','Tras pulsar «Mostrar». La mitad de arriba, girada hacia la otra persona: lee la traducción y responde sola. La de abajo es tuya.'],
      error:['Sin conexión','Se cortó la red tras grabar. Puedes escuchar la grabación; «Reintentar» la vuelve a enviar.']},
  hDec:'Decisiones',
  dec:['<b>Misma estructura que T‑02 y T‑10.</b> Cabecera de 64 pt, panel inferior con aviso y botones de 80 pt, bloques con radio 28. Los bloques de grabación son los de «antes / después».',
   '<b>Botones «Hablo yo» / «Я говорю»</b>, según los textos del sitio. El de la otra persona va en su idioma: el móvil pasa de un lado a otro de la mesa.',
   '<b>Color = lado.</b> Tú, #2BC48A; la otra persona, #BFF2DC. Tus frases en verde oscuro, las suyas en menta. El turno también se dice con palabras y con el anillo del botón.',
   '<b>El género se ve.</b> Se elige en la pantalla principal («Él / Ella») y queda en un chip sobre la conversación. Lo que concuerda gracias a eso va subrayado. El género del usuario no se usa nunca.',

  hTok:'Tokens y contraste',

  na:['Todos los textos son borrador, también las versiones en español e inglés y la conversación de ejemplo.','En el mapa del sitio (T‑01) los botones se llaman «Yo» y «La otra persona»; en los textos del sitio, «Я говорю» / «Yo hablo». La maqueta sigue los textos, como T‑02 y T‑10.','El subrayado del género y el chip son una propuesta.','Aviso en el idioma de la otra persona, «Parar» bilingüe, cara a cara con «Mostrar» y escucha de la grabación en el error: más allá de la versión actual.','Los colores <code>#005E40</code>, <code>#243A33</code>, <code>#2E4A3F</code>, <code>#FF8A7F</code>, <code>#E0483B</code> son derivados.'],

      listening:['You’re speaking','After “I speak”. Live text and wave in a green frame, the translation slot below. Stop translates, Cancel throws it away.'],
      'listening-other':['They’re speaking','After “Yo hablo”. Frame and wave turn mint; the prompt is in their language, and Stop is labeled in both.'],
      conversation:['Conversation','T‑03. Turns back and forth, the other person’s gender applied. The next button gets a ring, and the turn is named in words.'],
      'turn-error':['Turn not translated','The network dropped on one turn. The phrase stays in the conversation; instead of the translation there’s a badge and Try again. The conversation carries on. Server down: “Server unavailable”.'],
      face:['Face to face','After Show. The top half turns to the other person: they read the translation and reply on their own. The bottom half is yours.'],
      error:['No connection','The network dropped after recording. You can play the recording back; Try again resends it.']},
  hDec:'Decisions',
  dec:['<b>Same layout as T‑02 and T‑10.</b> 64 pt header, bottom panel with hint and 80 pt buttons, 28 pt radius blocks. Recording blocks are the “before / after” ones.',
   '<b>“I speak” / “Yo hablo” buttons</b>, following the site copy. The other person’s button is in their language: the phone gets passed across the table.',
   '<b>Color = side.</b> You #2BC48A, the other person #BFF2DC. Your turns deep green, theirs mint. Whose turn is also said in words and shown with a ring.',
   '<b>Gender you can see.</b> Set on the home screen (He / She) and shown as a chip above the conversation. Words that agree because of it get a dotted underline. The user’s own gender is never used.',
   '<b>Incoming bubble as in the app:</b> translation on top, original on tap.',
   '<b>The prompt for the other person is in their language,</b> and Stop is bilingual while they talk.',
   '<b>Face to face.</b> Top half rotated 180°: large translation (Nunito 38), Escuchar and their own button. Below: your phrase and “I speak”.',
   '<b>The error keeps the recording.</b> Play it back; Try again is the main action.'],
  hTok:'Tokens and contrast',
  tok:['Background <code>#0E1116</code>, surfaces <code>#1C2026</code> / <code>#242B34</code>, lines <code>#2F3742</code>, text <code>#F2F5F7</code> / <code>#9AA4B2</code>: dark theme v2.3.',
   'You: <code>#2BC48A</code>. Other person: <code>#BFF2DC</code>, their prompt <code>#243A33</code>. Your turns: <code>#00875C</code>; Play in the bubble <code>#005E40</code>. Error: <code>#FF8A7F</code> on <code>#3C2A2E</code>.',
   'Nunito 900 for titles, buttons and large translations; Inter 400/500/600 for the UI. 4 pt grid, 16 margins. Tap targets ≥ 44 pt.'],
  ctrH:['Pair (text / background)','Where','Contrast','Minimum'],
  hNa:'Not approved',
  na:['All copy is draft, including the Spanish and English UI and the sample conversation.','The site map (T‑01) names the buttons “Me” and “Other person”; the site copy says “Я говорю” / “Yo hablo”. The mockup follows the copy, like T‑02 and T‑10.','The gender underline and chip are a proposal.','Prompt in the other person’s language, bilingual Stop, face‑to‑face via Show and recording playback on error go beyond the current build.','Colors <code>#005E40</code>, <code>#243A33</code>, <code>#2E4A3F</code>, <code>#FF8A7F</code>, <code>#E0483B</code> are derived.'],
  ctr:['body text','labels and hints on background','labels in blocks and chip','Cancel, Normal view, pill','I speak, Try again','Yo hablo, incoming bubble','“Original” in incoming bubble','prompt for the other person','your turn and translation in bubble','large translation (Nunito)','Play in bubble','Escuchar face to face','Stop button','error badge']}
}};

const LANGS=['ru','es','en'];
let L=(new URLSearchParams(location.search).get('l')||'ru').toLowerCase(); if(!LANGS.includes(L))L='ru';

function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function wave(n,live,seed,maxH){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const env=0.4+0.6*Math.sin(Math.PI*(i+1)/(live+1));const v=i<live?Math.max(6,Math.round((0.25+0.75*r())*maxH*env)):4;h+=`<i class="${i<live?'':P+'z'}" style="height:${v}px"></i>`;}return h;}
function mini(n,seed){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const v=Math.round(5+r()*19*Math.sin(Math.PI*(i+.5)/n)+3);h+=`<i style="height:${v}px"></i>`;}return h;}
const gw=s=>s.replace(/\{([^}]*)\}/g,`<span class="${P}g">$1</span>`);

function screen(st,t){
 const sbar=`<div class="sbar"><b>9:41</b><span class="sig"><i class="wf"></i><i></i></span></div>`;
 const home=`<div class="homebar"><i></i></div>`;
 const top=`<div class="${P}top"><span class="${P}cb" role="button" aria-label="${t.aBack}">${I.back}</span><span class="${P}pair"><span><i class="${P}dot"></i>${t.pair[0]}<i class="${P}swp">${I.swap}</i>${t.pair[1]}<i class="${P}dot ${P}p"></i></span></span><span class="${P}cb" role="button" aria-label="${t.aKbd}">${I.kbd}</span><span class="${P}cb" role="button" aria-label="${t.aMore}">${I.more}</span></div>`;
 const pbMe=(x='')=>`<span class="${P}pb ${P}me ${x}" role="button">${I.mic}<span><b>${t.me[0]}</b><small>${t.me[1]}</small></span></span>`;
 const pbPt=(x='')=>`<span class="${P}pb ${P}pt ${x}" role="button" lang="${t.pl}">${I.mic}<span><b>${t.pt[0]}</b><small>${t.pt[1]}</small></span></span>`;
 const wrap=(body,bot)=>`<div class="scr ${P}scr" data-state="${st}">${sbar}${body}${bot?`<div class="${P}bot">${bot}</div>`:''}${home}</div>`;
 const mic18=I.mic.replace('style="width:26px;height:26px"','');

 if(st==='idle') return wrap(`${top}<div class="${P}main ${P}idle">
  <img src="${MASC}listen-dark.svg" alt="">
  <h3>${t.idleH}</h3><p>${t.idleP}</p>
  <div class="${P}set">
   <div class="${P}row"><div><b>${t.rLang[0]}</b></div><span class="${P}val" role="button">${t.rLang[1]}${I.chev}</span></div>
   <div class="${P}row"><div><b>${t.rG[0]}</b><small>${t.rG[1]}</small></div><span class="${P}seg" role="radiogroup"><span role="radio" aria-checked="false">${t.seg[0]}</span><span class="${P}sel" role="radio" aria-checked="true">${I.ok}${t.seg[1]}</span></span></div>
  </div></div>`,
  `<div class="${P}hint">${t.hIdle}</div><div class="${P}btns">${pbMe()}${pbPt()}</div>`);

 if(st==='listening') return wrap(`${top}<div class="${P}main ${P}rec">
  <div class="${P}slot ${P}a"><div class="${P}lbl"><i class="${P}dot"></i>${t.recLbl}<span class="${P}sp"><i></i>0:03</span></div>
   <p class="${P}live" lang="${t.ml}">${t.recLive}<i class="${P}car"></i></p>
   <div class="${P}wave" aria-hidden="true">${wave(44,34,7,104)}</div></div>
  <div class="${P}slot ${P}c"><div class="${P}lbl"><i class="${P}dot ${P}p"></i>${t.cLbl}</div><p class="${P}empty">${t.cWait}</p><div class="${P}sk" aria-hidden="true"><i style="width:84%"></i><i style="width:52%"></i></div></div>
 </div>`,
  `<div class="${P}hint">${I.info}${t.hRec}</div><div class="${P}btns"><span class="${P}sec" role="button">${t.cancel}</span><span class="${P}stop" role="button"><i></i>${t.stop}</span></div>`);

 if(st==='listening-other') return wrap(`${top}<div class="${P}main ${P}rec">
  <div class="${P}ask" lang="${t.pl}">${I.ear}${t.oAsk}</div>
  <div class="${P}slot ${P}a ${P}ap"><div class="${P}lbl"><i class="${P}dot ${P}p"></i>${t.oLbl}<span class="${P}sp"><i></i>0:04</span></div>
   <p class="${P}live" lang="${t.pl}">${t.oLive}<i class="${P}car"></i></p>
   <div class="${P}wave" aria-hidden="true">${wave(44,38,23,104)}</div></div>
  <div class="${P}slot ${P}c"><div class="${P}lbl"><i class="${P}dot"></i>${t.oCLbl}</div><p class="${P}empty">${t.oWait}</p></div>
 </div>`,
  `<div class="${P}hint">${I.info}${t.hOther}</div><div class="${P}btns"><span class="${P}sec" role="button">${t.cancel}</span><span class="${P}stop" role="button"><i></i>${t.oStop}</span></div>`);

 if(st==='conversation'){
  const times=['9:41','9:41','9:42','9:43','9:43'];
  const n=t.conv.length;
  const feed=t.conv.map(([s,o,tr],i)=>{
   const last=i===n-1;
   if(s==='p') return `<div class="${P}bb ${P}l" role="button" aria-label="${t.aOrig}"><span class="${P}t" lang="${t.ml}">${gw(tr)}</span><span class="${P}orig">${I.chevd}${t.orig} · ${t.pair[1]}</span></div><div class="${P}meta ${P}l">${t.who[0]} · ${times[i]}</div>`;
   return `<div class="${P}bb ${P}r ${last?P+'big':''}"><span class="${P}o" lang="${t.ml}">${o}</span><span class="${P}t" lang="${t.pl}">${gw(tr)}</span>${last?`<span class="${P}spk" role="button" aria-label="${t.aPlay}">${I.spk}</span>`:''}</div><div class="${P}meta ${P}r">${t.who[1]} · ${times[i]}</div>`;
  }).join('');
  return wrap(`${top}<div class="${P}main ${P}conv">
   <span class="${P}gchip" role="button"><span class="${P}av">${I.person}</span>${t.gchip[0]}<span>· ${t.gchip[1]}</span>${I.chev}</span>
   <div class="${P}feed">${feed}</div></div>`,
   `<div class="${P}hint">${I.down}${t.hTurn}</div><div class="${P}btns">${pbMe()}${pbPt(P+'next')}</div>`);
 }

 if(st==='turn-error'){
  const times=['9:41','9:41','9:42','9:43','9:43'];
  const c=t.conv.slice(0,4), n=c.length, f=t.tf;
  const feed=c.map(([s,o,tr],i)=>{
   if(s==='p') return `<div class="${P}bb ${P}l" role="button" aria-label="${t.aOrig}"><span class="${P}t" lang="${t.ml}">${gw(tr)}</span><span class="${P}orig">${I.chevd}${t.orig} · ${t.pair[1]}</span></div><div class="${P}meta ${P}l">${t.who[0]} · ${times[i]}</div>`;
   return `<div class="${P}bb ${P}r"><span class="${P}o" lang="${t.ml}">${o}</span><span class="${P}t" lang="${t.pl}">${gw(tr)}</span></div><div class="${P}meta ${P}r">${t.who[1]} · ${times[i]}</div>`;
  }).join('')+`<div class="${P}bb ${P}r ${P}fail" role="group" aria-label="${f.h}"><span class="${P}o" lang="${t.ml}">${t.conv[4][1]}</span><span class="${P}fl"><span class="${P}erb">${I.wifioff}${f.badge}</span><span class="${P}flt">${f.h}</span><span class="${P}rt" role="button">${I.retry}${f.retry}</span></span></div><div class="${P}meta ${P}r">${t.who[1]} · ${times[4]}</div>`;
  return wrap(`${top}<div class="${P}main ${P}conv">
   <span class="${P}gchip" role="button"><span class="${P}av">${I.person}</span>${t.gchip[0]}<span>· ${t.gchip[1]}</span>${I.chev}</span>
   <div class="${P}feed">${feed}</div></div>`,
   `<div class="${P}btns">${pbMe()}${pbPt()}</div>`);
 }

 if(st==='face'){
  const last=t.conv[t.conv.length-1];
  return wrap(`<div class="${P}main ${P}fc">
  <div class="${P}pan" lang="${t.pl}">
   <div class="${P}lbl"><i class="${P}dot ${P}p"></i>${t.face.lbl}</div>
   <p>${last[2]}</p>
   <div class="${P}acts"><span class="${P}act" role="button">${I.spk}${t.face.play}</span><span class="${P}act ${P}pm" role="button">${mic18}${t.face.mic}</span></div>
  </div>
  <div class="${P}mid">${I.rot}${t.mid}</div>
  <div class="${P}mine">
   <div><div class="${P}lbl"><i class="${P}dot"></i>${t.mine}</div><p lang="${t.ml}">${last[1]}</p></div>
   <div class="${P}btns"><span class="${P}sec" role="button">${t.normal}</span><span class="${P}pb ${P}me" role="button">${I.mic}<span><b>${t.me[0]}</b></span></span></div>
  </div></div>`,'');
 }

 /* error */
 const e=t.err;
 return wrap(`${top}<div class="${P}main ${P}er">
  <img src="${MASC}think-dark.svg" alt="">
  <span class="${P}erb">${I.wifioff}${e.badge}</span>
  <h3>${e.h}</h3><p>${e.p}</p>
  <div class="${P}clip"><span class="${P}play" role="button" aria-label="${t.aListen}">${I.play}</span><div class="${P}cw"><b>${e.clip}</b><div class="${P}mw" aria-hidden="true">${mini(40,11)}</div></div><span class="${P}dur">0:04</span></div>
 </div>`,
 `<div class="${P}btns ${P}v"><span class="${P}pri" role="button">${I.retry}${e.retry}</span><span class="${P}sec" role="button">${mic18}${e.redo}</span></div>`);
}

/* контраст */
function Lu(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#F2F5F7','#242B34',4.5],['#0E1116','#2BC48A',4.5],['#0E1116','#BFF2DC',4.5],['#2E4A3F','#BFF2DC',4.5],['#BFF2DC','#243A33',4.5],['#FFFFFF','#00875C',4.5],['#FFFFFF','#00875C',3],['#FFFFFF','#005E40',4.5],['#0E1116','#FFFFFF',4.5],['#0E1116','#F2F5F7',4.5],['#FF8A7F','#3C2A2E',4.5]];

const STATES=['idle','listening','listening-other','conversation','turn-error','face','error'];
const ph=(id,s,html)=>`<div class="pf p67" id="${id}" style="--s:${s}"><div class="shell"></div><div class="glass">${html}</div></div>`;
const $=id=>document.getElementById(P+id);
function render(){
 const t=T[L],p=t.page;
 document.documentElement.lang=L; document.title=p.title;
 $('lsw').innerHTML=LANGS.map(l=>`<a href="?l=${l}" data-l="${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
 $('tag').textContent=p.tag; $('h1').textContent=p.h1; $('lead').textContent=p.lead;
 $('hero-ph').innerHTML=ph('translate-talk',.8,screen('conversation',t))+`<div class="pcap"><span class="dot"></span><div><b>${p.cap[0]}</b><span>${p.cap[1]}</span></div></div>`;
 $('hero-t').innerHTML=`<h3>${p.heroH}</h3>`+p.heroP.map(x=>`<p>${x}</p>`).join('');
 $('h-states').textContent=p.hStates; $('states-lead').textContent=p.statesLead;
 $('grid').innerHTML=STATES.map((k,i)=>`<figure>${ph(P+'-'+k,.6,screen(k,t))}<figcaption><b>${i+1} · ${p.st[k][0]}</b><code>${k}</code> · ${p.st[k][1]}</figcaption></figure>`).join('');
 $('h-dec').textContent=p.hDec; $('dec').innerHTML=p.dec.map(x=>`<li>${x}</li>`).join('');
 $('h-tok').textContent=p.hTok; $('tok').innerHTML=p.tok.map(x=>`<li>${x}</li>`).join('');
 const fmt=v=>L==='en'?v.toFixed(2):v.toFixed(2).replace('.',',');
 const fn=n=>L==='en'?String(n):String(n).replace('.',',');
 $('ctr').innerHTML=`<tr>${p.ctrH.map(h=>`<th>${h}</th>`).join('')}</tr>`+PAIRS.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${p.ctr[i]}</td><td><b>${fmt(v)}:1</b></td><td>${v>=n?'≥ '+fn(n)+' ✓':'✗'}</td></tr>`;}).join('');
 $('h-na').textContent=p.hNa; $('na').innerHTML=p.na.map(x=>`<li>${x}</li>`).join('');
 window.TT_CR=PAIRS.map(([a,b,n],i)=>[p.ctr[i],+cr(a,b).toFixed(2),n]);
 document.body.dataset.ready=L;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-l]');if(!a)return;e.preventDefault();L=a.dataset.l;history.replaceState(null,'','?l='+L);render();});
window.TT_STATES=STATES;
render();
})();
</script>
