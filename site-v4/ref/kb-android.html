<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo · клавиатура, Android</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.kb-android-w{max-width:1200px;margin:0 auto}
.kb-android-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.kb-android-tags{display:flex;gap:8px;flex-wrap:wrap}
.kb-android-tag{display:inline-block;font:600 13px/20px Inter,sans-serif;color:#0E1116;background:#FFC247;border-radius:8px;padding:2px 10px}
.kb-android-tag.m{background:#2F3742;color:#F2F5F7}
.kb-android-lng{display:flex;gap:4px;background:#171C23;border-radius:14px;padding:4px}
.kb-android-lng a{min-width:56px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 15px Inter,sans-serif;color:#C5CCD5;text-decoration:none}
.kb-android-lng a[aria-current="true"]{background:#2BC48A;color:#0E1116}
.kb-android-w h1{font:900 36px/1.15 Nunito,sans-serif;margin:0 0 8px}
.kb-android-w h2{font:900 24px/1.2 Nunito,sans-serif;margin:0 0 8px}
.kb-android-lead{color:#9AA4B2;max-width:760px;margin:0 0 24px}
.kb-android-copy{max-width:760px;margin:0 0 32px;border-left:3px solid #2BC48A;padding:4px 0 4px 16px;color:#9AA4B2;font-size:15px}
.kb-android-copy small{display:block;font:700 12px/18px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9AA4B2}
.kb-android-copy b{display:block;font:900 22px/1.25 Nunito,sans-serif;color:#F2F5F7;margin:2px 0 4px}
.kb-android-copy p{margin:0 0 8px}
.kb-android-copy span{display:inline-block;font:700 14px/20px Inter,sans-serif;color:#0E1116;background:#2BC48A;border-radius:10px;padding:4px 12px}
.kb-android-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;padding:48px 24px 40px;border-radius:32px;background:#171C23}
.kb-android-hero figure,.kb-android-st figure{margin:0}
.kb-android-sec{margin-top:64px}
.kb-android-sec>p{color:#9AA4B2;margin:0 0 24px;max-width:760px}
.kb-android-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(580px,1fr));gap:24px}
.kb-android-st{background:#171C23;border-radius:24px;padding:24px}
.kb-android-st h3{font:900 20px/1.25 Nunito,sans-serif;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kb-android-st h3 code{font:500 13px ui-monospace,Menlo,monospace;color:#9AA4B2;background:#0E1116;border-radius:6px;padding:1px 6px}
.kb-android-st>p{margin:0 0 20px;color:#9AA4B2;font-size:15px}
.kb-android-pair{display:flex;gap:20px;justify-content:center}
.kb-android-pair .pcap{margin-top:10px;font-size:13px}
.kb-android-pair .pcap b{font-size:14px}
.kb-android-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-android-notes h2{font-size:20px;margin:0 0 10px}
.kb-android-notes ul{margin:0;padding-left:20px;color:#9AA4B2}
.kb-android-notes li{margin:6px 0}
.kb-android-notes b{color:#F2F5F7;font-weight:600}
.kb-android-st .pf{--s:.6!important}
@media (max-width:660px){
 .kb-android-grid{grid-template-columns:1fr}
 .kb-android-st{padding:16px}
 .kb-android-pair{gap:12px}
 .kb-android-st .pf{--s:.355!important}
 .kb-android-hero{padding:24px 8px;gap:24px}
 .kb-android-hero .pf{--s:.78!important}
 .kb-android-w h1{font-size:28px}
}

/* ===== рамка Android: на основе .pf, 412×915, маленький круглый вырез камеры ===== */
.pf.kb-android-pf{--pw:412px;--ph:915px;--bz:10px;--r:46px}
.kb-android-pf .glass::after{content:"";position:absolute;z-index:20;top:calc(14px*var(--s));left:50%;width:calc(12px*var(--s));height:calc(12px*var(--s));margin-left:calc(-6px*var(--s));border-radius:50%;background:#05070A;box-shadow:0 0 0 calc(1.5px*var(--s)) rgba(255,255,255,.06)}

/* ===== экран 412×915: нейтральный мессенджер + клавиатура Parrlo ===== */
.scr.light{--kb-bg:#D3D7DC;--kb-key:#FFFFFF;--kb-key2:#ABB2BB;--kb-tx:#0E1116;--kb-sec:#5B6472;--kb-acc:#00875C;--kb-onacc:#FFFFFF;--kb-line:#C5CCD5;--kb-rec:#C42B1F;--kb-track:#E3E7EB}
.scr:not(.light){--kb-bg:#1B1F25;--kb-key:#3A414B;--kb-key2:#2A3038;--kb-tx:#F2F5F7;--kb-sec:#C5CCD5;--kb-acc:#2BC48A;--kb-onacc:#0E1116;--kb-line:#4A525D;--kb-rec:#FF6B5E;--kb-track:#4A525D}
/* статус-бар Android: время слева, значки справа, камера по центру */
.kb-android-sb{flex:none;height:40px;display:flex;align-items:center;justify-content:space-between;padding:2px 22px 0 26px;font:600 15px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.kb-android-sb .ic{display:flex;align-items:center;gap:6px;width:auto;height:auto}
.kb-android-sb svg{width:17px;height:17px}
.kb-android-sb svg.bt{width:11px;height:18px}
/* шапка чата: стрелка «назад», аватар, имя, меню */
.kb-android-scr .nav{padding:4px 4px 8px 4px;gap:4px}
.kb-android-hb{flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.kb-android-hb svg{width:24px;height:24px}
.kb-android-scr .nav .av{color:#0E1116;margin-right:8px}
.kb-android-scr .msgs{padding:12px 16px}
.kb-android-scr .m{max-width:80%;border-radius:18px}
.kb-android-scr .m.in{border-bottom-left-radius:4px}
.kb-android-scr .m.out{border-bottom-right-radius:4px}
.kb-android-scr .m .tm{opacity:1;color:var(--sec)}
.kb-android-scr .m.out .tm{color:inherit;opacity:.85}
.kb-android-scr.light .m.out .tm{color:#3E5A4D;opacity:1}
.kb-android-scr .inp{padding:8px 8px 10px 12px;align-items:flex-end;gap:6px}
.kb-android-scr .inp .f{color:var(--tx);flex:1;min-width:0;padding:9px 16px;line-height:24px;font-size:17px;border-radius:24px;min-height:46px}
.kb-android-scr .inp .f .pl{color:var(--sec)}
.kb-android-sd{flex:none;width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center}
.kb-android-sd svg{width:22px;height:22px}
.kb-android-sd.off{background:var(--sf2);color:var(--sec)}
.kb-android-car{display:inline-block;width:2px;height:22px;background:var(--acc);vertical-align:-5px;margin-left:1px}
/* клавиатура */
.kb-android-kb{flex:none;background:var(--kb-bg);padding:0 3px;color:var(--kb-tx)}
.kb-android-strip{position:relative;margin:8px 5px 0;height:60px;border-radius:14px;background:var(--kb-key);padding:0 4px 0 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:19px;overflow:hidden}
.kb-android-strip>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-android-strip .tx{flex:1;min-width:0}
.kb-android-strip .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-android-strip .tx span{display:block;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-android-strip.go{padding:0 8px;gap:8px}
.kb-android-strip.st{padding-right:8px}
.kb-android-a{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font:700 15px Inter,sans-serif;white-space:nowrap}
.kb-android-a svg{flex:none;width:22px;height:22px}
.kb-android-a .pm{width:21px;height:21px}
.kb-android-a.p{flex:1 1 auto;min-width:0;background:var(--kb-acc);color:var(--kb-onacc)}
.kb-android-a.s{flex:none;background:var(--kb-key2);color:var(--kb-tx)}
.kb-android-a.s .un{width:20px;height:20px}
.kb-android-a.q{flex:none;background:transparent;color:var(--kb-tx);padding:0 12px}
.kb-android-a small{font:700 12px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor}
/* запись в полосе */
.kb-android-strip.rec{padding:0 14px 0 14px;gap:10px}
.kb-android-rdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--kb-rec);box-shadow:0 0 0 4px color-mix(in srgb,var(--kb-rec) 22%,transparent)}
.kb-android-rl{flex:none;font:600 15px/20px Inter,sans-serif;white-space:nowrap}
.kb-android-rt{flex:none;font:500 15px/20px Inter,sans-serif;color:var(--kb-sec);font-variant-numeric:tabular-nums}
.kb-android-wv{flex:1;min-width:0;height:32px;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden}
.kb-android-wv i{flex:none;width:3px;border-radius:2px;background:var(--kb-acc)}
.kb-android-wv i.q{opacity:.35}
/* панель из пяти иконок */
.kb-android-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:4px}
.kb-android-ib{width:64px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-android-ib svg{width:26px;height:26px}
.kb-android-ib .pm{width:25px;height:25px}
.kb-android-ib.on{background:var(--kb-acc);color:var(--kb-onacc)}
/* клавиши: плоские, со скруглением 6, цифры-подсказки в верхнем ряду */
.kb-android-rows{height:236px;display:flex;flex-direction:column;gap:10px;padding:6px 0 8px}
.kb-android-r{display:flex;gap:4px}
.kb-android-k{position:relative;flex:1 1 0;min-width:0;height:47px;border-radius:7px;background:var(--kb-key);color:var(--kb-tx);display:flex;align-items:center;justify-content:center;font:400 23px/1 Inter,sans-serif}
.kb-android-k sup{position:absolute;top:4px;right:4px;font:500 11px/1 Inter,sans-serif;color:var(--kb-sec)}
.kb-android-k.f{background:var(--kb-key2)}
.kb-android-k.f svg{width:23px;height:23px}
.kb-android-k.w{flex:1.5 1 0}
.kb-android-hp{flex:.5 1 0}
.kb-android-k.n{flex:1.5 1 0;font:500 15px/1 Inter,sans-serif}
.kb-android-k.p{flex:1 1 0}
.kb-android-k.gl svg{width:21px;height:21px}
.kb-android-k.sp{flex:4.6 1 0;font:500 14px/1 Inter,sans-serif;color:var(--kb-sec)}
.kb-android-k.rt{flex:1.5 1 0;background:var(--kb-acc);color:var(--kb-onacc);border-radius:24px}
.kb-android-k.rt svg{width:24px;height:24px}
/* панель голоса вместо букв — та же высота */
.kb-android-vp{height:236px;display:flex;flex-direction:column;gap:10px;padding:6px 5px 8px}
.kb-android-live{flex:1;min-height:0;border-radius:14px;background:var(--kb-key);padding:12px 16px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.kb-android-live small{font:600 13px/18px Inter,sans-serif;color:var(--kb-sec)}
.kb-android-live p{margin:0;font:400 18px/25px Inter,sans-serif}
.kb-android-live p i{font-style:normal;color:var(--kb-sec)}
.kb-android-ctl{flex:none;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.kb-android-ctl .side{flex:1 1 0;display:flex}
.kb-android-ctl .side.r{justify-content:flex-end}
.kb-android-stop{flex:none;width:64px;height:64px;border-radius:50%;background:var(--kb-acc);color:var(--kb-onacc);display:flex;align-items:center;justify-content:center}
.kb-android-stop i{width:20px;height:20px;border-radius:5px;background:currentColor}
.kb-android-lc{height:44px;border-radius:22px;background:var(--kb-key2);display:flex;align-items:center;gap:6px;padding:0 14px;font:700 14px Inter,sans-serif;color:var(--kb-tx)}
.kb-android-lc svg{width:18px;height:18px}
/* результат голоса: два варианта на выбор */
.kb-android-ch{flex:none;border-radius:14px;background:var(--kb-key);padding:9px 14px 10px;box-shadow:inset 0 0 0 1.5px transparent}
.kb-android-ch.on{box-shadow:inset 0 0 0 2px var(--kb-acc)}
.kb-android-ch .lb{display:flex;align-items:center;gap:8px;font:600 13px/18px Inter,sans-serif;color:var(--kb-sec);margin-bottom:3px}
.kb-android-ch .rd{flex:none;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--kb-sec);display:flex;align-items:center;justify-content:center}
.kb-android-ch.on .rd{background:var(--kb-acc);box-shadow:none;color:var(--kb-onacc)}
.kb-android-ch .rd svg{width:12px;height:12px}
.kb-android-ch.on .lb{color:var(--kb-tx)}
.kb-android-ch p{margin:0;font:400 15px/20px Inter,sans-serif}
.kb-android-ch.on p{font-weight:500}
.kb-android-acts{flex:none;display:flex;gap:8px;margin-top:auto}
/* нижняя системная полоса Android при открытой клавиатуре: скрыть, жест, сменить клавиатуру */
.kb-android-nb{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.kb-android-nb .b{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-android-nb .b svg{width:24px;height:24px}
.kb-android-nb .g{width:108px;height:4px;border-radius:2px;background:var(--kb-tx);opacity:.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="kb-android-w">
<div class="kb-android-top"><div class="kb-android-tags"><span class="kb-android-tag" id="kb-android-t-draft"></span><span class="kb-android-tag m" id="kb-android-t-mock"></span></div>
<nav class="kb-android-lng" id="kb-android-lng" aria-label="Language"></nav></div>
<h1 id="kb-android-h1"></h1>
<p class="kb-android-lead" id="kb-android-lead"></p>
<div class="kb-android-copy" id="kb-android-copy"></div>
<div class="kb-android-hero" id="kb-android-hero"></div>
<section class="kb-android-sec">
<h2 id="kb-android-h-st"></h2>
<p id="kb-android-p-st"></p>
<div class="kb-android-grid" id="kb-android-grid"></div>
</section>
<section class="kb-android-sec kb-android-notes" id="kb-android-notes"></section>
</div>
<script>
const SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
let pmN=0;
/* «Улучшить» — монохромный попугай Parrlo (ключ spark из screens.js), маска с уникальным id */
const parrot=()=>{const id='kb-android-pm'+(++pmN);return `<svg class="pm" viewBox="180 140 735 840" fill="currentColor" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><circle cx="612" cy="372" r="44" fill="#000"/><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z" fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"/></mask></defs><g mask="url(#${id})"><path d="M345 800 L 235 925 L 420 895 Z" stroke="currentColor" stroke-width="70" stroke-linejoin="round"/><circle cx="500" cy="640" r="245"/><circle cx="560" cy="395" r="235"/></g><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z"/></svg>`;};
const I={
tr:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><path d="M3 5h9M7.5 3v2M5 5c.5 3 2.5 6 6 7.5M10 5c-.8 3.5-3 6.5-6.5 8"/><path d="M12.5 21l4-10 4 10M14 17.5h5"/></svg>`,
mic:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11.5a7 7 0 0 0 14 0"/><path d="M12 18.5v3"/></svg>`,
voice:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><path d="M3.5 9.5v5h3.5l4.5 4V5.5L7 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8.2 8.2 0 0 1 0 11.4"/></svg>`,
gear:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
shift:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l7.5 8H15v7H9v-7H4.5z"/></svg>`,
shiftOn:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l7.5 8H15v7H9v-7H4.5z"/></svg>`,
del:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.5L3 12z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5" stroke-linecap="round"/></svg>`,
ret:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v6a3 3 0 0 1-3 3H5"/><path d="M9 10l-4 4 4 4"/></svg>`,
globe:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>`,
/* Android: стрелка «назад», меню, отправка */
back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4.5M11 5l-7 7 7 7"/></svg>`,
more:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5.5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="18.5" r="1.9"/></svg>`,
send:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.4-7.5a1 1 0 0 0 0-1.8L3.4 3.6a.7.7 0 0 0-1 .8L4.5 11l8 1-8 1-2.1 6.6a.7.7 0 0 0 1 .8z"/></svg>`,
/* системная полоса: скрыть клавиатуру, сменить клавиатуру */
hide:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`,
kbd:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M6 9.5h.01M9.3 9.5h.01M12.6 9.5h.01M15.9 9.5h.01M18 9.5h.01M6 12.5h.01M9.3 12.5h.01M12.6 12.5h.01M15.9 12.5h.01M18 12.5h.01M8 15.5h8" stroke-width="2.1"/></svg>`,
/* статус-бар */
wifi:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5L.8 8.6a16 16 0 0 1 22.4 0z"/></svg>`,
cell:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 2.5v19h-19z"/></svg>`,
batt:`<svg class="bt" viewBox="0 0 11 18" fill="currentColor" aria-hidden="true"><rect x="3.5" y="0" width="4" height="2" rx=".6"/><rect x=".8" y="1.8" width="9.4" height="15.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.4" y="5.4" width="6.2" height="10.2" rx="1"/></svg>`,

 hDec:'Decisiones',dec:[
  '<b>Marco Android propio</b> (clase kb-android-pf basada en .pf): pantalla de 412×915, esquinas algo menos redondeadas y un pequeño orificio de cámara centrado en la barra de estado. Sin logotipos ni modelo reconocible.',
  '<b>Nada de iPhone</b>: barra de estado de Android (hora a la izquierda; wifi, red y batería a la derecha), flecha «atrás» y menú ⋮ en la cabecera, botón de enviar redondo con avión de papel y barra de gestos de 108×4.',
  '<b>El mismo panel de Parrlo</b>: franja de 60 pt, cinco iconos en el mismo orden (Mejorar, Traducir, Dictado, Nota de voz, Ajustes) y los mismos colores. Quien ya vio la versión de iPhone en esta página lo reconoce al momento.',
  '<b>Lo propio de Android en el teclado</b>: teclas planas sin sombra, números de ayuda en la fila superior (pulsación larga) y fila inferior ?123 · , · globo · espacio · . · intro en píldora. El globo cambia el idioma del teclado; «Cambiar de teclado» y «Ocultar» están en la barra del sistema, como en cualquier teclado de Android.',
  '<b>Voz dentro del panel</b>: en Android el teclado graba por sí mismo, sin pasar a la app. El panel de grabación ocupa el sitio de las letras con la misma altura (236 pt), así que la conversación no salta. Arriba, la franja «Grabando» con tiempo y onda; abajo, «Cancelar», un «Detener» grande y el idioma de la voz.',
  '<b>Texto sobre la marcha</b>: mientras hablas, el panel muestra lo que Parrlo ha entendido, con sus «eh» y «o sea» (como en §9). Al detener, el texto ya limpio.',
  '<b>Elegir antes de insertar</b>: dos tarjetas, «Tu texto» y «Traducción · Русский»; la elegida lleva borde y marca de verificación (no solo color). Por defecto, la traducción: para eso se le escribe a la casera.',
  '<b>Envías tú</b>: el teclado no tiene botón de enviar; tras traducir o insertar se activa el del mensajero.',
  '<b>Sin capturas de la versión de prueba</b>: todo está dibujado como maqueta; en la web lleva la etiqueta «maqueta» y en la propia pantalla no hay marca.'],

 hDec:'Decisions',dec:[
  '<b>Its own Android frame</b> (kb-android-pf, built on .pf): a 412×915 screen, slightly tighter corners and a small round camera hole centred in the status bar. No logos, no recognisable model.',
  '<b>Nothing from iPhone</b>: Android status bar (time on the left; Wi‑Fi, signal, battery on the right), back arrow and ⋮ menu in the header, a round send button with a paper plane, and a 108×4 gesture bar.',
  '<b>The same Parrlo panel</b>: 60 pt strip, five icons in the same order (Improve, Translate, Dictate, Voice note, Settings), same tokens. Anyone who saw the iPhone version on this page recognises it at once.',
  '<b>What’s Android about the keyboard</b>: flat keys without shadows, digit hints on the top row (long press), and a bottom row of ?123 · , · globe · space · . · pill-shaped return. The globe switches layout language; Switch keyboard and Hide live in Android’s system bar, as with any keyboard there.',
  '<b>Voice right in the panel</b>: on Android the keyboard records by itself, no jump to the app. The recording panel takes the letters’ place at the same height (236 pt), so the thread doesn’t jump. Above it, the Recording strip with a timer and waveform; below, Cancel, a big Stop and the speech language.',
  '<b>Text as you speak</b>: while you talk, the panel shows what Parrlo heard, ums and likes included (as in §9). After Stop, the tidied text.',
  '<b>Choose before inserting</b>: two cards, Your text and Translation · Español; the chosen one has an outline and a check mark (not colour alone). Translation is preselected — that’s why you’re writing to the landlord.',
  '<b>You do the sending</b>: the keyboard has no send button of its own; after translating or inserting, the messenger’s button is active.',
  '<b>No frames from the diagnostic build</b>: everything is drawn as a mockup; labelled “mockup” on the site, no label on the screen itself.'],

  'All copy is draft; Spanish and English have not been proofread by native speakers.',
  'The Android keyboard doesn’t exist as a product yet — only a diagnostic build (keyboard GAP, nos. 25–30). A‑V0…A‑V8 exist only as text; these frames are their first drawing.',
  'Text as you speak needs streaming recognition; the build finishes recording first and processes afterwards (A‑V4 stages). Without streaming, the panel shows those stages instead.',
  'Whether the translation or your own text is preselected needs a decision; kb-voice A‑V5 defaults to your text, with translation behind a button.',
  'Timer with no visible cap: we don’t put limit numbers on screen; an end-of-recording warning (A‑V2b) would be a separate frame.',
  'Where Switch keyboard lives: in the system bar (as Android draws it) and/or on long-pressing the globe — decide with engineering.',
  'The messenger is made up and neutral; on the site the scenario is named “WhatsApp” in text, without a logo.']}

 '<b>Светлая:</b> фон клавиатуры #D3D7DC, клавиши, полоса и карточки #FFFFFF, служебные #ABB2BB, текст #0E1116, вторичный #5B6472, акцент #00875C / #FFFFFF, точка записи #C42B1F; чат — фон #FFFFFF, входящие #E9EDF0, поле #F2F4F6.',
 '<b>Тёмная:</b> фон клавиатуры #1B1F25, клавиши, полоса и карточки #3A414B, служебные #2A3038, текст #F2F5F7, вторичный #C5CCD5, акцент #2BC48A / #0E1116, точка записи #FF6B5E; чат — фон #0E1116, входящие #242B34, поле #1C2026.',
 '<b>Контраст, светлая:</b> CONTRAST_L.','<b>Контраст, тёмная:</b> CONTRAST_D.',
 '<b>Не только цветом:</b> запись — точка, таймер и слова «Идёт запись»; выбранная карточка — обводка и галочка, невыбранная — пустой кружок; «Перевели» — галочка и слова; активная иконка микрофона — заливка и aria-pressed.',
 '<b>Зоны нажатия:</b> иконки панели 64×44, «Перевести», «Улучшить», «Отменить», «Отмена», «Заново», «Вставить», язык речи — 44 pt; «Стоп» 64×64; «Назад», ⋮, «Скрыть» и «Сменить клавиатуру» — 48×48; отправка 46×46; переключатель языка страницы 56×44. Буквенные клавиши — 33×47, как у системных клавиатур.'],
es:[
 '<b>Claro:</b> fondo del teclado #D3D7DC, teclas, franja y tarjetas #FFFFFF, teclas de función #ABB2BB, texto #0E1116, secundario #5B6472, acento #00875C / #FFFFFF, punto de grabación #C42B1F; chat: fondo #FFFFFF, recibidos #E9EDF0, campo #F2F4F6.',
 '<b>Oscuro:</b> fondo del teclado #1B1F25, teclas, franja y tarjetas #3A414B, teclas de función #2A3038, texto #F2F5F7, secundario #C5CCD5, acento #2BC48A / #0E1116, punto de grabación #FF6B5E; chat: fondo #0E1116, recibidos #242B34, campo #1C2026.',
 '<b>Contraste, claro:</b> CONTRAST_L.','<b>Contraste, oscuro:</b> CONTRAST_D.',
 '<b>No solo con color:</b> la grabación lleva punto, tiempo y la palabra «Grabando»; la tarjeta elegida, borde y marca, y la otra, un círculo vacío; «Traducido», marca y texto; el micrófono activo, relleno y aria-pressed.',
 '<b>Zonas táctiles:</b> iconos del panel 64×44; «Traducir», «Mejorar», «Deshacer», «Cancelar», «Repetir», «Insertar» e idioma de la voz, 44 pt; «Detener» 64×64; «Atrás», ⋮, «Ocultar» y «Cambiar de teclado», 48×48; enviar 46×46; selector de idioma 56×44. Teclas de letras 33×47, como en los teclados del sistema.'],
en:[
 '<b>Light:</b> keyboard background #D3D7DC, keys, strip and cards #FFFFFF, function keys #ABB2BB, text #0E1116, secondary #5B6472, accent #00875C / #FFFFFF, recording dot #C42B1F; chat: background #FFFFFF, incoming #E9EDF0, field #F2F4F6.',
 '<b>Dark:</b> keyboard background #1B1F25, keys, strip and cards #3A414B, function keys #2A3038, text #F2F5F7, secondary #C5CCD5, accent #2BC48A / #0E1116, recording dot #FF6B5E; chat: background #0E1116, incoming #242B34, field #1C2026.',
 '<b>Contrast, light:</b> CONTRAST_L.','<b>Contrast, dark:</b> CONTRAST_D.',
 '<b>Not by colour alone:</b> recording has a dot, a timer and the word “Recording”; the chosen card has an outline and a check, the other an empty circle; Translated has a check and words; the active mic icon is filled and aria-pressed.',
 '<b>Touch targets:</b> toolbar icons 64×44; Translate, Improve, Undo, Cancel, Redo, Insert and the speech language 44 pt; Stop 64×64; Back, ⋮, Hide and Switch keyboard 48×48; send 46×46; page language switch 56×44. Letter keys 33×47, as on system keyboards.']};

function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS={
 L:[['T1','#0E1116','#FFFFFF'],['T2','#5B6472','#FFFFFF'],['T3','#FFFFFF','#00875C'],['T4','#0E1116','#ABB2BB'],['T5','#0E1116','#D3D7DC'],['T6','#0E1116','#E9EDF0'],['T8','#5B6472','#E9EDF0'],['T9','#5B6472','#F2F4F6']],
 D:[['T1','#F2F5F7','#3A414B'],['T2','#C5CCD5','#3A414B'],['T3','#0E1116','#2BC48A'],['T4','#F2F5F7','#2A3038'],['T5','#F2F5F7','#1B1F25'],['T6','#F2F5F7','#242B34'],['T8','#9AA4B2','#242B34'],['T9','#9AA4B2','#1C2026']]};
const PL={ru:{T1:'текст на клавише, полосе, карточке',T2:'вторичный и цифры-подсказки',T3:'«Перевести», «Вставить» на акценте',T4:'«Улучшить», «Отменить» на служебном',T5:'значки системной полосы на фоне клавиатуры',T6:'входящее сообщение',T8:'время во входящем',T9:'плейсхолдер поля'},
 es:{T1:'texto en tecla, franja y tarjeta',T2:'secundario y números de ayuda',T3:'«Traducir», «Insertar» sobre acento',T4:'«Mejorar», «Deshacer» sobre tecla de función',T5:'barra del sistema sobre el teclado',T6:'mensaje recibido',T8:'hora en recibido',T9:'marcador del campo'},
 en:{T1:'text on keys, strip, cards',T2:'secondary and digit hints',T3:'Translate, Insert on accent',T4:'Improve, Undo on function key',T5:'system bar on keyboard background',T6:'incoming message',T8:'time in incoming',T9:'field placeholder'}};
const fmt=(v,l)=>l==='en'?v.toFixed(1):v.toFixed(1).replace('.',',');

/* раскладки и цифры-подсказки верхнего ряда */
const ROWS={ru:['йцукенгшщзх','фывапролджэ','ячсмитьбю'],es:['qwertyuiop','asdfghjklñ','zxcvbnm'],en:['qwertyuiop','asdfghjkl','zxcvbnm']};
const BAR=[['imp',parrot],['tr',()=>I.tr],['dict',()=>I.mic],['voice',()=>I.voice],['set',()=>I.gear]];
function keys(c,up){
 const R=ROWS[c.kb];
 const k=(ch,i,top)=>{const t=up?ch.toLocaleUpperCase(c.kb):ch;const sup=top&&i<10?`<sup aria-hidden="true">${(i+1)%10}</sup>`:'';return `<span class="kb-android-k" role="button">${t}${sup}</span>`;};
 const row=(s,top)=>[...s].map((ch,i)=>k(ch,i,top)).join('');
 const half=R[1].length<R[0].length?'<span class="kb-android-hp"></span>':'';
 return `<div class="kb-android-r">${row(R[0],1)}</div><div class="kb-android-r">${half}${row(R[1])}${half}</div>
<div class="kb-android-r"><span class="kb-android-k f w" role="button" aria-label="${c.shift}"${up?' aria-pressed="true"':''}>${up?I.shiftOn:I.shift}</span>${row(R[2])}<span class="kb-android-k f w" role="button" aria-label="${c.del}">${I.del}</span></div>
<div class="kb-android-r"><span class="kb-android-k f n" role="button" aria-label="${c.num}">?123</span><span class="kb-android-k p" role="button">,</span><span class="kb-android-k f gl" role="button" aria-label="${c.lang}">${I.globe}</span><span class="kb-android-k sp" role="button">${c.space}</span><span class="kb-android-k p" role="button">.</span><span class="kb-android-k rt" role="button" aria-label="${c.ret}">${I.ret}</span></div>`;}

const car='<i class="kb-android-car"></i>';
const WAVE=[6,10,16,12,22,18,26,14,10,20,24,16,8,18,26,22,12,8,14,20,10,6];
/* состояния: поле, полоса, панель, область букв */
const S={
 panel:c=>({field:c.draft,send:1,
  strip:`<div class="kb-android-strip go"><span class="kb-android-a p" role="button" aria-label="${c.trAria}">${I.tr}${c.trA}<small>${c.toTag}</small></span><span class="kb-android-a s" role="button">${parrot()}${c.imp}</span></div>`}),
 translated:c=>({field:c.out,flang:c.to,send:1,
  strip:`<div class="kb-android-strip st" role="status">${I.check}<span class="tx"><b>${c.doneB}</b><span>${c.was}</span></span><span class="kb-android-a s" role="button" aria-label="${c.undoA}">${I.undo}${c.undo}</span></div>`}),
 voice:c=>({field:`<span class="pl">${c.ph}</span>`,pre:1,send:0,on:2,
  strip:`<div class="kb-android-strip rec" role="status"><i class="kb-android-rdot"></i><span class="kb-android-rl">${c.rec}</span><span class="kb-android-rt">${c.recT}</span><span class="kb-android-wv" aria-hidden="true">${WAVE.map((h,i)=>`<i${i>18?' class="q"':''} style="height:${h}px"></i>`).join('')}</span></div>`,
  area:`<div class="kb-android-vp"><div class="kb-android-live" aria-live="polite"><small>${c.liveL}</small><p>${c.raw}<i>${c.rawTail}</i>${car}</p></div>
<div class="kb-android-ctl"><span class="side"><span class="kb-android-a s" role="button">${c.cancel}</span></span><span class="kb-android-stop" role="button" aria-label="${c.stopA}"><i></i></span><span class="side r"><span class="kb-android-lc" role="button" aria-label="${c.speakA}">${I.globe}${c.speak}</span></span></div></div>`}),
 'voice-done':c=>({field:`<span class="pl">${c.ph}</span>`,pre:1,send:0,on:2,
  strip:`<div class="kb-android-strip st" role="status">${I.check}<span class="tx"><b>${c.vdB}</b><span>${c.vdS}</span></span></div>`,
  area:`<div class="kb-android-vp" role="radiogroup"><div class="kb-android-ch" role="radio" aria-checked="false"><span class="lb"><span class="rd"></span>${c.mine}</span><p>${c.draft}</p></div>
<div class="kb-android-ch on" role="radio" aria-checked="true"><span class="lb"><span class="rd">${I.checkS}</span>${c.trL}</span><p lang="${c.to}">${c.out}</p></div>
<div class="kb-android-acts"><span class="kb-android-a s" role="button" aria-label="${c.againA}">${I.redo}${c.again}</span><span class="kb-android-a p" role="button" aria-label="${c.insertA}">${I.ins}${c.insert}<small>${c.toTag}</small></span></div></div>`})
};
function screen(id,light,c){
 const s=S[id](c);
 const f=s.pre?car+s.field:s.field+car;
 const bar=`<div class="kb-android-bar">${BAR.map(([n,ic],i)=>{const on=s.on===i;
  return `<span class="kb-android-ib${on?' on':''}" role="button" aria-label="${c[n]}"${on?' aria-pressed="true"':''}>${ic()}</span>`;}).join('')}</div>`;
 const msgs=c.msgs.map(([d,t,tm])=>`<div class="m ${d}">${t}<span class="tm">${tm}</span></div>`).join('');
 return `<div class="scr kb-android-scr ${light?'light':''}" lang="${c.html}">
<div class="kb-android-sb"><span>9:41</span><span class="ic">${I.wifi}${I.cell}${I.batt}</span></div>
<div class="nav"><span class="kb-android-hb" role="button" aria-label="${c.backA}">${I.back}</span><span class="av">${c.av}</span><span class="nm"><b>${c.who}</b><span>${c.online}</span></span><span class="kb-android-hb" role="button" aria-label="${c.moreA}">${I.more}</span></div>
<div class="msgs"><div class="day">${c.today}</div>${msgs}</div>
<div class="inp"><span class="f"><span${s.flang?` lang="${s.flang}"`:''}>${f}</span></span><span class="kb-android-sd${s.send?'':' off'}" role="button" aria-label="${c.sendA}">${I.send}</span></div>
<div class="kb-android-kb">
${s.strip}
${bar}
${s.area||`<div class="kb-android-rows">${keys(c,0)}</div>`}
<div class="kb-android-nb"><span class="b" role="button" aria-label="${c.hideKb}">${I.hide}</span><i class="g"></i><span class="b" role="button" aria-label="${c.switchKb}">${I.kbd}</span></div></div></div>`;}
const ph=(id,l,sc,c)=>`<div class="pf kb-android-pf ${l?'light':''}" style="--s:${sc}"><div class="shell"></div><div class="glass">${screen(id,l,c)}</div></div>`;

function render(L){
 const c=D[L];
 document.documentElement.lang=c.html;document.title=c.title;
 const $=id=>document.getElementById(id);
 $('kb-android-lng').innerHTML=['ru','es','en'].map(x=>`<a href="?l=${x}" data-l="${x}" aria-current="${x===L}" lang="${x}">${x.toUpperCase()}</a>`).join('');
 $('kb-android-t-draft').textContent=c.t_draft;$('kb-android-t-mock').textContent=c.t_mock;
 $('kb-android-h1').textContent=c.h1;$('kb-android-lead').textContent=c.lead;
 $('kb-android-copy').innerHTML=`<small>${c.copyH}</small><p style="margin:8px 0 0">${c.copyO}</p><b>${c.copyT}</b><p>${c.copyP}</p><span>${c.copyB}</span>`;
 $('kb-android-h-st').textContent=c.hSt;$('kb-android-p-st').textContent=c.pSt;
 $('kb-android-hero').innerHTML=
 `<figure data-shot="kb-android--light--${L}">${ph('panel',1,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capL[0]}</b><span>${c.capL[1]}</span></div></div></figure>
<figure data-shot="kb-android--dark--${L}">${ph('panel',0,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capD[0]}</b><span>${c.capD[1]}</span></div></div></figure>`;
 $('kb-android-grid').innerHTML=Object.keys(S).map(id=>
 `<article class="kb-android-st"><h3>${c.st[id][0]}<code>${id}</code></h3><p>${c.st[id][1]}</p><div class="kb-android-pair">
<figure data-shot="kb-android--${id}--light--${L}">${ph(id,1,.6,c)}<div class="pcap"><div><b>${c.light}</b></div></div></figure>
<figure data-shot="kb-android--${id}--dark--${L}">${ph(id,0,.6,c)}<div class="pcap"><div><b>${c.dark}</b></div></div></figure></div></article>`).join('');
 const cs=t=>PAIRS[t].map(([k,a,b])=>`${PL[L][k]} ${fmt(cr(a,b),L)}`).join('; ');
 const tok=TOK[L].map(x=>x.replace('CONTRAST_L',cs('L')).replace('CONTRAST_D',cs('D')));
 $('kb-android-notes').innerHTML=`<div><h2>${c.hDec}</h2><ul>${c.dec.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hTok}</h2><ul>${tok.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hNo}</h2><ul>${c.no.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 document.body.dataset.lang=L;
}
let L0=new URLSearchParams(location.search).get('l');if(!D[L0])L0='ru';
render(L0);
document.getElementById('kb-android-lng').addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(!a)return;e.preventDefault();const l=a.dataset.l;try{history.replaceState(null,'','?l='+l)}catch(_){}render(l);});
window.KB_ANDROID_RENDER=render;
document.body.dataset.ready='1';
</script>
</body>
</html>
