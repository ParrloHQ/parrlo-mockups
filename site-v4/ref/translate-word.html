<!doctype html>
<html lang="ru">
<head>

<title>Parrlo Translate · правка слова</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0E12;color:#F2F5F7}
body{font:400 16px/1.5 Inter,system-ui,sans-serif;padding:32px 16px 80px}
.translate-word-w{max-width:1200px;margin:0 auto}
.translate-word-langs{display:flex;gap:8px;margin-bottom:28px}
.translate-word-langs a{min-width:56px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;font:700 15px/1 Inter,sans-serif;color:#F2F5F7;background:#1C2026;box-shadow:inset 0 0 0 1px #2F3742;text-decoration:none}
.translate-word-langs a[aria-current="true"]{background:#2BC48A;color:#0E1116;box-shadow:none}
.translate-word-w h1{font:900 40px/1.1 Nunito,sans-serif;margin-bottom:12px}
.translate-word-w h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.translate-word-lead{color:#9AA4B2;max-width:820px}
.translate-word-tag{display:inline-block;margin-bottom:12px;font:600 13px/1 Inter,sans-serif;color:#0E1116;background:#BFF2DC;border-radius:8px;padding:6px 10px}
.translate-word-hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;margin-top:40px;padding:48px 40px;border-radius:32px;background:#12161C;box-shadow:inset 0 0 0 1px #2F3742}
.translate-word-hero figure{margin:0}
.translate-word-hero-t{flex:1 1 300px;max-width:520px}
.translate-word-hero-t h3{font:900 24px/1.25 Nunito,sans-serif;margin-bottom:12px}
.translate-word-hero-t p{color:#C3CBD5;margin-bottom:12px}
.translate-word-w ul{padding-left:20px;color:#C3CBD5;font-size:15px;max-width:860px}
.translate-word-w li{margin:8px 0}
.translate-word-w li b{color:#F2F5F7}
.translate-word-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7}
.translate-word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(284px,1fr));gap:48px 24px;margin-top:32px}
.translate-word-grid figure{margin:0;display:flex;flex-direction:column;align-items:center}
.translate-word-grid figcaption{margin-top:16px;width:272px;font-size:14px;line-height:1.45;color:#9AA4B2}
.translate-word-grid figcaption b{display:block;color:#F2F5F7;font:900 17px/1.3 Nunito,sans-serif;margin-bottom:4px}
.translate-word-grid figcaption code{font-size:12px}
.translate-word-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.translate-word-tbl th,.translate-word-tbl td{text-align:left;vertical-align:top;border-bottom:1px solid #2F3742;padding:10px 12px 10px 0}
.translate-word-tbl th{color:#9AA4B2;font-weight:600}
.translate-word-tw{overflow-x:auto}
.translate-word-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px #3A414B}
@media (max-width:760px){.translate-word-w h1{font-size:30px}.translate-word-hero{padding:24px 12px;gap:24px;justify-content:center}.translate-word-hero .pf{--s:.8!important}}
@media (max-width:480px){.translate-word-hero .pf{--s:.7!important}}

/* ===== экран 430×932 ===== */
.translate-word-scr{--me:#2BC48A;--es:#BFF2DC;--q:#FFC247;--qbg:#3A3426}
.translate-word-top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px}
.translate-word-cb{width:48px;height:48px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.translate-word-pair{flex:1;min-width:0;display:flex;justify-content:center}
.translate-word-pair>span{height:48px;border-radius:24px;background:var(--sf2);display:inline-flex;align-items:center;gap:8px;padding:0 16px;font:900 19px/1 Nunito,sans-serif;letter-spacing:.02em}
.translate-word-swp{color:var(--sec);display:flex}
.translate-word-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--me)}
.translate-word-dot.translate-word-es{background:var(--es)}
.translate-word-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;padding:12px 16px 0;position:relative}
.translate-word-bot{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px 16px 4px}
.translate-word-btns{display:flex;gap:12px}
.translate-word-pb{flex:1;min-width:0;height:80px;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:10px;color:#0E1116}
.translate-word-pb svg{flex:none;width:26px;height:26px}
.translate-word-pb b{display:block;font:900 21px/24px Nunito,sans-serif;white-space:nowrap}
.translate-word-pb small{display:block;font:600 13px/1.3 Inter,sans-serif;margin-top:2px}
.translate-word-pb.translate-word-me{background:var(--me)}
.translate-word-pb.translate-word-es{background:var(--es)}
.translate-word-pb.translate-word-next{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--es),0 0 36px rgba(191,242,220,.28)}
.translate-word-hint{display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px Inter,sans-serif;color:var(--sec);text-align:center}
.translate-word-hint svg{width:16px;height:16px;flex:none}
.translate-word-lbl{font:600 13px/16px Inter,sans-serif;color:var(--sec);letter-spacing:.02em;display:flex;align-items:center;gap:8px;min-width:0}
.translate-word-row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px}

/* «Что понял Parrlo» */
.translate-word-said{position:relative;background:var(--sf);border-radius:24px;padding:16px 20px 18px;box-shadow:inset 0 0 0 1px var(--line)}
.translate-word-said p{font:500 21px/32px Inter,sans-serif;margin-top:10px;padding-right:8px}
.translate-word-said.translate-word-up{z-index:3;box-shadow:inset 0 0 0 1px #3A414B,0 20px 40px -12px rgba(0,0,0,.6)}
.translate-word-ed{position:absolute;right:6px;top:4px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec)}
.translate-word-ed svg{width:20px;height:20px}
/* слово: неуверенно / выбрано / заменено — всегда форма + цвет */
.translate-word-wd{position:relative;display:inline;padding:2px 4px;margin:0 -1px;border-radius:8px;font-weight:700;white-space:nowrap;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.translate-word-wd::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:44px;transform:translateY(-50%)}
.translate-word-wd.translate-word-q{color:var(--q);background:var(--qbg);text-decoration:underline dashed var(--q);text-decoration-thickness:2px;text-underline-offset:6px}
.translate-word-wd.translate-word-sel{margin:0 4px;color:#0E1116;background:var(--q);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--q)}
.translate-word-wd.translate-word-ok{color:var(--me);background:#1E3734;text-decoration:underline solid var(--me);text-decoration-thickness:2px;text-underline-offset:6px}
.translate-word-qb{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.8px solid currentColor;font:800 12px/1 Inter,sans-serif;margin-left:4px;vertical-align:3px;font-style:normal;text-decoration:none}
.translate-word-wd svg{display:inline-block;width:16px;height:16px;margin-left:4px;vertical-align:-1px}
.translate-word-note{font:400 14px/20px Inter,sans-serif;color:var(--sec);display:flex;gap:8px;align-items:flex-start;padding:0 4px;margin-top:-4px}
.translate-word-note svg{width:16px;height:16px;flex:none;margin-top:2px}
.translate-word-note b{color:var(--tx);font-weight:600}

/* перевод для собеседника */
.translate-word-card{background:var(--deep);border-radius:28px;padding:20px 24px;color:#fff;transition:opacity .2s}
.translate-word-card .translate-word-lbl{color:#FFFFFF}
.translate-word-card p{font:900 30px/38px Nunito,sans-serif;margin:12px 0 20px}
.translate-word-tw{text-decoration-thickness:2px;text-underline-offset:7px}
.translate-word-tw.translate-word-q{text-decoration-line:underline;text-decoration-style:dashed;text-decoration-color:rgba(255,255,255,.75)}
.translate-word-tw.translate-word-ok{text-decoration-line:underline;text-decoration-style:solid;text-decoration-color:#FFFFFF}
.translate-word-upd{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:#005E40;font:600 13px Inter,sans-serif;color:#fff}
.translate-word-upd svg{width:14px;height:14px}
.translate-word-acts{display:flex;gap:8px}
.translate-word-act{height:48px;border-radius:24px;display:inline-flex;align-items:center;gap:8px;padding:0 18px 0 14px;font:600 16px Inter,sans-serif;background:#FFFFFF;color:#0E1116}
.translate-word-act.translate-word-ghost{background:#005E40;color:#fff}
.translate-word-act svg{width:20px;height:20px}

/* затемнение и лист */
.translate-word-dim{position:absolute;inset:0;background:rgba(5,7,10,.66);z-index:2}
.translate-word-sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#1C2026;border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 #2F3742,0 -20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:8px 16px 0}
.translate-word-grab{width:40px;height:5px;border-radius:3px;background:#3A414B;align-self:center;margin-bottom:8px}
.translate-word-sh{display:flex;align-items:flex-start;gap:12px;padding:4px 4px 12px}
.translate-word-sh>div{flex:1;min-width:0}
.translate-word-sh h3{font:900 24px/30px Nunito,sans-serif}
.translate-word-sh span.translate-word-sub{display:block;font:500 15px/20px Inter,sans-serif;color:var(--sec);margin-top:2px}
.translate-word-x{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.translate-word-x svg{width:20px;height:20px}
.translate-word-sl{font:600 13px/16px Inter,sans-serif;color:var(--sec);letter-spacing:.02em;padding:8px 4px 8px}
.translate-word-list{background:var(--sf2);border-radius:20px;overflow:hidden}
.translate-word-opt{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 16px}
.translate-word-opt+.translate-word-opt{border-top:1px solid var(--line)}
.translate-word-opt>div{flex:1;min-width:0}
.translate-word-opt b{display:flex;align-items:center;gap:10px;font:900 21px/26px Nunito,sans-serif}
.translate-word-opt span.translate-word-ctx{display:block;font:400 14px/19px Inter,sans-serif;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.translate-word-opt span.translate-word-ctx em{font-style:normal;color:var(--tx);font-weight:600}
.translate-word-heard{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--qbg);color:var(--q);font:600 13px Inter,sans-serif}
.translate-word-heard svg{width:14px;height:14px}
.translate-word-chev{flex:none;width:20px;color:var(--sec);display:flex}
.translate-word-chev svg{width:20px;height:20px}
.translate-word-own{display:flex;gap:8px;align-items:center}
.translate-word-field{flex:1;min-width:0;height:56px;border-radius:28px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;font:400 17px Inter,sans-serif;color:var(--sec)}
.translate-word-field svg{width:20px;height:20px;flex:none}
.translate-word-mic{flex:none;width:56px;height:56px;border-radius:50%;background:var(--me);color:#0E1116;display:flex;align-items:center;justify-content:center}
.translate-word-mic svg{width:24px;height:24px}
.translate-word-foot{display:flex;gap:8px;align-items:flex-start;font:400 13px/18px Inter,sans-serif;color:var(--sec);padding:12px 4px 0}
.translate-word-foot svg{width:16px;height:16px;flex:none;margin-top:1px}

/* голосом */
.translate-word-turn{align-self:center;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;background:#1E3734;color:var(--me);font:600 15px Inter,sans-serif;margin-top:4px}
.translate-word-turn svg{width:18px;height:18px}
.translate-word-live{align-self:center;display:flex;align-items:center;gap:2px;margin-top:24px;font:900 40px/48px Nunito,sans-serif}
.translate-word-live i{width:3px;height:40px;border-radius:2px;background:var(--me);animation:translate-word-bl 1s steps(2) infinite}
@keyframes translate-word-bl{50%{opacity:0}}
.translate-word-livesub{align-self:center;font:500 14px/20px Inter,sans-serif;color:var(--sec);margin-top:4px}
.translate-word-wave{height:96px;display:flex;align-items:center;justify-content:center;gap:4px;margin:16px 0 8px}
.translate-word-wave i{width:4px;border-radius:2px;background:var(--me);flex:none}
.translate-word-wave i.translate-word-f{background:#3A414B}
.translate-word-vb{display:flex;gap:12px;padding:8px 0 0}
.translate-word-sec{flex:1;height:64px;border-radius:32px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;font:600 17px Inter,sans-serif}
.translate-word-pri{flex:1.4;height:64px;border-radius:32px;background:#F2F5F7;color:#0E1116;display:flex;align-items:center;justify-content:center;gap:10px;font:900 21px Nunito,sans-serif}
.translate-word-pri i{width:16px;height:16px;border-radius:4px;background:#E0483B}

/* тост «вернуть» */
.translate-word-toast{flex:none;margin:0 16px;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 16px;border-radius:24px;background:var(--sf2);box-shadow:inset 0 0 0 1px #3A414B}
.translate-word-toast>svg{width:22px;height:22px;color:var(--me);flex:none}
.translate-word-toast>div{flex:1;min-width:0}
.translate-word-toast b{display:block;font:600 15px/20px Inter,sans-serif}
.translate-word-toast>div>span{display:block;font:400 14px/19px Inter,sans-serif;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.translate-word-undo{flex:none;white-space:nowrap;height:48px;border-radius:24px;padding:0 16px 0 12px;display:inline-flex;align-items:center;gap:6px;background:#F2F5F7;color:#0E1116;font:600 15px Inter,sans-serif}
.translate-word-undo svg{width:18px;height:18px}
</style>
</head>

function word(mode){
 if(mode==='q')return `<span class="${P}wd ${P}q" data-tap>${D.heard}<i class="${P}qb" aria-hidden="true">?</i></span>`;
 if(mode==='sel')return `<span class="${P}wd ${P}sel" data-tap>${D.heard}</span>`;

}
const said=(mode,up)=>`<div class="${P}said ${up?P+'up':''}"><div class="${P}row"><div class="${P}lbl"><i class="${P}dot"></i>${D.said} · ${D.meN}</div></div><span class="${P}ed" aria-label="${D.edit}">${I.pencil}</span><p>${D.ph[0]}${word(mode)}${D.ph[1]}</p></div>`;
const card=(mode)=>`<div class="${P}card"><div class="${P}row"><div class="${P}lbl"><i class="${P}dot ${P}es"></i>${mode==='ok'?D.ptN:D.ptN+' · '+D.forPt}</div>${mode==='ok'?`<span class="${P}upd">${I.ok}${D.upd}</span>`:''}</div>
 <p>${D.tr[0]}<span class="${P}tw ${P}${mode}">${mode==='ok'?D.trFixed:D.trHeard}</span>${D.tr[1]}</p>
 <div class="${P}acts"><span class="${P}act">${I.spk}${D.play}</span><span class="${P}act ${P}ghost">${I.rot}${D.show}</span></div></div>`;
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function wave(n,live,seed,maxH){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const env=Math.sin(Math.PI*(i+1)/(live+1));const v=i<live?Math.max(6,Math.round((0.25+0.75*r())*maxH*(0.35+0.65*env))):4;h+=`<i class="${i<live?'':P+'f'}" style="height:${v}px"></i>`;}return h;}

 <div class="${P}live">${D.fixed}<i></i></div>
 <div class="${P}livesub">${D.vLive}</div>
 <div class="${P}wave">${wave(44,30,17,80)}</div>
 <div class="${P}vb"><span class="${P}sec">${D.cancel}</span><span class="${P}pri"><i></i>${D.stop}</span></div>
 ${home}
</div></div>`,

updated:scr(`${top}
<div class="${P}main">
 ${said('ok')}
 ${card('ok')}
</div>
<div class="${P}toast">${I.okc}<div><b>${D.toastT}</b><span>${D.toastS(D.heard,D.fixed)}</span></div><span class="${P}undo">${I.undo}${D.undo}</span></div>
<div class="${P}bot"><div class="${P}hint">${I.down}${D.next}</div><div class="${P}btns">${pbMe()}${pbPt(P+'next')}</div></div>`),
};
const ORDER=['unsure','options','voice','updated'];
window.TW_STATES=ORDER; window.TW_LANG=L;

/* ===== страница ===== */
const G=D.page;
$('langs').innerHTML=['ru','es','en'].map(l=>`<a href="?l=${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
$('tag').textContent=G.tag; $('h1').textContent=G.h1; $('lead').textContent=G.lead;
document.title='Parrlo Translate · '+G.cap[0].split(' · ')[1];
const ph=(id,s,html)=>`<div class="pf p67" id="${id}" style="--s:${s}"><div class="shell"></div><div class="glass">${html}</div></div>`;
$('hero-ph').innerHTML=ph('translate-word',.8,H.options)+`<div class="pcap"><span class="dot"></span><div><b>${G.cap[0]}</b><span>${G.cap[1]}</span></div></div>`;
$('hero-t').innerHTML=`<h3>${G.heroH}</h3>`+G.heroP.map(p=>`<p>${p}</p>`).join('');
$('h-st').textContent=G.hSt; $('st-lead').textContent=G.stLead;
$('grid').innerHTML=ORDER.map(k=>`<figure>${ph(P+'-'+k,.6,H[k])}<figcaption><b>${D.st[k][0]}</b><code>${k}</code> · ${D.st[k][1]}</figcaption></figure>`).join('');
$('h-dec').textContent=G.hDec; $('dec').innerHTML=G.dec.map(x=>`<li>${x}</li>`).join('');
$('h-tok').textContent=G.hTok; $('tok').innerHTML=G.tok.map(x=>`<li>${x}</li>`).join('');
$('h-na').textContent=G.hNa; $('na').innerHTML=G.na.map(x=>`<li>${x}</li>`).join('');

/* контраст */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const pairs=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#FFC247','#3A3426',4.5],['#0E1116','#FFC247',4.5],['#2BC48A','#1E3734',4.5],
 ['#FFFFFF','#00875C',3],['#FFFFFF','#00875C',4.5],['#FFFFFF','#005E40',4.5],['#0E1116','#FFFFFF',4.5],['#0E1116','#2BC48A',4.5],['#0E1116','#BFF2DC',4.5],['#0E1116','#F2F5F7',4.5],['#F2F5F7','#242B34',4.5]];
const dec=x=>L==='en'?String(x):String(x).replace('.',',');
$('ctr').innerHTML=`<tr><th>${G.thP}</th><th>${G.thW}</th><th>${G.thC}</th><th>${G.thN}</th></tr>`+pairs.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${G.ctr[i]}</td><td><b>${dec(v.toFixed(2))}:1</b></td><td>${v>=n?'≥ '+dec(n)+' ✓':G.low}</td></tr>`;}).join('');
window.TW_CR=pairs.map(([a,b,n],i)=>[G.ctr[i],+cr(a,b).toFixed(2),n]);
document.body.dataset.ready='1';
})();
</script>
