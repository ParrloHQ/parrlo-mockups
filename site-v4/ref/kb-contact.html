<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo · папки контактов</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.kb-contact-w{max-width:1200px;margin:0 auto}
.kb-contact-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.kb-contact-tags{display:flex;gap:8px;flex-wrap:wrap}
.kb-contact-tag{display:inline-block;font:600 13px/20px Inter,sans-serif;color:#0E1116;background:#FFC247;border-radius:8px;padding:2px 10px}
.kb-contact-tag.m{background:#2F3742;color:#F2F5F7}
.kb-contact-lng{display:flex;gap:4px;background:#171C23;border-radius:14px;padding:4px}
.kb-contact-lng a{min-width:56px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 15px Inter,sans-serif;color:#C5CCD5;text-decoration:none}
.kb-contact-lng a[aria-current="true"]{background:#2BC48A;color:#0E1116}
.kb-contact-w h1{font:900 36px/1.15 Nunito,sans-serif;margin:0 0 8px}
.kb-contact-w h2{font:900 24px/1.2 Nunito,sans-serif;margin:0 0 8px}
.kb-contact-lead{color:#9AA4B2;max-width:760px;margin:0 0 32px}
.kb-contact-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;padding:48px 24px 40px;border-radius:32px;background:#171C23}
.kb-contact-hero figure,.kb-contact-st figure{margin:0}
.kb-contact-sec{margin-top:64px}
.kb-contact-sec>p{color:#9AA4B2;margin:0 0 24px;max-width:760px}
.kb-contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:24px}
.kb-contact-st{background:#171C23;border-radius:24px;padding:24px}
.kb-contact-st h3{font:900 20px/1.25 Nunito,sans-serif;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kb-contact-st h3 code{font:500 13px ui-monospace,Menlo,monospace;color:#9AA4B2;background:#0E1116;border-radius:6px;padding:1px 6px}
.kb-contact-st>p{margin:0 0 20px;color:#9AA4B2;font-size:15px}
.kb-contact-st .kb-contact-where{display:inline-block;font:600 12px/18px Inter,sans-serif;color:#C5CCD5;background:#0E1116;border-radius:6px;padding:1px 8px;margin-left:auto}
.kb-contact-pair{display:flex;gap:20px;justify-content:center}
.kb-contact-pair .pcap{margin-top:10px;font-size:13px}
.kb-contact-pair .pcap b{font-size:14px}
.kb-contact-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-contact-notes h2{font-size:20px;margin:0 0 10px}
.kb-contact-notes ul{margin:0;padding-left:20px;color:#9AA4B2}
.kb-contact-notes li{margin:6px 0}
.kb-contact-notes b{color:#F2F5F7;font-weight:600}
.kb-contact-st .pf{--s:.6!important}
@media (max-width:660px){
 .kb-contact-grid{grid-template-columns:1fr}
 .kb-contact-st{padding:16px}
 .kb-contact-pair{gap:12px}
 .kb-contact-st .pf{--s:.345!important}
 .kb-contact-st .kb-contact-one .pf{--s:.66!important}
 .kb-contact-hero{padding:24px 8px;gap:24px}
 .kb-contact-hero .pf{--s:.76!important}
 .kb-contact-w h1{font-size:28px}
}

/* ================= приложение (только тёмная) ================= */
.kb-contact-app{--y:#FFC247}
.kb-contact-hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 16px 0;height:60px}
.kb-contact-cb{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center}
.kb-contact-cb svg{width:22px;height:22px}
.kb-contact-hd .kb-contact-ht{flex:1;min-width:0;text-align:center;font:600 16px/20px Inter,sans-serif;color:var(--sec)}
.kb-contact-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px;overflow:hidden}
.kb-contact-h{font:900 34px/40px Nunito,sans-serif;margin:8px 4px 4px}
.kb-contact-sub{font:400 15px/21px Inter,sans-serif;color:var(--sec);margin:0 4px 20px}
/* список */
.kb-contact-gh{display:flex;align-items:center;gap:8px;font:600 13px/16px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--sec);margin:0 4px 8px}
.kb-contact-gh svg{width:16px;height:16px;flex:none}
.kb-contact-gh span.d{text-transform:none;letter-spacing:0;font-weight:500;margin-left:auto}
.kb-contact-grp{background:var(--sf);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-bottom:20px}
.kb-contact-row{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 12px 12px 16px}
.kb-contact-row+.kb-contact-row{border-top:1px solid var(--line)}
.kb-contact-av{flex:none;width:44px;height:44px;border-radius:50%;color:#0E1116;font:700 17px/44px Inter,sans-serif;text-align:center}
.kb-contact-row>div{flex:1;min-width:0}
.kb-contact-row b{display:block;font:600 17px/22px Inter,sans-serif}
.kb-contact-row b small{font:400 15px Inter,sans-serif;color:var(--sec)}
.kb-contact-row span.s{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.kb-contact-pl{font:500 13px/20px Inter,sans-serif;color:var(--tx);background:var(--sf2);border-radius:7px;padding:0 7px;white-space:nowrap}
.kb-contact-chev{flex:none;color:var(--sec);display:flex}.kb-contact-chev svg{width:20px;height:20px}
.kb-contact-bot{flex:none;padding:12px 16px 0}
.kb-contact-btn{height:56px;border-radius:28px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;gap:10px;font:900 19px Nunito,sans-serif}
.kb-contact-btn svg{width:22px;height:22px}
.kb-contact-btn2{height:48px;border-radius:24px;color:var(--tx);display:flex;align-items:center;justify-content:center;font:600 16px Inter,sans-serif;margin-top:8px}
/* карточка */
.kb-contact-id{display:flex;align-items:center;gap:16px;margin:12px 4px 28px}
.kb-contact-id .kb-contact-av{width:64px;height:64px;font:900 26px/64px Nunito,sans-serif}
.kb-contact-id h2{font:900 30px/36px Nunito,sans-serif;margin:0}
.kb-contact-fold{display:inline-flex;align-items:center;gap:6px;height:44px;margin:-4px 0 -8px -2px;padding:0 2px;font:500 15px Inter,sans-serif;color:var(--sec)}
.kb-contact-fold svg{width:16px;height:16px}
.kb-contact-fold b{color:var(--tx);font-weight:600}
.kb-contact-f{margin-bottom:26px}
.kb-contact-lb{font:600 13px/16px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--sec);margin:0 4px 8px}
.kb-contact-chips{display:flex;gap:8px;flex-wrap:nowrap}
.kb-contact-chip{flex:none;height:44px;border-radius:22px;padding:0 16px;display:flex;align-items:center;gap:6px;font:500 16px Inter,sans-serif;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);color:var(--tx);white-space:nowrap}
.kb-contact-chip svg{width:18px;height:18px}
.kb-contact-chip.on{background:#F2F5F7;color:#0E1116;box-shadow:none;font-weight:700;padding-left:12px}
.kb-contact-chip.add{width:44px;padding:0;justify-content:center;color:var(--sec)}
.kb-contact-seg{display:flex;gap:4px;padding:4px;border-radius:26px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line)}
.kb-contact-seg span{flex:1;min-width:0;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 16px/1 Inter,sans-serif;white-space:nowrap}
.kb-contact-seg span svg{width:16px;height:16px;flex:none}
.kb-contact-seg span[aria-checked="true"]{background:#F2F5F7;color:#0E1116;font-weight:700}
.kb-contact-note{position:relative;background:var(--sf);border-radius:20px;box-shadow:inset 0 0 0 2px var(--acc);padding:14px 16px 12px}
.kb-contact-note p{margin:0;font:400 17px/24px Inter,sans-serif}
.kb-contact-car{display:inline-block;width:2px;height:21px;background:var(--acc);vertical-align:-4px;margin-left:1px}
.kb-contact-meter{display:flex;align-items:center;gap:10px;margin-top:12px}
.kb-contact-bar{flex:1;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.kb-contact-bar i{display:block;height:100%;border-radius:3px;background:var(--y)}
.kb-contact-left{flex:none;display:flex;align-items:center;gap:6px;font:600 13px/16px Inter,sans-serif;color:var(--y)}
.kb-contact-left svg{width:16px;height:16px}
.kb-contact-tip{display:flex;gap:10px;margin:10px 4px 0;font:400 14px/20px Inter,sans-serif;color:var(--sec)}
.kb-contact-tip svg{flex:none;width:18px;height:18px;margin-top:1px}
/* пусто */
.kb-contact-em{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px 24px}
.kb-contact-em img{width:168px;height:168px}
.kb-contact-em h3{font:900 28px/34px Nunito,sans-serif;margin:12px 0 8px}
.kb-contact-em p{font:400 16px/23px Inter,sans-serif;color:var(--sec);margin:0 0 24px;max-width:340px}
.kb-contact-ex{display:flex;flex-direction:column;gap:8px;width:100%}
.kb-contact-exr{display:flex;align-items:center;gap:12px;height:56px;border-radius:18px;padding:0 16px;box-shadow:inset 0 0 0 1.5px var(--line);border:0;text-align:left}
.kb-contact-exr svg{flex:none;width:22px;height:22px;color:var(--acc)}
.kb-contact-exr b{font:600 16px Inter,sans-serif;flex:none}
.kb-contact-exr span{font:400 15px Inter,sans-serif;color:var(--sec);flex:1;min-width:0;text-align:right;white-space:nowrap}

/* ================= клавиатура (обе темы), каркас kb-before ================= */
.scr.light{--kb-bg:#D3D7DC;--kb-key:#FFFFFF;--kb-key2:#ABB2BB;--kb-tx:#0E1116;--kb-sec:#5B6472;--kb-sh:0 1px 0 rgba(0,0,0,.3);--kb-acc:#00875C;--kb-onacc:#FFFFFF;--kb-line:#D5DBE1}
.scr:not(.light){--kb-bg:#1B1F25;--kb-key:#3A414B;--kb-key2:#2A3038;--kb-tx:#F2F5F7;--kb-sec:#C5CCD5;--kb-sh:0 1px 0 rgba(0,0,0,.6);--kb-acc:#2BC48A;--kb-onacc:#0E1116;--kb-line:#4A525D}
.kb-contact-scr .nav{padding:6px 16px 10px}
.kb-contact-scr .nav .av{color:#0E1116}
.kb-contact-scr .nav .bk svg{width:28px;height:28px}
.kb-contact-scr .msgs{padding:12px 16px}
.kb-contact-scr .m{max-width:78%}
.kb-contact-scr .m .tm{opacity:1;color:var(--sec)}
.kb-contact-scr .m.out .tm{color:inherit;opacity:.85}
.kb-contact-scr.light .m.out .tm{color:#3E5A4D;opacity:1}
.kb-contact-scr .inp{padding:8px 12px 10px;align-items:flex-end}
.kb-contact-scr .inp .f{color:var(--tx);flex:1;min-width:0;padding:8px 14px;line-height:24px;font-size:17px;border-radius:20px;min-height:42px}
.kb-contact-scr .inp .f .pl{color:var(--sec)}
.kb-contact-scr .inp .sd{flex:none;width:38px;height:38px;margin-bottom:2px}
.kb-contact-scr .inp .sd.off{background:var(--sf2);color:var(--sec)}
.kb-contact-kcar{display:inline-block;width:2px;height:22px;background:var(--acc);vertical-align:-5px;margin-left:1px}
.kb-contact-kb{flex:none;background:var(--kb-bg);padding:0 3px;color:var(--kb-tx)}
.kb-contact-strip{position:relative;margin:8px 5px 0;height:60px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);padding:0 8px 0 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:19px;overflow:hidden}
.kb-contact-strip>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-contact-strip .tx{flex:1;min-width:0}
.kb-contact-strip .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-contact-strip .tx span{display:block;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-contact-a{flex:none;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font:700 15px Inter,sans-serif;white-space:nowrap;background:var(--kb-key2);color:var(--kb-tx)}
.kb-contact-a svg{width:18px;height:18px}
/* ряд контактов */
.kb-contact-strip.row{padding:0 6px;gap:6px}
.kb-contact-kc{flex:none;height:48px;border-radius:24px;display:flex;align-items:center;gap:8px;padding:0 12px;font:600 15px/18px Inter,sans-serif;white-space:nowrap;color:var(--kb-tx)}
.kb-contact-kc .kb-contact-av{width:30px;height:30px;font:700 13px/30px Inter,sans-serif}
.kb-contact-kc.on{background:var(--kb-acc);color:var(--kb-onacc);padding:0 14px 0 9px;margin-right:2px}
.kb-contact-kc.on small{display:block;font:500 12px/15px Inter,sans-serif}
.kb-contact-kc.on b{display:block;font-weight:700}
.kb-contact-kd{flex:none;width:1px;height:28px;background:var(--kb-line)}
.kb-contact-kc.more{width:44px;padding:0;justify-content:center;color:var(--kb-sec);margin-left:auto}
.kb-contact-kc.more svg{width:22px;height:22px}
/* панель иконок */
.kb-contact-tbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:4px}
.kb-contact-ib{width:64px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-contact-ib svg{width:26px;height:26px}
.kb-contact-ib .pm{width:25px;height:25px}
.kb-contact-rows{position:relative;display:flex;flex-direction:column;gap:11px;padding-top:6px}
.kb-contact-r{display:flex;gap:5px}
.kb-contact-k{position:relative;flex:1 1 0;min-width:0;height:45px;border-radius:8px;background:var(--kb-key);box-shadow:var(--kb-sh);color:var(--kb-tx);display:flex;align-items:center;justify-content:center;font:400 24px/1 Inter,sans-serif}
.kb-contact-k.f{background:var(--kb-key2)}
.kb-contact-k.f svg{width:23px;height:23px}
.kb-contact-k.w{flex:1.38 1 0}
.kb-contact-g{flex:.18 1 0}
.kb-contact-hp{flex:.5 1 0}
.kb-contact-k.n{flex:1.25 1 0;font-size:17px;font-weight:500}
.kb-contact-k.p{flex:.85 1 0}
.kb-contact-k.sp{flex:4.4 1 0;font-size:16px;gap:10px}
.kb-contact-k.sp i{font-style:normal;color:var(--kb-sec);font-size:18px}
.kb-contact-k.rt{flex:1.55 1 0;background:var(--kb-acc);color:var(--kb-onacc);box-shadow:none}
.kb-contact-k.rt svg{width:25px;height:25px}
.kb-contact-home{height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.kb-contact-home i{width:140px;height:5px;border-radius:3px;background:var(--kb-tx)}
</style>
</head>
<body>
<div class="kb-contact-w">
<div class="kb-contact-top"><div class="kb-contact-tags"><span class="kb-contact-tag" id="kb-contact-t-draft"></span><span class="kb-contact-tag m" id="kb-contact-t-mock"></span></div>
<nav class="kb-contact-lng" id="kb-contact-lng" aria-label="Language"></nav></div>
<h1 id="kb-contact-h1"></h1>
<p class="kb-contact-lead" id="kb-contact-lead"></p>
<div class="kb-contact-hero" id="kb-contact-hero"></div>
<section class="kb-contact-sec">
<h2 id="kb-contact-h-st"></h2>
<p id="kb-contact-p-st"></p>
<div class="kb-contact-grid" id="kb-contact-grid"></div>
</section>
<section class="kb-contact-sec kb-contact-notes" id="kb-contact-notes"></section>
</div>
<script>
const SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
let pmN=0;
/* «Улучшить» — монохромный попугай Parrlo (ключ spark из screens.js) */
const parrot=()=>{const id='kb-contact-pm'+(++pmN);return `<svg class="pm" viewBox="180 140 735 840" fill="currentColor" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><circle cx="612" cy="372" r="44" fill="#000"/><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z" fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"/></mask></defs><g mask="url(#${id})"><path d="M345 800 L 235 925 L 420 895 Z" stroke="currentColor" stroke-width="70" stroke-linejoin="round"/><circle cx="500" cy="640" r="245"/><circle cx="560" cy="395" r="235"/></g><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z"/></svg>`;};
const ic=(p,extra='')=>`<svg viewBox="0 0 24 24" ${SW} ${extra} aria-hidden="true">${p}</svg>`;
const I={
tr:ic('<path d="M3 5h9M7.5 3v2M5 5c.5 3 2.5 6 6 7.5M10 5c-.8 3.5-3 6.5-6.5 8"/><path d="M12.5 21l4-10 4 10M14 17.5h5"/>'),
mic:ic('<rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11.5a7 7 0 0 0 14 0"/><path d="M12 18.5v3"/>'),
voice:ic('<path d="M3.5 9.5v5h3.5l4.5 4V5.5L7 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8.2 8.2 0 0 1 0 11.4"/>'),
gear:ic('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
shift:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8 8.5h-4.5v7.5h-7V12H4z"/></svg>`,
shiftOn:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8 8.5h-4.5v7.5h-7V12H4z"/></svg>`,
del:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.5L3 12z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5" stroke-linecap="round"/></svg>`,
ret:ic('<path d="M19 5v6a3 3 0 0 1-3 3H5"/><path d="M9 10l-4 4 4 4"/>','stroke-width="2"'),
back:ic('<path d="M15 5l-7 7 7 7"/>','stroke-width="2.2"'),
send:`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`,
plus:ic('<path d="M12 5v14M5 12h14"/>','stroke-width="2.1"'),
more:ic('<circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/>'),
chev:ic('<path d="M9 5l7 7-7 7"/>','stroke-width="2"'),
down:ic('<path d="M7 10l5 5 5-5"/>','stroke-width="2.1"'),
check:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>','stroke-width="2.4"'),
work:ic('<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M3 12.5h18"/>'),
family:ic('<path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/>'),

 '<b>Zonas táctiles:</b> botones redondos 44×44, chips y segmentos 44 pt, filas 72 pt, «Guardar» 56 pt, chips de contacto 48 pt, «Ignorar» 44 pt.'],
en:['<b>App (dark):</b> background #0E1116, cards #1C2026, second level #242B34, lines #2F3742, text #F2F5F7, secondary #9AA4B2, accent #2BC48A / #0E1116, selected segment #F2F5F7 / #0E1116, warning #FFC247.',
 '<b>Keyboard:</b> kb-before tokens. Light: background #D3D7DC, keys #FFFFFF, function #ABB2BB, accent #00875C / #FFFFFF; dark: background #1B1F25, keys #3A414B, function #2A3038, accent #2BC48A / #0E1116.',
 '<b>Contrast, app:</b> CONTRAST_A.','<b>Contrast, keyboard light:</b> CONTRAST_L.','<b>Contrast, keyboard dark:</b> CONTRAST_D.',
 '<b>Not by colour alone:</b> selected chip and segment have a white fill and a check; “guessed” is a word; “Almost full” has a word and a clock; “Ignore” has a word and a cross.',
 '<b>Touch targets:</b> round buttons 44×44, chips and segments 44 pt, list rows 72 pt, “Save” 56 pt, keyboard contact chips 48 pt, “Ignore” 44 pt.']};

function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS={
 A:[['A1','#F2F5F7','#0E1116'],['A2','#9AA4B2','#1C2026'],['A3','#F2F5F7','#242B34'],['A4','#0E1116','#F2F5F7'],['A5','#0E1116','#2BC48A'],['A6','#FFC247','#1C2026'],['A7','#0E1116','#6AA6F5']],
 L:[['K1','#0E1116','#FFFFFF'],['K2','#5B6472','#FFFFFF'],['K3','#FFFFFF','#00875C'],['K4','#0E1116','#ABB2BB']],
 D:[['K1','#F2F5F7','#3A414B'],['K2','#C5CCD5','#3A414B'],['K3','#0E1116','#2BC48A'],['K4','#F2F5F7','#2A3038']]};
const PL={ru:{A1:'текст на фоне',A2:'вторичный на карточке',A3:'метка на #242B34',A4:'выбранный сегмент',A5:'«Сохранить»',A6:'«Осталось немного»',A7:'буква на аватаре',K1:'текст на полосе',K2:'вторичный на полосе',K3:'чип «угадано» на акценте',K4:'«Не учитывать»'},
 es:{A1:'texto sobre fondo',A2:'secundario en tarjeta',A3:'etiqueta sobre #242B34',A4:'segmento elegido',A5:'«Guardar»',A6:'«Queda poco»',A7:'letra del avatar',K1:'texto en la franja',K2:'secundario en la franja',K3:'chip «adivinado» sobre acento',K4:'«Ignorar»'},
 en:{A1:'text on background',A2:'secondary on card',A3:'tag on #242B34',A4:'selected segment',A5:'“Save”',A6:'“Almost full”',A7:'avatar letter',K1:'text on strip',K2:'secondary on strip',K3:'“guessed” chip on accent',K4:'“Ignore”'}};
const fmt=(v,l)=>l==='en'?v.toFixed(1):v.toFixed(1).replace('.',',');

/* ================= приложение ================= */
const sbar='<div class="sbar"><span>9:41</span><span class="sig"><i class="wf"></i><i></i></span></div>';
const hb='<div class="homebar"><i></i></div>';
const fic=k=>I[k];
const APP={
 list:c=>`${sbar}<div class="kb-contact-hd"><span class="kb-contact-cb" role="button" aria-label="${c.back}">${I.back}</span><span class="kb-contact-ht">${c.kbd}</span><span class="kb-contact-cb" role="button" aria-label="${c.add}">${I.plus}</span></div>
<div class="kb-contact-body"><h2 class="kb-contact-h">${c.lH}</h2><p class="kb-contact-sub">${c.lSub}</p>
${c.folders.map(([k,n,d])=>{const ps=c.people.filter(p=>p[0]===k);return `<div class="kb-contact-gh">${fic(k)}${n}<span class="d">${d}</span></div><div class="kb-contact-grp">${ps.map(p=>`<div class="kb-contact-row" role="button">${av(p[5],p[6])}<div><b>${p[1]}${p[2]?` <small>· ${p[2]}</small>`:''}</b><span class="s"><span class="kb-contact-pl">${p[3]}</span><span class="kb-contact-pl">${p[4]}</span></span></div><span class="kb-contact-chev">${I.chev}</span></div>`).join('')}</div>`;}).join('')}
</div>${hb}`,
 folder:c=>{const pct=Math.round(c.note.length/140*100);return `${sbar}<div class="kb-contact-hd"><span class="kb-contact-cb" role="button" aria-label="${c.back}">${I.back}</span><span class="kb-contact-ht">${c.lH}</span><span class="kb-contact-cb" role="button" aria-label="${c.moreA}">${I.more}</span></div>
<div class="kb-contact-body"><div class="kb-contact-id">${av(c.fAv,c.fAv==='P'?0:1)}<div><h2>${c.fName}</h2><span class="kb-contact-fold" role="button">${I.home}${c.fFolderL}&nbsp;<b>${c.fFolder}</b>${I.down}</span></div></div>
<div class="kb-contact-f"><div class="kb-contact-lb">${c.lRole}</div><div class="kb-contact-chips" role="radiogroup">${c.roles.map((r,i)=>`<span class="kb-contact-chip${i===0?' on':''}" role="radio" aria-checked="${i===0}">${i===0?I.check:''}${r}</span>`).join('')}<span class="kb-contact-chip add" role="button" aria-label="${c.roleAdd}">${I.plus}</span></div></div>
<div class="kb-contact-f"><div class="kb-contact-lb">${c.lAddr}</div><div class="kb-contact-seg" role="radiogroup">${c.addr.map((r,i)=>`<span role="radio" aria-checked="${i===1}">${i===1?I.check:''}${r}</span>`).join('')}</div></div>
<div class="kb-contact-f"><div class="kb-contact-lb">${c.lTone}</div><div class="kb-contact-seg" role="radiogroup">${c.tones.map((r,i)=>`<span role="radio" aria-checked="${i===2}">${i===2?I.check:''}${r}</span>`).join('')}</div></div>
<div class="kb-contact-f" style="margin-bottom:0"><div class="kb-contact-lb">${c.lNote}</div><div class="kb-contact-note"><p>${c.note}<i class="kb-contact-car"></i></p>
<div class="kb-contact-meter"><span class="kb-contact-bar" role="meter" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${c.left}"><i style="width:${pct}%"></i></span><span class="kb-contact-left">${I.clock}${c.left}</span></div></div>
<div class="kb-contact-tip">${I.info}<span>${c.tip}</span></div></div>
</div><div class="kb-contact-bot"><div class="kb-contact-btn" role="button">${c.save}</div></div>${hb}`;},
 empty:c=>`${sbar}<div class="kb-contact-hd"><span class="kb-contact-cb" role="button" aria-label="${c.back}">${I.back}</span><span class="kb-contact-ht">${c.kbd}</span><span style="width:44px"></span></div>
<div class="kb-contact-body"><h2 class="kb-contact-h">${c.lH}</h2>
<div class="kb-contact-em"><img src="../../brandbook/assets/mascot/mascot-happy-dark.svg" alt=""><h3>${c.eH}</h3><p>${c.eP}</p>
<div class="kb-contact-ex">${c.eEx.map(([k,n,d])=>`<div class="kb-contact-exr">${fic(k)}<b>${n}</b><span>${d}</span></div>`).join('')}</div></div></div>
<div class="kb-contact-bot"><div class="kb-contact-btn" role="button">${I.plus}${c.add}</div><div class="kb-contact-btn2" role="button">${c.eHow}</div></div>${hb}`
};
const appScr=(id,c)=>`<div class="scr kb-contact-app" lang="${c.html}">${APP[id](c)}</div>`;

/* ================= клавиатура ================= */
const ROWS={ru:['йцукенгшщзх','фывапролджэ','ячсмитьбю'],es:['qwertyuiop','asdfghjklñ','zxcvbnm'],en:['qwertyuiop','asdfghjkl','zxcvbnm']};
const BAR=[['imp',parrot],['tr',()=>I.tr],['dict',()=>I.mic],['voice',()=>I.voice],['set',()=>I.gear]];
function keys(c,up){
 const R=ROWS[c.kb];
 const k=ch=>`<span class="kb-contact-k" role="button">${up?ch.toLocaleUpperCase(c.kb):ch}</span>`;
 const row=s=>[...s].map(k).join('');
 const half=R[1].length<R[0].length?'<span class="kb-contact-hp"></span>':'';
 return `<div class="kb-contact-r">${row(R[0])}</div><div class="kb-contact-r">${half}${row(R[1])}${half}</div>
<div class="kb-contact-r"><span class="kb-contact-k f w" role="button" aria-label="${c.shift}"${up?' aria-pressed="true"':''}>${up?I.shiftOn:I.shift}</span><span class="kb-contact-g"></span>${row(R[2])}<span class="kb-contact-g"></span><span class="kb-contact-k f w" role="button" aria-label="${c.del}">${I.del}</span></div>
<div class="kb-contact-r"><span class="kb-contact-k f n" role="button" aria-label="${c.num}">123</span><span class="kb-contact-k p" role="button">,</span><span class="kb-contact-k sp" role="button"><i>‹</i>${c.space}<i>›</i></span><span class="kb-contact-k p" role="button">.</span><span class="kb-contact-k rt" role="button" aria-label="${c.ret}">${I.ret}</span></div>`;}
const car='<i class="kb-contact-kcar"></i>';
const KB={
 row:c=>({field:car+`<span class="pl">${c.ph}</span>`,up:1,send:0,
  strip:`<div class="kb-contact-strip row" role="radiogroup"><span class="kb-contact-kc on" role="radio" aria-checked="true">${av(c.whoAv,c.whoAv==='P'?0:1)}<span><b>${c.who}</b><small>${c.guess}</small></span></span>${c.kOthers.map(([n,a,ci],i)=>`${i?'<i class="kb-contact-kd"></i>':''}<span class="kb-contact-kc" role="radio" aria-checked="false">${n}</span>`).join('')}<span class="kb-contact-kc more" role="button" aria-label="${c.kMore}">${I.down}</span></div>`}),
 'keyboard-hint':c=>({field:c.draft+car,up:0,send:1,
  strip:`<div class="kb-contact-strip">${I.reply}<span class="tx"><b>${c.hB}</b><span>${c.hS}</span></span><span class="kb-contact-a" role="button">${I.x}${c.hX}</span></div>`})
};
function kbScr(id,light,c){
 const s=KB[id](c);
 const bar=BAR.map(([n,f])=>`<span class="kb-contact-ib" role="button" aria-label="${c[n]}">${f()}</span>`).join('');
 const msgs=c.msgs.map(([d,t,tm])=>`<div class="m ${d}">${t}<span class="tm">${tm}</span></div>`).join('');
 return `<div class="scr kb-contact-scr ${light?'light':''}" lang="${c.html}">${sbar}
<div class="nav"><span class="bk">${I.back}</span><span class="av" style="background:${AVC[c.whoAv==='P'?0:1]}">${c.whoAv}</span><span class="nm"><b>${c.who}</b><span>${c.online}</span></span></div>
<div class="msgs"><div class="day">${c.today}</div>${msgs}</div>
<div class="inp"><span class="f"><span>${s.field}</span></span><span class="sd${s.send?'':' off'}">${I.send}</span></div>
<div class="kb-contact-kb">${s.strip}<div class="kb-contact-tbar">${bar}</div><div class="kb-contact-rows">${keys(c,s.up)}</div><div class="kb-contact-home"><i></i></div></div></div>`;}

const phApp=(id,sc,c)=>`<div class="pf p67" style="--s:${sc}"><div class="shell"></div><div class="glass">${appScr(id,c)}</div></div>`;
const phKb=(id,l,sc,c)=>`<div class="pf p67 ${l?'light':''}" style="--s:${sc}"><div class="shell"></div><div class="glass">${kbScr(id,l,c)}</div></div>`;
const ORDER=[['list','app'],['folder','app'],['row','kb'],['keyboard-hint','kb'],['empty','app']];

function render(L){
 const c=D[L];pmN=0;
 document.documentElement.lang=c.html;document.title=c.title;
 const $=id=>document.getElementById(id);
 $('kb-contact-lng').innerHTML=['ru','es','en'].map(x=>`<a href="?l=${x}" data-l="${x}" aria-current="${x===L}" lang="${x}">${x.toUpperCase()}</a>`).join('');
 $('kb-contact-t-draft').textContent=c.t_draft;$('kb-contact-t-mock').textContent=c.t_mock;
 $('kb-contact-h1').textContent=c.h1;$('kb-contact-lead').textContent=c.lead;
 $('kb-contact-h-st').textContent=c.hSt;$('kb-contact-p-st').textContent=c.pSt;
 $('kb-contact-hero').innerHTML=
 `<figure data-shot="kb-contact--${L}">${phApp('folder',1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capF[0]}</b><span>${c.capF[1]}</span></div></div></figure>
<figure>${phKb('keyboard-hint',1,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capH[0]}</b><span>${c.capH[1]}</span></div></div></figure>`;
 $('kb-contact-grid').innerHTML=ORDER.map(([id,t])=>
 `<article class="kb-contact-st"><h3>${c.st[id][0]}<code>${id}</code><span class="kb-contact-where">${t==='app'?c.app:c.kbw}</span></h3><p>${c.st[id][1]}</p><div class="kb-contact-pair${t==='app'?' kb-contact-one':''}">`+
 (t==='app'?`<figure data-shot="kb-contact--${id}--${L}">${phApp(id,.6,c)}</figure>`:
 `<figure data-shot="kb-contact--${id}--light--${L}">${phKb(id,1,.6,c)}<div class="pcap"><div><b>${c.light}</b></div></div></figure>
<figure data-shot="kb-contact--${id}--dark--${L}">${phKb(id,0,.6,c)}<div class="pcap"><div><b>${c.dark}</b></div></div></figure>`)+`</div></article>`).join('');
 const cs=t=>PAIRS[t].map(([k,a,b])=>`${PL[L][k]} ${fmt(cr(a,b),L)}`).join('; ');
 const tok=TOK[L].map(x=>x.replace('CONTRAST_A',cs('A')).replace('CONTRAST_L',cs('L')).replace('CONTRAST_D',cs('D')));
 $('kb-contact-notes').innerHTML=`<div><h2>${c.hDec}</h2><ul>${c.dec.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hTok}</h2><ul>${tok.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hNo}</h2><ul>${c.no.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 document.body.dataset.lang=L;
}
let L0=new URLSearchParams(location.search).get('l');if(!D[L0])L0='ru';
render(L0);
document.getElementById('kb-contact-lng').addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(!a)return;e.preventDefault();const l=a.dataset.l;try{history.replaceState(null,'','?l='+l)}catch(_){}render(l);});
document.body.dataset.ready='1';
</script>
</body>
</html>
