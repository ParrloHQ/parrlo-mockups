<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo · клавиатура, языки и диктовка</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.kb-switch-w{max-width:1200px;margin:0 auto}
.kb-switch-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.kb-switch-tags{display:flex;gap:8px;flex-wrap:wrap}
.kb-switch-tag{display:inline-block;font:600 13px/20px Inter,sans-serif;color:#0E1116;background:#FFC247;border-radius:8px;padding:2px 10px}
.kb-switch-tag.m{background:#2F3742;color:#F2F5F7}
.kb-switch-lng{display:flex;gap:4px;background:#171C23;border-radius:14px;padding:4px}
.kb-switch-lng a{min-width:56px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 15px Inter,sans-serif;color:#C5CCD5;text-decoration:none}
.kb-switch-lng a[aria-current="true"]{background:#2BC48A;color:#0E1116}
.kb-switch-w h1{font:900 36px/1.15 Nunito,sans-serif;margin:0 0 8px}
.kb-switch-w h2{font:900 24px/1.2 Nunito,sans-serif;margin:0 0 8px}
.kb-switch-lead{color:#9AA4B2;max-width:760px;margin:0 0 32px}
.kb-switch-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;padding:48px 24px 40px;border-radius:32px;background:#171C23}
.kb-switch-hero figure,.kb-switch-st figure{margin:0}
.kb-switch-sec{margin-top:64px}
.kb-switch-sec>p{color:#9AA4B2;margin:0 0 24px;max-width:760px}
.kb-switch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(600px,1fr));gap:24px}
.kb-switch-st{background:#171C23;border-radius:24px;padding:24px}
.kb-switch-st h3{font:900 20px/1.25 Nunito,sans-serif;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kb-switch-st h3 code{font:500 13px ui-monospace,Menlo,monospace;color:#9AA4B2;background:#0E1116;border-radius:6px;padding:1px 6px}
.kb-switch-st>p{margin:0 0 20px;color:#9AA4B2;font-size:15px}
.kb-switch-pair{display:flex;gap:20px;justify-content:center}
.kb-switch-pair .pcap{margin-top:10px;font-size:13px}
.kb-switch-pair .pcap b{font-size:14px}
.kb-switch-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-switch-notes h2{font-size:20px;margin:0 0 10px}
.kb-switch-notes ul{margin:0;padding-left:20px;color:#9AA4B2}
.kb-switch-notes li{margin:6px 0}
.kb-switch-notes b{color:#F2F5F7;font-weight:600}
.kb-switch-st .pf{--s:.6!important}
@media (max-width:660px){
 .kb-switch-grid{grid-template-columns:1fr}
 .kb-switch-st{padding:16px}
 .kb-switch-pair{gap:12px}
 .kb-switch-st .pf{--s:.345!important}
 .kb-switch-hero{padding:24px 8px;gap:24px}
 .kb-switch-hero .pf{--s:.76!important}
 .kb-switch-w h1{font-size:28px}
}

/* ===== экран 430×932: нейтральный мессенджер + клавиатура Parrlo ===== */
.scr.light{--kb-bg:#D3D7DC;--kb-key:#FFFFFF;--kb-key2:#ABB2BB;--kb-tx:#0E1116;--kb-sec:#5B6472;--kb-sh:0 1px 0 rgba(0,0,0,.3);--kb-acc:#00875C;--kb-onacc:#FFFFFF;--kb-line:#D5DBE1}
.scr:not(.light){--kb-bg:#1B1F25;--kb-key:#3A414B;--kb-key2:#2A3038;--kb-tx:#F2F5F7;--kb-sec:#C5CCD5;--kb-sh:0 1px 0 rgba(0,0,0,.6);--kb-acc:#2BC48A;--kb-onacc:#0E1116;--kb-line:#4A525D}
.kb-switch-scr .nav{padding:6px 16px 10px}
.kb-switch-scr .nav .av{color:#0E1116}
.kb-switch-scr .msgs{padding:12px 16px}
.kb-switch-scr .m{max-width:78%}
.kb-switch-scr .m .tm{opacity:1;color:var(--sec)}
.kb-switch-scr .m.out .tm{color:inherit;opacity:.85}
.kb-switch-scr.light .m.out .tm{color:#3E5A4D;opacity:1}
.kb-switch-scr .inp{padding:8px 12px 10px;align-items:flex-end}
.kb-switch-scr .inp .f{color:var(--tx);flex:1;min-width:0;padding:8px 14px;line-height:24px;font-size:17px;border-radius:20px;min-height:42px}
.kb-switch-scr .inp .f .pl{color:var(--sec)}
.kb-switch-scr .inp .sd{flex:none;width:38px;height:38px;margin-bottom:2px}
.kb-switch-scr .inp .sd.off{background:var(--sf2);color:var(--sec)}
.kb-switch-car{display:inline-block;width:2px;height:22px;background:var(--acc);vertical-align:-5px;margin-left:1px}
.kb-switch-kb{flex:none;background:var(--kb-bg);padding:0 3px;color:var(--kb-tx)}
/* полоса над панелью — 60 pt, как в kb-switch */
.kb-switch-strip{position:relative;margin:8px 5px 0;height:60px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);padding:0 4px 0 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:19px;overflow:hidden}
.kb-switch-strip>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-switch-strip .tx{flex:1;min-width:0}
.kb-switch-strip .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-switch-strip .tx span{display:block;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-switch-pill{flex:none;height:44px;display:flex;align-items:center;padding:0 4px}
.kb-switch-pill span{height:32px;border-radius:16px;background:var(--kb-key2);display:flex;align-items:center;gap:5px;padding:0 8px 0 12px;font:700 13px Inter,sans-serif;letter-spacing:.02em}
.kb-switch-pill svg{width:16px;height:16px}
/* подсказки слов при наборе */
.kb-switch-strip.sg{padding:0 4px;gap:0}
.kb-switch-sg{flex:1 1 0;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;font:500 16px Inter,sans-serif;border-radius:10px;white-space:nowrap}
.kb-switch-sg.on{background:var(--kb-bg)}
.kb-switch-sgd{flex:none;width:1px;height:28px;background:var(--kb-line)}
/* черновик готов: два действия */
.kb-switch-strip.go{padding:0 8px;gap:8px}
.kb-switch-a{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font:700 15px Inter,sans-serif;white-space:nowrap}
.kb-switch-a svg{flex:none;width:22px;height:22px}
.kb-switch-a .pm{width:21px;height:21px}
.kb-switch-a.p{flex:1 1 auto;min-width:0;background:var(--kb-acc);color:var(--kb-onacc)}
.kb-switch-a.s{flex:none;background:var(--kb-key2);color:var(--kb-tx)}
.kb-switch-a.p small{font:700 12px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor}
.scr:not(.light) .kb-switch-pop{background:#4A525D}
/* панель иконок */
.kb-switch-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:4px}
.kb-switch-ib{width:64px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-switch-ib svg{width:26px;height:26px}
.kb-switch-ib .pm{width:25px;height:25px}
/* клавиши */
.kb-switch-rows{position:relative;display:flex;flex-direction:column;gap:11px;padding-top:6px}
.kb-switch-r{display:flex;gap:5px}
.kb-switch-k{position:relative;flex:1 1 0;min-width:0;height:45px;border-radius:8px;background:var(--kb-key);box-shadow:var(--kb-sh);color:var(--kb-tx);display:flex;align-items:center;justify-content:center;font:400 24px/1 Inter,sans-serif}
.kb-switch-k.f{background:var(--kb-key2)}
.kb-switch-k.f svg{width:23px;height:23px}
.kb-switch-k.w{flex:1.38 1 0}
.kb-switch-g{flex:.18 1 0}
.kb-switch-hp{flex:.5 1 0}
.kb-switch-k.n{flex:1.25 1 0;font-size:17px;font-weight:500}
.kb-switch-k.p{flex:.85 1 0}
.kb-switch-k.sp{flex:4.4 1 0;font-size:16px;gap:10px}
.kb-switch-k.sp i{font-style:normal;color:var(--kb-sec);font-size:18px}
.kb-switch-k.rt{flex:1.55 1 0;background:var(--kb-acc);color:var(--kb-onacc);box-shadow:none}
.kb-switch-k.rt svg{width:25px;height:25px}
/* нажатая клавиша: увеличенная буква над ней */
.kb-switch-k.pr{background:transparent;box-shadow:none;color:transparent}
.kb-switch-pop{position:absolute;left:-7px;right:-7px;bottom:0;height:108px;border-radius:12px 12px 9px 9px;background:var(--kb-key);box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);color:var(--kb-tx);display:flex;justify-content:center;padding-top:10px;font:400 36px/1 Inter,sans-serif;z-index:2;clip-path:polygon(0 0,100% 0,100% 52%,calc(100% - 7px) 60%,calc(100% - 7px) 100%,7px 100%,7px 60%,0 52%)}
.kb-switch-home{height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.kb-switch-home i{width:140px;height:5px;border-radius:3px;background:var(--kb-tx)}
/* ===== добавлено для kb-switch: состояния полосы ===== */
.scr.light{--kb-err:#C42B1F;--kb-rec:#C42B1F;--kb-track:#E3E7EB}
.scr:not(.light){--kb-err:#FF8A80;--kb-rec:#FF6B5E;--kb-track:#4A525D}
.kb-switch-strip>svg.ok{color:var(--kb-acc)}
.kb-switch-strip>svg.er{color:var(--kb-err)}
.kb-switch-strip>svg.nt{color:var(--kb-tx)}
.kb-switch-strip.st{padding-right:8px}
.kb-switch-strip.pg{padding-bottom:8px}
.kb-switch-strip.pg .tx{padding-left:4px}
.kb-switch-a.s .un{width:20px;height:20px}
.kb-switch-a.q{flex:none;background:transparent;color:var(--kb-tx);padding:0 12px}
.kb-switch-a.p.n{flex:none}
.kb-switch-a.p.n svg{width:20px;height:20px}
.kb-switch-prog{position:absolute;left:12px;right:12px;bottom:6px;height:3px;border-radius:2px;background:var(--kb-track);overflow:hidden}
.kb-switch-prog i{position:absolute;top:0;bottom:0;left:22%;width:38%;border-radius:2px;background:var(--kb-acc);animation:kb-switch-run 1.4s ease-in-out infinite}
@keyframes kb-switch-run{0%{left:22%}45%{left:100%}45.01%{left:-40%}100%{left:22%}}
/* иконка панели: активна / занята / недоступна */
.kb-switch-ib.on{background:var(--kb-acc);color:var(--kb-onacc)}
.kb-switch-ib.off{opacity:.36}
.kb-switch-spin{animation:kb-switch-rot 1s linear infinite;transform-origin:12px 12px}
@keyframes kb-switch-rot{to{transform:rotate(360deg)}}
/* диктовка: полоса «Идёт запись» */
.kb-switch-strip.rec{padding:0 8px 0 4px;gap:8px}
.kb-switch-rx{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-switch-rx span{width:34px;height:34px;border-radius:50%;background:var(--kb-key2);display:flex;align-items:center;justify-content:center}
.kb-switch-rx svg{width:18px;height:18px}
.kb-switch-rdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--kb-rec)}
.kb-switch-rl{flex:none;font:600 15px/20px Inter,sans-serif;white-space:nowrap}
.kb-switch-rt{flex:none;font:500 15px/20px Inter,sans-serif;color:var(--kb-sec);font-variant-numeric:tabular-nums}
.kb-switch-wv{flex:1;min-width:0;height:30px;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.kb-switch-wv i{flex:none;width:3px;border-radius:2px;background:var(--kb-acc)}
/* диктовка: чип «Вставить» вместо панели иконок */
.kb-switch-insr{height:48px;display:flex;align-items:center;padding:0 5px;margin-top:4px}
.kb-switch-ins{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;font:400 14px/18px Inter,sans-serif;color:var(--kb-tx)}
.kb-switch-ins>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-switch-ins .t{flex:1;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.kb-switch-ins .t b{font-weight:700}
.kb-switch-ins small{flex:none;font:700 12px/18px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor;color:var(--kb-sec)}
@media (prefers-reduced-motion:reduce){.kb-switch-spin,.kb-switch-prog i{animation:none}}
/* ===== добавлено для kb-switch ===== */
/* полоса «три языка» во время смахивания */
.kb-switch-strip.lx{padding:0;display:block}
.kb-switch-lxr{position:absolute;top:8px;left:4px;width:406px;height:44px;display:flex}
.kb-switch-lxr span{flex:1 1 0;display:flex;align-items:center;justify-content:center;font:500 16px/20px Inter,sans-serif;white-space:nowrap}
.kb-switch-th{position:absolute;top:8px;height:44px;width:135.33px;border-radius:12px;background:var(--kb-acc);overflow:hidden}
.kb-switch-th .kb-switch-lxr{top:0;color:var(--kb-onacc)}
.kb-switch-th .kb-switch-lxr span{font-weight:700}
/* пробел: подпись едет, палец */
.kb-switch-k.sp.dn{background:var(--kb-key2)}
.kb-switch-k.sp.dn i{color:var(--kb-tx)}
.kb-switch-sv{position:relative;width:112px;height:24px;overflow:hidden}
.kb-switch-sv b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:400;white-space:nowrap}
.kb-switch-tp{position:absolute;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(14,17,22,.08);box-shadow:inset 0 0 0 2px rgba(14,17,22,.4);z-index:3;pointer-events:none}
.scr:not(.light) .kb-switch-tp{background:rgba(242,245,247,.1);box-shadow:inset 0 0 0 2px rgba(242,245,247,.55)}
.kb-switch-tl{position:absolute;top:50%;height:50px;margin-top:-25px;border-radius:25px;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(14,17,22,.12),rgba(14,17,22,0))}
.scr:not(.light) .kb-switch-tl{background:linear-gradient(90deg,rgba(242,245,247,.16),rgba(242,245,247,0))}
.kb-switch-ar{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;color:var(--kb-tx);opacity:.7;z-index:3}
/* раскладка перетекает: два слоя букв */
.kb-switch-lay{display:flex;flex-direction:column;gap:11px}
.kb-switch-lay.a{position:absolute;left:0;right:0;top:6px}
/* диктовка: сказанное и собранное — одна карточка */
.kb-switch-live .t{flex:1;min-width:0;display:flex;justify-content:flex-end;overflow:hidden;white-space:nowrap;color:var(--kb-sec);-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.kb-switch-live .t span{flex:none}
.kb-switch-live>svg{color:var(--kb-tx)}
.kb-switch-a.s .ic{width:20px;height:20px}
/* карточки текста сайта */
.kb-switch-copy{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:24px}
.kb-switch-copy article{background:#171C23;border-radius:20px;padding:20px}
.kb-switch-copy small{display:block;font:600 13px/20px Inter,sans-serif;color:#2BC48A;letter-spacing:.02em}
.kb-switch-copy h3{font:900 20px/1.25 Nunito,sans-serif;margin:4px 0 8px}
.kb-switch-copy p{margin:0;color:#9AA4B2;font-size:15px}
.kb-switch-copy code{font:500 12px ui-monospace,Menlo,monospace;color:#9AA4B2}
.kb-switch-st.main{box-shadow:inset 0 0 0 2px #2BC48A}
</style>
</head>
<body>
<div class="kb-switch-w">
<div class="kb-switch-top"><div class="kb-switch-tags"><span class="kb-switch-tag" id="kb-switch-t-draft"></span><span class="kb-switch-tag m" id="kb-switch-t-mock"></span></div>
<nav class="kb-switch-lng" id="kb-switch-lng" aria-label="Language"></nav></div>
<h1 id="kb-switch-h1"></h1>
<p class="kb-switch-lead" id="kb-switch-lead"></p>
<div class="kb-switch-hero" id="kb-switch-hero"></div>
<div class="kb-switch-copy" id="kb-switch-copy"></div>
<section class="kb-switch-sec">
<h2 id="kb-switch-h-st"></h2>
<p id="kb-switch-p-st"></p>
<div class="kb-switch-grid" id="kb-switch-grid"></div>
</section>
<section class="kb-switch-sec kb-switch-notes" id="kb-switch-notes"></section>
</div>
<script>
const SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
let pmN=0;
/* «Улучшить» — монохромный попугай Parrlo (ключ spark из screens.js), маска с уникальным id */
const parrot=()=>{const id='kb-switch-pm'+(++pmN);return `<svg class="pm" viewBox="180 140 735 840" fill="currentColor" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><circle cx="612" cy="372" r="44" fill="#000"/><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z" fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"/></mask></defs><g mask="url(#${id})"><path d="M345 800 L 235 925 L 420 895 Z" stroke="currentColor" stroke-width="70" stroke-linejoin="round"/><circle cx="500" cy="640" r="245"/><circle cx="560" cy="395" r="235"/></g><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z"/></svg>`;};
const I={
tr:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><path d="M3 5h9M7.5 3v2M5 5c.5 3 2.5 6 6 7.5M10 5c-.8 3.5-3 6.5-6.5 8"/><path d="M12.5 21l4-10 4 10M14 17.5h5"/></svg>`,
mic:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11.5a7 7 0 0 0 14 0"/><path d="M12 18.5v3"/></svg>`,
voice:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><path d="M3.5 9.5v5h3.5l4.5 4V5.5L7 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8.2 8.2 0 0 1 0 11.4"/></svg>`,
gear:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
chev:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>`,
shift:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8 8.5h-4.5v7.5h-7V12H4z"/></svg>`,
shiftOn:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8 8.5h-4.5v7.5h-7V12H4z"/></svg>`,

  '<b>Una sola estructura para todos los fotogramas</b>, la de kb-before y kb-translate: conversación, campo, franja de 60 pt, panel y teclado. En el gesto solo cambian la barra espaciadora, la franja y las letras, así que el vídeo se monta superponiéndolos.',

  '<b>Franja de «tres idiomas» durante el gesto</b> (idea nueva, no está en la versión): se ve adónde vas y cuántos idiomas hay. El actual va relleno y en negrita, no solo con color. Al soltar la barra, la franja vuelve enseguida a su aspecto normal.',

  '<b>Nombres de idioma en su propia lengua</b>: «Русский», «Español», «English» en cualquier interfaz, como en los teclados del sistema.',
  '<b>Por qué cambiar de idioma aquí</b>: en el campo ya está la traducción al ruso de kb-translate, y añadir una palabra a mano en el idioma de la otra persona es justo el caso.',
  '<b>El dictado demuestra que te escucha</b>: lo que dices aparece en una línea bajo «Grabando», con todos los «pues». Tras «Listo», en el mismo sitio, la frase clara en el chip «Insertar». Solo entra en el campo al tocarlo; después, «Deshacer» (§9) recupera lo dicho tal cual.',
  '<b>El dictado es en tu idioma</b>, como dice el §9: en el chip, el mismo borrador en español de kb-before; para traducirlo, toca «Traducir».',
  '<b>El dedo es un círculo semitransparente con estela</b>: en el vídeo lo sustituirá un toque real.'],

  '<b>One skeleton for every frame</b>, the same as kb-before and kb-translate: thread, field, 60 pt strip, toolbar and layout. During the swipe only the space bar, the strip and the letters change, so the video can be cut by simply overlaying frames.',

  '<b>Language names in their own language</b>: “Русский”, “Español”, “English” in every interface, as on system keyboards.',
  '<b>Why switch here</b>: the field already holds the Spanish translation from kb-translate, and adding a word by hand in the other person’s language is exactly the case for a swipe.',
  '<b>Dictation shows it’s listening</b>: what you say runs in a line under the Recording strip, ums and all. After Done, the same spot shows a clear sentence in the Insert chip. It goes into the field only when tapped; afterwards Undo (§9) brings back your exact words.',
  '<b>Dictation stays in your language</b>, as §9 says: the chip holds the same English draft as kb-before; tap Translate next to translate it.',
  '<b>The finger is a translucent circle with a trail</b>: in the video a real touch replaces it.'],
 hTok:'Tokens and contrast',
 hNo:'Not approved',no:[
  'All copy is draft; Spanish and English have not been proofread by native speakers.',
  'Swipe direction and language order: switching exists in the build (keyboard GAP, row 2) but hasn’t been tested on a phone.',
  'The “three languages” strip is a mockup idea; needs a decision on whether it goes into the app.',
  'Mid‑swipe in the video: layout crossfade or slide; decide at the shoot.',
  'Dictation differs from kb-translate: there the chip is already translated, here it’s clear text in your own language, as in §9. Pick one before the shoot.',
  'The Recording strip inside the keyboard is the post‑launch option; at launch, recording happens in Parrlo Translate.',
  '“Ums and likes taken out”: check that cleanup works this way in the build.',
  'The messenger is made up and neutral; on the site the scenario is named “WhatsApp” in text, without a logo.']}
};
const TOK={
ru:[
 '<b>Светлая:</b> фон #D3D7DC, клавиши и полоса #FFFFFF, служебные и нажатый пробел #ABB2BB, текст #0E1116, вторичный #5B6472, акцент #00875C / #FFFFFF, точка записи #C42B1F; чат — фон #FFFFFF, входящие #E9EDF0, исходящие #D6F5E5.',
 '<b>Тёмная:</b> фон #1B1F25, клавиши и полоса #3A414B, служебные и нажатый пробел #2A3038, текст #F2F5F7, вторичный #C5CCD5, акцент #2BC48A / #0E1116, точка записи #FF6B5E; чат — фон #0E1116, входящие #242B34, исходящие #00875C.',
 '<b>Контраст, светлая:</b> CONTRAST_L.','<b>Контраст, тёмная:</b> CONTRAST_D.',

 '<b>Не только цветом:</b> текущий язык — заливка и жирный, запись — точка, таймер и слова «Идёт запись», готовый текст — галочка и «Текст готов».',

es:[
 '<b>Claro:</b> fondo #D3D7DC, teclas y franja #FFFFFF, teclas de función y espacio pulsado #ABB2BB, texto #0E1116, secundario #5B6472, acento #00875C / #FFFFFF, punto de grabación #C42B1F; chat: fondo #FFFFFF, recibidos #E9EDF0, enviados #D6F5E5.',

en:[
 '<b>Light:</b> background #D3D7DC, keys and strip #FFFFFF, function keys and pressed space #ABB2BB, text #0E1116, secondary #5B6472, accent #00875C / #FFFFFF, recording dot #C42B1F; chat: background #FFFFFF, incoming #E9EDF0, outgoing #D6F5E5.',
 '<b>Dark:</b> background #1B1F25, keys and strip #3A414B, function keys and pressed space #2A3038, text #F2F5F7, secondary #C5CCD5, accent #2BC48A / #0E1116, recording dot #FF6B5E; chat: background #0E1116, incoming #242B34, outgoing #00875C.',

function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS={
 L:[['T1','#0E1116','#FFFFFF'],['T2','#5B6472','#FFFFFF'],['T3','#FFFFFF','#00875C'],['T4','#0E1116','#ABB2BB'],['T6','#0E1116','#E9EDF0'],['T7','#3E5A4D','#D6F5E5'],['T8','#5B6472','#E9EDF0']],
 D:[['T1','#F2F5F7','#3A414B'],['T2','#C5CCD5','#3A414B'],['T3','#0E1116','#2BC48A'],['T4','#F2F5F7','#2A3038'],['T6','#F2F5F7','#242B34'],['T7','#FFFFFF','#00875C'],['T8','#9AA4B2','#242B34']]};
const PL={ru:{T1:'текст на клавише и полосе',T2:'сказанное в карточке',T3:'текущий язык, «Готово» на акценте',T4:'пробел под пальцем, «Заново»',T6:'входящее сообщение',T7:'исходящее и время в нём',T8:'время во входящем'},
 es:{T1:'texto en tecla y franja',T2:'lo dicho en la tarjeta',T3:'idioma actual y «Listo» sobre acento',T4:'espacio pulsado, «Repetir»',T6:'mensaje recibido',T7:'mensaje enviado y su hora',T8:'hora en recibido'},
 en:{T1:'text on keys and strip',T2:'spoken words in the card',T3:'current language, Done on accent',T4:'pressed space bar, Redo',T6:'incoming message',T7:'outgoing message and its time',T8:'time in incoming'}};
const fmt=(v,l)=>l==='en'?v.toFixed(1):v.toFixed(1).replace('.',',');

/* раскладки — как в kb-before */
const ROWS={ru:['йцукенгшщзх','фывапролджэ','ячсмитьбю'],es:['qwertyuiop','asdfghjklñ','zxcvbnm'],en:['qwertyuiop','asdfghjkl','zxcvbnm']};
const BAR=[['imp',parrot],['tr',()=>I.tr],['dict',()=>I.mic],['voice',()=>I.voice],['set',()=>I.gear]];
function letters(kb,c,up){
 const R=ROWS[kb];
 const k=ch=>`<span class="kb-switch-k" role="button">${up?ch.toLocaleUpperCase(kb):ch}</span>`;
 const row=s=>[...s].map(k).join('');
 const half=R[1].length<R[0].length?'<span class="kb-switch-hp"></span>':'';
 return `<div class="kb-switch-r" lang="${kb}">${row(R[0])}</div><div class="kb-switch-r" lang="${kb}">${half}${row(R[1])}${half}</div>
<div class="kb-switch-r" lang="${kb}"><span class="kb-switch-k f w" role="button" aria-label="${c.shift}"${up?' aria-pressed="true"':''}>${up?I.shiftOn:I.shift}</span><span class="kb-switch-g"></span>${row(R[2])}<span class="kb-switch-g"></span><span class="kb-switch-k f w" role="button" aria-label="${c.del}">${I.del}</span></div>`;}
/* sw: {a,b,p} — смахивание с языка a на b, p = 0…1 */
function space(c,sw){
 if(!sw)return `<span class="kb-switch-k sp" role="button" aria-label="${c.spA}"><i>‹</i><span class="kb-switch-sv"><b>${NAME[c.kb]}</b></span><i>›</i></span>`;
 const {a,b,p}=sw,fx=72-58*p;
 const lab=p===0?`<b>${NAME[a]}</b>`:p===1?`<b>${NAME[b]}</b>`:
  `<b style="transform:translateX(-62%);opacity:.25" aria-hidden="true">${NAME[a]}</b><b style="transform:translateX(16%);opacity:.8">${NAME[b]}</b>`;
 const extra=p<1?`<span class="kb-switch-tl" style="left:${fx}%;width:${p?30:12}%"></span>`:'';
 return `<span class="kb-switch-k sp dn" role="button" aria-label="${c.spA}"><i>‹</i><span class="kb-switch-sv">${lab}</span><i>›</i>${extra}<span class="kb-switch-tp" style="left:${fx}%" aria-hidden="true"></span></span>`;}
function bottom(c,sw){
 return `<div class="kb-switch-r"><span class="kb-switch-k f n" role="button" aria-label="${c.num}">123</span><span class="kb-switch-k p" role="button">,</span>${space(c,sw)}<span class="kb-switch-k p" role="button">.</span><span class="kb-switch-k rt" role="button" aria-label="${c.ret}">${I.ret}</span></div>`;}
const SEG=135.33;
function lxStrip(c,p){
 const lab=c.order.map((l,i)=>`<span lang="${l}">${NAME[l]}</span>`).join('');
 const cur=c.order[p<.5?0:1];
 return `<div class="kb-switch-strip lx" role="radiogroup" aria-label="${c.lxA}"><div class="kb-switch-lxr" aria-hidden="true">${lab}</div><div class="kb-switch-th" style="left:${(4+p*SEG).toFixed(2)}px" role="radio" aria-checked="true" aria-label="${NAME[cur]}"><div class="kb-switch-lxr" style="left:${(-p*SEG).toFixed(2)}px" aria-hidden="true">${lab}</div></div></div>`;}

const car='<i class="kb-switch-car"></i>';
const WAVE=[8,14,22,12,26,18,28,16,10,20,24,14,8,18,26,12,6,4,4,4];
const recStrip=c=>`<div class="kb-switch-strip rec" role="status"><span class="kb-switch-rx" role="button" aria-label="${c.recX}"><span>${I.x}</span></span><i class="kb-switch-rdot"></i><span class="kb-switch-rl">${c.rec}</span><span class="kb-switch-rt">${c.recT}</span><span class="kb-switch-wv" aria-hidden="true">${WAVE.map(h=>`<i style="height:${h}px"></i>`).join('')}</span><span class="kb-switch-a p n" role="button">${c.recDone}</span></div>`;
const sw=(c,p)=>({a:c.order[0],b:c.order[1],p});
/* состояния: поле, полоса, панель, раскладка */
const S={
 'switch-1':c=>({field:c.out,flang:c.to,car:'post',send:1,strip:lxStrip(c,0),sw:sw(c,0),kb:c.order[0]}),
 'switch-2':c=>({field:c.out,flang:c.to,car:'post',send:1,strip:lxStrip(c,.5),sw:sw(c,.5),kb:c.order[1],fade:c.order[0]}),
 'switch-3':c=>({field:c.out,flang:c.to,car:'post',send:1,strip:lxStrip(c,1),sw:sw(c,1),kb:c.order[1]}),
 'dictation':c=>({field:`<span class="pl">${c.ph}</span>`,car:'pre',up:1,send:0,strip:recStrip(c),
  bar:`<div class="kb-switch-insr"><span class="kb-switch-ins kb-switch-live" role="status" aria-label="${c.heardA}">${I.wave}<span class="t"><span>${c.q[0]}${c.heard}</span></span></span></div>`}),
 'dictation-insert':c=>({field:`<span class="pl">${c.ph}</span>`,car:'pre',up:1,send:0,
  strip:`<div class="kb-switch-strip st" role="status">${I.check}<span class="tx"><b>${c.doneB}</b><span>${c.doneS}</span></span><span class="kb-switch-a s" role="button" aria-label="${c.againA}">${I.micS}${c.again}</span></div>`,
  bar:`<div class="kb-switch-insr"><span class="kb-switch-ins" role="button" aria-label="${c.insA}">${I.ins}<span class="t"><b>${c.insL}</b> ${c.q[0]}${c.draft}${c.q[1]}</span></span></div>`})
};
function screen(id,light,c){
 const s=S[id](c);
 const f=s.car==='pre'?car+s.field:s.field+car;
 const bar=s.bar||`<div class="kb-switch-bar">${BAR.map(([n,ic])=>`<span class="kb-switch-ib" role="button" aria-label="${c[n]}">${ic()}</span>`).join('')}</div>`;
 const msgs=c.msgs.map(([d,t,tm])=>`<div class="m ${d}">${t}<span class="tm">${tm}</span></div>`).join('');
 const kb=s.kb||c.kb;
 const lay=s.fade?`<div class="kb-switch-lay a" style="opacity:.22" aria-hidden="true">${letters(s.fade,c,s.up)}</div><div class="kb-switch-lay" style="opacity:.8">${letters(kb,c,s.up)}</div>`
  :`<div class="kb-switch-lay">${letters(kb,c,s.up)}</div>`;
 return `<div class="scr kb-switch-scr ${light?'light':''}" lang="${c.html}">
<div class="sbar"><span>9:41</span><span class="sig"><i class="wf"></i><i></i></span></div>
<div class="nav"><span class="bk">${I.back}</span><span class="av">${c.av}</span><span class="nm"><b>${c.who}</b><span>${c.online}</span></span></div>
<div class="msgs"><div class="day">${c.today}</div>${msgs}</div>
<div class="inp"><span class="f"><span${s.flang?` lang="${s.flang}"`:''}>${f}</span></span><span class="sd${s.send?'':' off'}">${I.send}</span></div>
<div class="kb-switch-kb">
${s.strip}
${bar}
<div class="kb-switch-rows">${lay}${bottom(c,s.sw)}</div>
<div class="kb-switch-home"><i></i></div></div></div>`;}
const ph=(id,l,sc,c)=>`<div class="pf p67 ${l?'light':''}" style="--s:${sc}"><div class="shell"></div><div class="glass">${screen(id,l,c)}</div></div>`;

function render(L){
 const c=D[L];
 document.documentElement.lang=c.html;document.title=c.title;
 const $=id=>document.getElementById(id);
 $('kb-switch-lng').innerHTML=['ru','es','en'].map(x=>`<a href="?l=${x}" data-l="${x}" aria-current="${x===L}" lang="${x}">${x.toUpperCase()}</a>`).join('');
 $('kb-switch-t-draft').textContent=c.t_draft;$('kb-switch-t-mock').textContent=c.t_mock;
 $('kb-switch-h1').textContent=c.h1;$('kb-switch-lead').textContent=c.lead;
 $('kb-switch-h-st').textContent=c.hSt;$('kb-switch-p-st').textContent=c.pSt;
 $('kb-switch-hero').innerHTML=
 `<figure data-shot="kb-switch--light--${L}">${ph('switch-3',1,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capL[0]}</b><span>${c.capL[1]}</span></div></div></figure>
<figure data-shot="kb-switch--dark--${L}">${ph('switch-3',0,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capD[0]}</b><span>${c.capD[1]}</span></div></div></figure>`;
 $('kb-switch-copy').innerHTML=c.copy.map(([n,k,h,t])=>`<article><small>${k} <code>${n}</code></small><h3>${h}</h3><p>${t}</p></article>`).join('');
 $('kb-switch-grid').innerHTML=Object.keys(S).map(id=>
 `<article class="kb-switch-st${id==='switch-3'?' main':''}"><h3>${c.st[id][0]}<code>${id}</code>${id==='switch-3'?`<code>${c.mainTag}</code>`:''}</h3><p>${c.st[id][1]}</p><div class="kb-switch-pair">
<figure data-shot="kb-switch--${id}--light--${L}">${ph(id,1,.6,c)}<div class="pcap"><div><b>${c.light}</b></div></div></figure>
<figure data-shot="kb-switch--${id}--dark--${L}">${ph(id,0,.6,c)}<div class="pcap"><div><b>${c.dark}</b></div></div></figure></div></article>`).join('');
 const cs=t=>PAIRS[t].map(([k,a,b])=>`${PL[L][k]} ${fmt(cr(a,b),L)}`).join('; ');
 const tok=TOK[L].map(x=>x.replace('CONTRAST_L',cs('L')).replace('CONTRAST_D',cs('D')));
 $('kb-switch-notes').innerHTML=`<div><h2>${c.hDec}</h2><ul>${c.dec.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hTok}</h2><ul>${tok.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hNo}</h2><ul>${c.no.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 document.body.dataset.lang=L;
}
let L0=new URLSearchParams(location.search).get('l');if(!D[L0])L0='ru';
render(L0);
document.getElementById('kb-switch-lng').addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(!a)return;e.preventDefault();const l=a.dataset.l;try{history.replaceState(null,'','?l='+l)}catch(_){}render(l);});
window.KB_SWITCH_RENDER=render;
document.body.dataset.ready='1';
</script>
