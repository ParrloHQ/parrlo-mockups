.chat-group-w{max-width:1200px;margin:0 auto}

.chat-group-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-group-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-group-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}

.chat-group-card{width:273px}

.chat-group-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-group-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}

/* раскрытый оригинал */

.chat-group-oga svg{width:16px;height:16px}

.chat-group-crow{display:flex;align-items:flex-end;gap:8px}

.chat-group-pa{display:flex;gap:8px;margin-top:10px}

.chat-group-pa .p{background:var(--acc);color:var(--onacc);font:900 16px/1 Nunito,sans-serif}

.chat-group-qa{display:flex;gap:8px;margin:16px 0 0}

.chat-group-ln{margin:12px 0 0;display:flex;gap:10px;border-radius:16px;background:#16241F;box-shadow:inset 0 0 0 1px rgba(191,242,220,.18);padding:10px 14px;font-size:14px;line-height:20px;color:#DCEFE6}

.chat-group-sh2{font:600 12px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin:20px 4px 8px}

.chat-group-code{flex:none;height:28px;min-width:40px;border-radius:8px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font:700 12px/1 Inter;letter-spacing:.06em;color:var(--tx);padding:0 8px}

.chat-group-li .ch{width:18px;height:18px;color:var(--sec);flex:none}

function qr(){var n=25,s='',seed=7;function r(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}
 function fin(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#0E1116"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#0E1116"/>'}
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){if((x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8))continue;if(r()>.52)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
 return '<svg viewBox="0 0 25 25" shape-rendering="crispEdges" aria-hidden="true"><g fill="#0E1116">'+s+'</g>'+fin(0,0)+fin(n-7,0)+fin(0,n-7)+'</svg>'}
