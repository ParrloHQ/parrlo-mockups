<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo · клавиатура, перевод</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.kb-translate-w{max-width:1200px;margin:0 auto}
.kb-translate-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.kb-translate-tags{display:flex;gap:8px;flex-wrap:wrap}
.kb-translate-tag{display:inline-block;font:600 13px/20px Inter,sans-serif;color:#0E1116;background:#FFC247;border-radius:8px;padding:2px 10px}
.kb-translate-tag.m{background:#2F3742;color:#F2F5F7}
.kb-translate-lng{display:flex;gap:4px;background:#171C23;border-radius:14px;padding:4px}
.kb-translate-lng a{min-width:56px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 15px Inter,sans-serif;color:#C5CCD5;text-decoration:none}
.kb-translate-lng a[aria-current="true"]{background:#2BC48A;color:#0E1116}
.kb-translate-w h1{font:900 36px/1.15 Nunito,sans-serif;margin:0 0 8px}
.kb-translate-w h2{font:900 24px/1.2 Nunito,sans-serif;margin:0 0 8px}
.kb-translate-lead{color:#9AA4B2;max-width:760px;margin:0 0 32px}
.kb-translate-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;padding:48px 24px 40px;border-radius:32px;background:#171C23}
.kb-translate-hero figure,.kb-translate-st figure{margin:0}
.kb-translate-sec{margin-top:64px}
.kb-translate-sec>p{color:#9AA4B2;margin:0 0 24px;max-width:760px}
.kb-translate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(600px,1fr));gap:24px}
.kb-translate-st{background:#171C23;border-radius:24px;padding:24px}
.kb-translate-st h3{font:900 20px/1.25 Nunito,sans-serif;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kb-translate-st h3 code{font:500 13px ui-monospace,Menlo,monospace;color:#9AA4B2;background:#0E1116;border-radius:6px;padding:1px 6px}
.kb-translate-st>p{margin:0 0 20px;color:#9AA4B2;font-size:15px}
.kb-translate-pair{display:flex;gap:20px;justify-content:center}
.kb-translate-pair .pcap{margin-top:10px;font-size:13px}
.kb-translate-pair .pcap b{font-size:14px}
.kb-translate-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-translate-notes h2{font-size:20px;margin:0 0 10px}
.kb-translate-notes ul{margin:0;padding-left:20px;color:#9AA4B2}
.kb-translate-notes li{margin:6px 0}
.kb-translate-notes b{color:#F2F5F7;font-weight:600}
.kb-translate-st .pf{--s:.6!important}
@media (max-width:660px){
 .kb-translate-grid{grid-template-columns:1fr}
 .kb-translate-st{padding:16px}
 .kb-translate-pair{gap:12px}
 .kb-translate-st .pf{--s:.345!important}
 .kb-translate-hero{padding:24px 8px;gap:24px}
 .kb-translate-hero .pf{--s:.76!important}
 .kb-translate-w h1{font-size:28px}
}

/* ===== экран 430×932: нейтральный мессенджер + клавиатура Parrlo ===== */
.scr.light{--kb-bg:#D3D7DC;--kb-key:#FFFFFF;--kb-key2:#ABB2BB;--kb-tx:#0E1116;--kb-sec:#5B6472;--kb-sh:0 1px 0 rgba(0,0,0,.3);--kb-acc:#00875C;--kb-onacc:#FFFFFF;--kb-line:#D5DBE1}
.scr:not(.light){--kb-bg:#1B1F25;--kb-key:#3A414B;--kb-key2:#2A3038;--kb-tx:#F2F5F7;--kb-sec:#C5CCD5;--kb-sh:0 1px 0 rgba(0,0,0,.6);--kb-acc:#2BC48A;--kb-onacc:#0E1116;--kb-line:#4A525D}
.kb-translate-scr .nav{padding:6px 16px 10px}
.kb-translate-scr .nav .av{color:#0E1116}
.kb-translate-scr .msgs{padding:12px 16px}
.kb-translate-scr .m{max-width:78%}
.kb-translate-scr .m .tm{opacity:1;color:var(--sec)}
.kb-translate-scr .m.out .tm{color:inherit;opacity:.85}
.kb-translate-scr.light .m.out .tm{color:#3E5A4D;opacity:1}
.kb-translate-scr .inp{padding:8px 12px 10px;align-items:flex-end}
.kb-translate-scr .inp .f{color:var(--tx);flex:1;min-width:0;padding:8px 14px;line-height:24px;font-size:17px;border-radius:20px;min-height:42px}
.kb-translate-scr .inp .f .pl{color:var(--sec)}
.kb-translate-scr .inp .sd{flex:none;width:38px;height:38px;margin-bottom:2px}
.kb-translate-scr .inp .sd.off{background:var(--sf2);color:var(--sec)}
.kb-translate-car{display:inline-block;width:2px;height:22px;background:var(--acc);vertical-align:-5px;margin-left:1px}
.kb-translate-kb{flex:none;background:var(--kb-bg);padding:0 3px;color:var(--kb-tx)}
/* полоса над панелью — 60 pt, как в kb-translate */
.kb-translate-strip{position:relative;margin:8px 5px 0;height:60px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);padding:0 4px 0 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:19px;overflow:hidden}
.kb-translate-strip>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-translate-strip .tx{flex:1;min-width:0}
.kb-translate-strip .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-translate-strip .tx span{display:block;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-translate-pill{flex:none;height:44px;display:flex;align-items:center;padding:0 4px}
.kb-translate-pill span{height:32px;border-radius:16px;background:var(--kb-key2);display:flex;align-items:center;gap:5px;padding:0 8px 0 12px;font:700 13px Inter,sans-serif;letter-spacing:.02em}
.kb-translate-pill svg{width:16px;height:16px}
/* подсказки слов при наборе */
.kb-translate-strip.sg{padding:0 4px;gap:0}
.kb-translate-sg{flex:1 1 0;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;font:500 16px Inter,sans-serif;border-radius:10px;white-space:nowrap}
.kb-translate-sg.on{background:var(--kb-bg)}
.kb-translate-sgd{flex:none;width:1px;height:28px;background:var(--kb-line)}
/* черновик готов: два действия */
.kb-translate-strip.go{padding:0 8px;gap:8px}
.kb-translate-a{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font:700 15px Inter,sans-serif;white-space:nowrap}
.kb-translate-a svg{flex:none;width:22px;height:22px}
.kb-translate-a .pm{width:21px;height:21px}
.kb-translate-a.p{flex:1 1 auto;min-width:0;background:var(--kb-acc);color:var(--kb-onacc)}
.kb-translate-a.s{flex:none;background:var(--kb-key2);color:var(--kb-tx)}
.kb-translate-a.p small{font:700 12px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor}
.scr:not(.light) .kb-translate-pop{background:#4A525D}
/* панель иконок */
.kb-translate-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:4px}
.kb-translate-ib{width:64px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-translate-ib svg{width:26px;height:26px}
.kb-translate-ib .pm{width:25px;height:25px}
/* клавиши */
.kb-translate-rows{position:relative;display:flex;flex-direction:column;gap:11px;padding-top:6px}
.kb-translate-r{display:flex;gap:5px}
.kb-translate-k{position:relative;flex:1 1 0;min-width:0;height:45px;border-radius:8px;background:var(--kb-key);box-shadow:var(--kb-sh);color:var(--kb-tx);display:flex;align-items:center;justify-content:center;font:400 24px/1 Inter,sans-serif}
.kb-translate-k.f{background:var(--kb-key2)}
.kb-translate-k.f svg{width:23px;height:23px}
.kb-translate-k.w{flex:1.38 1 0}
.kb-translate-g{flex:.18 1 0}
.kb-translate-hp{flex:.5 1 0}
.kb-translate-k.n{flex:1.25 1 0;font-size:17px;font-weight:500}
.kb-translate-k.p{flex:.85 1 0}
.kb-translate-k.sp{flex:4.4 1 0;font-size:16px;gap:10px}
.kb-translate-k.sp i{font-style:normal;color:var(--kb-sec);font-size:18px}
.kb-translate-k.rt{flex:1.55 1 0;background:var(--kb-acc);color:var(--kb-onacc);box-shadow:none}
.kb-translate-k.rt svg{width:25px;height:25px}
/* нажатая клавиша: увеличенная буква над ней */
.kb-translate-k.pr{background:transparent;box-shadow:none;color:transparent}
.kb-translate-pop{position:absolute;left:-7px;right:-7px;bottom:0;height:108px;border-radius:12px 12px 9px 9px;background:var(--kb-key);box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);color:var(--kb-tx);display:flex;justify-content:center;padding-top:10px;font:400 36px/1 Inter,sans-serif;z-index:2;clip-path:polygon(0 0,100% 0,100% 52%,calc(100% - 7px) 60%,calc(100% - 7px) 100%,7px 100%,7px 60%,0 52%)}
.kb-translate-home{height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.kb-translate-home i{width:140px;height:5px;border-radius:3px;background:var(--kb-tx)}
/* ===== добавлено для kb-translate: состояния полосы ===== */
.scr.light{--kb-err:#C42B1F;--kb-rec:#C42B1F;--kb-track:#E3E7EB}
.scr:not(.light){--kb-err:#FF8A80;--kb-rec:#FF6B5E;--kb-track:#4A525D}
.kb-translate-strip>svg.ok{color:var(--kb-acc)}
.kb-translate-strip>svg.er{color:var(--kb-err)}
.kb-translate-strip>svg.nt{color:var(--kb-tx)}
.kb-translate-strip.st{padding-right:8px}
.kb-translate-strip.pg{padding-bottom:8px}
.kb-translate-strip.pg .tx{padding-left:4px}
.kb-translate-a.s .un{width:20px;height:20px}
.kb-translate-a.q{flex:none;background:transparent;color:var(--kb-tx);padding:0 12px}
.kb-translate-a.p.n{flex:none}
.kb-translate-a.p.n svg{width:20px;height:20px}
.kb-translate-prog{position:absolute;left:12px;right:12px;bottom:6px;height:3px;border-radius:2px;background:var(--kb-track);overflow:hidden}
.kb-translate-prog i{position:absolute;top:0;bottom:0;left:22%;width:38%;border-radius:2px;background:var(--kb-acc);animation:kb-translate-run 1.4s ease-in-out infinite}
@keyframes kb-translate-run{0%{left:22%}45%{left:100%}45.01%{left:-40%}100%{left:22%}}
/* иконка панели: активна / занята / недоступна */
.kb-translate-ib.on{background:var(--kb-acc);color:var(--kb-onacc)}
.kb-translate-ib.off{opacity:.36}
.kb-translate-spin{animation:kb-translate-rot 1s linear infinite;transform-origin:12px 12px}
@keyframes kb-translate-rot{to{transform:rotate(360deg)}}
/* диктовка: полоса «Идёт запись» */
.kb-translate-strip.rec{padding:0 8px 0 4px;gap:8px}
.kb-translate-rx{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-translate-rx span{width:34px;height:34px;border-radius:50%;background:var(--kb-key2);display:flex;align-items:center;justify-content:center}
.kb-translate-rx svg{width:18px;height:18px}
.kb-translate-rdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--kb-rec)}
.kb-translate-rl{flex:none;font:600 15px/20px Inter,sans-serif;white-space:nowrap}
.kb-translate-rt{flex:none;font:500 15px/20px Inter,sans-serif;color:var(--kb-sec);font-variant-numeric:tabular-nums}
.kb-translate-wv{flex:1;min-width:0;height:30px;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.kb-translate-wv i{flex:none;width:3px;border-radius:2px;background:var(--kb-acc)}
/* диктовка: чип «Вставить» вместо панели иконок */
.kb-translate-insr{height:48px;display:flex;align-items:center;padding:0 5px;margin-top:4px}
.kb-translate-ins{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;font:400 14px/18px Inter,sans-serif;color:var(--kb-tx)}
.kb-translate-ins>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-translate-ins .t{flex:1;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.kb-translate-ins .t b{font-weight:700}
.kb-translate-ins small{flex:none;font:700 12px/18px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor;color:var(--kb-sec)}
@media (prefers-reduced-motion:reduce){.kb-translate-spin,.kb-translate-prog i{animation:none}}
</style>
</head>
<body>
<div class="kb-translate-w">
<div class="kb-translate-top"><div class="kb-translate-tags"><span class="kb-translate-tag" id="kb-translate-t-draft"></span><span class="kb-translate-tag m" id="kb-translate-t-mock"></span></div>
<nav class="kb-translate-lng" id="kb-translate-lng" aria-label="Language"></nav></div>
<h1 id="kb-translate-h1"></h1>
<p class="kb-translate-lead" id="kb-translate-lead"></p>
<div class="kb-translate-hero" id="kb-translate-hero"></div>
<section class="kb-translate-sec">
<h2 id="kb-translate-h-st"></h2>
<p id="kb-translate-p-st"></p>
<div class="kb-translate-grid" id="kb-translate-grid"></div>
</section>
<section class="kb-translate-sec kb-translate-notes" id="kb-translate-notes"></section>
</div>
<script>
const SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
let pmN=0;
/* «Улучшить» — монохромный попугай Parrlo (ключ spark из screens.js), маска с уникальным id */
const parrot=()=>{const id='kb-translate-pm'+(++pmN);return `<svg class="pm" viewBox="180 140 735 840" fill="currentColor" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><circle cx="612" cy="372" r="44" fill="#000"/><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z" fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"/></mask></defs><g mask="url(#${id})"><path d="M345 800 L 235 925 L 420 895 Z" stroke="currentColor" stroke-width="70" stroke-linejoin="round"/><circle cx="500" cy="640" r="245"/><circle cx="560" cy="395" r="235"/></g><path d="M735 322 L 895 322 A160 160 0 0 1 735 482 Z"/></svg>`;};
const I={
tr:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><path d="M3 5h9M7.5 3v2M5 5c.5 3 2.5 6 6 7.5M10 5c-.8 3.5-3 6.5-6.5 8"/><path d="M12.5 21l4-10 4 10M14 17.5h5"/></svg>`,
mic:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11.5a7 7 0 0 0 14 0"/><path d="M12 18.5v3"/></svg>`,
voice:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><path d="M3.5 9.5v5h3.5l4.5 4V5.5L7 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8.2 8.2 0 0 1 0 11.4"/></svg>`,
gear:`<svg viewBox="0 0 24 24" ${SW} aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
chev:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>`,
shift:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8 8.5h-4.5v7.5h-7V12H4z"/></svg>`,
shiftOn:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l8 8.5h-4.5v7.5h-7V12H4z"/></svg>`,
del:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.5L3 12z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5" stroke-linecap="round"/></svg>`,
ret:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v6a3 3 0 0 1-3 3H5"/><path d="M9 10l-4 4 4 4"/></svg>`,
back:`<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`,
send:`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`,
/* добавлено для состояний перевода */
spin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5" opacity=".3"/><path class="kb-translate-spin" d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg>`,
check:`<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
checkW:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
undo:`<svg class="un" viewBox="0 0 24 24" ${SW} stroke-width="2.1" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>`,
retry:`<svg viewBox="0 0 24 24" ${SW} stroke-width="2.1" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>`,
alert:`<svg class="er" viewBox="0 0 24 24" ${SW} aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>`,
cloudOff:`<svg class="nt" viewBox="0 0 24 24" ${SW} aria-hidden="true"><path d="M8 7.2A5.5 5.5 0 0 1 17 9.5h.5a4 4 0 0 1 2.6 7"/><path d="M17 19H7a4.5 4.5 0 0 1-1.3-8.8"/><path d="M3 3l18 18"/></svg>`,
x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>`,
ins:`<svg viewBox="0 0 24 24" ${SW} stroke-width="2.1" aria-hidden="true"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/></svg>`};
const NB=' ';

/* ===== один словарь: экран и страница =====
   Каркас, переписка, собеседник и черновик — дословно из kb-before (словарь D). */
const D={
ru:{html:'ru',
 /* экран — как в kb-before */
 kb:'ru',space:'Русский',ph:'Сообщение',online:'в сети',today:'Сегодня',who:'Pedro',av:'P',pair:'RU → ES',pairA:'Языки: с русского на испанский',
 msgs:[['in','¡Hola! ¿Qué tal el piso? ¿Va bien la calefacción?','9:52'],['out','¡Hola, Pedro! Sí, todo bien, gracias.','9:55'],['in','Genial. Mañana viene el técnico a revisar la caldera. ¿A qué hora te viene bien?','10:01']],

  '<b>Каркас совпадает с kb-before</b>: та же переписка, поле, полоса 60 pt, панель и раскладка. При наложении кадров меняются только текст в поле и полоса — глаз видит одно: русский стал испанским.',
  '<b>Замена на месте, без предпросмотра</b>, как в kb-improve: перевод сразу в поле. Страховка — строка «Было: …» и «Отменить» в полосе; отмена возвращает русский черновик целиком.',

  '<b>Пока переводим, поле не трогаем</b>: можно отменить запрос; кнопка «Перевести» в панели подсвечена и показывает ход.',
  '<b>Диктовка сразу в перевод</b>: под полосой «Идёт запись» вместо панели — чип «Вставить: «…»» с фразой на языке собеседника и меткой «ES». Вставка только по касанию.',
  '<b>Ошибка с действием</b>: что случилось, что с текстом («Текст не изменился») и «Повторить» — главная кнопка.',
  '<b>Нет сети</b>: облачные функции приглушены и помечены aria-disabled, печать и настройки работают.',
  '<b>Своей кнопки отправки у клавиатуры нет</b>: после перевода активна кнопка мессенджера.'],

  '<b>Dictado directo a traducción</b>: bajo la franja «Grabando», en lugar del panel, el chip «Insertar: «…»» con la frase en el idioma de la otra persona y la etiqueta «RU». Solo se inserta al tocarlo.',

  '<b>Same skeleton as kb-before</b>: same thread, field, 60 pt strip, toolbar and layout. Overlay the frames and only the field text and the strip change, so the eye sees one thing: English became Spanish.',
  '<b>Replaced in place, no preview</b>, as in kb-improve. The safety net: the “Before: …” line and Undo, which brings back the whole draft.',
  '<b>After translating, the layout stays your own (English).</b> You’re the one who keeps writing: adding a line or answering the next message happens in English, then Translate again. Editing the Spanish by hand is rare, and a swipe on the space bar covers it. Switching layouts automatically would trip up your typing and break the frame alignment.',
  '<b>One status strip</b>: Translating, Translated, the error, No connection and Recording take turns in the same place.',
  '<b>The field is left alone while translating</b>: you can cancel; the Translate button in the toolbar lights up and shows progress.',
  '<b>Dictation straight into a translation</b>: under the Recording strip, in place of the toolbar, an “Insert: “…”” chip with the sentence in the other person’s language and an “ES” tag. It’s inserted only when you tap it.',
  '<b>An error with an action</b>: what happened, what happened to the text (“Your text hasn’t changed”) and Try again as the primary button.',
  '<b>No connection</b>: cloud features are dimmed and marked aria-disabled; typing and Settings still work.',
  '<b>The keyboard has no send button of its own</b>: after translating, the messenger’s button becomes active.'],

/* контраст считается из цветов на лету */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}

const PL={ru:{T1:'текст на клавише и полосе',T2:'вторичный на полосе',T3:'«Повторить», «Готово» на акценте',T4:'«Отменить» на служебном',T9:'значок ошибки на полосе',T6:'входящее сообщение',T7:'исходящее и время в нём',T8:'время во входящем'},
 es:{T1:'texto en tecla y franja',T2:'secundario en la franja',T3:'«Reintentar», «Listo» sobre acento',T4:'«Deshacer» sobre tecla de función',T9:'icono de error en la franja',T6:'mensaje recibido',T7:'mensaje enviado y su hora',T8:'hora en recibido'},
 en:{T1:'text on keys and strip',T2:'secondary on strip',T3:'Try again, Done on accent',T4:'Undo on function key',T9:'error icon on strip',T6:'incoming message',T7:'outgoing message and its time',T8:'time in incoming'}};
const fmt=(v,l)=>l==='en'?v.toFixed(1):v.toFixed(1).replace('.',',');

/* раскладки — как в kb-before */
const ROWS={ru:['йцукенгшщзх','фывапролджэ','ячсмитьбю'],es:['qwertyuiop','asdfghjklñ','zxcvbnm'],en:['qwertyuiop','asdfghjkl','zxcvbnm']};
const BAR=[['imp',parrot],['tr',()=>I.tr],['dict',()=>I.mic],['voice',()=>I.voice],['set',()=>I.gear]];
function keys(c,up,press){
 const R=ROWS[c.kb],lg=c.kb==='ru'?'ru':c.kb;
 const k=ch=>{const t=up?ch.toLocaleUpperCase(lg):ch;return ch===press?`<span class="kb-translate-k pr" role="button">${t}<span class="kb-translate-pop" aria-hidden="true">${t}</span></span>`:`<span class="kb-translate-k" role="button">${t}</span>`;};
 const row=s=>[...s].map(k).join('');
 const half=R[1].length<R[0].length?'<span class="kb-translate-hp"></span>':'';
 return `<div class="kb-translate-r">${row(R[0])}</div><div class="kb-translate-r">${half}${row(R[1])}${half}</div>
<div class="kb-translate-r"><span class="kb-translate-k f w" role="button" aria-label="${c.shift}"${up?' aria-pressed="true"':''}>${up?I.shiftOn:I.shift}</span><span class="kb-translate-g"></span>${row(R[2])}<span class="kb-translate-g"></span><span class="kb-translate-k f w" role="button" aria-label="${c.del}">${I.del}</span></div>
<div class="kb-translate-r"><span class="kb-translate-k f n" role="button" aria-label="${c.num}">123</span><span class="kb-translate-k p" role="button">,</span><span class="kb-translate-k sp" role="button"><i>‹</i>${c.space}<i>›</i></span><span class="kb-translate-k p" role="button">.</span><span class="kb-translate-k rt" role="button" aria-label="${c.ret}">${I.ret}</span></div>`;}

const car='<i class="kb-translate-car"></i>';
const WAVE=[8,14,22,12,26,18,28,16,10,20,24,14,8,18,26,12,6,4,4,4];
/* состояния: поле, полоса, панель */
const S={
 translating:c=>({field:c.draft,car:'post',up:0,send:1,on:1,busy:1,
  strip:`<div class="kb-translate-strip st pg" role="status"><span class="tx"><b>${c.ingB}</b><span>${c.ingS}</span></span><span class="kb-translate-a q" role="button">${c.cancel}</span><span class="kb-translate-prog" aria-hidden="true"><i></i></span></div>`}),
 translated:c=>({field:c.out,flang:c.to,car:'post',up:0,send:1,on:1,
  strip:`<div class="kb-translate-strip st" role="status">${I.check}<span class="tx"><b>${c.doneB}</b><span>${c.was}${c.draft}</span></span><span class="kb-translate-a s" role="button" aria-label="${c.undoA}">${I.undo}${c.undo}</span></div>`}),
 dictation:c=>({field:`<span class="pl">${c.ph}</span>`,car:'pre',up:1,send:0,on:2,
  strip:`<div class="kb-translate-strip rec" role="status"><span class="kb-translate-rx" role="button" aria-label="${c.recX}"><span>${I.x}</span></span><i class="kb-translate-rdot"></i><span class="kb-translate-rl">${c.rec}</span><span class="kb-translate-rt">${c.recT}</span><span class="kb-translate-wv" aria-hidden="true">${WAVE.map(h=>`<i style="height:${h}px"></i>`).join('')}</span><span class="kb-translate-a p n" role="button">${c.recDone}</span></div>`,
  bar:`<div class="kb-translate-insr"><span class="kb-translate-ins" role="button" aria-label="${c.insA}">${I.ins}<span class="t"><b>${c.insL}</b> <span lang="${c.to}">${c.q[0]}${c.out}${c.q[1]}</span></span><small>${c.toTag}</small></span></div>`}),
 error:c=>({field:c.draft,car:'post',up:0,send:1,
  strip:`<div class="kb-translate-strip st" role="alert">${I.alert}<span class="tx"><b>${c.errB}</b><span>${c.errS}</span></span><span class="kb-translate-a p n" role="button">${I.retry}${c.retry}</span></div>`}),
 offline:c=>({field:c.draft,car:'post',up:0,send:1,off:1,
  strip:`<div class="kb-translate-strip st" role="status">${I.cloudOff}<span class="tx"><b>${c.offB}</b><span>${c.offS}</span></span></div>`})
};
function screen(id,light,c){
 const s=S[id](c);
 const f=s.car==='pre'?car+s.field:s.field+car;
 const bar=s.bar||`<div class="kb-translate-bar">${BAR.map(([n,ic],i)=>{const on=s.on===i,off=s.off&&i<4;const icon=(on&&s.busy)?I.spin:ic();
  return `<span class="kb-translate-ib${on?' on':''}${off?' off':''}" role="button" aria-label="${c[n]}"${on?' aria-pressed="true"':''}${off?' aria-disabled="true"':''}>${icon}</span>`;}).join('')}</div>`;
 const msgs=c.msgs.map(([d,t,tm])=>`<div class="m ${d}">${t}<span class="tm">${tm}</span></div>`).join('');
 return `<div class="scr kb-translate-scr ${light?'light':''}" lang="${c.html}">
<div class="sbar"><span>9:41</span><span class="sig"><i class="wf"></i><i></i></span></div>
<div class="nav"><span class="bk">${I.back}</span><span class="av">${c.av}</span><span class="nm"><b>${c.who}</b><span>${c.online}</span></span></div>
<div class="msgs"><div class="day">${c.today}</div>${msgs}</div>
<div class="inp"><span class="f"><span${s.flang?` lang="${s.flang}"`:''}>${f}</span></span><span class="sd${s.send?'':' off'}">${I.send}</span></div>
<div class="kb-translate-kb">
${s.strip}
${bar}
<div class="kb-translate-rows">${keys(c,s.up,s.press)}</div>
<div class="kb-translate-home"><i></i></div></div></div>`;}
const ph=(id,l,sc,c)=>`<div class="pf p67 ${l?'light':''}" style="--s:${sc}"><div class="shell"></div><div class="glass">${screen(id,l,c)}</div></div>`;

function render(L){
 const c=D[L];
 document.documentElement.lang=c.html;document.title=c.title;
 const $=id=>document.getElementById(id);
 $('kb-translate-lng').innerHTML=['ru','es','en'].map(x=>`<a href="?l=${x}" data-l="${x}" aria-current="${x===L}" lang="${x}">${x.toUpperCase()}</a>`).join('');
 $('kb-translate-t-draft').textContent=c.t_draft;$('kb-translate-t-mock').textContent=c.t_mock;
 $('kb-translate-h1').textContent=c.h1;$('kb-translate-lead').textContent=c.lead;
 $('kb-translate-h-st').textContent=c.hSt;$('kb-translate-p-st').textContent=c.pSt;
 $('kb-translate-hero').innerHTML=
 `<figure data-shot="kb-translate--light--${L}">${ph('translated',1,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capL[0]}</b><span>${c.capL[1]}</span></div></div></figure>
<figure data-shot="kb-translate--dark--${L}">${ph('translated',0,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capD[0]}</b><span>${c.capD[1]}</span></div></div></figure>`;
 $('kb-translate-grid').innerHTML=Object.keys(S).map(id=>
 `<article class="kb-translate-st"><h3>${c.st[id][0]}<code>${id}</code></h3><p>${c.st[id][1]}</p><div class="kb-translate-pair">
<figure data-shot="kb-translate--${id}--light--${L}">${ph(id,1,.6,c)}<div class="pcap"><div><b>${c.light}</b></div></div></figure>
<figure data-shot="kb-translate--${id}--dark--${L}">${ph(id,0,.6,c)}<div class="pcap"><div><b>${c.dark}</b></div></div></figure></div></article>`).join('');
 const cs=t=>PAIRS[t].map(([k,a,b])=>`${PL[L][k]} ${fmt(cr(a,b),L)}`).join('; ');
 const tok=TOK[L].map(x=>x.replace('CONTRAST_L',cs('L')).replace('CONTRAST_D',cs('D')));
 $('kb-translate-notes').innerHTML=`<div><h2>${c.hDec}</h2><ul>${c.dec.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hTok}</h2><ul>${tok.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hNo}</h2><ul>${c.no.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 document.body.dataset.lang=L;
}
let L0=new URLSearchParams(location.search).get('l');if(!D[L0])L0='ru';
render(L0);
document.getElementById('kb-translate-lng').addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(!a)return;e.preventDefault();const l=a.dataset.l;try{history.replaceState(null,'','?l='+l)}catch(_){}render(l);});
window.KB_TRANSLATE_RENDER=render;
document.body.dataset.ready='1';
</script>
</body>
</html>
