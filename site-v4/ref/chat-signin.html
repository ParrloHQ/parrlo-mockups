<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Chat · Вход и онбординг</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-signin-w{max-width:1200px;margin:0 auto}
.chat-signin-lng{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-signin-lng a{min-width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#C9D1DA;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.chat-signin-lng a.on{background:#2BC48A;color:#0E1116;box-shadow:none}
.chat-signin-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-signin-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-signin-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-signin-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-signin-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-signin-info ul,.chat-signin-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-signin-info li,.chat-signin-sec li{margin:6px 0}
.chat-signin-w b{color:#F2F5F7;font-weight:600}
.chat-signin-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-signin-apn{display:flex;gap:12px;align-items:flex-start;margin:20px 0 0;padding:14px 16px;border-radius:16px;background:#14181D;box-shadow:inset 0 0 0 1px #2F3742;font-size:15px;color:#C9D1DA}
.chat-signin-apn i{flex:none;font:normal 600 12px/20px Inter;color:#FFC247;border:1px solid #FFC247;border-radius:8px;padding:0 8px;margin-top:1px;white-space:nowrap}
.chat-signin-flow{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.chat-signin-flow li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:#14181D;box-shadow:inset 0 0 0 1px #2F3742;font-size:15px;color:#C9D1DA;flex-wrap:wrap}
.chat-signin-flow li>span{flex:none;width:28px;height:28px;border-radius:50%;background:#242B34;color:#F2F5F7;font:900 14px/28px Nunito,sans-serif;text-align:center}
.chat-signin-flow code{margin-left:auto}
.chat-signin-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-signin-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-signin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:40px 24px;justify-items:center}
.chat-signin-card{width:273px}
.chat-signin-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.chat-signin-card h3 code{font-size:12px;color:#9AA4B2}
.chat-signin-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-signin-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.chat-signin-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-signin-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-signin-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-signin-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-signin-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-signin-hero .pf{--s:.78!important}.chat-signin-info h1{font-size:30px}.chat-signin-hero{gap:24px}}

/* ======= экран 430×932 ======= */
.chat-signin-scr{overflow:hidden}
.chat-signin-scr svg{display:block}
.chat-signin-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(460px 400px at 50% 36%,rgba(43,196,138,.12),rgba(43,196,138,0) 70%)}
.chat-signin-scr>:not(.chat-signin-glow){position:relative}
.chat-signin-top{flex:none;height:56px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 8px}
.chat-signin-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.chat-signin-ib svg{width:28px;height:28px}
.chat-signin-steps{display:flex;justify-content:center;align-items:center;gap:6px}
.chat-signin-steps i{display:block;width:8px;height:8px;border-radius:4px;background:var(--line)}
.chat-signin-steps i.d{background:var(--sec)}
.chat-signin-steps i.on{width:28px;background:var(--acc)}
.chat-signin-cnt{justify-self:end;margin-right:12px;font:600 15px/1 Inter;color:var(--sec);font-variant-numeric:tabular-nums}

.chat-signin-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 24px}
.chat-signin-ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.chat-signin-h{font:900 34px/1.12 Nunito,sans-serif;margin:0;letter-spacing:-.005em;text-wrap:balance}
.chat-signin-sub{margin:16px 0 0;font:400 17px/24px Inter;color:var(--sec);text-wrap:balance}
.chat-signin-masc{display:block;width:184px;height:184px;margin:0 auto 24px}
.chat-signin-bot{flex:none;padding:0 24px 8px;display:flex;flex-direction:column;gap:12px}

.chat-signin-btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;font:900 19px/1 Nunito,sans-serif;white-space:nowrap}
.chat-signin-btn.p{background:var(--acc);color:var(--onacc)}
.chat-signin-btn.s{background:var(--sf2);color:var(--tx)}
.chat-signin-btn svg{width:22px;height:22px}
/* Apple: нейтральный плейсхолдер формы официальной кнопки (белая на тёмном фоне) */
.chat-signin-apple{background:#FFFFFF;color:#000000;font:600 19px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;gap:8px}
.chat-signin-slot{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px dashed #8A9099}
/* Google: официальный значок из brandbook/assets/third-party/google, тёмная тема по правилам Google */
.chat-signin-google{background:#131314;color:#E3E3E3;box-shadow:inset 0 0 0 1px #8E918F;font:500 18px/1 Roboto,Inter,system-ui,sans-serif;gap:10px;padding-right:12px}
.chat-signin-google img{flex:none;width:44px;height:44px;display:block}
.chat-signin-txt{height:44px;display:flex;align-items:center;justify-content:center;font:600 17px/1 Inter;color:var(--tx)}
.chat-signin-legal{margin:4px 4px 0;text-align:center;font:400 13px/19px Inter;color:var(--sec);text-wrap:pretty}
.chat-signin-legal u{color:var(--tx);text-decoration:underline;text-decoration-color:var(--sec);text-underline-offset:3px}
.chat-signin-spin{width:28px;height:28px;flex:none;animation:chat-signin-r 1s linear infinite}
@keyframes chat-signin-r{to{transform:rotate(360deg)}}
.chat-signin-static .chat-signin-spin{animation:none}

/* welcome: сцена */
.chat-signin-scene{flex:none;display:flex;flex-direction:column;padding:8px 0 0}
.chat-signin-lbl{display:flex;align-items:center;gap:8px;font:600 13px/20px Inter;color:var(--sec)}
.chat-signin-lbl.r{align-self:flex-end;margin-right:4px}
.chat-signin-lbl.l{align-self:flex-start;margin-left:4px}
.chat-signin-av{width:24px;height:24px;border-radius:50%;background:#6AA6F5;color:#0E1116;font:800 12px/24px Nunito,Inter;text-align:center}
.chat-signin-av.o{background:#E8A0BF}
.chat-signin-bub{max-width:318px;border-radius:22px;padding:12px 16px 10px;font:500 19px/26px Inter;margin-top:8px}
.chat-signin-bub.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-signin-bub.in{align-self:flex-start;background:var(--sf2);color:var(--tx);border-bottom-left-radius:6px;padding-bottom:12px}
.chat-signin-car{display:inline-block;width:2px;height:22px;background:#fff;vertical-align:-4px;margin-left:2px;border-radius:1px}
.chat-signin-tg{display:flex;align-items:center;gap:6px;margin-top:8px;font:600 13px/18px Inter;color:var(--mint)}
.chat-signin-tg svg{width:16px;height:16px;flex:none}
.chat-signin-link{align-self:center;width:2px;height:20px;margin:8px 0;background:repeating-linear-gradient(var(--acc) 0 3px,transparent 3px 7px);opacity:.8}
.chat-signin-node{align-self:center;display:flex;align-items:center;gap:10px}
.chat-signin-node img{width:56px;height:56px;display:block;border-radius:50%;background:#14181D;box-shadow:0 0 0 1px var(--line),0 0 0 8px rgba(43,196,138,.08)}
.chat-signin-pill{height:32px;padding:0 14px;border-radius:16px;background:#1D2A28;color:var(--mint);font:600 14px/32px Inter;box-shadow:inset 0 0 0 1px rgba(191,242,220,.25);white-space:nowrap}

/* language */
.chat-signin-lhd{padding:16px 0 24px}
.chat-signin-langs{display:flex;flex-direction:column;gap:12px}
.chat-signin-lang{height:84px;border-radius:22px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:16px;padding:0 20px 0 16px}
.chat-signin-lang.sel{background:#14261F;box-shadow:inset 0 0 0 2px var(--acc)}
.chat-signin-code{flex:none;width:48px;height:48px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;font:900 16px/1 Nunito,sans-serif;letter-spacing:.04em;color:var(--tx)}
.chat-signin-lang.sel .chat-signin-code{background:var(--acc);color:var(--onacc)}
.chat-signin-nm{flex:1;min-width:0}
.chat-signin-nm b{display:block;font:900 23px/28px Nunito,sans-serif;color:var(--tx)}
.chat-signin-nm>span{display:block;font:400 15px/20px Inter;color:var(--sec);margin-top:2px}
.chat-signin-radio{flex:none;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px #5A6472}
.chat-signin-chk{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center}
.chat-signin-chk svg{width:18px;height:18px}
.chat-signin-note{display:flex;gap:8px;align-items:center;margin:20px 4px 0;font:400 15px/20px Inter;color:var(--sec)}
.chat-signin-note svg{flex:none;width:20px;height:20px}

/* signin: язык */
.chat-signin-lc{margin-top:16px;height:44px;display:flex;align-items:center}
.chat-signin-lc>span{height:36px;border-radius:18px;background:var(--sf2);display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;font:600 15px/1 Inter;color:var(--tx)}
.chat-signin-lc svg{width:18px;height:18px;color:var(--sec)}
.chat-signin-lc .g{display:flex}.chat-signin-lc .g svg{color:var(--mint)}

/* waiting */
.chat-signin-wait{margin-top:28px;width:100%;border-radius:20px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:flex;gap:14px;align-items:center;text-align:left;font:600 17px/22px Inter}

/* error */
.chat-signin-err{margin:24px 0 0;border-radius:20px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:flex;gap:14px;text-align:left}
.chat-signin-ei{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(255,107,94,.14);color:#FF6B5E;display:flex;align-items:center;justify-content:center}
.chat-signin-ei svg{width:22px;height:22px}
.chat-signin-err b{display:block;font:600 17px/22px Inter;color:var(--tx)}
.chat-signin-err div>span{display:block;font:400 15px/21px Inter;color:var(--sec);margin-top:4px}

/* done */
.chat-signin-next{margin:28px 0 0;width:100%;border-radius:22px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:flex;gap:14px;align-items:center;text-align:left}
.chat-signin-ni{flex:none;width:48px;height:48px;border-radius:50%;background:rgba(43,196,138,.14);color:var(--acc);display:flex;align-items:center;justify-content:center}
.chat-signin-ni svg{width:24px;height:24px}
.chat-signin-next small{display:block;font:700 12px/16px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
.chat-signin-next b{display:block;font:900 19px/24px Nunito,sans-serif;margin-top:2px;color:var(--tx)}
.chat-signin-next div>span{display:block;font:400 14px/20px Inter;color:var(--sec);margin-top:2px}
</style>
</head>

 return scr(top(2,true)+'<div class="chat-signin-body"><div class="chat-signin-lhd"><h2 class="chat-signin-h">'+T.lH+'</h2><p class="chat-signin-sub">'+T.lS+'</p></div>'+
 '<div class="chat-signin-langs" role="radiogroup" aria-label="'+T.lH+'">'+rows+'</div><p class="chat-signin-note">'+I.gear+T.lNote+'</p></div>'+
 '<div class="chat-signin-bot" style="padding-bottom:16px">'+btn('p',T.next)+'</div>')};
S.signin=function(){return scr(top(3,true)+'<div class="chat-signin-glow"></div><div class="chat-signin-body"><div class="chat-signin-ctr">'+
 '<img class="chat-signin-masc" src="'+M('happy')+'" alt=""><h2 class="chat-signin-h">'+T.sH+'</h2><p class="chat-signin-sub">'+T.sS+'</p>'+
 '<div class="chat-signin-lc" role="button" aria-label="'+T.aLang+'"><span><span class="g">'+I.globe+'</span>'+T.sLang+I.chev+'</span></div>'+
 '</div></div><div class="chat-signin-bot">'+apple+google+'<p class="chat-signin-legal">'+T.legal+'</p></div>')};
S.waiting=function(){return scr(top(3,false)+'<div class="chat-signin-body"><div class="chat-signin-ctr">'+
 '<img class="chat-signin-masc" src="'+M('listen')+'" alt=""><h2 class="chat-signin-h">'+T.wtH+'</h2><p class="chat-signin-sub">'+T.wtS+'</p>'+
 '<div class="chat-signin-wait" role="status" aria-busy="true">'+I.spin+'<span>'+T.wtC+'</span></div>'+
 '</div></div><div class="chat-signin-bot">'+btn('s',T.cancel)+'</div>')};
S.error=function(){return scr(top(3,true)+'<div class="chat-signin-body"><div class="chat-signin-ctr">'+
 '<img class="chat-signin-masc" src="'+M('think')+'" alt=""><h2 class="chat-signin-h">'+T.eH+'</h2>'+
 '<div class="chat-signin-err" role="alert"><span class="chat-signin-ei">'+I.wifioff+'</span><div><b>'+T.eB+'</b><span>'+T.eS+'</span></div></div>'+
 '</div></div><div class="chat-signin-bot">'+btn('p',T.retry,I.retry)+tbtn(T.other)+'</div>')};
S.done=function(){return scr(top(4,false)+'<div class="chat-signin-glow"></div><div class="chat-signin-body"><div class="chat-signin-ctr">'+
 '<img class="chat-signin-masc" src="'+M('happy')+'" alt="" style="width:208px;height:208px"><h2 class="chat-signin-h" style="font-size:42px">'+T.dH+'</h2><p class="chat-signin-sub">'+T.dS+'</p>'+
 '<div class="chat-signin-next"><span class="chat-signin-ni">'+I.invite+'</span><div><small>'+T.dK+'</small><b>'+T.dB+'</b><span>'+T.dT+'</span></div></div>'+
 '</div></div><div class="chat-signin-bot">'+btn('p',T.invite,I.share)+tbtn(T.later)+'</div>')};
window.CHAT_SIGNIN_S=S;

document.documentElement.lang=T.htmlLang;document.title=T.docTitle;
function $(id){return document.getElementById('chat-signin-'+id)}
$('lng').innerHTML=['ru','es','en'].map(function(k){return '<a href="?l='+k+'" hreflang="'+k+'" class="'+(k===l?'on':'')+'"'+(k===l?' aria-current="true"':'')+'>'+k.toUpperCase()+'</a>'}).join('');
$('eb').textContent=T.eb;$('h1').textContent=T.h1;$('intro').textContent=T.intro;
$('capb').textContent=T.capB;$('caps').textContent=T.capS;
$('flow').innerHTML=T.flow.map(function(x,i){return '<li><span>'+(i+1)+'</span>'+x[0]+'<code>'+x[1]+'</code></li>'}).join('');
$('apt').textContent=T.apT;$('apx').textContent=T.apX;
$('sth').textContent=T.stH;$('stl').innerHTML=T.stL;
var order=['welcome','language','signin','waiting','error','done'];window.CHAT_SIGNIN_ORDER=order;
$('grid').innerHTML=order.map(function(k){return '<div class="chat-signin-card"><div class="pf p67" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+T.st[k][0]+' <code>'+k+'</code></h3><p>'+T.st[k][1]+'</p></div>'}).join('');
document.querySelectorAll('.pf[data-state]').forEach(function(p){p.querySelector('.glass').innerHTML=S[p.dataset.state]()});
window.chatSigninHero=function(k){var h=$('hero');h.dataset.state=k;h.querySelector('.glass').innerHTML=S[k]()};
$('moreh').textContent=T.moreH;$('dech').textContent=T.decH;$('tokh').textContent=T.tokH;$('nah').textContent=T.naH;
$('dec').innerHTML=T.dec.map(function(x){return '<li>'+x+'</li>'}).join('');
$('tok').innerHTML=T.tok.map(function(x){return '<li>'+x+'</li>'}).join('');
$('na').innerHTML=T.na.map(function(x){return '<li>'+x+'</li>'}).join('');

function Lu(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#0E1116'],['#9AA4B2','#0E1116'],['#9AA4B2','#1C2026'],['#000000','#FFFFFF'],['#E3E3E3','#131314'],['#0E1116','#2BC48A'],['#FFFFFF','#00875C'],['#F2F5F7','#242B34'],['#BFF2DC','#242B34'],['#BFF2DC','#1D2A28'],['#9AA4B2','#14261F']];
$('ct').innerHTML=pairs.map(function(r,i){return '<tr><td><span class="chat-signin-sw" style="background:'+r[0]+'"></span><span class="chat-signin-sw" style="background:'+r[1]+'"></span>'+T.ct[i]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_SIGNIN_MIN=Math.min.apply(null,pairs.map(function(r){return cr(r[0],r[1])}));
if(location.hash==='#static')document.body.classList.add('chat-signin-static');
document.body.dataset.ready='1';
})();
