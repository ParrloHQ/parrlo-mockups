<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Translate · подписка</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0E12;color:#F2F5F7}
body{font:400 16px/1.5 Inter,system-ui,sans-serif;padding:32px 16px 80px}
.translate-plan-w{max-width:1200px;margin:0 auto}
.translate-plan-lsw{display:flex;gap:4px;justify-content:flex-end;margin-bottom:24px}
.translate-plan-lsw a{min-width:48px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;font:700 14px/1 Inter,sans-serif;color:#C3CBD5;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.translate-plan-lsw a[aria-current="true"]{background:#2BC48A;color:#0E1116;box-shadow:none}
.translate-plan-w h1{font:900 40px/1.1 Nunito,sans-serif;margin-bottom:12px}
.translate-plan-w h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.translate-plan-lead{color:#9AA4B2;max-width:820px}
.translate-plan-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.translate-plan-tag{display:inline-block;font:600 13px/1 Inter,sans-serif;color:#0E1116;background:#BFF2DC;border-radius:8px;padding:6px 10px}
.translate-plan-tag.translate-plan-mk{background:#FFC247}
.translate-plan-hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;margin-top:40px;padding:48px 40px;border-radius:32px;background:#12161C;box-shadow:inset 0 0 0 1px #2F3742}
.translate-plan-hero figure{margin:0}
.translate-plan-hero-t{flex:1 1 320px;max-width:520px}
.translate-plan-hero-t h3{font:900 24px/1.25 Nunito,sans-serif;margin-bottom:12px}
.translate-plan-hero-t p{color:#C3CBD5;margin-bottom:12px}
.translate-plan-w ul{padding-left:20px;color:#C3CBD5;font-size:15px;max-width:860px}
.translate-plan-w li{margin:8px 0}
.translate-plan-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7}
.translate-plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:48px 24px;margin-top:32px}
.translate-plan-grid figure{margin:0;display:flex;flex-direction:column;align-items:center}
.translate-plan-grid figcaption{margin-top:16px;width:272px;font-size:14px;line-height:1.45;color:#9AA4B2}
.translate-plan-grid figcaption b{display:block;color:#F2F5F7;font:900 17px/1.3 Nunito,sans-serif;margin-bottom:4px}
.translate-plan-grid figcaption code{font-size:12px}
.translate-plan-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.translate-plan-tbl th,.translate-plan-tbl td{text-align:left;vertical-align:top;border-bottom:1px solid #2F3742;padding:10px 12px 10px 0}
.translate-plan-tbl th{color:#9AA4B2;font-weight:600}
.translate-plan-tw{overflow-x:auto}
.translate-plan-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px #3A414B}
@media (max-width:760px){.translate-plan-w h1{font-size:30px}.translate-plan-hero{padding:24px 12px;gap:24px;justify-content:center}.translate-plan-hero .pf{--s:.74!important}}
@media (max-width:420px){.translate-plan-hero .pf{--s:.7!important}}

/* ===== экран 430×932 ===== */
.translate-plan-scr{--me:#2BC48A;--es:#BFF2DC;--tint:#1E3734;--col:#17322A}
.translate-plan-scr .sbar .translate-plan-air{width:17px;height:17px;display:flex}
.translate-plan-scr .sbar .translate-plan-air svg{width:17px;height:17px}
/* верх: Translate */
.translate-plan-top{flex:none;height:64px;display:flex;align-items:center;gap:8px;padding:0 16px}
.translate-plan-cb{width:48px;height:48px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.translate-plan-pair{flex:1;min-width:0;display:flex;justify-content:center}
.translate-plan-pair>span{height:48px;border-radius:24px;background:var(--sf2);display:inline-flex;align-items:center;gap:8px;padding:0 16px;font:900 19px/1 Nunito,sans-serif;letter-spacing:.02em}
.translate-plan-swp{color:var(--sec);display:flex}
.translate-plan-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--me)}
.translate-plan-dot.translate-plan-p{background:var(--es)}
/* верх: экран настроек */
.translate-plan-nt{flex:1;min-width:0;text-align:center;font:600 17px/22px Inter,sans-serif;white-space:nowrap}
.translate-plan-sp48{width:48px;flex:none}
/* ---- plan ---- */
.translate-plan-pm{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 16px 0}
.translate-plan-h{font:900 28px/36px Nunito,sans-serif;padding:0 4px}
.translate-plan-sub{margin-top:8px;font:400 16px/23px Inter,sans-serif;color:var(--sec);padding:0 4px}
.translate-plan-cmp{position:relative;margin-top:16px;border-radius:24px;background:var(--sf);padding:0 0 4px}
.translate-plan-colhl{position:absolute;top:0;bottom:0;right:0;width:116px;border-radius:24px;background:var(--col);box-shadow:inset 0 0 0 2px var(--me)}
.translate-plan-tr{position:relative;display:flex;align-items:center;min-height:58px;border-top:1px solid var(--line);margin:0 0 0 20px}
.translate-plan-tr.translate-plan-hd{border-top:0;min-height:56px;align-items:flex-end;padding-bottom:10px}
.translate-plan-tr .translate-plan-f{flex:1;min-width:0;padding:8px 8px 8px 0}
.translate-plan-tr .translate-plan-f b{display:block;font:600 16px/21px Inter,sans-serif}
.translate-plan-tr .translate-plan-f span{display:block;margin-top:2px;font:400 13px/18px Inter,sans-serif;color:var(--sec)}
.translate-plan-c{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.translate-plan-c.translate-plan-pl{width:116px;padding:0 6px}
.translate-plan-c svg{width:24px;height:24px}
.translate-plan-ch{font:900 16px/20px Nunito,sans-serif;text-align:center}
.translate-plan-ch small{display:block;font:600 12px/16px Inter,sans-serif;color:var(--sec);margin-top:2px}
.translate-plan-pl .translate-plan-ch{color:var(--me)}
.translate-plan-pl .translate-plan-ch small{color:#BFF2DC}
.translate-plan-leg{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;padding:0 4px;font:500 13px/18px Inter,sans-serif;color:var(--sec)}
.translate-plan-leg span{display:inline-flex;align-items:center;gap:6px}
.translate-plan-leg svg{width:16px;height:16px;flex:none}
.translate-plan-pb{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 16px 0}
.translate-plan-cta{height:60px;border-radius:30px;background:var(--me);color:#0E1116;display:flex;align-items:center;justify-content:center;gap:10px;font:900 21px/1 Nunito,sans-serif;box-shadow:0 0 32px rgba(43,196,138,.28)}
.translate-plan-btn2{height:48px;border-radius:24px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 Inter,sans-serif;text-align:center;padding:0 16px}
.translate-plan-btn2 svg{width:20px;height:20px;flex:none}
.translate-plan-lnks{display:flex;justify-content:center;gap:4px;height:44px}
.translate-plan-lnk{height:44px;display:inline-flex;align-items:center;padding:0 10px;font:600 14px/1 Inter,sans-serif;color:var(--me)}
.translate-plan-lnks i{align-self:center;color:var(--sec);font-style:normal}
/* ---- разговор (limit, offline-use) ---- */
.translate-plan-cv{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:0 16px}
.translate-plan-card{border-radius:24px;padding:16px 20px 18px;background:var(--sf);position:relative}
.translate-plan-lbl{height:20px;display:flex;align-items:center;gap:8px;font:600 13px/16px Inter,sans-serif;color:var(--sec);letter-spacing:.02em}
.translate-plan-said{margin-top:8px;font:500 20px/27px Inter,sans-serif}
.translate-plan-card.translate-plan-out{background:var(--deep);color:#fff;padding:16px 20px 20px}
.translate-plan-out .translate-plan-lbl{color:#fff;height:28px}
.translate-plan-ot{margin-top:10px;font:900 26px/32px Nunito,sans-serif}
.translate-plan-off{margin-left:auto;height:28px;border-radius:14px;background:#005E40;color:#fff;display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 10px;font:700 13px/1 Inter,sans-serif;letter-spacing:.02em}
.translate-plan-off svg{width:16px;height:16px}
.translate-plan-acts{display:flex;gap:8px;margin-top:18px}
.translate-plan-act{height:48px;border-radius:24px;display:inline-flex;align-items:center;gap:8px;padding:0 18px 0 14px;font:600 16px Inter,sans-serif;background:#FFFFFF;color:#0E1116}
.translate-plan-act.translate-plan-ghost{background:#005E40;color:#fff}
.translate-plan-act svg{width:20px;height:20px}
.translate-plan-dim{opacity:.55}
.translate-plan-net{flex:none;margin:4px 16px 0;height:44px;border-radius:22px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 Inter,sans-serif;color:var(--tx)}
.translate-plan-net svg{width:20px;height:20px;color:var(--me)}
/* низ разговора */
.translate-plan-bot{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px 16px 8px}
.translate-plan-hint{height:20px;display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px Inter,sans-serif;color:var(--sec);white-space:nowrap}
.translate-plan-hint svg{width:16px;height:16px;flex:none}
.translate-plan-btns{display:flex;gap:12px;height:80px}
.translate-plan-spb{flex:1;min-width:0;height:80px;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:10px;color:#0E1116}
.translate-plan-spb svg{flex:none;width:26px;height:26px}
.translate-plan-spb b{display:block;font:900 21px/24px Nunito,sans-serif;white-space:nowrap}
.translate-plan-spb small{display:block;font:600 13px/1.3 Inter,sans-serif;margin-top:2px}
.translate-plan-spb.translate-plan-me{background:var(--me)}
.translate-plan-spb.translate-plan-pt{background:var(--es);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--es),0 0 36px rgba(191,242,220,.28)}
/* плашка лимита */
.translate-plan-lim{flex:none;margin:16px 16px 8px;border-radius:28px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:24px 20px 20px;display:flex;flex-direction:column}
.translate-plan-lim-hd{display:flex;gap:16px;align-items:center}
.translate-plan-lim-hd img{width:64px;height:64px;flex:none;margin-left:-4px}
.translate-plan-lim h4{font:900 23px/28px Nunito,sans-serif}
.translate-plan-lim p{margin-top:12px;font:400 15px/22px Inter,sans-serif;color:var(--sec)}
.translate-plan-lim .translate-plan-cta{margin-top:20px}
.translate-plan-lim .translate-plan-btn2{margin-top:8px;height:56px;border-radius:28px}
/* ---- настройки ---- */
.translate-plan-set{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px}
.translate-plan-bigt{font:900 34px/44px Nunito,sans-serif;padding:4px 4px 0}
.translate-plan-gl{margin:24px 4px 8px;font:600 13px/16px Inter,sans-serif;color:var(--sec);letter-spacing:.04em;text-transform:uppercase}
.translate-plan-grp{border-radius:20px;background:var(--sf);overflow:hidden}
.translate-plan-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;position:relative}
.translate-plan-row+.translate-plan-row::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--line)}
.translate-plan-row.translate-plan-hl{box-shadow:inset 0 0 0 2px var(--me);border-radius:20px;min-height:76px}
.translate-plan-row.translate-plan-hl::before,.translate-plan-hl+.translate-plan-row::before{display:none}
.translate-plan-ri{width:32px;height:32px;flex:none;border-radius:9px;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.translate-plan-ri svg{width:20px;height:20px}
.translate-plan-ri.translate-plan-g{background:var(--tint);color:var(--me)}
.translate-plan-rt{flex:1;min-width:0}
.translate-plan-rt b{display:block;font:500 17px/22px Inter,sans-serif}
.translate-plan-rt span{display:block;font:400 13px/18px Inter,sans-serif;color:var(--sec);margin-top:1px}
.translate-plan-rv{flex:none;font:400 16px/1 Inter,sans-serif;color:var(--sec);display:flex;align-items:center;gap:6px}
.translate-plan-chev{width:18px;height:18px;color:#5B6472;flex:none}
.translate-plan-ok{height:32px;border-radius:16px;background:var(--tint);color:var(--me);display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 9px;font:700 15px/1 Inter,sans-serif}
.translate-plan-ok svg{width:18px;height:18px}
.translate-plan-tg{width:51px;height:31px;border-radius:16px;background:var(--me);position:relative;flex:none}
.translate-plan-tg::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.translate-plan-fn{margin:8px 4px 0;font:400 13px/18px Inter,sans-serif;color:var(--sec)}
/* ---- загрузка пакетов ---- */
.translate-plan-dl{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px}
.translate-plan-dh{display:flex;flex-direction:column;align-items:flex-start;padding:8px 4px 0}
.translate-plan-big{width:64px;height:64px;border-radius:20px;background:var(--tint);color:var(--me);display:flex;align-items:center;justify-content:center}
.translate-plan-big svg{width:34px;height:34px}
.translate-plan-dh h4{margin-top:16px;font:900 30px/36px Nunito,sans-serif}
.translate-plan-dh p{margin-top:8px;font:400 16px/23px Inter,sans-serif;color:var(--sec)}
.translate-plan-pill{margin-top:12px;height:28px;border-radius:14px;background:var(--tint);color:var(--me);display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 10px;font:700 13px/1 Inter,sans-serif}
.translate-plan-pill svg{width:16px;height:16px}
.translate-plan-pk{min-height:76px}
.translate-plan-lg{width:40px;height:40px;flex:none;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;font:900 14px/1 Nunito,sans-serif;letter-spacing:.02em}
.translate-plan-row.translate-plan-pk+.translate-plan-row::before{left:68px}
.translate-plan-bar{margin-top:8px;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.translate-plan-bar i{display:block;height:6px;width:62%;border-radius:3px;background:var(--me)}
.translate-plan-x{width:44px;height:44px;flex:none;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center}
.translate-plan-x i{width:12px;height:12px;border-radius:3px;background:var(--tx)}
.translate-plan-get{height:44px;flex:none;border-radius:22px;background:var(--tint);color:var(--me);display:inline-flex;align-items:center;gap:6px;padding:0 16px 0 12px;font:600 15px/1 Inter,sans-serif}
.translate-plan-get svg{width:18px;height:18px}
.translate-plan-inst{flex:none;display:flex;align-items:center;gap:6px;font:500 15px/1 Inter,sans-serif;color:var(--sec)}
.translate-plan-inst svg{width:18px;height:18px;color:var(--me)}
.translate-plan-note{display:flex;gap:8px;margin:12px 4px 0;font:400 13px/18px Inter,sans-serif;color:var(--sec)}
.translate-plan-note svg{width:16px;height:16px;flex:none;margin-top:1px}
</style>
</head>
<body>
<div class="translate-plan-w">
<nav class="translate-plan-lsw" id="translate-plan-lsw" aria-label="Language"></nav>

<section class="translate-plan-hero">

</div>

 page:{title:'Parrlo Translate · suscripción',mk:'Maqueta · próximamente',tag:'Referencia · lote 2 · textos en borrador',h1:'Translate · suscripción y traductor sin conexión',

      'offline-download':['Descarga de un paquete','Dentro del traductor sin conexión: qué está instalado, qué se descarga y qué se puede descargar. La descarga se puede detener.'],

  hDec:'Decisiones',
  dec:['<b>Textos traducidos de <code>docs/site/copy-ru/translate.md</code>.</b> «Sin cobertura. Con traducción.», «en la montaña, en el metro, en roaming», el requisito de 8 GB, «Mostrar en grande», «Hablo yo» / «Я говорю», la cuenta y la farmacia. Para el plan y el límite copy-ru no tiene textos: son nuevos y están en «Pendiente de aprobar».',
   '<b>Una lista de funciones, no una tabla de tarifas.</b> Cinco filas sobre lo que haces en Translate. Sin precios ni cifras: la composición de los planes no está decidida (GAP Translate, puntos 10–11) y la pantalla tiene que aguantar cualquier decisión.',
   '<b>El límite de Free, en palabras.</b> «Con límite diario» y un icono de semicírculo. Cuando el límite esté configurado, la cifra puede ir en la descripción de la fila sin tocar la estructura.',

   '<b>Sin conexión: una sola fila en Ajustes.</b> «Traductor sin conexión · Listo», con «con suscripción». «Listo» lleva check y palabra, no solo color. El requisito de iPhone va en una nota bajo el grupo.',
   '<b>Paquetes por idioma, sin megas.</b> Estados «Instalado / Descargando… / Descargar» y barra de progreso sin porcentaje ni tamaño. «Solo con wifi», activado por defecto: propuesta que va más allá de la versión actual.',
   '<b>Sin conexión, a la vista en dos sitios.</b> Icono de modo avión en la barra de estado y aviso «Sin red» arriba; en la tarjeta de la traducción, la etiqueta «sin conexión». Botones y «color = lado», como en la conversación.'],
  hTok:'Tokens y contraste',

 if(st==='offline-settings'){const s=t.set;
  const row=(ic,g,title,sub,right,extra)=>`<div class="${P}row${extra||''}" role="button"><span class="${P}ri${g?' '+P+'g':''}">${ic}</span><span class="${P}rt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span>${right}</div>`;

/* контраст */
function Lu(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#F2F5F7','#1C2026',4.5],['#F2F5F7','#242B34',4.5],['#0E1116','#2BC48A',4.5],['#0E1116','#BFF2DC',4.5],['#2BC48A','#1E3734',4.5],['#2BC48A','#17322A',3],['#BFF2DC','#17322A',4.5],['#2BC48A','#0E1116',4.5],['#FFFFFF','#00875C',3],['#FFFFFF','#00875C',4.5],['#FFFFFF','#005E40',4.5],['#0E1116','#FFFFFF',4.5]];

const STATES=['plan','limit','offline-settings','offline-download','offline-use'];

function render(){
 const t=T[L],p=t.page;
 document.documentElement.lang=L; document.title=p.title;
 $('lsw').innerHTML=LANGS.map(l=>`<a href="?l=${l}" data-l="${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
 $('mk').textContent=p.mk; $('tag').textContent=p.tag; $('h1').textContent=p.h1; $('lead').textContent=p.lead;
 $('hero-ph').innerHTML=ph('translate-plan',.8,screen('plan',t))+`<div class="pcap"><span class="dot"></span><div><b>${p.cap[0]}</b><span>${p.cap[1]}</span></div></div>`;
 $('hero-t').innerHTML=`<h3>${p.heroH}</h3>`+p.heroP.map(x=>`<p>${x}</p>`).join('');
 $('h-states').textContent=p.hStates; $('states-lead').textContent=p.statesLead;
 $('grid').innerHTML=STATES.map((k,i)=>`<figure>${ph(P+'-'+k,.6,screen(k,t))}<figcaption><b>${i+1} · ${p.st[k][0]}</b><code>${k}</code> · ${p.st[k][1]}</figcaption></figure>`).join('');
 $('h-dec').textContent=p.hDec; $('dec').innerHTML=p.dec.map(x=>`<li>${x}</li>`).join('');
 $('h-tok').textContent=p.hTok; $('tok').innerHTML=p.tok.map(x=>`<li>${x}</li>`).join('');
 const fmt=v=>L==='en'?v.toFixed(2):v.toFixed(2).replace('.',',');
 $('ctr').innerHTML=`<tr>${p.ctrH.map(h=>`<th>${h}</th>`).join('')}</tr>`+PAIRS.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${p.ctr[i]}</td><td><b>${fmt(v)}:1</b></td><td>${v>=n?'≥ '+(n===3?'3':fmt(4.5).replace(/0$/,''))+' ✓':'✗'}</td></tr>`;}).join('');
 $('h-na').textContent=p.hNa; $('na').innerHTML=p.na.map(x=>`<li>${x}</li>`).join('');
 window.TP_CR=PAIRS.map(([a,b,n],i)=>[p.ctr[i],+cr(a,b).toFixed(2),n]);
 document.body.dataset.ready=L;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-l]');if(!a)return;e.preventDefault();L=a.dataset.l;history.replaceState(null,'','?l='+L);render();});
window.TP_STATES=STATES;
