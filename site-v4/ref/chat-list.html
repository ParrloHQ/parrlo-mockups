<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Chat · Чаты</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-list-w{max-width:1200px;margin:0 auto}
.chat-list-lng{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-list-lng a{min-width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#C9D1DA;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.chat-list-lng a.on{background:#2BC48A;color:#0E1116;box-shadow:none}
.chat-list-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-list-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-list-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-list-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-list-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-list-info ul,.chat-list-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-list-info li,.chat-list-sec li{margin:6px 0}
.chat-list-w b{color:#F2F5F7;font-weight:600}
.chat-list-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-list-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-list-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:40px 24px;justify-items:center}
.chat-list-card{width:273px}
.chat-list-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.chat-list-card h3 code{font-size:12px;color:#9AA4B2}
.chat-list-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-list-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.chat-list-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-list-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-list-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-list-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-list-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-list-hero .pf{--s:.78!important}.chat-list-info h1{font-size:30px}.chat-list-hero{gap:24px}}

/* ======= экран 430×932 ======= */
.chat-list-scr{position:relative;overflow:hidden}
.chat-list-scr svg{display:block;flex:none}
.chat-list-hd{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px 0 20px}
.chat-list-hd h3{margin:0;flex:1;font:900 34px/1 Nunito,sans-serif}
.chat-list-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--acc);background:var(--sf2);flex:none}
.chat-list-ib svg{width:24px;height:24px}
/* поиск */
.chat-list-sr{flex:none;margin:4px 16px;height:44px;border-radius:12px;background:var(--sf);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--sec);font-size:17px;white-space:nowrap;overflow:hidden}
.chat-list-sr svg{width:20px;height:20px}
.chat-list-srw{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px 4px}
.chat-list-srw .chat-list-sr{flex:1;min-width:0;margin:0;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--acc)}
.chat-list-car{display:inline-block;width:2px;height:22px;background:var(--acc);margin-left:1px;vertical-align:middle}
.chat-list-clr{margin-left:auto;width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--sec)}
.chat-list-cancel{font:500 17px/44px Inter,sans-serif;color:var(--acc);height:44px;flex:none}
/* фильтры */
.chat-list-fl{flex:none;display:flex;gap:8px;padding:0 16px;height:52px;align-items:center}
.chat-list-ch{height:44px;display:flex;align-items:center}
.chat-list-ch span{height:36px;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:6px;font:600 15px/1 Inter,sans-serif;color:var(--tx);background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chat-list-ch.on span{background:var(--tx);color:var(--bg);box-shadow:none}
.chat-list-ch em{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:var(--onacc);font:700 12px/20px Inter;text-align:center;padding:0 6px}
/* карточка Парло */
.chat-list-pc{flex:none;margin:4px 16px 8px;min-height:72px;border-radius:20px;background:linear-gradient(100deg,#1E3734 0%,#1C2026 62%);box-shadow:inset 0 0 0 1px #2F4A44;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px}
.chat-list-pc img{width:52px;height:52px;flex:none;display:block}
.chat-list-pct{flex:1;min-width:0}
.chat-list-pct b{display:flex;align-items:center;gap:8px;font:900 18px/1.2 Nunito,sans-serif}
.chat-list-pct b small{font:700 11px/1 Inter,sans-serif;letter-spacing:.04em;color:var(--mint);background:rgba(191,242,220,.12);padding:4px 6px;border-radius:6px}
.chat-list-pct span{display:block;font-size:14px;line-height:1.3;color:#C9D1DA;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-pc .go{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-list-pc .go svg{width:20px;height:20px}
/* список */
.chat-list-ls{flex:1;min-height:0;overflow:hidden;position:relative}
.chat-list-sh{font:600 13px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);padding:16px 20px 8px}
.chat-list-r{position:relative;height:78px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg)}
.chat-list-av{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:900 21px Nunito,sans-serif;color:#0E1116;position:relative}
.chat-list-av.g{border-radius:16px;background:#1E3734;color:var(--mint)}
.chat-list-av.g svg{width:26px;height:26px}
.chat-list-av .on{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--bg)}
.chat-list-bd{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:5px;box-shadow:inset 0 -1px 0 var(--line)}
.chat-list-r.last .chat-list-bd{box-shadow:none}
.chat-list-l1,.chat-list-l2{display:flex;align-items:center;gap:6px;min-width:0}
.chat-list-nm{min-width:0;flex:0 1 auto;font:600 17px/1.25 Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* плашки языка собеседника: мятная — переводится, серая — твой язык */
.chat-list-lg{flex:none;display:flex;gap:4px}
.chat-list-lg i{font:700 11px/1 Inter;letter-spacing:.06em;font-style:normal;height:20px;padding:0 6px;border-radius:6px;display:flex;align-items:center;background:rgba(191,242,220,.14);color:var(--mint)}
.chat-list-lg i.s{background:rgba(154,164,178,.18);color:var(--tx)}
.chat-list-mu{width:16px;height:16px;color:var(--sec);flex:none}
.chat-list-tm{margin-left:auto;padding-left:8px;flex:none;font:400 14px/1 Inter,sans-serif;color:var(--sec);display:flex;align-items:center;gap:4px;white-space:nowrap}
.chat-list-tm.u{color:var(--acc);font-weight:600}
.chat-list-tm svg{width:18px;height:18px;color:var(--acc)}
.chat-list-pv{flex:1;min-width:0;font-size:15px;line-height:1.3;color:var(--sec);display:flex;align-items:center;gap:6px}
.chat-list-pv.u{color:var(--tx)}
.chat-list-pv>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-pv>svg{width:16px;height:16px;color:var(--mint)}
.chat-list-pv>svg.n{color:var(--sec)}
.chat-list-who{color:var(--tx);font-weight:500}
.chat-list-pv.typ{color:var(--acc);font-weight:500}
.chat-list-dots{display:flex;gap:3px;align-items:center}
.chat-list-dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.chat-list-dots i:nth-child(2){opacity:.65}.chat-list-dots i:nth-child(3){opacity:.35}
.chat-list-bg{flex:none;min-width:24px;height:24px;border-radius:12px;background:var(--acc);color:var(--onacc);font:700 13px/24px Inter,sans-serif;text-align:center;padding:0 7px}
.chat-list-bg.m{background:#3A414B;color:var(--tx)}
.chat-list-pend{color:var(--sec)}
/* смахивание */
.chat-list-swp{position:relative;height:78px;overflow:hidden}
.chat-list-acts{position:absolute;top:0;right:0;bottom:0;display:flex}
.chat-list-act{width:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12px/1.15 Inter,sans-serif;text-align:center;color:#fff;padding:0 4px}
.chat-list-act svg{width:24px;height:24px}
.chat-list-act.a1{background:#3A414B;color:var(--tx)}
.chat-list-act.a2{background:#2F3742;color:var(--tx)}
.chat-list-act.a3{background:#B8342B}
.chat-list-swp .chat-list-r{transform:translateX(-240px);box-shadow:8px 0 24px -8px rgba(0,0,0,.6)}
.chat-list-hint{position:absolute;left:0;right:0;bottom:112px;display:flex;justify-content:center;pointer-events:none;z-index:3}
.chat-list-hint span{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--sf2);box-shadow:0 8px 24px rgba(0,0,0,.45);font:500 13px/1 Inter,sans-serif;color:var(--tx);white-space:nowrap}
.chat-list-hint svg{width:16px;height:16px;color:var(--acc)}
/* поиск: результаты */
.chat-list-res .chat-list-r{height:74px}
.chat-list-res .chat-list-av{width:44px;height:44px;font-size:18px}
.chat-list-res .chat-list-av.g{border-radius:14px}.chat-list-res .chat-list-av.g svg{width:22px;height:22px}
.chat-list-pv mark{background:#1E3734;color:var(--tx);font-weight:700;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--acc)}
.chat-list-tag{flex:none;font:600 11px/1 Inter,sans-serif;color:var(--sec);border:1px solid var(--line);border-radius:6px;padding:3px 5px;white-space:nowrap}
.chat-list-tag.t{color:var(--mint);border-color:rgba(191,242,220,.3)}
.chat-list-nt{display:flex;gap:10px;margin:12px 16px 0;padding:10px 14px;border-radius:14px;background:#16241F;box-shadow:inset 0 0 0 1px rgba(191,242,220,.18);font-size:14px;line-height:20px;color:#DCEFE6}
.chat-list-nt svg{width:18px;height:18px;color:var(--mint);margin-top:1px}
/* пусто */
.chat-list-em{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px 24px;text-align:center}
.chat-list-em img{width:176px;height:176px;display:block;margin-bottom:12px}
.chat-list-em h4{margin:0 0 12px;font:900 28px/1.15 Nunito,sans-serif}
.chat-list-em p{margin:0 0 32px;color:var(--sec);font-size:16px;line-height:1.5}
.chat-list-btn{width:100%;min-height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;font:900 18px/1.2 Nunito,sans-serif;padding:0 20px}
.chat-list-btn svg{width:22px;height:22px}
.chat-list-btn.p{background:var(--acc);color:var(--onacc)}
.chat-list-btn.s{background:var(--sf2);color:var(--tx);margin-top:12px}
.chat-list-em small{display:block;margin-top:16px;font-size:13px;line-height:1.45;color:var(--sec)}
/* нет сети */
.chat-list-off{flex:none;margin:4px 16px;min-height:52px;border-radius:14px;background:#3C372B;display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:14px;line-height:20px}
.chat-list-off svg{width:22px;height:22px;color:#FFC247}
.chat-list-off b{display:block;font-weight:600}
.chat-list-off span{color:#D9D3C4}
/* вкладки */
.chat-list-tb{position:absolute;left:0;right:0;bottom:0;padding-top:4px;background:rgba(14,17,22,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--line);z-index:2}
.chat-list-tbi{display:flex;height:52px}
.chat-list-t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sec);font:600 11px/1.2 Inter,sans-serif}
.chat-list-t svg{width:26px;height:26px}
.chat-list-t.on{color:var(--acc)}
.chat-list-tic{position:relative}
.chat-list-tic em{position:absolute;left:18px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--onacc);font:700 11px/18px Inter;text-align:center;padding:0 5px;font-style:normal;box-shadow:0 0 0 2px var(--bg)}
.chat-list-gap{flex:none;height:92px}
</style>
</head>

 return '<div class="chat-list-r'+(last?' last':'')+'">'+av(o.k,o.on)+'<div class="chat-list-bd">'+
  '<div class="chat-list-l1"><span class="chat-list-nm">'+o.nm+'</span>'+lg(o.lg)+(o.mu?'<span class="chat-list-mu" role="img" aria-label="'+T.muted+'">'+I.mute+'</span>':'')+'<span class="chat-list-tm'+(u?' u':'')+'">'+(o.tk?I.ticks:'')+o.tm+'</span></div>'+
  '<div class="chat-list-l2"><span class="chat-list-pv '+cls+'">'+pvHtml(o.pv)+'</span>'+right+'</div></div></div>'}
function list(rows){return '<div class="chat-list-ls">'+rows.map(function(r,i){return row(r,i===rows.length-1)}).join('')+'<div class="chat-list-gap"></div></div>'}
var R=T.rows;
function clone(o,ch){var x=JSON.parse(JSON.stringify(o));for(var k in ch)x[k]=ch[k];return x}

var S={};
S.main=function(){return '<div class="scr chat-list-scr">'+sbar()+hd()+srch+filt(3)+parrlo+list(R)+tabs(3)+'</div>'};
S.search=function(){
 var res=T.res.map(function(o,i){return '<div class="chat-list-r'+(i===T.res.length-1?' last':'')+'">'+av(o.k)+'<div class="chat-list-bd"><div class="chat-list-l1"><span class="chat-list-nm">'+o.nm+'</span><span class="chat-list-tm">'+o.tm+'</span></div><div class="chat-list-l2"><span class="chat-list-pv">'+(o.tag?I.tr:'')+'<span>'+o.pv+'</span></span><span class="chat-list-tag'+(o.tag?' t':'')+'">'+(o.tag?T.tagT:T.tagO)+'</span></div></div></div>'}).join('');
 return '<div class="scr chat-list-scr">'+sbar()+
 '<div class="chat-list-srw"><div class="chat-list-sr">'+I.search+'<span>'+T.q+'<i class="chat-list-car"></i></span><span class="chat-list-clr" role="button" aria-label="'+T.aClr+'" data-tap>'+I.xc+'</span></div><span class="chat-list-cancel" role="button" data-tap>'+T.cancel+'</span></div>'+
 '<div class="chat-list-fl"><span class="chat-list-ch on" role="button" data-tap><span>'+T.sf[0]+'</span></span><span class="chat-list-ch" role="button" data-tap><span>'+T.sf[1]+'</span></span><span class="chat-list-ch" role="button" data-tap><span>'+T.sf[2]+'</span></span></div>'+
 '<div class="chat-list-ls chat-list-res"><div class="chat-list-sh">'+T.shM+'</div>'+res+'<div class="chat-list-nt">'+I.info+'<span>'+T.resN+'</span></div><div class="chat-list-gap"></div></div>'+tabs(3)+'</div>'};
S.empty=function(){return '<div class="scr chat-list-scr">'+sbar()+hd()+
 '<div class="chat-list-em"><img src="'+M+'mascot-happy-dark.svg" alt=""><h4>'+T.emH+'</h4><p>'+T.emP+'</p>'+
 '<span class="chat-list-btn p" role="button" data-tap>'+I.plus+T.emB1+'</span><span class="chat-list-btn s" role="button" data-tap>'+I.qr+T.emB2+'</span><small>'+T.emS+'</small></div><div class="chat-list-gap"></div>'+tabs(0)+'</div>'};
S.offline=function(){
 var mine=clone(R[0],{n:0,on:0,tk:0,tm:'<span class="chat-list-pend">'+T.wait+'</span>',pv:{kind:'me',wait:1,t:T.offMsg}});
 var rows=[mine,R[1],clone(R[2],{on:0,pv:{t:T.offL,tr:R[2].lg[0][1]}}),R[3],R[4],R[5]];
 return '<div class="scr chat-list-scr">'+sbar(1)+hd()+
 '<div class="chat-list-off" role="status">'+I.wifioff+'<div><b>'+T.offB+'</b><span>'+T.offS+'</span></div></div>'+srch+filt(3)+list(rows)+tabs(3)+'</div>'};
S.swipe=function(){
 var a=T.swA;
 return '<div class="scr chat-list-scr">'+sbar()+hd()+srch+filt(3)+parrlo+
 '<div class="chat-list-ls">'+row(R[0])+row(R[1])+
 '<div class="chat-list-swp"><div class="chat-list-acts"><span class="chat-list-act a1" role="button" data-tap>'+I.mute+a[0]+'</span><span class="chat-list-act a2" role="button" data-tap>'+I.hide+a[1]+'</span><span class="chat-list-act a3" role="button" data-tap>'+I.trash+a[2]+'</span></div>'+row(R[2])+'</div>'+
 row(R[3])+row(R[4])+row(R[5],1)+'<div class="chat-list-gap"></div></div>'+
 '<div class="chat-list-hint"><span>'+I.swipe+T.swH+'</span></div>'+tabs(3)+'</div>'};

/* ===== страница ===== */
document.documentElement.lang=T.htmlLang;document.title=T.docTitle;
function $(id){return document.getElementById('chat-list-'+id)}
$('lng').innerHTML=['ru','es','en'].map(function(k){return '<a href="?l='+k+'" hreflang="'+k+'" class="'+(k===l?'on':'')+'"'+(k===l?' aria-current="true"':'')+'>'+k.toUpperCase()+'</a>'}).join('');
$('eb').textContent=T.eb;$('h1').textContent=T.h1;$('intro').textContent=T.intro;
$('capb').textContent=T.capB;$('caps').textContent=T.capS;
$('what').innerHTML=T.what.map(function(x){return '<li>'+x+'</li>'}).join('');
$('sth').textContent=T.stH;$('stl').innerHTML=T.stL;
var order=['main','search','empty','offline','swipe'];
$('grid').innerHTML=order.map(function(k){return '<div class="chat-list-card"><div class="pf p67 flat" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+T.st[k][0]+' <code>'+k+'</code></h3><p>'+T.st[k][1]+'</p></div>'}).join('');
document.querySelectorAll('.pf[data-state]').forEach(function(p){p.querySelector('.glass').innerHTML=S[p.dataset.state]()});
$('moreh').textContent=T.moreH;$('dech').textContent=T.decH;$('tokh').textContent=T.tokH;$('nah').textContent=T.naH;
$('dec').innerHTML=T.dec.map(function(x){return '<li>'+x+'</li>'}).join('');
$('tok').innerHTML=T.tok.map(function(x){return '<li>'+x+'</li>'}).join('');
$('na').innerHTML=T.na.map(function(x){return '<li>'+x+'</li>'}).join('');

function Lu(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
/* плашки: фон — подложка с прозрачностью на #0E1116, посчитан вручную: mint .14 → #26332F, серая .18 → #2A2F37 */
var pairs=[['#F2F5F7','#0E1116'],['#9AA4B2','#0E1116'],['#BFF2DC','#26332F'],['#F2F5F7','#2A2F37'],['#2BC48A','#0E1116'],['#0E1116','#2BC48A'],['#BFF2DC','#1E3734'],['#9AA4B2','#1C2026'],['#D9D3C4','#3C372B'],['#FFC247','#3C372B'],['#FFFFFF','#B8342B'],['#C9D1DA','#1E3734']];
$('ct').innerHTML=pairs.map(function(r,i){return '<tr><td><span class="chat-list-sw" style="background:'+r[0]+'"></span><span class="chat-list-sw" style="background:'+r[1]+'"></span>'+T.ct[i]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_LIST={lang:l,S:S,order:order,min:Math.min.apply(null,pairs.map(function(r){return cr(r[0],r[1])})),
 hero:function(k){var h=$('hero');h.dataset.state=k;h.querySelector('.glass').innerHTML=S[k]()}};
})();
</script>
</body>
