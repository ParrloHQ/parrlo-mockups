<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-original-w{max-width:1200px;margin:0 auto}
.chat-original-lng{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-original-lng a{min-width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#C9D1DA;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.chat-original-lng a.on{background:#2BC48A;color:#0E1116;box-shadow:none}
.chat-original-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-original-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-original-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-original-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-original-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-original-info ul,.chat-original-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-original-info li,.chat-original-sec li{margin:6px 0}
.chat-original-w b{color:#F2F5F7;font-weight:600}
.chat-original-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-original-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-original-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-original-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:40px 24px;justify-items:center}
.chat-original-card{width:273px}
.chat-original-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.chat-original-card h3 code{font-size:12px;color:#9AA4B2}
.chat-original-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-original-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.chat-original-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-original-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-original-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-original-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-original-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-original-hero .pf{--s:.78!important}.chat-original-info h1{font-size:30px}.chat-original-hero{gap:24px}}

/* ======= экран 430×932 ======= */
.chat-original-scr{overflow:hidden}
.chat-original-scr svg{display:block}
.chat-original-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-original-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-original-ib svg{width:24px;height:24px}
.chat-original-ib.bk{color:var(--acc)}.chat-original-ib.bk svg{width:28px;height:28px}
.chat-original-av{width:40px;height:40px;border-radius:50%;background:#6AA6F5;color:#0E1116;font:800 17px/40px Nunito,Inter;text-align:center;flex:none}
.chat-original-av.o{background:#E8A0BF}
.chat-original-nm{flex:1;min-width:0;padding-left:4px}
.chat-original-nm b{display:block;font:600 17px/22px Inter}
.chat-original-nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:18px;color:var(--sec)}
.chat-original-lc{flex:none;height:44px;display:flex;align-items:center}
.chat-original-lc span{height:32px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 13px/1 Inter;letter-spacing:.04em;color:var(--tx)}
.chat-original-lc svg{width:14px;height:14px;color:var(--sec)}

.chat-original-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.chat-original-day{align-self:center;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px;margin-bottom:4px}
.chat-original-m{position:relative;max-width:80%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-original-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px;padding-bottom:0}
.chat-original-m.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-original-m.gap{margin-top:8px}
.chat-original-m.wide{width:80%}
.chat-original-tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px}
.chat-original-tm svg{width:16px;height:16px}
/* подпись «перевод» внутри входящего */
.chat-original-ft{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:0 -12px;padding:0 12px}
.chat-original-tg{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--mint);white-space:nowrap}
.chat-original-tg svg{width:16px;height:16px;flex:none}
.chat-original-tg svg.cv{width:14px;height:14px;opacity:.9}
.chat-original-ft .chat-original-tm{margin:0;color:var(--sec);flex:none}
/* раскрытый оригинал */
.chat-original-og{margin:8px 0 0;border-radius:12px;background:var(--sf);border-left:3px solid var(--mint);padding:8px 12px 10px}
.chat-original-og .k{display:block;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin-bottom:2px}
.chat-original-og .v{display:block;font-size:16px;line-height:22px;color:var(--tx)}
.chat-original-m.hl{box-shadow:0 0 0 2px var(--acc)}
.chat-original-rd{align-self:flex-end;display:flex;align-items:center;gap:4px;font:500 12px/16px Inter;color:var(--sec);margin:-2px 4px 0 0}
.chat-original-rd svg{width:16px;height:16px;color:var(--acc)}

/* поле ввода и предпросмотр */
.chat-original-cmp{flex:none;border-top:1px solid var(--line);padding:8px 12px 0;background:var(--bg)}
.chat-original-row{display:flex;align-items:flex-end;gap:8px}
.chat-original-pls{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-original-pls svg{width:26px;height:26px}
.chat-original-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:17px;line-height:22px;color:var(--tx)}
.chat-original-f .pl{color:var(--sec)}
.chat-original-f .car{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-4px;margin-left:1px;border-radius:1px}
.chat-original-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-original-go svg{width:22px;height:22px}
.chat-original-pv{margin:0 0 8px;border-radius:16px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:2px 6px 12px 12px}
.chat-original-pv .h{display:flex;align-items:center;gap:6px;min-height:44px;font:600 13px/18px Inter;color:var(--sec)}
.chat-original-pv .h>svg{width:16px;height:16px;color:var(--mint);flex:none}
.chat-original-pv .h .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-original-pv p{margin:0 6px 0 0;font-size:16px;line-height:22px;color:var(--tx)}
.chat-original-chip{flex:none;min-height:44px;display:flex;align-items:center}
.chat-original-chip span{height:32px;border-radius:16px;background:var(--sf2);box-shadow:inset 0 0 0 1px #3A414B;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;font:600 13px/1 Inter;color:var(--tx);white-space:nowrap}
.chat-original-chip svg{width:14px;height:14px;color:var(--sec)}
.chat-original-chip .sp{width:16px;height:16px;color:var(--mint)}

/* затемнение, меню */
.chat-original-dim{position:absolute;inset:0;background:rgba(9,11,14,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.chat-original-dim.s{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(9,11,14,.66)}
.chat-original-pop{position:absolute;left:16px;right:16px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.chat-original-pop .chat-original-m{box-shadow:0 12px 32px rgba(0,0,0,.4)}
.chat-original-mn{width:272px;border-radius:16px;background:var(--sf2);box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);overflow:hidden}
.chat-original-mn div{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;font-size:17px;line-height:22px;border-top:1px solid var(--line)}
.chat-original-mn div:first-child{border-top:0}
.chat-original-mn div.sep{border-top:6px solid #1A1F25}
.chat-original-mn svg{width:22px;height:22px;color:var(--sec);flex:none}
.chat-original-mn div.on svg{color:var(--mint)}

/* лист «Как я звучу» */
.chat-original-sh{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45),inset 0 1px 0 var(--line);padding:8px 20px 0}
.chat-original-gr{width:40px;height:5px;border-radius:3px;background:#3A414B;margin:0 auto 12px}
.chat-original-shh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.chat-original-shh h4{margin:0;font:900 26px/32px Nunito,sans-serif}
.chat-original-shh p{margin:4px 0 0;color:var(--sec);font-size:14px;line-height:20px}
.chat-original-x{width:44px;height:44px;margin:-6px -10px 0 0;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-original-x i{width:32px;height:32px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center}
.chat-original-x svg{width:18px;height:18px}
.chat-original-ex{margin-top:16px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px 14px}
.chat-original-ex .k{display:flex;align-items:center;gap:6px;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.chat-original-ex .k svg{width:14px;height:14px;color:var(--mint)}
.chat-original-ex .k .lv{margin-left:auto;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.chat-original-ex .k .lv i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chat-original-ex .u{margin:2px 0 12px;font-size:16px;line-height:22px;color:var(--tx)}
.chat-original-ex .b{margin-top:6px;border-radius:18px;border-bottom-right-radius:6px;background:var(--deep);color:#fff;padding:10px 14px;font:500 17px/24px Inter}
.chat-original-lbl{margin:20px 0 8px;font:600 13px/18px Inter;color:var(--sec)}
.chat-original-ls{border-radius:16px;background:var(--sf2);overflow:hidden}
.chat-original-op{min-height:60px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line)}
.chat-original-op:first-child{border-top:0}
.chat-original-op .t{flex:1;min-width:0}
.chat-original-op .t b{display:block;font:600 16px/22px Inter}
.chat-original-op .t span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-original-rb{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px #5A6472;flex:none;display:flex;align-items:center;justify-content:center}
.chat-original-op.on .chat-original-rb{background:var(--acc);box-shadow:none;color:var(--onacc)}
.chat-original-rb svg{width:16px;height:16px}
.chat-original-seg{display:flex;gap:8px}
.chat-original-seg>div{flex:1;min-width:0;min-height:60px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;text-align:center}
.chat-original-seg>div.on{background:#1E3734;box-shadow:inset 0 0 0 1.5px var(--acc)}
.chat-original-seg .t b{display:block;font:600 16px/22px Inter}
.chat-original-seg .t span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-original-seg .on .t span{color:var(--mint)}
.chat-original-seg svg{width:18px;height:18px;color:var(--acc);flex:none}
.chat-original-nt{margin:14px 0 0;font-size:13px;line-height:18px;color:var(--sec);text-align:center}
.chat-original-cta{margin-top:12px;height:52px;border-radius:26px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font:900 18px/1 Nunito,sans-serif}
</style>
</head>

 '<p class="chat-original-nt">'+T.shN+'</p><div class="chat-original-cta" role="button">'+T.done+'</div><div style="height:42px"></div></div>')};

function Lu(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#242B34'],['#BFF2DC','#242B34'],['#9AA4B2','#242B34'],['#F2F5F7','#1C2026'],['#9AA4B2','#1C2026'],['#FFFFFF','#00875C'],['#9AA4B2','#0E1116'],['#9AA4B2','#1C2026'],['#F2F5F7','#242B34'],['#BFF2DC','#1E3734'],['#0E1116','#2BC48A']];
$('ct').innerHTML=pairs.map(function(r,i){return '<tr><td><span class="chat-original-sw" style="background:'+r[0]+'"></span><span class="chat-original-sw" style="background:'+r[1]+'"></span>'+T.ct[i]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_ORIGINAL_MIN=Math.min.apply(null,pairs.map(function(r){return cr(r[0],r[1])}));
