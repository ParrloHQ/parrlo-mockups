<!doctype html>
<html lang="ru">
<head>

<title>Parrlo · клавиатура, «Улучшить»</title>

<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:32px 16px 80px}
.kb-improve-w{max-width:1200px;margin:0 auto}
.kb-improve-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.kb-improve-tags{display:flex;gap:8px;flex-wrap:wrap}
.kb-improve-tag{display:inline-block;font:600 13px/20px Inter,sans-serif;color:#0E1116;background:#FFC247;border-radius:8px;padding:2px 10px}
.kb-improve-tag.g{background:#242B34;color:#F2F5F7}
.kb-improve-lang{display:flex;gap:4px;background:#171C23;border-radius:24px;padding:4px}
.kb-improve-lang a{min-width:56px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 15px Inter,sans-serif;color:#C5CCD5;text-decoration:none}
.kb-improve-lang a[aria-current="true"]{background:#2BC48A;color:#0E1116}
.kb-improve-w h1{font:900 36px/1.15 Nunito,sans-serif;margin:0 0 8px}
.kb-improve-w h2{font:900 24px/1.2 Nunito,sans-serif;margin:0 0 8px}
.kb-improve-lead{color:#9AA4B2;max-width:780px;margin:0 0 32px}
.kb-improve-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;padding:48px 24px 40px;border-radius:32px;background:#171C23}
.kb-improve-hero figure,.kb-improve-st figure{margin:0}
.kb-improve-sec{margin-top:64px}
.kb-improve-sec>p{color:#9AA4B2;margin:0 0 24px;max-width:780px}
.kb-improve-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(600px,1fr));gap:24px}
.kb-improve-st{background:#171C23;border-radius:24px;padding:24px}
.kb-improve-st h3{font:900 20px/1.25 Nunito,sans-serif;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kb-improve-st h3 code{font:500 13px ui-monospace,Menlo,monospace;color:#9AA4B2;background:#0E1116;border-radius:6px;padding:1px 6px}
.kb-improve-st>p{margin:0 0 20px;color:#9AA4B2;font-size:15px}
.kb-improve-pair{display:flex;gap:20px;justify-content:center}
.kb-improve-pair .pcap{margin-top:10px;font-size:13px}
.kb-improve-pair .pcap b{font-size:14px}
.kb-improve-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-improve-notes h2{font-size:20px;margin:0 0 10px}
.kb-improve-notes ul{margin:0;padding-left:20px;color:#9AA4B2}
.kb-improve-notes li{margin:6px 0}
.kb-improve-notes b{color:#F2F5F7;font-weight:600}
.kb-improve-st .pf{--s:.6!important}
body.kb-improve-cap .pf{--s:1!important}
@media (max-width:660px){
 .kb-improve-grid{grid-template-columns:1fr}
 .kb-improve-st{padding:16px}
 .kb-improve-pair{gap:12px}
 .kb-improve-st .pf{--s:.34!important}
 .kb-improve-hero{padding:24px 8px;gap:24px}
 .kb-improve-hero .pf{--s:.72!important}
 .kb-improve-w h1{font-size:28px}
}

/* ===== экран 430×932: клавиатура Parrlo, «Улучшить» ===== */
.scr.light{--kb-bg:#D3D7DC;--kb-key:#FFFFFF;--kb-key2:#ABB2BB;--kb-tx:#0E1116;--kb-sec:#5B6472;--kb-sh:0 1px 0 rgba(0,0,0,.3);--kb-acc:#00875C;--kb-onacc:#FFFFFF;--kb-track:#E3E7EB;--kb-sel:#E6F5EE}
.scr:not(.light){--kb-bg:#1B1F25;--kb-key:#3A414B;--kb-key2:#2A3038;--kb-tx:#F2F5F7;--kb-sec:#C5CCD5;--kb-sh:0 1px 0 rgba(0,0,0,.6);--kb-acc:#2BC48A;--kb-onacc:#0E1116;--kb-track:#4A525D;--kb-sel:#24443A}
.kb-improve-scr .nav .av{color:#0E1116}
.kb-improve-scr .m .tm{opacity:.75}
.kb-improve-scr .inp .f{color:var(--tx);flex:1;min-width:0;padding-top:8px;padding-bottom:8px;line-height:24px;align-items:flex-start}
.kb-improve-car{display:inline-block;width:2px;height:22px;background:var(--acc);vertical-align:-5px;margin-left:1px}
.kb-improve-busy{color:var(--sec)}
.kb-improve-kb{flex:none;background:var(--kb-bg);padding:0 3px;color:var(--kb-tx)}
/* полоса статуса над панелью */
.kb-improve-strip{position:relative;margin:8px 5px 0;height:60px;border-radius:14px;background:var(--kb-key);box-shadow:var(--kb-sh);padding:0 4px 0 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:19px;overflow:hidden}
.kb-improve-strip>svg{flex:none;width:22px;height:22px;color:var(--kb-acc)}
.kb-improve-strip>svg.pm{width:22px;height:22px}
.kb-improve-strip .tx{flex:1;min-width:0}
.kb-improve-strip .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-improve-strip .tx span{display:block;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-improve-act{flex:none;min-width:64px;height:44px;display:flex;align-items:center;justify-content:center;padding:0 10px;font:600 15px Inter,sans-serif;color:var(--kb-tx);border-radius:10px}
.kb-improve-pill{flex:none;height:44px;display:flex;align-items:center;padding:0 4px}
.kb-improve-pill span{height:32px;border-radius:16px;background:var(--kb-key2);display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;font:600 14px Inter,sans-serif;white-space:nowrap;color:var(--kb-tx)}
.kb-improve-pill svg{width:16px;height:16px}
.kb-improve-pill.open span{background:var(--kb-acc);color:var(--kb-onacc)}
.kb-improve-prog{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:2px;background:var(--kb-track);overflow:hidden}
.kb-improve-prog i{position:absolute;top:0;bottom:0;left:18%;width:38%;border-radius:2px;background:var(--kb-acc);animation:kb-improve-run 1.4s ease-in-out infinite}
@keyframes kb-improve-run{0%{left:20%}45%{left:100%}45.01%{left:-40%}100%{left:20%}}
/* чипы результата */
.kb-improve-chips{display:flex;gap:6px;height:52px;align-items:center;margin:0 5px}
.kb-improve-chip{flex:1 1 auto;height:44px;border-radius:22px;background:var(--kb-key);box-shadow:var(--kb-sh);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 9px;font:600 15px Inter,sans-serif;white-space:nowrap;color:var(--kb-tx)}
.kb-improve-chip svg{flex:none;width:17px;height:17px}
.kb-improve-chip.on{background:var(--kb-acc);color:var(--kb-onacc);box-shadow:none}
.kb-improve-chip.u{flex:0 1 auto;background:var(--kb-key2);box-shadow:none}
/* панель иконок */
.kb-improve-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:2px}
.kb-improve-ib{position:relative;width:64px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}
.kb-improve-ib svg{width:26px;height:26px}
.kb-improve-ib svg.pm{width:25px;height:25px}
.kb-improve-ib.on{background:var(--kb-acc);color:var(--kb-onacc)}
/* клавиши */
.kb-improve-rows{position:relative;display:flex;flex-direction:column;gap:11px;padding-top:6px}
.kb-improve-r{display:flex;gap:6px}
.kb-improve-r.ru{gap:5px}
.kb-improve-k{flex:1 1 0;min-width:0;height:45px;border-radius:8px;background:var(--kb-key);box-shadow:var(--kb-sh);color:var(--kb-tx);display:flex;align-items:center;justify-content:center;font:400 23px/1 Inter,sans-serif}
.kb-improve-k.f{background:var(--kb-key2)}
.kb-improve-k.f svg{width:23px;height:23px}
.kb-improve-k.w{flex:1.38 1 0}
.kb-improve-hp{flex:.5 1 0}
.kb-improve-g{flex:.18 1 0}
.kb-improve-k.n{flex:1.25 1 0;font-size:16px;font-weight:500}
.kb-improve-k.p{flex:.85 1 0}
.kb-improve-k.sp{flex:4.4 1 0;font-size:15px;gap:9px}
.kb-improve-k.sp i{font-style:normal;color:var(--kb-sec);font-size:17px}
.kb-improve-k.rt{flex:1.55 1 0;background:var(--kb-acc);color:var(--kb-onacc);box-shadow:none}
.kb-improve-k.rt svg{width:24px;height:24px}
/* выбор тона поверх раскладки */
.kb-improve-ov{position:absolute;inset:0 -3px -3px;background:var(--kb-bg);padding:6px 5px 3px}
.kb-improve-ovc{height:100%;border-radius:16px;background:var(--kb-key);box-shadow:var(--kb-sh);padding:4px 8px 10px 16px;display:flex;flex-direction:column}
.kb-improve-oh{display:flex;align-items:center;gap:8px;height:48px}
.kb-improve-oh h4{flex:1;margin:0;font:700 17px/22px Inter,sans-serif}
.kb-improve-oh h4 span{font-weight:400;color:var(--kb-sec);font-size:14px;margin-left:6px}
.kb-improve-x{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.kb-improve-x svg{width:22px;height:22px}
.kb-improve-opts{display:flex;flex-direction:column;gap:8px;margin-right:8px;margin-top:2px}
.kb-improve-opt{height:64px;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px}
.kb-improve-opt .tx{flex:1;min-width:0}
.kb-improve-opt b{display:block;font:700 16px/21px Inter,sans-serif}
.kb-improve-opt .tx>span{display:block;font-size:14px;line-height:19px;color:var(--kb-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-improve-rad{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--kb-sec);display:flex;align-items:center;justify-content:center}
.kb-improve-opt.on{border-color:var(--kb-acc);background:var(--kb-sel)}
.kb-improve-opt.on .kb-improve-rad{border:0;background:var(--kb-acc);color:var(--kb-onacc)}
.kb-improve-rad svg{width:16px;height:16px}
.kb-improve-home{height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.kb-improve-home i{width:140px;height:5px;border-radius:3px;background:var(--kb-tx)}
@media (prefers-reduced-motion:reduce){.kb-improve-prog i{animation:none}}
</style>
</head>

/* контраст: считаем по пикселям цветов из CSS, а не на глаз */
function rgb(s){const m=s.match(/[\d.]+/g);return m?m.map(Number):[0,0,0,0];}
function lum([r,g,b]){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b);}
function bgOf(el){while(el){const c=rgb(getComputedStyle(el).backgroundColor);if(c.length<4||c[3]>0.5)return c;el=el.parentElement;}return [14,17,22];}
function blend(fg,bg,a){return fg.slice(0,3).map((v,i)=>v*a+bg[i]*(1-a));}
const pairs={};let minC=99,bad=[];
document.querySelectorAll('.scr *').forEach(el=>{if(![...el.childNodes].some(n=>n.nodeType===3&&n.data.trim()))return;

 const c=rgb(cs.color);const bg=bgOf(el);const fg=blend(c,bg,(c[3]??1)*a);
 const L1=lum(fg),L2=lum(bg);const r=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);
 const big=parseFloat(cs.fontSize)>=24||(parseFloat(cs.fontSize)>=18.66&&+cs.fontWeight>=700);
 if(r<(big?3:4.5))bad.push(el.textContent.trim().slice(0,20)+' '+r.toFixed(2));minC=Math.min(minC,r);});
