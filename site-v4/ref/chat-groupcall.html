<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Chat · групповой звонок</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-groupcall-w{max-width:1200px;margin:0 auto}
.chat-groupcall-lsw{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-groupcall-lsw a{min-width:48px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#9AA4B2;text-decoration:none;padding:0 12px}
.chat-groupcall-lsw a[aria-current="true"]{background:#1C2026;color:#F2F5F7;box-shadow:inset 0 0 0 1px #2F3742}
.chat-groupcall-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-groupcall-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-groupcall-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-groupcall-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-groupcall-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-groupcall-info ul,.chat-groupcall-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-groupcall-info li,.chat-groupcall-sec li{margin:6px 0}
.chat-groupcall-w b{color:#F2F5F7;font-weight:600}
.chat-groupcall-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-groupcall-legal{display:inline-block;font:700 12px/1.3 Inter;color:#0E1116;background:#FFC247;border-radius:6px;padding:3px 7px;margin-right:4px}
.chat-groupcall-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-groupcall-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-groupcall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 24px;justify-items:center}
.chat-groupcall-card{width:280px}
.chat-groupcall-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.chat-groupcall-card h3 code{font-size:12px;color:#9AA4B2}
.chat-groupcall-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-groupcall-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.chat-groupcall-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-groupcall-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-groupcall-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-groupcall-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-groupcall-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-groupcall-hero .pf{--s:.78!important}.chat-groupcall-info h1{font-size:30px}.chat-groupcall-hero{gap:24px}.chat-groupcall-cols{grid-template-columns:1fr}}

/* ======= экран 430×932 ======= */
.chat-groupcall-scr{overflow:hidden;--me:#2BC48A;--err:#FF6B5E;--cL:#6AA6F5;--cP:#C3A6F7;--cO:#E8A0BF}
.chat-groupcall-scr svg{display:block}
.chat-groupcall-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-groupcall-ib svg{width:26px;height:26px}
.chat-groupcall-ib.ac{color:var(--acc)}

/* шапка звонка */
.chat-groupcall-top{flex:none;height:60px;display:flex;align-items:center;gap:4px;padding:0 8px}
.chat-groupcall-tt{flex:1;min-width:0;text-align:center}
.chat-groupcall-tt b{display:block;font:600 17px/22px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-groupcall-tt span{display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px/18px Inter;color:var(--sec);font-variant-numeric:tabular-nums}
.chat-groupcall-tt span i{width:7px;height:7px;border-radius:50%;background:var(--me)}
.chat-groupcall-nt{flex:none;align-self:center;display:flex;align-items:center;gap:8px;height:32px;margin:0 16px 10px;padding:0 14px;border-radius:16px;background:var(--sf);font:500 13px/18px Inter;color:#C9D1DA;white-space:nowrap}
.chat-groupcall-nt svg{width:16px;height:16px;color:var(--mint);flex:none}

/* плитки участников */
.chat-groupcall-tiles{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.chat-groupcall-tiles.t3{grid-template-columns:1fr 1fr 1fr}
.chat-groupcall-tile{position:relative;height:128px;border-radius:24px;background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0}
.chat-groupcall-tile.sp{background:#1A222B;box-shadow:inset 0 0 0 2px var(--c),0 0 0 4px rgba(255,255,255,.04)}
.chat-groupcall-av{width:56px;height:56px;border-radius:50%;background:var(--c);color:#0E1116;font:900 25px/56px Nunito,Inter;text-align:center;flex:none;display:flex;align-items:center;justify-content:center}
.chat-groupcall-av svg{width:30px;height:30px}
.chat-groupcall-tile.sp .chat-groupcall-av{box-shadow:0 0 0 4px #1A222B,0 0 0 7px var(--c)}
.chat-groupcall-tn{display:flex;align-items:center;gap:6px;margin-top:10px;font:600 15px/20px Inter;max-width:100%;padding:0 8px}
.chat-groupcall-tn em{font:700 11px/1 Inter;font-style:normal;letter-spacing:.06em;color:var(--tx);background:var(--sf2);border-radius:6px;padding:4px 5px}
.chat-groupcall-ts{height:18px;margin-top:2px;font:500 13px/18px Inter;color:var(--sec);display:flex;align-items:center;gap:5px;white-space:nowrap}
.chat-groupcall-ts.sp{color:var(--c)}
.chat-groupcall-ts svg{width:14px;height:14px}
.chat-groupcall-wv{display:flex;align-items:center;gap:2px;height:14px}
.chat-groupcall-wv b{width:3px;border-radius:2px;background:currentColor}
.chat-groupcall-mk{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--sf2);color:var(--sec);display:flex;align-items:center;justify-content:center}
.chat-groupcall-mk svg{width:16px;height:16px}

/* субтитры */
.chat-groupcall-feed{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:8px 16px 12px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 48px);mask-image:linear-gradient(to bottom,transparent 0,#000 48px)}
.chat-groupcall-ln{position:relative;padding:8px 12px 8px 18px;border-radius:18px}
.chat-groupcall-ln::before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--c)}
.chat-groupcall-wh{display:flex;align-items:center;gap:6px;font:600 13px/18px Inter;color:var(--c);margin-bottom:2px;white-space:nowrap}
.chat-groupcall-wh em{font:700 11px/16px Inter;font-style:normal;letter-spacing:.06em;color:var(--sec);border-radius:5px;padding:0 5px;box-shadow:inset 0 0 0 1px #3A414B}
.chat-groupcall-wh .fr{font-weight:500;color:var(--sec)}
.chat-groupcall-wh .lv{margin-left:auto;display:flex;align-items:center;gap:5px;font-weight:500;color:var(--sec)}
.chat-groupcall-wh .lv i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chat-groupcall-tx{font-size:17px;line-height:24px;color:#C9D1DA}
.chat-groupcall-ln.live{background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px 14px 20px}
.chat-groupcall-ln.live::before{left:6px;top:16px;bottom:16px}
.chat-groupcall-ln.live .chat-groupcall-tx{font-size:23px;line-height:31px;font-weight:500;color:var(--tx);letter-spacing:-.005em}
.chat-groupcall-tx em{font-style:normal;color:var(--sec)}
.chat-groupcall-dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.chat-groupcall-dots i{width:6px;height:6px;border-radius:50%;background:var(--sec)}
.chat-groupcall-dots i:nth-child(2){opacity:.7}.chat-groupcall-dots i:nth-child(3){opacity:.45}
.chat-groupcall-og{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:15px;line-height:21px;color:var(--sec)}
.chat-groupcall-og svg{flex:none;width:16px;height:16px;margin-top:2px}
.chat-groupcall-og span{min-width:0;max-height:42px;overflow:hidden}
.chat-groupcall-sys{align-self:center;display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:16px;background:var(--sf);font:500 14px/18px Inter;color:#C9D1DA;margin:4px 0}
.chat-groupcall-sys svg{width:16px;height:16px;color:var(--sec)}

/* управление */
.chat-groupcall-ctl{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 16px 12px}
.chat-groupcall-c{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.chat-groupcall-c .b{width:68px;height:68px;border-radius:50%;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center}
.chat-groupcall-c .b svg{width:28px;height:28px}
.chat-groupcall-c.on .b{background:#F2F5F7;color:#0E1116}
.chat-groupcall-c.end .b{background:var(--err);color:#0E1116}
.chat-groupcall-c .l{font:500 13px/16px Inter;color:var(--sec);text-align:center;white-space:nowrap}
.chat-groupcall-c.on .l{color:var(--tx)}

/* звонок заполнен */
.chat-groupcall-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center}
.chat-groupcall-stk{display:flex;align-items:center;justify-content:center}
.chat-groupcall-stk span{width:72px;height:72px;border-radius:50%;background:var(--c);color:#0E1116;font:900 30px/72px Nunito,Inter;text-align:center;box-shadow:0 0 0 5px var(--bg);margin-left:-14px}
.chat-groupcall-stk span:first-child{margin-left:0}
.chat-groupcall-stk span.more{background:var(--sf2);color:var(--sec);display:flex;align-items:center;justify-content:center}
.chat-groupcall-stk span.more svg{width:28px;height:28px}
.chat-groupcall-pl{margin-top:20px;display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:16px;background:var(--sf);font:500 14px/1 Inter;color:#C9D1DA;font-variant-numeric:tabular-nums}
.chat-groupcall-pl i{width:8px;height:8px;border-radius:50%;background:var(--me)}
.chat-groupcall-mid h4{margin:16px 0 8px;font:900 30px/36px Nunito,sans-serif}
.chat-groupcall-mid p{margin:0;color:var(--sec);font-size:16px;line-height:23px;max-width:350px}
.chat-groupcall-act{flex:none;display:flex;flex-direction:column;gap:12px;padding:0 24px 8px}
.chat-groupcall-btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;font:900 19px/1 Nunito,sans-serif;padding:0 20px;white-space:nowrap}
.chat-groupcall-btn svg{width:22px;height:22px;flex:none}
.chat-groupcall-btn.p{background:var(--acc);color:var(--onacc)}
.chat-groupcall-btn.s{background:var(--sf2);color:var(--tx)}
.chat-groupcall-btn.s svg{color:var(--mint)}
.chat-groupcall-btn.t{height:44px;font:600 16px/1 Inter;color:var(--sec)}
.chat-groupcall-btnn{margin:-4px 0 0;font-size:13px;line-height:18px;color:var(--sec);text-align:center}

/* чат с итогами */
.chat-groupcall-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-groupcall-nav .chat-groupcall-ib svg{width:28px;height:28px}
.chat-groupcall-gav{width:40px;height:40px;border-radius:12px;background:#1E3734;color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
.chat-groupcall-gav svg{width:22px;height:22px}
.chat-groupcall-nm{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;padding-left:4px}
.chat-groupcall-nm b{display:block;font:600 17px/22px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-groupcall-nm span{display:block;font-size:13px;line-height:18px;color:var(--sec);white-space:nowrap}
.chat-groupcall-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:12px 16px}
.chat-groupcall-day{align-self:center;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px}
.chat-groupcall-cl{align-self:center;display:flex;align-items:center;gap:8px;font:500 13px/18px Inter;color:var(--sec)}
.chat-groupcall-cl svg{width:16px;height:16px;color:var(--acc)}
.chat-groupcall-min{border-radius:24px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:16px 16px 6px}
.chat-groupcall-mh{display:flex;align-items:center;gap:12px}
.chat-groupcall-mi{width:44px;height:44px;border-radius:14px;background:#16302A;color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
.chat-groupcall-mi svg{width:24px;height:24px}
.chat-groupcall-mh div b{display:block;font:900 20px/26px Nunito,sans-serif}
.chat-groupcall-mh div span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-groupcall-pp{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:13px;line-height:18px;color:var(--sec)}
.chat-groupcall-pp .s{display:flex}
.chat-groupcall-pp .s i{width:24px;height:24px;border-radius:50%;background:var(--c);color:#0E1116;font:800 11px/24px Nunito,Inter;text-align:center;font-style:normal;box-shadow:0 0 0 2px var(--sf);margin-left:-4px}
.chat-groupcall-pp .s i:first-child{margin-left:0}
.chat-groupcall-pp .s i svg{width:14px;height:14px;margin:5px}
.chat-groupcall-ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.chat-groupcall-ul li{position:relative;padding-left:22px;font-size:16px;line-height:22px;color:var(--tx)}
.chat-groupcall-ul li::before{content:"";position:absolute;left:4px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.chat-groupcall-ul li b{font-weight:600;color:var(--c)}
.chat-groupcall-mn{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:18px;color:var(--sec)}
.chat-groupcall-mn svg{width:16px;height:16px;flex:none;color:var(--mint)}
.chat-groupcall-ma{display:flex;align-items:center;justify-content:space-between;margin:2px -6px 0}
.chat-groupcall-ma .sh{height:44px;display:flex;align-items:center;gap:6px;padding:0 6px;font:600 15px/1 Inter;color:var(--acc)}
.chat-groupcall-ma .sh svg{width:18px;height:18px}
.chat-groupcall-ma .chat-groupcall-ib{color:var(--sec)}
.chat-groupcall-ma .chat-groupcall-ib svg{width:22px;height:22px}
.chat-groupcall-r{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.chat-groupcall-ra{width:32px;height:32px;border-radius:50%;background:var(--c);color:#0E1116;font:800 14px/32px Nunito,Inter;text-align:center;flex:none}
.chat-groupcall-m{border-radius:20px;border-bottom-left-radius:6px;background:var(--sf2);padding:8px 12px 6px;font-size:16px;line-height:22px;min-width:0}
.chat-groupcall-m .w{display:block;font:600 13px/18px Inter;color:var(--c);margin-bottom:2px}
.chat-groupcall-m .chat-groupcall-mf{display:flex;align-items:center;gap:6px;margin-top:6px;font:500 12px/16px Inter;color:var(--mint);white-space:nowrap}
.chat-groupcall-m .chat-groupcall-mf em{font:700 11px/1 Inter;font-style:normal;letter-spacing:.06em;height:20px;padding:0 6px;border-radius:6px;display:flex;align-items:center;background:rgba(191,242,220,.14)}
.chat-groupcall-m .chat-groupcall-mf.or{color:var(--sec)}
.chat-groupcall-m .chat-groupcall-mf.or em{background:rgba(154,164,178,.18);color:var(--tx)}
.chat-groupcall-m .chat-groupcall-mf .tm{margin-left:auto;padding-left:10px;color:var(--sec)}
.chat-groupcall-cmp{flex:none;border-top:1px solid var(--line);padding:8px 12px 0}
.chat-groupcall-crow{display:flex;align-items:flex-end;gap:8px}
.chat-groupcall-pls{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sec);flex:none}
.chat-groupcall-pls svg{width:26px;height:26px}
.chat-groupcall-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:17px;line-height:22px;color:var(--sec);white-space:nowrap;overflow:hidden}
.chat-groupcall-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-groupcall-go svg{width:22px;height:22px}

/* история звонков */
.chat-groupcall-hd{flex:none;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 20px}
.chat-groupcall-hd h3{margin:0;font:900 34px/40px Nunito,sans-serif}
.chat-groupcall-seg{flex:none;margin:4px 16px 8px;height:44px;border-radius:14px;background:var(--sf);display:flex;padding:4px}
.chat-groupcall-seg span{flex:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 15px/1 Inter;color:var(--sec)}
.chat-groupcall-seg span.on{background:var(--sf2);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.chat-groupcall-hl{flex:1;min-height:0;overflow:hidden;padding:0 16px 96px}
.chat-groupcall-sh{font:600 12px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin:14px 4px 6px}
.chat-groupcall-lst{border-radius:18px;background:var(--sf);overflow:hidden}
.chat-groupcall-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 2px 8px 14px;border-top:1px solid var(--line)}
.chat-groupcall-row:first-child{border-top:0}
.chat-groupcall-row .a{width:44px;height:44px;border-radius:50%;background:var(--c);color:#0E1116;font:900 19px/44px Nunito,Inter;text-align:center;flex:none}
.chat-groupcall-row .a.g{border-radius:14px;background:#1E3734;color:var(--mint);display:flex;align-items:center;justify-content:center}
.chat-groupcall-row .a.g svg{width:22px;height:22px}
.chat-groupcall-row .t{flex:1;min-width:0}
.chat-groupcall-row .t b{display:block;font:600 16px/22px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-groupcall-row.ms .t b{color:var(--err)}
.chat-groupcall-row .t span{display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px;color:var(--sec);white-space:nowrap}
.chat-groupcall-row .t span svg{width:16px;height:16px;flex:none}
.chat-groupcall-row.ms .t span svg{color:var(--err)}
.chat-groupcall-row .t span em{font:600 12px/1 Inter;font-style:normal;color:var(--mint);background:rgba(191,242,220,.12);border-radius:6px;padding:4px 6px;display:flex;align-items:center;gap:4px}
.chat-groupcall-row .t span em svg{width:12px;height:12px;color:var(--mint)}
.chat-groupcall-row .tm{font-size:14px;line-height:20px;color:var(--sec);font-variant-numeric:tabular-nums;flex:none}
.chat-groupcall-row .chat-groupcall-ib{color:var(--acc)}
.chat-groupcall-row .chat-groupcall-ib svg{width:22px;height:22px}
.chat-groupcall-tb{position:absolute;left:0;right:0;bottom:0;padding-top:4px;background:rgba(14,17,22,.92);box-shadow:inset 0 1px 0 var(--line);z-index:2}
.chat-groupcall-tbi{display:flex;height:52px}
.chat-groupcall-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sec);font:600 11px/1.2 Inter,sans-serif}
.chat-groupcall-tab svg{width:26px;height:26px}
.chat-groupcall-tab.on{color:var(--acc)}
</style>
</head>
<body>
<div class="chat-groupcall-w">
<nav class="chat-groupcall-lsw" id="chat-groupcall-lsw" aria-label="Language"></nav>

<section class="chat-groupcall-hero">
 <div><div class="pf p67" style="--s:1" data-state="group-call" data-hero="1"><div class="shell"></div><div class="glass"></div></div>

$('chat-groupcall-hdec').innerHTML=P.hdec;$('chat-groupcall-htok').innerHTML=P.htok;$('chat-groupcall-hna').innerHTML=P.hna;
$('chat-groupcall-dec').innerHTML=P.dec.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');
$('chat-groupcall-tok').innerHTML=P.tok.map(function(x){return '<li>'+nb(x)+'</li>'}).join('');

$('chat-groupcall-grid').innerHTML=order.map(function(k){return '<div class="chat-groupcall-card"><div class="pf p67" style="--s:.6" data-state="'+k+'"><div class="shell"></div><div class="glass"></div></div><h3>'+P.st[k][0]+' <code>'+k+'</code></h3><p>'+nb(P.st[k][1])+'</p></div>'}).join('');
document.querySelectorAll('.pf[data-state]').forEach(function(p){p.querySelector('.glass').innerHTML=nb(S[p.dataset.state]())});
window.CHAT_GROUPCALL={S:S,order:order,lang:LG};

function Lm(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lm(a),y=Lm(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#1A222B'],['#6AA6F5','#1C2026'],['#C3A6F7','#0E1116'],['#E8A0BF','#0E1116'],['#2BC48A','#0E1116'],['#C9D1DA','#0E1116'],['#9AA4B2','#1C2026'],['#9AA4B2','#0E1116'],['#0E1116','#FF6B5E'],['#FF6B5E','#1C2026'],['#BFF2DC','#1C2026'],['#0E1116','#2BC48A'],['#0E1116','#6AA6F5']];
var rows=pairs.map(function(p,i){return [p[0],p[1],P.ct[i]]});
$('chat-groupcall-ct').innerHTML=rows.map(function(r){return '<tr><td><span class="chat-groupcall-sw" style="background:'+r[0]+'"></span><span class="chat-groupcall-sw" style="background:'+r[1]+'"></span>'+r[2]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_GROUPCALL.min=Math.min.apply(null,rows.map(function(r){return cr(r[0],r[1])}));
document.body.dataset.ready='1';
})();
