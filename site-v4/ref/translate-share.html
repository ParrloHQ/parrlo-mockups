<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parrlo Translate · голосовое</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../frame.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0E12;color:#F2F5F7}
body{font:400 16px/1.5 Inter,system-ui,sans-serif;padding:32px 16px 80px}
.translate-share-w{max-width:1200px;margin:0 auto}
.translate-share-langs{display:flex;gap:8px;margin-bottom:28px}
.translate-share-langs a{min-width:56px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;font:700 15px/1 Inter,sans-serif;color:#F2F5F7;background:#1C2026;box-shadow:inset 0 0 0 1px #2F3742;text-decoration:none}
.translate-share-langs a[aria-current="true"]{background:#2BC48A;color:#0E1116;box-shadow:none}
.translate-share-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.translate-share-tag{display:inline-block;font:600 13px/1 Inter,sans-serif;color:#0E1116;background:#BFF2DC;border-radius:8px;padding:6px 10px}
.translate-share-tag.translate-share-mk{background:#F2F5F7}
.translate-share-w h1{font:900 40px/1.1 Nunito,sans-serif;margin-bottom:12px}
.translate-share-w h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.translate-share-lead{color:#9AA4B2;max-width:820px}
.translate-share-hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;margin-top:40px;padding:48px 40px;border-radius:32px;background:#12161C;box-shadow:inset 0 0 0 1px #2F3742}
.translate-share-hero figure{margin:0}
.translate-share-hero-t{flex:1 1 300px;max-width:520px}
.translate-share-hero-t h3{font:900 24px/1.25 Nunito,sans-serif;margin-bottom:12px}
.translate-share-hero-t p{color:#C3CBD5;margin-bottom:12px}
.translate-share-w ul{padding-left:20px;color:#C3CBD5;font-size:15px;max-width:860px}
.translate-share-w li{margin:8px 0}
.translate-share-w li b{color:#F2F5F7}
.translate-share-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7}
.translate-share-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(284px,1fr));gap:48px 24px;margin-top:32px}
.translate-share-grid figure{margin:0;display:flex;flex-direction:column;align-items:center}
.translate-share-grid figcaption{margin-top:16px;width:272px;font-size:14px;line-height:1.45;color:#9AA4B2}
.translate-share-grid figcaption b{display:block;color:#F2F5F7;font:900 17px/1.3 Nunito,sans-serif;margin-bottom:4px}
.translate-share-grid figcaption code{font-size:12px}
.translate-share-tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.translate-share-tbl th,.translate-share-tbl td{text-align:left;vertical-align:top;border-bottom:1px solid #2F3742;padding:10px 12px 10px 0}
.translate-share-tbl th{color:#9AA4B2;font-weight:600}
.translate-share-tw{overflow-x:auto}
.translate-share-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px #3A414B}
@media (max-width:760px){.translate-share-w h1{font-size:30px}.translate-share-hero{padding:24px 12px;gap:24px;justify-content:center}.translate-share-hero .pf{--s:.8!important}}
@media (max-width:480px){.translate-share-hero .pf{--s:.7!important}}

/* ===== экран 430×932 ===== */
.translate-share-scr{--me:#2BC48A;--es:#BFF2DC;--msg:#262A30}
.translate-share-scr svg{flex:none}

/* выдуманный нейтральный мессенджер */
.translate-share-mnav{flex:none;display:flex;align-items:center;gap:12px;height:64px;padding:0 16px 0 8px;border-bottom:1px solid var(--line)}
.translate-share-mback{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.translate-share-mback svg{width:26px;height:26px}
.translate-share-av{width:40px;height:40px;border-radius:50%;background:#3A414B;color:#F2F5F7;display:flex;align-items:center;justify-content:center;font:700 17px Inter,sans-serif;flex:none}
.translate-share-mnm b{display:block;font:600 17px/22px Inter,sans-serif}
.translate-share-mnm span{display:block;font:400 13px/18px Inter,sans-serif;color:var(--sec)}
.translate-share-chat{flex:1;display:flex;flex-direction:column;gap:8px;padding:16px 16px 0}
.translate-share-day{align-self:center;font:500 13px Inter,sans-serif;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px;margin-bottom:4px}
.translate-share-mb{align-self:flex-start;max-width:80%;background:var(--msg);border-radius:20px;border-bottom-left-radius:6px;padding:10px 14px;font:400 17px/23px Inter,sans-serif}
.translate-share-mb small{display:block;text-align:right;font:400 12px/16px Inter,sans-serif;color:var(--sec);margin-top:2px}
.translate-share-mv{display:flex;align-items:center;gap:10px;width:272px;padding:10px 14px 8px 10px}
.translate-share-mv.translate-share-lift{position:relative;z-index:3;box-shadow:0 0 0 2px #3A414B,0 16px 36px -10px rgba(0,0,0,.7)}
.translate-share-mplay{width:40px;height:40px;border-radius:50%;background:#F2F5F7;color:#0E1116;display:flex;align-items:center;justify-content:center;flex:none}
.translate-share-mplay svg{width:18px;height:18px}
.translate-share-mv .translate-share-wv{flex:1;height:32px;display:flex;align-items:center;gap:2px}
.translate-share-mv .translate-share-wv i{width:3px;border-radius:2px;background:#9AA4B2;flex:none}
.translate-share-mv>div:last-child{flex:none;display:flex;flex-direction:column;align-items:flex-end;font:500 13px/18px Inter,sans-serif;color:var(--sec)}
.translate-share-dim{position:absolute;inset:0;background:rgba(5,7,10,.55);z-index:2}

/* лист «Поделиться» iOS, обобщённый */
.translate-share-ss{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#1C2026;border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 #2F3742,0 -20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:8px 16px 0}
.translate-share-grab{width:40px;height:5px;border-radius:3px;background:#3A414B;align-self:center;margin-bottom:12px;flex:none}
.translate-share-ssh{display:flex;align-items:center;gap:12px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.translate-share-file{width:52px;height:52px;border-radius:14px;background:#2F3742;color:#C3CBD5;display:flex;align-items:center;justify-content:center;flex:none}
.translate-share-file svg{width:26px;height:26px}
.translate-share-ssh>div{flex:1;min-width:0}
.translate-share-ssh b{display:block;font:600 17px/22px Inter,sans-serif}
.translate-share-ssh>div>span{display:block;font:400 14px/20px Inter,sans-serif;color:var(--sec)}
.translate-share-x{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.translate-share-x svg{width:20px;height:20px}
.translate-share-apps{display:flex;justify-content:space-between;padding:20px 4px 20px}
.translate-share-app{width:72px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.translate-share-app>i{display:block;width:64px;height:64px;border-radius:50%;background:#3A414B}
.translate-share-app>em{display:block;width:44px;height:10px;border-radius:5px;background:#2F3742;margin-top:4px}
.translate-share-app>svg{width:64px;height:64px;border-radius:15px}
.translate-share-app.translate-share-on>svg{box-shadow:0 0 0 3px #1C2026,0 0 0 6px var(--me)}
.translate-share-app>b{font:600 13px/18px Inter,sans-serif;color:var(--tx)}
.translate-share-tap{display:block;text-decoration:none;position:absolute;left:50%;top:32px;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(242,245,247,.28);box-shadow:0 0 0 8px rgba(242,245,247,.1)}
.translate-share-grp{background:var(--sf2);border-radius:20px;overflow:hidden}
.translate-share-row{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 18px;font:400 17px Inter,sans-serif}
.translate-share-row+.translate-share-row{border-top:1px solid var(--line)}
.translate-share-row svg{width:22px;height:22px;color:var(--sec)}
.translate-share-ss .homebar{margin-top:auto}

/* лист Parrlo поверх мессенджера */
.translate-share-peek{position:absolute;left:20px;right:20px;top:54px;height:24px;border-radius:14px 14px 0 0;background:#171A1F;box-shadow:inset 0 1px 0 #262A30}
.translate-share-ps{position:absolute;left:0;right:0;top:66px;bottom:0;background:var(--bg);border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 #2F3742;display:flex;flex-direction:column}
.translate-share-ph{flex:none;display:flex;align-items:center;gap:12px;padding:16px 16px 12px 20px}
.translate-share-ph>svg{width:40px;height:40px;border-radius:10px}
.translate-share-ph>div{flex:1;min-width:0}
.translate-share-ph b{display:block;font:900 20px/24px Nunito,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.translate-share-ph span{display:flex;align-items:center;gap:6px;font:500 14px/20px Inter,sans-serif;color:var(--sec)}
.translate-share-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--me)}
.translate-share-dot.translate-share-es{background:var(--es)}
.translate-share-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:4px 16px 0;overflow:hidden}
.translate-share-bot{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px 16px 4px}
.translate-share-hint{display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px Inter,sans-serif;color:var(--sec);text-align:center}
.translate-share-hint svg{width:16px;height:16px}
.translate-share-btns{display:flex;gap:12px}
.translate-share-sec{flex:1;min-width:0;height:64px;border-radius:32px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;font:600 17px Inter,sans-serif;white-space:nowrap}
.translate-share-sec svg{width:22px;height:22px}
.translate-share-pri{flex:1.65;min-width:0;height:64px;border-radius:32px;background:var(--me);color:#0E1116;display:flex;align-items:center;justify-content:center;gap:10px;font:900 20px Nunito,sans-serif;white-space:nowrap}
.translate-share-pri svg{width:24px;height:24px}
.translate-share-pri.translate-share-lt{background:#F2F5F7}
.translate-share-lbl{font:600 13px/16px Inter,sans-serif;color:var(--sec);letter-spacing:.02em;display:flex;align-items:center;gap:8px;min-width:0}

/* перевод для тебя — сторона собеседника, мятный */
.translate-share-card{background:var(--es);color:#0E1116;border-radius:28px;padding:18px 22px 18px}
.translate-share-card .translate-share-lbl{color:#2E4A3F}
.translate-share-card .translate-share-lbl .translate-share-dot{background:#0E1116}
.translate-share-card p{font:900 25px/31px Nunito,sans-serif;margin:10px 0 16px}
.translate-share-acts{display:flex;gap:8px}
.translate-share-act{height:48px;border-radius:24px;display:inline-flex;align-items:center;gap:8px;padding:0 18px 0 14px;font:600 16px Inter,sans-serif;background:#0E1116;color:#F2F5F7}
.translate-share-act svg{width:20px;height:20px}

/* оригинал с плеером */
.translate-share-orig{background:var(--sf);border-radius:24px;padding:14px 16px 18px 20px;box-shadow:inset 0 0 0 1px var(--line)}
.translate-share-orow{display:flex;align-items:center;justify-content:space-between;gap:8px;height:24px;overflow:visible}
.translate-share-col{width:44px;height:44px;margin:-10px -8px -10px 0;flex:none;display:flex;align-items:center;justify-content:center;color:var(--sec)}
.translate-share-col svg{width:20px;height:20px}
.translate-share-pl{display:flex;align-items:center;gap:12px;margin-top:8px}
.translate-share-play{width:44px;height:44px;border-radius:50%;background:var(--es);color:#0E1116;display:flex;align-items:center;justify-content:center;flex:none}
.translate-share-play svg{width:18px;height:18px}
.translate-share-pl .translate-share-wv{flex:1;min-width:0;height:36px;display:flex;align-items:center;gap:2px;overflow:hidden}
.translate-share-pl .translate-share-wv i{width:3px;border-radius:2px;background:var(--es);flex:none}
.translate-share-pl .translate-share-wv i.translate-share-f{background:#3A414B}
.translate-share-pl time{flex:none;font:600 14px/20px Inter,sans-serif;color:var(--sec);font-variant-numeric:tabular-nums}
.translate-share-orig p{font:400 16px/23px Inter,sans-serif;margin-top:10px}
.translate-share-note{font:400 13px/18px Inter,sans-serif;color:var(--sec);display:flex;gap:8px;align-items:flex-start;padding:0 4px}
.translate-share-note svg{width:16px;height:16px;margin-top:1px}

/* обработка */
.translate-share-stepper{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:20px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.translate-share-stepper>span{display:flex;align-items:center;gap:8px;font:600 15px/20px Inter,sans-serif;white-space:nowrap}
.translate-share-stepper svg{width:22px;height:22px}
.translate-share-stepper .translate-share-wait{color:var(--sec)}
.translate-share-stepper .translate-share-arr{flex:1;height:2px;background:var(--line);border-radius:1px;min-width:12px}
.translate-share-spin{color:var(--es);animation:translate-share-rot 1s linear infinite}
@keyframes translate-share-rot{to{transform:rotate(360deg)}}
.translate-share-sk{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.translate-share-sk i{display:block;height:16px;border-radius:8px;background:linear-gradient(90deg,#242B34,#2F3742,#242B34)}
.translate-share-skc{background:#1B2E29;border-radius:28px;padding:20px 24px 28px;display:flex;flex-direction:column;gap:14px}
.translate-share-skc .translate-share-lbl{color:#BFF2DC}
.translate-share-skc>i{display:block;height:22px;border-radius:11px;background:linear-gradient(90deg,rgba(191,242,220,.10),rgba(191,242,220,.22),rgba(191,242,220,.10))}

/* название места */
.translate-share-pw{text-decoration:underline solid currentColor;text-decoration-thickness:2px;text-underline-offset:6px;white-space:nowrap}
.translate-share-orig .translate-share-pw{font-weight:700;text-decoration-color:var(--es)}
.translate-share-ptag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 6px;margin-left:6px;border-radius:12px;background:#0E1116;color:#BFF2DC;font:600 13px/1 Inter,sans-serif;vertical-align:4px;text-decoration:none}
.translate-share-ptag svg{width:14px;height:14px}
.translate-share-ptip{display:flex;gap:12px;align-items:flex-start;background:#1B2E29;border-radius:20px;padding:14px 16px;box-shadow:inset 0 0 0 1px #2C4A40}
.translate-share-ptip>i{flex:none;width:36px;height:36px;border-radius:50%;background:#BFF2DC;color:#0E1116;display:flex;align-items:center;justify-content:center}
.translate-share-ptip>i svg{width:20px;height:20px}
.translate-share-ptip b{display:block;font:600 15px/20px Inter,sans-serif}
.translate-share-ptip span{display:block;font:400 14px/20px Inter,sans-serif;color:#C3CBD5;margin-top:2px}

/* ошибка формата */
.translate-share-err{align-items:center;text-align:center;justify-content:center;padding-bottom:16px}
.translate-share-err img{width:128px;height:128px;margin-bottom:12px}
.translate-share-err h3{font:900 28px/34px Nunito,sans-serif;margin-bottom:8px}
.translate-share-err>p{font:400 16px/24px Inter,sans-serif;color:var(--sec);max-width:340px}
.translate-share-fch{display:flex;align-items:center;gap:12px;align-self:stretch;margin-top:24px;background:var(--sf);border-radius:20px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.translate-share-fch>i{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sf2);color:var(--sec);display:flex;align-items:center;justify-content:center}
.translate-share-fch>i svg{width:22px;height:22px}
.translate-share-fch>div{flex:1;min-width:0}
.translate-share-fch b{display:block;font:600 16px/22px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.translate-share-fch>div>span{display:block;font:400 14px/20px Inter,sans-serif;color:var(--sec)}
.translate-share-badge{flex:none;white-space:nowrap;height:28px;padding:0 10px;border-radius:14px;background:#3A2326;color:#FF8A80;display:inline-flex;align-items:center;gap:6px;font:600 13px Inter,sans-serif}
.translate-share-badge svg{width:14px;height:14px}
.translate-share-ok{display:flex;gap:8px;align-items:flex-start;align-self:stretch;text-align:left;margin-top:12px;padding:0 4px;font:400 14px/20px Inter,sans-serif;color:var(--sec)}
.translate-share-ok svg{width:16px;height:16px;margin-top:2px;color:var(--me)}
.translate-share-link{height:48px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 16px Inter,sans-serif;color:var(--me)}
.translate-share-link svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="translate-share-w">
<nav class="translate-share-langs" id="translate-share-langs"></nav>
<div class="translate-share-tags"><span class="translate-share-tag translate-share-mk" id="translate-share-mk"></span><span class="translate-share-tag" id="translate-share-tag"></span></div>
<h1 id="translate-share-h1"></h1>
<p class="translate-share-lead" id="translate-share-lead"></p>

<section class="translate-share-hero">
 <figure id="translate-share-hero-ph"></figure>
 <div class="translate-share-hero-t" id="translate-share-hero-t"></div>
</section>

<h2 id="translate-share-h-st"></h2>
<p class="translate-share-lead" id="translate-share-st-lead"></p>
<div class="translate-share-grid" id="translate-share-grid"></div>

<h2 id="translate-share-h-dec"></h2>
<ul id="translate-share-dec"></ul>

<h2 id="translate-share-h-tok"></h2>
<div class="translate-share-tw"><table class="translate-share-tbl" id="translate-share-ctr"></table></div>
<ul id="translate-share-tok"></ul>

<h2 id="translate-share-h-na"></h2>
<ul id="translate-share-na"></ul>
</div>

<script src="../screens.js"></script>
<script>
(function(){
const P='translate-share-';
const $=id=>document.getElementById(P+id);
const SW='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const S=window.SITE_ICONS;
const MASC='../../brandbook/assets/mascot/mascot-';
const I={
 mic:S.mic.replace('class="ic"',''),
 back:`<svg viewBox="0 0 24 24" ${SW}><path d="M15 5l-7 7 7 7"/></svg>`,
 play:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>`,
 spk:`<svg viewBox="0 0 24 24" ${SW}><path d="M3.5 9.5v5h3.5l4.5 4V5.5L7 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8.2 8.2 0 0 1 0 11.4"/></svg>`,
 copy:`<svg viewBox="0 0 24 24" ${SW}><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>`,
 save:`<svg viewBox="0 0 24 24" ${SW}><path d="M12 4v11M7 10.5l5 5 5-5"/><path d="M4.5 16.5v1a2.5 2.5 0 0 0 2.5 2.5h10a2.5 2.5 0 0 0 2.5-2.5v-1"/></svg>`,
 fwd:`<svg viewBox="0 0 24 24" ${SW}><path d="M14 5l6 6-6 6"/><path d="M20 11H10a6 6 0 0 0-6 6v1.5"/></svg>`,
 audio:`<svg viewBox="0 0 24 24" ${SW}><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>`,
 doc:`<svg viewBox="0 0 24 24" ${SW}><path d="M6.5 3.5h7l4 4v11a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M13.5 3.5v4h4"/><path d="M9 13v3M12 11.5v6M15 13.5v2"/></svg>`,
 x:`<svg viewBox="0 0 24 24" ${SW}><path d="M6 6l12 12M18 6L6 18"/></svg>`,
 up:`<svg viewBox="0 0 24 24" ${SW}><path d="M6.5 14.5L12 9l5.5 5.5"/></svg>`,
 info:`<svg viewBox="0 0 24 24" ${SW}><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5M12 7.8h.01"/></svg>`,
 okc:`<svg viewBox="0 0 24 24" ${SW}><circle cx="12" cy="12" r="9.2"/><path d="M8 12.3l2.7 2.7L16 9.6"/></svg>`,

  lead:'T‑13 and T‑04. Got a voice message, say on WhatsApp? Tap Share and pick Parrlo: it recognizes the speech and shows the translation, so you read it instead of replaying it ten times. Place names are here too: Cadaqués, not “Kadenas”. Neither feature is in the app yet, so everything on this page is a mockup. Dark theme only. Screen 430×932 pt, PNG @3×: 1290×2796.',
  heroH:'Hero frame · text and translation',
  heroP:['Website headline: “Got a voice message? Read it in English.” The translation is large and on top, like the incoming bubble in the app; the original with a player sits below and can be hidden.','Two buttons: Copy puts the translation on the clipboard; Reply by voice lets you answer in English and get it in Spanish, ready to send to Lucía.'],
  cap:['Translate · voice message','Mockup · dark theme only · draft copy'],
  hSt:'States', stLead:'In order, from the chat to the translation. Under each screen: when it appears and what the user does. Scale 0.6.',
  hDec:'Decisions', hTok:'Tokens and contrast', hNa:'Not yet approved', thP:'Pair (text / background)', thW:'Where', thC:'Contrast', thN:'Minimum', low:'below minimum',
  dec:['<b>A sheet over the chat, not a jump to the app.</b> Parrlo opens as a Share extension: the chat stays visible at the top, and closing the sheet takes you back.',
   '<b>Color = side, as in translate‑talk.</b> The other person’s message is mint <code>#BFF2DC</code>: player, waveform and translation card. Your reply is green <code>#2BC48A</code>, like “I’m speaking”.',
   '<b>Same order as the incoming bubble in the app.</b> Translation on top, original below; it can be hidden.',
   '<b>Two-step progress.</b> “Transcribing… → Translating”, with a skeleton where the translation will be. The message can be replayed in the meantime.',
   '<b>Place names the local way.</b> Cadaqués isn’t translated or respelled: it stays Cadaqués, tagged “place” (icon plus word, not color alone). A hint says why and how to fix it. On the es page it’s Сергиев Посад: Latin letters in the translation, the sign spelling in the hint.',
   '<b>Reply by voice.</b> The reply is translated into the message’s language, ready to send. Copy takes the translation.',
   '<b>A format error with a way out.</b> File name, a “not supported” tag, what works, Close and a help link.',
   '<b>A generic share sheet.</b> A made-up messaging app with no logo; other apps are grey circles; Parrlo has its own icon and a selection ring.'],
  tok:['Dark theme v2.3: background <code>#0E1116</code>, surfaces <code>#1C2026</code> / <code>#242B34</code>, lines <code>#2F3742</code>, text <code>#F2F5F7</code> / <code>#9AA4B2</code>.',
   'Color = side: the other person — <code>#BFF2DC</code> (translation for you, player); you — <code>#2BC48A</code> (Reply by voice).',
   'Place tag — <code>#BFF2DC</code> on <code>#0E1116</code>; hint on <code>#1B2E29</code>. Error — <code>#FF8A80</code> on <code>#3A2326</code>.',
   'Nunito 900 for titles, translation and the main button; Inter 400/500/600/700 for UI. 4 pt grid, 16 margins, 20–24 cards. Tap targets ≥ 44 pt.'],
  na:['All copy is draft; website wording comes from <code>docs/site/copy-ru/translate.md</code> (screens 7 and 10). Spanish and English copy hasn’t been reviewed by a native speaker.',
   'T‑13 isn’t in the app: it needs the <code>STT_FILE_TRANSLATE</code> flag and an <code>.opus</code> check on a phone (GAP #23). Audio goes to the recognition server, so legal needs to review it.',
   'T‑04: place-name recognition isn’t confirmed (GAP Translate #3). How to write a place name from another script (Sérguiev Posad / Сергиев Посад) is open.',
   'The format list in the error (.opus, .m4a, .mp3, .wav; .amr not supported) needs confirming with engineering.',
   'What happens after Reply by voice (recording in the same sheet, sending to the chat) isn’t drawn.',
   'Colors <code>#1B2E29</code>, <code>#2C4A40</code>, <code>#2E4A3F</code>, <code>#3A2326</code>, <code>#FF8A80</code> and <code>#262A30</code> are derived and not in the v2.3 tokens.'],
  ctr:['body text','labels, hints','labels on cards and sheet','translation for you (large)','labels on translation card','Play, “place” tag','place in the original, player','Reply by voice','Copy, sheet rows','Close in the error','“How to share” link','“not supported” tag','place hint','chat bubbles'] }
}};

let L=new URLSearchParams(location.search).get('l');
if(!T[L])L='ru';
const D=T[L];
document.documentElement.lang=L;

/* ===== куски экрана ===== */
const sbar=`<div class="sbar"><b>9:41</b><span class="sig"><i class="wf"></i><i></i></span></div>`;
const home=`<div class="homebar"><i></i></div>`;
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function wave(n,played,seed,maxH){const r=rnd(seed);let h='';for(let i=0;i<n;i++){const env=0.45+0.55*Math.sin(Math.PI*(i+.5)/n);const v=Math.max(4,Math.round((0.2+0.8*r())*maxH*env));h+=`<i class="${i<played?'':P+'f'}" style="height:${v}px"></i>`;}return h;}
const scr=body=>`<div class="scr ${P}scr">${body}</div>`;

/* мессенджер */
const msgr=lift=>`${sbar}<div class="${P}mnav"><span class="${P}mback">${I.back}</span><span class="${P}av">${D.fromAv}</span><div class="${P}mnm"><b>${D.from}</b><span>${D.online}</span></div></div>
<div class="${P}chat"><span class="${P}day">${D.today}</span>
 <div class="${P}mb">${D.mText}<small>${D.t1}</small></div>
 <div class="${P}mb ${P}mv ${lift?P+'lift':''}"><span class="${P}mplay">${I.play}</span><span class="${P}wv">${wave(30,0,7,28).replace(/ class="[^"]*"/g,'')}</span><div><span>${D.dur}</span><span>${D.t2}</span></div></div>
</div>`;

/* лист Parrlo */
const phead=()=>`<div class="${P}ph">${appIcon()}<div><b>${D.phT}</b><span><i class="${P}dot ${P}es"></i>${D.phS[0]} → ${D.phS[1]}<i class="${P}dot"></i></span></div><span class="${P}x" aria-label="${D.close}">${I.x}</span></div>`;
const psheet=(body,bot)=>scr(`${msgr(0)}<div class="${P}dim"></div><div class="${P}peek"></div>
<div class="${P}ps" style="z-index:4">${phead()}<div class="${P}main">${body}</div><div class="${P}bot">${bot}</div>${home}</div>`);
const player=(dur,played,seed)=>`<div class="${P}pl"><span class="${P}play" aria-label="${D.playV}">${I.play}</span><span class="${P}wv">${wave(46,played,seed,32)}</span><time>${dur}</time></div>`;
const orig=(text,dur,seed,skel)=>`<div class="${P}orig"><div class="${P}orow"><span class="${P}lbl"><i class="${P}dot ${P}es"></i>${D.orL}</span>${skel?'':`<span class="${P}col" aria-label="${D.collapse}">${I.up}</span>`}</div>${player(dur,46,seed)}${skel?`<div class="${P}sk"><i style="width:100%"></i><i style="width:92%"></i><i style="width:58%"></i></div>`:`<p>${text}</p>`}</div>`;
const card=text=>`<div class="${P}card"><span class="${P}lbl"><i class="${P}dot"></i>${D.trL}</span><p>${text}</p><div class="${P}acts"><span class="${P}act">${I.spk}${D.play}</span></div></div>`;
const replyBot=`<div class="${P}hint">${I.info}${D.replyHint}</div><div class="${P}btns"><span class="${P}sec">${I.copy}${D.copy}</span><span class="${P}pri">${I.mic}${D.reply}</span></div>`;
const ptag=`<span class="${P}ptag">${I.pin}${D.placeTag}</span>`;

const H={
'share-sheet':scr(`${msgr(1)}<div class="${P}dim"></div>
<div class="${P}ss">
 <i class="${P}grab"></i>
 <div class="${P}ssh"><span class="${P}file">${I.audio}</span><div><b>${D.ssT}</b><span>${D.ssS}</span></div><span class="${P}x" aria-label="${D.close}">${I.x}</span></div>
 <div class="${P}apps">
  <span class="${P}app ${P}on">${appIcon()}<b>${D.apps}</b><u class="${P}tap"></u></span>
  <span class="${P}app"><i></i><em></em></span><span class="${P}app"><i></i><em></em></span><span class="${P}app"><i></i><em></em></span><span class="${P}app"><i></i><em></em></span>
 </div>
 <div class="${P}grp">
  <div class="${P}row">${D.ssActs[0]}${I.copy}</div>
  <div class="${P}row">${D.ssActs[1]}${I.save}</div>
  <div class="${P}row">${D.ssActs[2]}${I.fwd}</div>
 </div>
 ${home}
</div>`),

processing:psheet(`
 <div class="${P}stepper"><span>${I.spin}${D.s1}</span><i class="${P}arr"></i><span class="${P}wait">${I.wait}${D.s2}</span></div>
 <div class="${P}skc"><span class="${P}lbl"><i class="${P}dot"></i>${D.skL}</span><i style="width:100%"></i><i style="width:94%"></i><i style="width:80%"></i><i style="width:46%"></i></div>
 ${orig('',D.dur,11,1)}`,
 `<div class="${P}btns"><span class="${P}sec">${D.cancel}</span></div>`),

result:psheet(`${card(D.tr)}${orig(D.or,D.dur,11)}<div class="${P}note">${I.info}<span>${D.note}</span></div>`,replyBot),

place:psheet(`
 <div class="${P}card"><span class="${P}lbl"><i class="${P}dot"></i>${D.trL}</span><p>${D.pTr[0]}<span style="white-space:nowrap"><span class="${P}pw">${D.placeTr}</span>${ptag}${L==='ru'?'.':''}${D.pTr[1].startsWith('.')?'.':''}</span>${D.pTr[1].replace(/^\./,'')}</p><div class="${P}acts"><span class="${P}act">${I.spk}${D.play}</span></div></div>
 <div class="${P}ptip"><i>${I.pin}</i><div><b>${D.pTipB}</b><span>${D.pTipS}</span></div></div>
 ${orig(D.pOr[0]+`<span class="${P}pw">${D.place}</span>`+D.pOr[1],D.durP,23)}`,replyBot),

error:psheet(`<div class="${P}main ${P}err" style="padding:0">
 <img src="${MASC}think-dark.svg" alt="">
 <h3>${D.eT}</h3><p>${D.eP}</p>
 <div class="${P}fch"><i>${I.doc}</i><div><b>${D.eFile}</b><span>${D.eFileS}</span></div><span class="${P}badge">${I.warn}${D.eBadge}</span></div>
 <div class="${P}ok">${I.okc}<span>${D.eOk}</span></div>
 </div>`,
 `<span class="${P}link">${I.help}${D.eHelp}</span><div class="${P}btns"><span class="${P}pri ${P}lt">${D.close}</span></div>`),
};
const ORDER=['share-sheet','processing','result','place','error'];
window.TW_STATES=ORDER; window.TW_LANG=L;

/* ===== страница ===== */
const G=D.page;
$('langs').innerHTML=['ru','es','en'].map(l=>`<a href="?l=${l}" aria-current="${l===L}">${l.toUpperCase()}</a>`).join('');
$('mk').textContent=G.mk; $('tag').textContent=G.tag; $('h1').textContent=G.h1; $('lead').textContent=G.lead;
document.title='Parrlo '+G.h1;
const ph=(id,s,html)=>`<div class="pf p67" id="${id}" style="--s:${s}"><div class="shell"></div><div class="glass">${html}</div></div>`;
$('hero-ph').innerHTML=ph('translate-share',.8,H.result)+`<div class="pcap"><span class="dot"></span><div><b>${G.cap[0]}</b><span>${G.cap[1]}</span></div></div>`;
$('hero-t').innerHTML=`<h3>${G.heroH}</h3>`+G.heroP.map(p=>`<p>${p}</p>`).join('');
$('h-st').textContent=G.hSt; $('st-lead').textContent=G.stLead;
$('grid').innerHTML=ORDER.map(k=>`<figure>${ph(P+'-'+k,.6,H[k])}<figcaption><b>${D.st[k][0]}</b><code>${k}</code> · ${D.st[k][1]}</figcaption></figure>`).join('');
$('h-dec').textContent=G.hDec; $('dec').innerHTML=G.dec.map(x=>`<li>${x}</li>`).join('');
$('h-tok').textContent=G.hTok; $('tok').innerHTML=G.tok.map(x=>`<li>${x}</li>`).join('');
$('h-na').textContent=G.hNa; $('na').innerHTML=G.na.map(x=>`<li>${x}</li>`).join('');

/* контраст */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const pairs=[['#F2F5F7','#0E1116',4.5],['#9AA4B2','#0E1116',4.5],['#9AA4B2','#1C2026',4.5],['#0E1116','#BFF2DC',4.5],['#2E4A3F','#BFF2DC',4.5],['#BFF2DC','#0E1116',4.5],['#0E1116','#BFF2DC',4.5],
 ['#0E1116','#2BC48A',4.5],['#F2F5F7','#242B34',4.5],['#0E1116','#F2F5F7',4.5],['#2BC48A','#0E1116',4.5],['#FF8A80','#3A2326',4.5],['#C3CBD5','#1B2E29',4.5],['#9AA4B2','#262A30',4.5]];
const dec=x=>L==='en'?String(x):String(x).replace('.',',');
$('ctr').innerHTML=`<tr><th>${G.thP}</th><th>${G.thW}</th><th>${G.thC}</th><th>${G.thN}</th></tr>`+pairs.map(([a,b,n],i)=>{const v=cr(a,b);return `<tr><td><i class="${P}sw" style="background:${a}"></i><code>${a}</code> / <i class="${P}sw" style="background:${b}"></i><code>${b}</code></td><td>${G.ctr[i]}</td><td><b>${dec(v.toFixed(2))}:1</b></td><td>${v>=n?'≥ '+dec(n)+' ✓':G.low}</td></tr>`;}).join('');
window.TW_CR=pairs.map(([a,b,n],i)=>[G.ctr[i],+cr(a,b).toFixed(2),n]);
document.body.dataset.ready='1';
})();
</script>
</body>
</html>
