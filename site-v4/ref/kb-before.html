.kb-before-lead{color:#9AA4B2;max-width:760px;margin:0 0 32px}
.kb-before-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;padding:48px 24px 40px;border-radius:32px;background:#171C23}
.kb-before-hero figure,.kb-before-st figure{margin:0}
.kb-before-sec{margin-top:64px}
.kb-before-sec>p{color:#9AA4B2;margin:0 0 24px;max-width:760px}
.kb-before-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(600px,1fr));gap:24px}
.kb-before-st{background:#171C23;border-radius:24px;padding:24px}
.kb-before-st h3{font:900 20px/1.25 Nunito,sans-serif;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kb-before-st h3 code{font:500 13px ui-monospace,Menlo,monospace;color:#9AA4B2;background:#0E1116;border-radius:6px;padding:1px 6px}
.kb-before-st>p{margin:0 0 20px;color:#9AA4B2;font-size:15px}
.kb-before-pair{display:flex;gap:20px;justify-content:center}
.kb-before-pair .pcap{margin-top:10px;font-size:13px}
.kb-before-pair .pcap b{font-size:14px}
.kb-before-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.kb-before-notes h2{font-size:20px;margin:0 0 10px}
.kb-before-notes ul{margin:0;padding-left:20px;color:#9AA4B2}
.kb-before-notes li{margin:6px 0}
.kb-before-notes b{color:#F2F5F7;font-weight:600}
.kb-before-st .pf{--s:.6!important}
@media (max-width:660px){

.kb-before-scr .inp .f .pl{color:var(--sec)}

.kb-before-strip.sg{padding:0 4px;gap:0}
.kb-before-sg{flex:1 1 0;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;font:500 16px Inter,sans-serif;border-radius:10px;white-space:nowrap}

.kb-before-strip.go{padding:0 8px;gap:8px}
.kb-before-a{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font:700 15px Inter,sans-serif;white-space:nowrap}
.kb-before-a svg{flex:none;width:22px;height:22px}
.kb-before-a .pm{width:21px;height:21px}
.kb-before-a.p{flex:1 1 auto;min-width:0;background:var(--kb-acc);color:var(--kb-onacc)}
.kb-before-a.s{flex:none;background:var(--kb-key2);color:var(--kb-tx)}
.kb-before-a.p small{font:700 12px Inter,sans-serif;letter-spacing:.03em;border-radius:6px;padding:0 4px;box-shadow:inset 0 0 0 1.5px currentColor}
.scr:not(.light) .kb-before-pop{background:#4A525D}

.kb-before-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:4px}
.kb-before-ib{width:64px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--kb-tx)}

.kb-before-ib .pm{width:25px;height:25px}
/* клавиши */
.kb-before-rows{position:relative;display:flex;flex-direction:column;gap:11px;padding-top:6px}
.kb-before-r{display:flex;gap:5px}
.kb-before-k{position:relative;flex:1 1 0;min-width:0;height:45px;border-radius:8px;background:var(--kb-key);box-shadow:var(--kb-sh);color:var(--kb-tx);display:flex;align-items:center;justify-content:center;font:400 24px/1 Inter,sans-serif}
.kb-before-k.f{background:var(--kb-key2)}
.kb-before-k.f svg{width:23px;height:23px}
.kb-before-k.w{flex:1.38 1 0}
.kb-before-g{flex:.18 1 0}
.kb-before-hp{flex:.5 1 0}
.kb-before-k.n{flex:1.25 1 0;font-size:17px;font-weight:500}
.kb-before-k.p{flex:.85 1 0}
.kb-before-k.sp{flex:4.4 1 0;font-size:16px;gap:10px}
.kb-before-k.sp i{font-style:normal;color:var(--kb-sec);font-size:18px}
.kb-before-k.rt{flex:1.55 1 0;background:var(--kb-acc);color:var(--kb-onacc);box-shadow:none}
.kb-before-k.rt svg{width:25px;height:25px}

.kb-before-k.pr{background:transparent;box-shadow:none;color:transparent}
.kb-before-pop{position:absolute;left:-7px;right:-7px;bottom:0;height:108px;border-radius:12px 12px 9px 9px;background:var(--kb-key);box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);color:var(--kb-tx);display:flex;justify-content:center;padding-top:10px;font:400 36px/1 Inter,sans-serif;z-index:2;clip-path:polygon(0 0,100% 0,100% 52%,calc(100% - 7px) 60%,calc(100% - 7px) 100%,7px 100%,7px 60%,0 52%)}

.kb-before-home i{width:140px;height:5px;border-radius:3px;background:var(--kb-tx)}

/* токены и контраст — одинаковы для всех языков (цифры WCAG) */
const TOK={

 '<b>Светлая:</b> фон #D3D7DC, клавиши и полоса #FFFFFF, служебные #ABB2BB, текст #0E1116, вторичный #5B6472, акцент #00875C / #FFFFFF; чат — фон #FFFFFF, входящие #E9EDF0, исходящие #D6F5E5.',
 '<b>Тёмная:</b> фон #1B1F25, клавиши и полоса #3A414B, служебные #2A3038, текст #F2F5F7, вторичный #C5CCD5, акцент #2BC48A / #0E1116; чат — фон #0E1116, входящие #242B34, исходящие #00875C.',

es:[

 '<b>Oscuro:</b> fondo #1B1F25, teclas y franja #3A414B, teclas de función #2A3038, texto #F2F5F7, secundario #C5CCD5, acento #2BC48A / #0E1116; chat: fondo #0E1116, recibidos #242B34, enviados #00875C.',

/* контраст считается из цветов на лету */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
const PAIRS={
 L:[['T1','#0E1116','#FFFFFF'],['T2','#5B6472','#FFFFFF'],['T3','#FFFFFF','#00875C'],['T4','#0E1116','#ABB2BB'],['T5','#0E1116','#D3D7DC'],['T6','#0E1116','#E9EDF0'],['T7','#3E5A4D','#D6F5E5'],['T8','#5B6472','#E9EDF0']],
 D:[['T1','#F2F5F7','#3A414B'],['T2','#C5CCD5','#3A414B'],['T3','#0E1116','#2BC48A'],['T4','#F2F5F7','#2A3038'],['T5','#F2F5F7','#1B1F25'],['T6','#F2F5F7','#242B34'],['T7','#FFFFFF','#00875C'],['T8','#9AA4B2','#242B34']]};
const PL={ru:{T1:'текст на клавише и полосе',T2:'вторичный на полосе',T3:'«Перевести» на акценте',T4:'текст на служебной клавише',T5:'подсказка слова на фоне клавиатуры',T6:'входящее сообщение',T7:'исходящее и время в нём',T8:'время во входящем'},
 es:{T1:'texto en tecla y franja',T2:'secundario en la franja',T3:'«Traducir» sobre acento',T4:'texto en tecla de función',T5:'sugerencia sobre fondo del teclado',T6:'mensaje recibido',T7:'mensaje enviado y su hora',T8:'hora en recibido'},
 en:{T1:'text on keys and strip',T2:'secondary on strip',T3:'“Translate” on accent',T4:'text on function key',T5:'suggestion on keyboard background',T6:'incoming message',T7:'outgoing message and its time',T8:'time in incoming'}};
const fmt=(v,l)=>l==='en'?v.toFixed(1):v.toFixed(1).replace('.',',');

/* раскладки */
const ROWS={ru:['йцукенгшщзх','фывапролджэ','ячсмитьбю'],es:['qwertyuiop','asdfghjklñ','zxcvbnm'],en:['qwertyuiop','asdfghjkl','zxcvbnm']};
const BAR=[['imp',parrot],['tr',()=>I.tr],['dict',()=>I.mic],['voice',()=>I.voice],['set',()=>I.gear]];
function keys(c,up,press){
 const R=ROWS[c.kb],lg=c.kb==='ru'?'ru':c.kb;
 const k=ch=>{const t=up?ch.toLocaleUpperCase(lg):ch;return ch===press?`<span class="kb-before-k pr" role="button">${t}<span class="kb-before-pop" aria-hidden="true">${t}</span></span>`:`<span class="kb-before-k" role="button">${t}</span>`;};
 const row=s=>[...s].map(k).join('');
 const half=R[1].length<R[0].length?'<span class="kb-before-hp"></span>':'';
 return `<div class="kb-before-r">${row(R[0])}</div><div class="kb-before-r">${half}${row(R[1])}${half}</div>
<div class="kb-before-r"><span class="kb-before-k f w" role="button" aria-label="${c.shift}"${up?' aria-pressed="true"':''}>${up?I.shiftOn:I.shift}</span><span class="kb-before-g"></span>${row(R[2])}<span class="kb-before-g"></span><span class="kb-before-k f w" role="button" aria-label="${c.del}">${I.del}</span></div>
<div class="kb-before-r"><span class="kb-before-k f n" role="button" aria-label="${c.num}">123</span><span class="kb-before-k p" role="button">,</span><span class="kb-before-k sp" role="button"><i>‹</i>${c.space}<i>›</i></span><span class="kb-before-k p" role="button">.</span><span class="kb-before-k rt" role="button" aria-label="${c.ret}">${I.ret}</span></div>`;}

const car='<i class="kb-before-car"></i>';
const S={
 empty:c=>({field:`<span class="pl">${c.ph}</span>`,car:'pre',up:1,send:0,
  strip:`<div class="kb-before-strip">${I.tr}<span class="tx"><b>${c.hintB}</b><span>${c.hintS}</span></span><span class="kb-before-pill" role="button" aria-label="${c.pairA}"><span>${c.pair}${I.chev}</span></span></div>`}),
 typing:c=>({field:c.typed,car:'post',up:0,send:1,press:c.press,
  strip:`<div class="kb-before-strip sg">${c.sg.map((w,i)=>`${i?'<i class="kb-before-sgd"></i>':''}<span class="kb-before-sg${i===0?' on':''}" role="button">${w}</span>`).join('')}</div>`}),
 ready:c=>({field:c.draft,car:'post',up:0,send:1,
  strip:`<div class="kb-before-strip go"><span class="kb-before-a p" role="button" aria-label="${c.trAria}">${I.tr}${c.trA}<small>${c.trTo}</small></span><span class="kb-before-a s" role="button">${parrot()}${c.imp}</span></div>`})
};
function screen(id,light,c){
 const s=S[id](c);
 const f=s.car==='pre'?car+s.field:s.field+car;
 const bar=BAR.map(([n,ic])=>`<span class="kb-before-ib" role="button" aria-label="${c[n]}">${ic()}</span>`).join('');
 const msgs=c.msgs.map(([d,t,tm])=>`<div class="m ${d}">${t}<span class="tm">${tm}</span></div>`).join('');
 return `<div class="scr kb-before-scr ${light?'light':''}" lang="${c.html}">
<div class="sbar"><span>9:41</span><span class="sig"><i class="wf"></i><i></i></span></div>
<div class="nav"><span class="bk">${I.back}</span><span class="av">${c.av}</span><span class="nm"><b>${c.who}</b><span>${c.online}</span></span></div>
<div class="msgs"><div class="day">${c.today}</div>${msgs}</div>
<div class="inp"><span class="f"><span>${f}</span></span><span class="sd${s.send?'':' off'}">${I.send}</span></div>
<div class="kb-before-kb">
${s.strip}
<div class="kb-before-bar">${bar}</div>
<div class="kb-before-rows">${keys(c,s.up,s.press)}</div>
<div class="kb-before-home"><i></i></div></div></div>`;}
const ph=(id,l,sc,c)=>`<div class="pf p67 ${l?'light':''}" style="--s:${sc}"><div class="shell"></div><div class="glass">${screen(id,l,c)}</div></div>`;

function render(L){
 const c=D[L];
 document.documentElement.lang=c.html;document.title=c.title;
 const $=id=>document.getElementById(id);
 $('kb-before-lng').innerHTML=['ru','es','en'].map(x=>`<a href="?l=${x}" data-l="${x}" aria-current="${x===L}" lang="${x}">${x.toUpperCase()}</a>`).join('');
 $('kb-before-t-draft').textContent=c.t_draft;$('kb-before-t-mock').textContent=c.t_mock;
 $('kb-before-h1').textContent=c.h1;$('kb-before-lead').textContent=c.lead;
 $('kb-before-h-st').textContent=c.hSt;$('kb-before-p-st').textContent=c.pSt;
 $('kb-before-hero').innerHTML=
 `<figure data-shot="kb-before--light--${L}">${ph('ready',1,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capL[0]}</b><span>${c.capL[1]}</span></div></div></figure>
<figure data-shot="kb-before--dark--${L}">${ph('ready',0,1,c)}<div class="pcap"><span class="dot"></span><div><b>${c.capD[0]}</b><span>${c.capD[1]}</span></div></div></figure>`;
 $('kb-before-grid').innerHTML=Object.keys(S).map(id=>
 `<article class="kb-before-st"><h3>${c.st[id][0]}<code>${id}</code></h3><p>${c.st[id][1]}</p><div class="kb-before-pair">
<figure data-shot="kb-before--${id}--light--${L}">${ph(id,1,.6,c)}<div class="pcap"><div><b>${c.light}</b></div></div></figure>
<figure data-shot="kb-before--${id}--dark--${L}">${ph(id,0,.6,c)}<div class="pcap"><div><b>${c.dark}</b></div></div></figure></div></article>`).join('');
 const cs=t=>PAIRS[t].map(([k,a,b])=>`${PL[L][k]} ${fmt(cr(a,b),L)}`).join('; ');
 const tok=TOK[L].map(x=>x.replace('CONTRAST_L',cs('L')).replace('CONTRAST_D',cs('D')));
 $('kb-before-notes').innerHTML=`<div><h2>${c.hDec}</h2><ul>${c.dec.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hTok}</h2><ul>${tok.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h2>${c.hNo}</h2><ul>${c.no.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 document.body.dataset.lang=L;
}
let L0=new URLSearchParams(location.search).get('l');if(!D[L0])L0='ru';
render(L0);
document.getElementById('kb-before-lng').addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(!a)return;e.preventDefault();const l=a.dataset.l;try{history.replaceState(null,'','?l='+l)}catch(_){}render(l);});
window.KB_BEFORE_RENDER=render;
document.body.dataset.ready='1';
</script>
