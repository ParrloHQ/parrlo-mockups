<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E12;color:#F2F5F7;font:400 16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 80px}
.chat-secretary-w{max-width:1200px;margin:0 auto}
.chat-secretary-lng{display:flex;justify-content:flex-end;gap:4px;margin:0 0 24px}
.chat-secretary-lng a{min-width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Inter;letter-spacing:.06em;color:#C9D1DA;text-decoration:none;box-shadow:inset 0 0 0 1px #2F3742}
.chat-secretary-lng a.on{background:#2BC48A;color:#0E1116;box-shadow:none}
.chat-secretary-hero{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
.chat-secretary-info{flex:1 1 340px;max-width:520px;padding-top:24px}
.chat-secretary-eb{font:600 13px/1.4 Inter;letter-spacing:.08em;text-transform:uppercase;color:#2BC48A;margin:0 0 8px}
.chat-secretary-tag{display:inline-block;margin:0 0 12px;font:700 13px/1 Inter;color:#0E1116;background:#BFF2DC;border-radius:8px;padding:6px 10px}
.chat-secretary-info h1{font:900 40px/1.1 Nunito,sans-serif;margin:0 0 12px}
.chat-secretary-info p{color:#9AA4B2;margin:0 0 16px;font-size:16px}
.chat-secretary-info ul,.chat-secretary-sec ul{margin:0;padding-left:20px;color:#C9D1DA;font-size:15px}
.chat-secretary-info li,.chat-secretary-sec li{margin:6px 0}
.chat-secretary-w b{color:#F2F5F7;font-weight:600}
.chat-secretary-w code{font:13px ui-monospace,Menlo,monospace;background:#1C2026;padding:1px 5px;border-radius:5px;color:#F2F5F7;overflow-wrap:anywhere}
.chat-secretary-h2{font:900 28px/1.2 Nunito,sans-serif;margin:72px 0 8px}
.chat-secretary-lead{color:#9AA4B2;margin:0 0 32px;max-width:760px}
.chat-secretary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:40px 24px;justify-items:center}
.chat-secretary-card{width:273px}
.chat-secretary-card h3{font:900 19px/1.3 Nunito,sans-serif;margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.chat-secretary-card h3 code{font-size:12px;color:#9AA4B2}
.chat-secretary-card p{margin:0;color:#9AA4B2;font-size:14px;line-height:1.45}
.chat-secretary-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.chat-secretary-sec h2{font:900 22px/1.3 Nunito,sans-serif;margin:0 0 8px}
.chat-secretary-ct{width:100%;border-collapse:collapse;font-size:14px;color:#C9D1DA}
.chat-secretary-ct td{padding:6px 8px 6px 0;border-bottom:1px solid #2F3742;vertical-align:top}
.chat-secretary-ct td:last-child{text-align:right;white-space:nowrap;color:#2BC48A;font-weight:600}
.chat-secretary-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@media (max-width:480px){.chat-secretary-hero .pf{--s:.78!important}.chat-secretary-info h1{font-size:30px}.chat-secretary-hero{gap:24px}}

/* ======= экран 430×932 ======= */
.chat-secretary-scr{overflow:hidden}
.chat-secretary-scr svg{display:block}
.chat-secretary-nav{flex:none;display:flex;align-items:center;gap:8px;height:60px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.chat-secretary-ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.chat-secretary-ib svg{width:24px;height:24px}
.chat-secretary-ib.bk{color:var(--acc);width:44px}.chat-secretary-ib.bk svg{width:28px;height:28px}
.chat-secretary-pav{position:relative;width:40px;height:40px;border-radius:50%;background:#173A2E;overflow:hidden;flex:none}
.chat-secretary-pav img{position:absolute;width:64px;height:64px;left:-14px;top:-9px}
.chat-secretary-nm{flex:1;min-width:0;padding-left:4px}
.chat-secretary-nm b{display:block;font:600 17px/22px Inter}
.chat-secretary-nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:18px;color:var(--sec)}
.chat-secretary-nm span.on{color:var(--acc)}

.chat-secretary-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.chat-secretary-day{align-self:center;font:500 12px/16px Inter;color:var(--sec);background:var(--sf);padding:4px 12px;border-radius:12px;margin-bottom:4px}
.chat-secretary-m{max-width:82%;border-radius:20px;padding:8px 12px 6px;font-size:16px;line-height:22px}
.chat-secretary-m.out{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:6px}
.chat-secretary-m.in{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px}
.chat-secretary-tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;line-height:16px;margin-top:2px}
.chat-secretary-m.in .chat-secretary-tm{color:var(--sec)}
.chat-secretary-tm svg{width:16px;height:16px}
.chat-secretary-gap{margin-top:8px}

/* «Парло пишет» */
.chat-secretary-ty{align-self:flex-start;display:flex;align-items:center;gap:8px}
.chat-secretary-ty .b{height:36px;border-radius:18px;border-bottom-left-radius:6px;background:var(--sf2);display:flex;align-items:center;gap:4px;padding:0 14px}
.chat-secretary-ty .b i{width:7px;height:7px;border-radius:50%;background:var(--sec)}
.chat-secretary-ty .b i:nth-child(2){opacity:.7}.chat-secretary-ty .b i:nth-child(3){opacity:.45}
.chat-secretary-ty span.l{font-size:13px;line-height:18px;color:var(--sec)}

/* карточка черновика */
.chat-secretary-dc{align-self:stretch;border-radius:24px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.chat-secretary-dc.ed{box-shadow:inset 0 0 0 1.5px var(--acc)}
.chat-secretary-dh{display:flex;align-items:center;gap:12px}
.chat-secretary-av{width:40px;height:40px;border-radius:50%;background:#6AA6F5;color:#0E1116;font:800 17px/40px Nunito,Inter;text-align:center;flex:none}
.chat-secretary-av.o{background:#E8A0BF}
.chat-secretary-dh .t{flex:1;min-width:0}
.chat-secretary-dh .t b{display:block;font:700 16px/22px Inter}
.chat-secretary-dh .t span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-secretary-lt{flex:none;height:28px;border-radius:14px;background:var(--sf2);display:flex;align-items:center;padding:0 10px;font:700 12px/1 Inter;letter-spacing:.06em;color:var(--tx)}
.chat-secretary-k{display:flex;align-items:center;gap:6px;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin:16px 0 6px}
.chat-secretary-k svg{width:14px;height:14px}
.chat-secretary-k .lv{margin-left:auto;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.chat-secretary-k .lv i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chat-secretary-bub{border-radius:20px;border-bottom-right-radius:6px;background:var(--deep);color:#fff;padding:12px 16px;font:500 18px/26px Inter}
.chat-secretary-bub.sm{font-size:16px;line-height:23px;font-weight:400;padding:10px 14px}
.chat-secretary-hint{display:flex;gap:8px;margin-top:12px;color:var(--mint);font-size:15px;line-height:21px}
.chat-secretary-hint svg{flex:none;width:18px;height:18px;margin-top:2px}
.chat-secretary-acts{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.chat-secretary-pri{height:52px;border-radius:26px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;gap:8px;font:900 18px/1 Nunito,sans-serif}
.chat-secretary-pri svg{width:20px;height:20px}
.chat-secretary-row2{display:flex;gap:8px}
.chat-secretary-sec2{flex:1;min-width:0;height:48px;border-radius:24px;background:var(--sf2);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 Inter;white-space:nowrap}
.chat-secretary-sec2 svg{width:18px;height:18px;color:var(--sec);flex:none}
.chat-secretary-note{margin:12px 0 0;text-align:center;font-size:13px;line-height:18px;color:var(--sec)}

/* скелетон */
.chat-secretary-sk{border-radius:20px;border-bottom-right-radius:6px;background:var(--sf2);padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-secretary-sk i,.chat-secretary-skh i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#2F3742 0%,#3A434F 45%,#2F3742 90%)}
.chat-secretary-skh{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chat-secretary-skh i{height:10px;background:linear-gradient(90deg,#24312E 0%,#2C3E39 45%,#24312E 90%)}
.chat-secretary-skb{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.chat-secretary-skb i{display:block;height:52px;border-radius:26px;background:var(--sf2)}
.chat-secretary-skb .r{display:flex;gap:8px}.chat-secretary-skb .r i{flex:1;height:48px;border-radius:24px}

/* правка */
.chat-secretary-fld{border-radius:16px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--acc);padding:12px 14px;font-size:17px;line-height:24px;color:var(--tx)}
.chat-secretary-fld .car{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-4px;margin-left:1px;border-radius:1px}
.chat-secretary-fld mark{background:rgba(43,196,138,.2);color:var(--tx);border-radius:4px;padding:0 2px}
.chat-secretary-chl{margin:14px 0 8px;font-size:13px;line-height:18px;color:var(--sec)}
.chat-secretary-chips{display:flex;flex-wrap:wrap;gap:0 8px}
.chat-secretary-chips span{height:44px;display:flex;align-items:center}
.chat-secretary-chips span i{font-style:normal;height:36px;border-radius:18px;background:var(--sf2);display:flex;align-items:center;gap:6px;padding:0 14px;font:600 14px/1 Inter;color:var(--tx)}
.chat-secretary-chips svg{width:16px;height:16px;color:var(--mint)}

/* отправлено */
.chat-secretary-ok{display:flex;align-items:center;gap:10px}
.chat-secretary-ok .c{width:40px;height:40px;border-radius:50%;background:rgba(43,196,138,.16);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-secretary-ok .c svg{width:22px;height:22px}
.chat-secretary-ok .t b{display:block;font:700 16px/22px Inter}
.chat-secretary-ok .t span{display:block;font-size:13px;line-height:18px;color:var(--sec)}
.chat-secretary-bub .chat-secretary-tm{color:#fff}
.chat-secretary-open{margin-top:16px;height:48px;border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;gap:8px;font:700 16px/1 Inter}
.chat-secretary-open svg{width:20px;height:20px}

/* пустой чат */
.chat-secretary-em{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center}
.chat-secretary-em img{width:144px;height:144px;display:block;margin-bottom:8px}
.chat-secretary-em h4{margin:0 0 8px;font:900 28px/34px Nunito,sans-serif}
.chat-secretary-em p{margin:0;color:var(--sec);font-size:16px;line-height:23px;max-width:360px}
.chat-secretary-exh{flex:none;font:600 11px/16px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin:0 16px 8px}
.chat-secretary-ex{flex:none;display:flex;flex-direction:column;gap:8px;padding:0 16px 12px}
.chat-secretary-ex div{min-height:56px;border-radius:18px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:15px;line-height:21px;text-align:left}
.chat-secretary-ex div span{flex:1;min-width:0}
.chat-secretary-ex svg{flex:none;width:20px;height:20px;color:var(--sec)}
.chat-secretary-ex svg.q{color:var(--mint)}

/* поле ввода */
.chat-secretary-cmp{flex:none;border-top:1px solid var(--line);padding:8px 12px 0;background:var(--bg)}
.chat-secretary-crow{display:flex;align-items:flex-end;gap:8px}
.chat-secretary-f{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;padding:10px 16px;font-size:16px;line-height:22px;color:var(--sec);white-space:nowrap;overflow:hidden}
.chat-secretary-f span{overflow:hidden;text-overflow:ellipsis}
.chat-secretary-go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.chat-secretary-go svg{width:22px;height:22px}
.chat-secretary-go.st{background:var(--sf2);color:var(--tx)}
.chat-secretary-go.st i{width:14px;height:14px;border-radius:3px;background:currentColor}
</style>
</head>

 '<div class="chat-secretary-fld" lang="'+T.ul+'">'+T.uPre+'<mark>'+T.uAdd+'</mark><i class="car"></i>'+T.uPost+'</div>'+
 '<div class="chat-secretary-k">'+I.tr+T.pl+'<span class="lv"><i></i>'+T.live+'</span></div>'+
 '<div class="chat-secretary-bub sm" lang="'+T.rl+'">'+T.prev+'</div>'+
 '<div class="chat-secretary-chl">'+T.chl+'</div><div class="chat-secretary-chips">'+T.chips.map(function(c){return '<span role="button"><i>'+c+'</i></span>'}).join('')+'</div>'+
 '<div class="chat-secretary-acts" style="margin-top:12px"><div class="chat-secretary-row2"><span class="chat-secretary-sec2" role="button">'+T.cancel+'</span><span class="chat-secretary-pri" role="button" style="flex:1.4;height:48px;font-size:17px">'+I.check+T.done+'</span></div></div></div>'+
 '</div>')};

function Lu(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){var x=Lu(a),y=Lu(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var pairs=[['#F2F5F7','#0E1116'],['#9AA4B2','#0E1116'],['#F2F5F7','#1C2026'],['#9AA4B2','#1C2026'],['#BFF2DC','#1C2026'],['#FFFFFF','#00875C'],['#FFFFFF','#00875C'],['#0E1116','#2BC48A'],['#2BC48A','#1C2026'],['#F2F5F7','#242B34'],['#F2F5F7','#1C2026']];
$('ct').innerHTML=pairs.map(function(r,i){return '<tr><td><span class="chat-secretary-sw" style="background:'+r[0]+'"></span><span class="chat-secretary-sw" style="background:'+r[1]+'"></span>'+T.ct[i]+' <code>'+r[0]+'</code> / <code>'+r[1]+'</code></td><td>'+cr(r[0],r[1]).toFixed(2)+':1</td></tr>'}).join('');
window.CHAT_SECRETARY_MIN=Math.min.apply(null,pairs.map(function(r){return cr(r[0],r[1])}));
